    <script>
      // Automatically grab the target URL out of the browser bar dynamically
      const urlParams = new URLSearchParams(window.location.search);
      // It looks for target=your_url
      const targetUrl = urlParams.get('target'); 

      if (targetUrl) {
        // Reconstructs the full target destination including the tracking parameters
        let redirectDestination = decodeURIComponent(targetUrl);
        
        // Pass along all current UTM values so they don't get lost in the jump
        const currentQuery = window.location.search.replace(`target=${encodeURIComponent(targetUrl)}`, '');
        if (currentQuery && currentQuery !== '?' && currentQuery !== '&') {
          redirectDestination += (redirectDestination.includes('?') ? '&' : '?') + currentQuery.replace(/^[?&]/, '');
        }

        // Execute the seamless jump immediately
        window.location.href = redirectDestination;
      }
    </script>
    <title>Redirecting...</title>
</head>
<body>
    <p>Redirecting to destination... <a id="fallback" href="#">Click here if not redirected</a>.</p>
    <script>
      if (targetUrl) {
        document.getElementById('fallback').href = decodeURIComponent(targetUrl);
      }
    </script>
</body>
