  <div class="container">
    <header>
      <h1>Trophy Tracker</h1>
      <span id="sync-time" style="font-size: 0.85rem; color: var(--text-muted);">Listening for updates...</span>
    </header>

    <div class="card" id="active-game-card">
      <h2 id="game-title" style="font-size: 1.2rem; margin-bottom: 8px;">Waiting for Game Data</h2>
      <p id="trophy-count" style="color: var(--text-muted); font-size: 0.9rem;">No data pulled yet</p>
    </div>

    <div class="card">
      <h3 style="font-size: 1.1rem; margin-bottom: 12px;">Recent Unlocks</h3>
      <div id="trophy-list">
        <!-- Dynamic trophy entries populate here -->
      </div>
    </div>
  </div>

  <!-- JavaScript: Service Worker Registration & Firestore Listener -->
  <script type="module">
    // JS Line 157: Service Worker Registration for PWA Installation
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker active:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }

    // JS Line 166: Firebase Web SDK Imports (Compatible with HTTP and HTTPS)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Insert your Firebase web configuration object here
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "entertainment-71888.firebaseapp.com",
      projectId: "entertainment-71888",
      storageBucket: "entertainment-71888.appspot.com",
      messagingSenderId: "660524340277",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // JS Line 184: Real-time listener for settings/psn
    const psnDocRef = doc(db, "settings", "psn");
    onSnapshot(psnDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById("game-title").textContent = data.lastTitleName || "No Title Playing";
        document.getElementById("trophy-count").textContent = `Total Earned Trophies: ${data.lastTrophyCount || 0}`;
        
        if (data.lastUpdated) {
          const date = new Date(data.lastUpdated);
          document.getElementById("sync-time").textContent = `Updated: ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })}`;
        }

        // Listen to the specific game's detailed trophies
        if (data.lastTitleId) {
          listenToGameTrophies(data.lastTitleId);
        }
      }
    });

    // JS Line 205: Real-time listener for detailed trophy list
    let unsubscribeGame = null;
    function listenToGameTrophies(titleId) {
      if (unsubscribeGame) unsubscribeGame();

      const gameDocRef = doc(db, "player_trophies", titleId);
      unsubscribeGame = onSnapshot(gameDocRef, (docSnap) => {
        const listEl = document.getElementById("trophy-list");
        listEl.innerHTML = "";

        if (docSnap.exists()) {
          const gameData = docSnap.data();
          const trophies = gameData.trophies || [];

          // Show earned trophies first
          const earnedTrophies = trophies.filter(t => t.earned);

          if (earnedTrophies.length === 0) {
            listEl.innerHTML = "<p style='color: #888; font-size: 0.9rem;'>No trophies unlocked yet.</p>";
            return;
          }

          earnedTrophies.forEach(t => {
            const item = document.createElement("div");
            item.className = "trophy-item";
            item.innerHTML = `
              <img src="${t.trophyIconUrl || ''}" class="trophy-icon" alt="Trophy Icon" loading="lazy" />
              <div class="trophy-info">
                <div class="trophy-name">${t.trophyName}</div>
                <div class="trophy-desc">${t.trophyDetail || ''}</div>
              </div>
            `;
            listEl.appendChild(item);
          });
        }
      });
    }
  </script>
