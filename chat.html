  <!-- ==========================================================================
       JAVASCRIPT (Starts at Line 384)
       ========================================================================== -->
  <script>
    // JS Line 387: On Page Load check for saved Streamlabs Widget URL
    window.addEventListener('DOMContentLoaded', () => {
      const savedSL = localStorage.getItem('werewolf_sl_widget');
      if (savedSL) {
        document.getElementById('sl-input').value = savedSL;
        document.getElementById('frame-streamlabs').src = savedSL;
      }
    });

    // JS Line 396: Update Streamlabs Widget URL and persist in storage
    function updateStreamlabsSrc(newUrl) {
      if (newUrl.trim() !== '') {
        localStorage.setItem('werewolf_sl_widget', newUrl.trim());
        document.getElementById('frame-streamlabs').src = newUrl.trim();
        gtag('event', 'streamlabs_widget_updated', { 'gamer_tag': 'werewolf3788' });
      }
    }

    // JS Line 405: Reload Individual Frame
    function reloadFrame(frameId) {
      const frame = document.getElementById(frameId);
      if (frame) {
        const src = frame.src;
        frame.src = '';
        frame.src = src;
        gtag('event', 'chat_frame_reload', { 'target': frameId });
      }
    }

    // JS Line 416: Layout & Responsive Tab Switcher
    function setLayout(mode) {
      const container = document.getElementById('chat-container');
      const buttons = document.querySelectorAll('.controls .btn');
      const cards = {
        nimo: document.getElementById('box-nimo'),
        streamlabs: document.getElementById('box-streamlabs'),
        tikfinity: document.getElementById('box-tikfinity')
      };

      buttons.forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + mode);
      if (activeBtn) activeBtn.classList.add('active');

      if (mode === 'all') {
        container.classList.remove('mobile-tab-view');
        Object.values(cards).forEach(card => {
          card.style.display = 'flex';
          card.classList.remove('active-tab');
        });
      } else {
        container.classList.add('mobile-tab-view');
        Object.keys(cards).forEach(key => {
          if (key === mode) {
            cards[key].style.display = 'flex';
            cards[key].classList.add('active-tab');
          } else {
            cards[key].style.display = 'none';
            cards[key].classList.remove('active-tab');
          }
        });
      }

      gtag('event', 'chat_view_change', { 'mode': mode });
    }
  </script>
