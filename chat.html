    .btn {

      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;

    }

      border-color: var(--primary-accent);

    main {
      flex: 1;
      padding: 12px;
      display: grid;

    .card-nimo .badge { background-color: var(--nimo-color); }
    .card-streamlabs .badge { background-color: var(--streamlabs-color); }
    .card-tikfinity .badge { background-color: var(--tikfinity-color); }

    .card-actions {

    .btn-icon {

    .iframe-wrapper {

    iframe {

    /* CSS Line 213: Responsive Breakpoints (Tablet & Mobile Layout) */

<body>
  <!-- ==========================================================================
       HEADER / NAVIGATION (Starts at Line 266)

  <header>

  <main id="chat-container">

          <button class="btn-icon" onclick="openExternal('https://tikfinity.zerody.one/widget/chat?cid=2565805')" title="Popout Window">↗️</button>

  <!-- ==========================================================================
       JAVASCRIPT LOGIC (Starts at Line 360)
       - Tab switching and responsive mobile mode
       - Iframe reloader and external window opener
       - GA4 event tracking for layout and interaction changes
       ========================================================================== -->
  <script>
    // JS Line 367: Reload individual iframes
    function reloadFrame(frameId) {
      const frame = document.getElementById(frameId);
      if (frame) {
        const currentSrc = frame.src;
        frame.src = '';
        frame.src = currentSrc;
        
        // Track refresh event in GA4
        gtag('event', 'chat_iframe_refresh', {
          'chat_target': frameId,
          'user_role': 'werewolf3788'
        });
      }
    }

    // JS Line 383: Open chat in external popout window
    function openExternal(url) {
      window.open(url, '_blank', 'width=450,height=700,menubar=no,toolbar=no,location=no');
      gtag('event', 'chat_popout_opened', {
        'destination_url': url
      });
    }

    // JS Line 391: Layout and Tab Switcher
    function setLayout(mode) {
      const container = document.getElementById('chat-container');
      const buttons = document.querySelectorAll('.controls .btn');
      const cards = {
        nimo: document.getElementById('box-nimo'),
        streamlabs: document.getElementById('box-streamlabs'),
        tikfinity: document.getElementById('box-tikfinity')
      };

      // Update button active state
      buttons.forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + mode);
      if (activeBtn) activeBtn.classList.add('active');

      // Update Grid / Tabs
      if (mode === 'all') {
        container.classList.remove('mobile-tab-view');
        Object.values(cards).forEach(card => {
          card.style.display = 'flex';
          card.classList.remove('active-tab');
        });
      } else {
        container.classList.add('mobile-tab-view');
        Object.keys(cards).forEach(key => {
          if (key === mode) {
            cards[key].style.display = 'flex';
            cards[key].classList.add('active-tab');
          } else {
            cards[key].style.display = 'none';
            cards[key].classList.remove('active-tab');
          }
        });
      }

      // Log tab view change to GA4
      gtag('event', 'chat_view_change', {
        'view_mode': mode
      });
    }
  </script>
