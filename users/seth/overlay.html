        /* REBUILD 3 CORE THEME OVERRIDES */
        .rebuild3-theme .top-banner {

            border: 2px solid rgba(255, 0, 0, 0.5);

        }
        .rebuild3-theme .stat-label {

        }
        .rebuild3-theme .profile-pic-wrapper {
            background: linear-gradient(45deg, #ff0000, #ff5555);

        }
        .rebuild3-theme .friend-card {
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-right: 0.3vh solid #ff3333;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.15);
        }
        .rebuild3-theme .friend-name {
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }
        .rebuild3-theme .live-dot {

        .rebuild3-theme .friend-game {
            color: rgba(255, 51, 51, 0.8);
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 2px currentColor; }
            100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 8px currentColor; }

        @keyframes textPulse {
            0% { text-shadow: 0 0 5px rgba(0, 132, 255, 0.6); }
            100% { text-shadow: 0 0 20px rgba(0, 212, 255, 1), 0 0 30px rgba(0, 85, 255, 0.8); }
        }
        .rebuild3-theme .current-game-title {
            animation: textPulseRed 2s infinite alternate;
        }
        @keyframes textPulseRed {
            0% { text-shadow: 0 0 5px rgba(255, 0, 0, 0.6); }
            100% { text-shadow: 0 0 20px rgba(255, 51, 51, 1), 0 0 30px rgba(255, 0, 0, 0.8); }
        }

        @keyframes slideInRight {
            from { transform: translateX(120%) skewX(-10deg); opacity: 0; }
            to { transform: translateX(0) skewX(0deg); opacity: 1; }
        }

        @keyframes slideInLeft {
            from { transform: translateX(-120%) skewX(10deg); opacity: 0; }
            to { transform: translateX(0) skewX(0deg); opacity: 1; }
        }

<body>

    <div id="fx-container"></div>

    <div class="overlay-wrapper" id="master-theme-container">
        <header class="top-banner">
            <div class="wing-text left-wing">Phoenix</div>
            <div class="wing-text right-wing">Darkfire</div>
        </header>

        <div class="middle-section">
            <div id="phoenix-beast"><img id="phoenix-img" src="https://raw.githack.com/KFruti88/Phoenix-Darkfire/main/Banner.png"></div>
            <div id="alert-box"><div class="name-banner" id="follower-name"></div></div>
        </div>

        <div class="live-friends-panel" id="live-friends-panel"></div>

        <div class="bottom-left-container">
            <div class="qr-wrapper">
                <img id="support-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Flinktr.ee%2FPhoenixDarkfire%3Futm_id%3DG-G-Z9M5LXQ5XN%26utm_source%3Dsmlc_qr%26utm_medium%3Dprint%26utm_campaign%3Dphoenix_darkfire_linktree_phoenixdarkfire_qr&bgcolor=ffffff&color=000000" alt="Support QR">
            </div>
        </div>

        <div class="bottom-ticker-container">
            <div class="ticker-text">
                Like What You See? Subscribe! &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Also Follow my friends CoralPoppa, GraphicsWorx, GriffinsCoffin, and Werewolf3788 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            </div>
        </div>

        <div class="bottom-right-container">
            <div class="game-title-wrapper">
                <div class="current-game-title" id="game-title">SCANNING...</div>
                
                <div class="game-thumbnail-container" id="game-thumbnail-container">
                    <img id="game-art-img" src="" alt="Game Art">
                </div>
            </div>

            <div class="identity-column">
                <div class="stats-stack">
                    <div class="stat-label">RECRUITS: <span id="follower-count">0</span></div>
                </div>

                <div class="profile-pic-wrapper">
                    <img id="twitch-profile-img" src="https://static-cdn.jtvnw.net/jtv_user_pictures/705599df-3e5f-4d6f-9c95-3ff34317d268-profile_image-70x70.png" alt="Phoenix">
                </div>
            </div>
        </div>
    </div>

    <script>
        // VERSION TIMESTAMP: 2026-07-13 13:55:00 CT
        // CRITICAL: Logic updated to include ?v= smart cache-busters and standard postMessage integration.
        
        const fxContainer = document.getElementById('fx-container');
        const beast = document.getElementById('phoenix-beast');
        const alertBox = document.getElementById('alert-box');
        const nameField = document.getElementById('follower-name');
        const gameTitleField = document.getElementById('game-title');
        const masterThemeContainer = document.getElementById('master-theme-container');
        
        const gameThumbnailContainer = document.getElementById('game-thumbnail-container');
        const gameArtImg = document.getElementById('game-art-img');
        
        const followerField = document.getElementById('follower-count');
        const profileImg = document.getElementById('twitch-profile-img');
        const friendsPanel = document.getElementById('live-friends-panel');

        let DEBUG_MODE = true; 
        let ACTIVE_THEME = "default";

        const GAME_ID_MAP = {
            "ghostwire: tokyo": "512923",
            "ghostwire tokyo": "512923",
            "ghost wire": "512923",
            "just chatting": "509658",
            "retro": "27284",
            "fortnite": "21776",
            "minecraft": "27471",
            "special events": "509663",
            "league of legends": "21779",
            "art": "509660",
            "talk shows & podcasts": "417752",
            "music": "26936",
            "software and game development": "509670",
            "call of duty: warzone": "512710",
            "counter-strike": "32399",
            "grand theft auto v": "32982",
            "apex legends": "511224",
            "valorant": "516575",
            "papa's pizzeria deluxe": "1507742194",
            "papas pizzeria deluxe": "1507742194",
            "rebuild 3: gangs of deadsville": "1657273395"
        };

        function applyLayoutTheme(themeName) {
            if (!themeName) return;
            const target = themeName.trim().toLowerCase();
            
            if (target.includes("rebuild 3") || target.includes("rebuild3")) {
                masterThemeContainer.classList.add('rebuild3-theme');
                ACTIVE_THEME = "rebuild3";
            } else {
                masterThemeContainer.classList.remove('rebuild3-theme');
                ACTIVE_THEME = "default";
            }
        }

        function updateGameArt(gameName) {
            if (!gameName || gameName.toLowerCase().includes("scanning") || gameName.toLowerCase().includes("offline")) {
                gameThumbnailContainer.style.display = 'none';
                return;
            }

            const cleanQuery = gameName.trim().toLowerCase();
            
            if (cleanQuery.includes("rebuild 3") || cleanQuery.includes("rebuild3")) {
                applyLayoutTheme("rebuild 3");
            } else if (!window.SE_Saved_Theme || !window.SE_Saved_Theme.toLowerCase().includes("rebuild 3")) {
                applyLayoutTheme("default");
            }

            let matchedID = GAME_ID_MAP[cleanQuery];
            
            if (!matchedID) {
                for (const key in GAME_ID_MAP) {
                    if (cleanQuery.includes(key) || key.includes(cleanQuery)) {
                        matchedID = GAME_ID_MAP[key];
                        break;
                    }
                }
            }

            gameArtImg.onload = function() {
                gameThumbnailContainer.style.display = 'block';
            };

            gameArtImg.onerror = function() {
                gameThumbnailContainer.style.display = 'none';
            };

            if (matchedID) {
                gameArtImg.src = `https://static-cdn.jtvnw.net/ttv-boxart/${matchedID}-285x380.jpg`;
            } else {
                const urlEncodedName = encodeURIComponent(gameName);
                gameArtImg.src = `https://static-cdn.jtvnw.net/ttv-boxart/./${urlEncodedName}-285x380.jpg`;
            }
        }

        async function fetchFriendsStatus() {
            const friendsList = [
                { username: "coralpoppa", displayName: "CoralPoppa" },
                { username: "graphixworkx", displayName: "GraphixWorkx" },
                { username: "griffinscoffin", displayName: "Griffinscoffin" },
                { username: "werewolf3788", displayName: "Werewolf3788" }
            ];

            if (DEBUG_MODE) {
                friendsPanel.innerHTML = "";
                return;
            }

            friendsPanel.innerHTML = ""; 

            // Explicitly using ?v=timestamp cache-buster on JSON API calls
            for (const friend of friendsList) {
                try {
                    const uptimeRes = await fetch(`https://decapi.me/twitch/uptime/${friend.username}?v=${Date.now()}`);
                    if (uptimeRes.ok) {
                        const uptimeText = (await uptimeRes.text()).trim().toLowerCase();
                        if (!uptimeText.includes("offline") && uptimeText.length > 0) {
                            let game = "Just Chatting";

                            const gameRes = await fetch(`https://decapi.me/twitch/game/${friend.username}?v=${Date.now()}`);
                            if (gameRes.ok) {
                                game = (await gameRes.text()).trim();
                            }

                            const el = createFriendCard(friend.displayName, game);
                            friendsPanel.appendChild(el);
                        }
                    }
                } catch (e) {
                    console.error("Error fetching friend status for", friend.username, e);
                }
            }
        }

        function createFriendCard(name, game) {
            const card = document.createElement("div");
            card.className = "friend-card";
            card.innerHTML = `
                <div class="friend-info">
                    <div class="friend-name">
                        <span class="live-dot"></span>${name}
                    </div>
                    <div class="friend-game">${game}</div>
                </div>
            `;
            return card;
        }

        async function fetchTwitchData() {
            const timestamp = Date.now();
            
            try {
                // Explicitly using ?v=timestamp cache-buster
                const gameRes = await fetch(`https://decapi.me/twitch/game/phoenix_darkfire?v=${timestamp}`);
                if (gameRes.ok) {
                    let game = (await gameRes.text()).trim();
                    if (game.toLowerCase().includes("offline") || !game) {
                        gameTitleField.innerText = DEBUG_MODE ? "REBUILD 3: GANGS OF DEADSVILLE" : "OFFLINE";
                        updateGameArt(DEBUG_MODE ? "Rebuild 3: Gangs of Deadsville" : "");
                    } else {
                        gameTitleField.innerText = game.toUpperCase();
                        updateGameArt(game);
                    }
                }
            } catch (e) {
                if (DEBUG_MODE && gameTitleField.innerText === "SCANNING...") {
                    gameTitleField.innerText = "REBUILD 3: GANGS OF DEADSVILLE";
                    updateGameArt("Rebuild 3: Gangs of Deadsville");
                }
            }

            try {
                const followRes = await fetch(`https://decapi.me/twitch/followcount/phoenix_darkfire?v=${timestamp}`);
                if (followRes.ok) {
                    let count = (await followRes.text()).trim();
                    followerField.innerText = count || "0";
                }
            } catch (e) {}
        }

        function startEngine() {
            fetchTwitchData();
            fetchFriendsStatus();
            
            setInterval(fetchTwitchData, 30000); 
            setInterval(fetchFriendsStatus, 30000);
            
            // Image cache buster injection
            profileImg.src = `https://static-cdn.jtvnw.net/jtv_user_pictures/705599df-3e5f-4d6f-9c95-3ff34317d268-profile_image-70x70.png?v=${Date.now()}`;
        }

        window.addEventListener('load', startEngine);

        /* 
        ===================================================================
        STREAMELEMENTS REMOTE DATA PASS-THROUGH HANDLER
        ===================================================================
        */
        function initOverlayWithSEData(fieldData) {
            if (!fieldData) return;
            
            if (fieldData.customBackgroundWebUrl) {
                document.body.style.backgroundImage = `url('${fieldData.customBackgroundWebUrl}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
            }

            if (typeof fieldData.enableDebugMode !== 'undefined') {
                DEBUG_MODE = fieldData.enableDebugMode;
            }

            if (fieldData.selectLayoutTheme) {
                window.SE_Saved_Theme = fieldData.selectLayoutTheme;
                applyLayoutTheme(fieldData.selectLayoutTheme);
            }
            
            fetchTwitchData();
            fetchFriendsStatus();
        }

        // --- THE FIX: Standard cross-origin listener for iframe setup ---
        window.addEventListener('message', function(event) {
            // Only process events explicitly tagged by our SE bridge
            if (event.data && event.data.target === 'SE_REMOTE_BRIDGE') {
                initOverlayWithSEData(event.data.fieldData);
            }
        });

        // Backup legacy logic for same-origin DOM testing
        if (window.SE_Data_Bridge && window.SE_Data_Bridge.fieldData) {
            initOverlayWithSEData(window.SE_Data_Bridge.fieldData);
        }
        window.addEventListener('seDataBridgeReady', function() {
            initOverlayWithSEData(window.SE_Data_Bridge.fieldData);
        });
    </script>
</body>
</html>
