<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 
      VERSION TIMESTAMP: 2026-07-13 12:40:00 CT
      CRITICAL: Viewport standard configured for strict 100vw layout tracking. 
      MODIFICATION: Completely integrated full StreamElements dynamic field mappings to prevent property truncation errors.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Darkfire - Elite Protocol</title>
    <!-- Animate.css for the alert events -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            max-width: 100%;
            height: 100%; 
            overflow: hidden; 
            background: transparent; /* Fully transparent for OBS/StreamElements capture */
            font-family: 'Arial Black', sans-serif; 
            font-size: 16px; /* Mobile-first design default baseline fallback */
        }

        /* Prevent scrollbars */
        .overlay-wrapper { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            position: relative;
        }

        /* --- TOP BANNER --- */
        .top-banner {
            height: 12vh; 
            width: 100%; 
            background: linear-gradient(90deg, #000000 0%, #001a33 50%, #000000 100%); 
            position: relative; 
            overflow: hidden; 
            border-bottom: 0.4vh solid #0055ff; 
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .top-banner::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .wing-text {
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            font-size: 3.5vh; 
            color: #00d4ff;
            text-transform: uppercase; 
            text-shadow: 0 0 15px #0055ff, 0 0 30px #0055ff; 
            letter-spacing: 0.5vw; 
            z-index: 11;
        }
        .left-wing { left: 10vw; } 
        .right-wing { right: 10vw; }

        /* --- FX LAYER --- */
        #fx-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            pointer-events: none; 
            z-index: 50; 
        }
        .falling-icon {
            position: absolute; 
            font-size: 5vh; 
            animation: fall linear forwards;
            filter: drop-shadow(0 0 10px #00d4ff);
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .firework-particle {
            position: absolute; 
            width: 8px; 
            height: 8px; 
            background: #00d4ff;
            border-radius: 50%; 
            box-shadow: 0 0 15px #0055ff; 
            pointer-events: none;
        }

        /* Middle layout wrapper */
        .middle-section { 
            flex: 1; 
            position: relative; 
            background: transparent; 
        }

        /* --- PHOENIX ALERT --- */
        #phoenix-beast {
            position: absolute; 
            width: 30vw; 
            max-width: 600px; 
            aspect-ratio: 1/1; 
            top: 50%; 
            left: -100vw; 
            z-index: 150;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
            filter: grayscale(100%) brightness(0.8) sepia(1) hue-rotate(185deg) saturate(15) drop-shadow(0 0 5vw #0055ff); 
            opacity: 0;
        }
        #phoenix-img { width: 100%; height: 100%; object-fit: contain; }
        #alert-box { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            text-align: center; 
            display: none; 
            z-index: 200; 
            width: 90vw; 
        }
        .name-banner {
            font-size: 8vw; 
            font-weight: 900; 
            text-transform: uppercase;
            background: linear-gradient(to bottom, #00d4ff 0%, #0055ff 50%, #001a33 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 2vw rgba(0, 85, 255, 0.8));
        }

        .ignite { animation: blueFire 2.8s ease-out forwards; }
        @keyframes blueFire {
            0% { filter: grayscale(100%) sepia(1) hue-rotate(185deg) saturate(15) brightness(1); transform: scale(1); opacity: 1; }
            40% { filter: grayscale(100%) sepia(1) hue-rotate(185deg) saturate(20) brightness(40) blur(2vh); transform: scale(3.5); opacity: 1; }
            100% { filter: brightness(0) blur(5vh); transform: scale(0); opacity: 0; }
        }

        /* --- BOTTOM LEFT: QR ONLY --- */
        .bottom-left-container {
            position: absolute;
            bottom: 3vh;
            left: 3vw;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1.5vh;
            animation: slideInLeft 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .qr-wrapper {
            background: rgba(0, 0, 0, 0.6);
            padding: 1vh;
            border-radius: 1.2vh;
            border: 1px solid rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 85, 255, 0.15);
        }

        #support-qr {
            width: 12vh;
            height: 12vh;
            display: block;
            border-radius: 0.5vh;
        }

        /* --- BOTTOM TICKER (CENTER) --- */
        .bottom-ticker-container {
            position: absolute;
            bottom: 3.5vh;
            left: 18vw; 
            right: 42vw;
            height: 4vh;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(0, 85, 255, 0.3);
            border-bottom: 1px solid rgba(0, 85, 255, 0.3);
            backdrop-filter: blur(5px);
            overflow: hidden;
            display: flex;
            align-items: center;
            z-index: 55;
            border-radius: 0.5vh;
        }

        .ticker-text {
            white-space: nowrap;
            display: inline-block;
            animation: ticker-scroll 45s linear infinite;
            color: #00d4ff;
            font-size: 1.5vh;
            text-transform: uppercase;
            letter-spacing: 0.1vw;
            text-shadow: 0 0 10px rgba(0, 85, 255, 0.8);
        }

        @keyframes ticker-scroll {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* --- BOTTOM RIGHT: CARTRIDGE LAYOUT --- */
        .bottom-right-container {
            position: absolute;
            bottom: 3vh;
            right: 3vw;
            z-index: 60;
            display: flex;
            flex-direction: row; 
            align-items: flex-end;
            gap: 1.5vw;
            animation: slideInRight 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .game-title-wrapper {
            max-width: 25vw;
            padding-bottom: 0.5vh; 
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1.5vh;
        }

        .current-game-title {
            font-size: 2.2vh;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 85, 255, 0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 900;
            animation: textPulse 2s infinite alternate;
        }

        /* --- DYNAMIC POSTER ART BOX --- */
        .game-thumbnail-container {
            width: 10.5vh;
            height: 14vh;
            border-radius: 0.8vh;
            overflow: hidden;
            border: 2px solid rgba(0, 212, 255, 0.45);
            box-shadow: 0 0 15px rgba(0, 85, 255, 0.3);
            background-color: rgba(0, 12, 26, 0.95);
            display: none; 
        }

        #game-art-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .identity-column {
            display: flex;
            flex-direction: column;
            align-items: center; 
            gap: 0.8vh;
        }

        .stats-stack {
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
            align-items: center;
        }

        .stat-label {
            font-size: 1.1vh;
            color: #00d4ff;
            padding: 2px 8px;
            border: 1px solid #0055ff;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.1vw;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .stat-label span { color: #fff; }

        .profile-pic-wrapper {
            position: relative;
            width: 10vh;
            height: 10vh;
            border-radius: 50%;
            padding: 0.4vh;
            background: linear-gradient(45deg, #0055ff, #00d4ff);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        #twitch-profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 0.2vh solid #000;
        }

        /* --- RIGHT CENTER: LIVE FRIENDS SIDEBAR PANEL --- */
        .live-friends-panel {
            position: absolute;
            right: 0.5vw; 
            top: 45%;
            transform: translateY(-50%);
            z-index: 65;
            display: flex;
            flex-direction: column;
            gap: 0.8vh;
            pointer-events: none;
        }

        .friend-card {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 85, 255, 0.3);
            border-right: 0.3vh solid #00d4ff; 
            border-radius: 0.4vh;
            padding: 0.5vh 0.6vw;
            box-shadow: 0 0 10px rgba(0, 85, 255, 0.15);
            animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            min-width: 10vw;
            max-width: 12vw;
        }

        .friend-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }

        .friend-name {
            font-size: 1.05vh;
            color: #fff;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
            letter-spacing: 0.05vw;
            display: flex;
            align-items: center;
        }

        .live-dot {
            display: inline-block;
            width: 0.6vh;
            height: 0.6vh;
            background-color: #00d4ff;
            border-radius: 50%;
            margin-right: 0.4vw;
            box-shadow: 0 0 5px #00d4ff;
            animation: pulse-dot 1.5s infinite alternate;
        }

        .friend-game {
            font-size: 0.85vh;
            color: rgba(0, 212, 255, 0.8);
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
            margin-top: 0.1vh;
            padding-left: 0.2vw;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 2px #00d4ff; }
            100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 8px #00d4ff; }
        }

        @keyframes textPulse {
            0% { text-shadow: 0 0 5px rgba(0, 132, 255, 0.6); }
            100% { text-shadow: 0 0 20px rgba(0, 212, 255, 1), 0 0 30px rgba(0, 85, 255, 0.8); }
        }

        @keyframes slideInRight {
            from { transform: translateX(120%) skewX(-10deg); opacity: 0; }
            to { transform: translateX(0) skewX(0deg); opacity: 1; }
        }

        @keyframes slideInLeft {
            from { transform: translateX(-120%) skewX(10deg); opacity: 0; }
            to { transform: translateX(0) skewX(0deg); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="fx-container"></div>

    <div class="overlay-wrapper">
        <header class="top-banner">
            <div class="wing-text left-wing">Phoenix</div>
            <div class="wing-text right-wing">Darkfire</div>
        </header>

        <div class="middle-section">
            <div id="phoenix-beast"><img id="phoenix-img" src="https://raw.githubusercontent.com/KFruti88/Phoenix-Darkfire/main/Banner.png"></div>
            <div id="alert-box"><div class="name-banner" id="follower-name"></div></div>
        </div>

        <!-- RIGHT CENTER: DYNAMIC LIVE FRIENDS PANEL -->
        <div class="live-friends-panel" id="live-friends-panel">
            <!-- Populated dynamically via JS -->
        </div>

        <!-- BOTTOM LEFT: QR TRACKING CARTRIDGE -->
        <div class="bottom-left-container">
            <div class="qr-wrapper">
                <img id="support-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Flinktr.ee%2FPhoenixDarkfire%3Futm_id%3DG-G-Z9M5LXQ5XN%26utm_source%3Dsmlc_qr%26utm_medium%3Dprint%26utm_campaign%3Dphoenix_darkfire_linktree_phoenixdarkfire_qr&bgcolor=ffffff&color=000000" alt="Support QR">
            </div>
        </div>

        <!-- BOTTOM MIDDLE: TICKER PROTOCOL -->
        <div class="bottom-ticker-container">
            <div class="ticker-text">
                Like What You See? Subscribe! &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; CoralPoppa, GraphicsWorx, GriffinsCoffin, and Werewolf3788 ——— Like What You See? Subscribe! &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Also Follow my friends CoralPoppa, GraphicsWorx, GriffinsCoffin, and Werewolf3788
            </div>
        </div>

        <!-- BOTTOM RIGHT: IDENTITY, STATS & DYNAMIC CARTRIDGE -->
        <div class="bottom-right-container">
            <div class="game-title-wrapper">
                <div class="current-game-title" id="game-title">SCANNING...</div>
                
                <div class="game-thumbnail-container" id="game-thumbnail-container">
                    <img id="game-art-img" src="" alt="Game Art">
                </div>
            </div>

            <div class="identity-column">
                <div class="stats-stack">
                    <div class="stat-label">RECRUITS: <span id="follower-count">0</span></div>
                </div>

                <div class="profile-pic-wrapper">
                    <img id="twitch-profile-img" src="https://static-cdn.jtvnw.net/jtv_user_pictures/705599df-3e5f-4d6f-9c95-3ff34317d268-profile_image-70x70.png" alt="Phoenix">
                </div>
            </div>
        </div>
    </div>

    <script>
        const fxContainer = document.getElementById('fx-container');
        const beast = document.getElementById('phoenix-beast');
        const alertBox = document.getElementById('alert-box');
        const nameField = document.getElementById('follower-name');
        const gameTitleField = document.getElementById('game-title');
        
        const gameThumbnailContainer = document.getElementById('game-thumbnail-container');
        const gameArtImg = document.getElementById('game-art-img');
        
        const followerField = document.getElementById('follower-count');
        const profileImg = document.getElementById('twitch-profile-img');
        const friendsPanel = document.getElementById('live-friends-panel');

        /* Toggle false to fetch real live API metrics on stream */
        let DEBUG_MODE = true; 

        /**
         * Dynamic Game ID Mapping Database
         */
        const GAME_ID_MAP = {
            "ghostwire: tokyo": "512923",
            "ghostwire tokyo": "512923",
            "ghost wire": "512923",
            "just chatting": "509658",
            "retro": "27284",
            "fortnite": "21776",
            "minecraft": "27471",
            "special events": "509663",
            "league of legends": "21779",
            "art": "509660",
            "talk shows & podcasts": "417752",
            "music": "26936",
            "software and game development": "509670",
            "call of duty: warzone": "512710",
            "counter-strike": "32399",
            "grand theft auto v": "32982",
            "apex legends": "511224",
            "valorant": "516575",
            "papa's pizzeria deluxe": "1507742194",
            "papas pizzeria deluxe": "1507742194"
        };

        /**
         * Intelligent Game Box Art Loader
         */
        function updateGameArt(gameName) {
            if (!gameName || gameName.toLowerCase().includes("scanning") || gameName.toLowerCase().includes("offline")) {
                gameThumbnailContainer.style.display = 'none';
                return;
            }

            const cleanQuery = gameName.trim().toLowerCase();
            const matchedID = GAME_ID_MAP[cleanQuery];

            gameArtImg.onload = function() {
                gameThumbnailContainer.style.display = 'block';
            };

            gameArtImg.onerror = function() {
                gameThumbnailContainer.style.display = 'none';
            };

            if (matchedID) {
                gameArtImg.src = `https://static-cdn.jtvnw.net/ttv-boxart/${matchedID}-285x380.jpg`;
            } else {
                const urlEncodedName = encodeURIComponent(gameName);
                gameArtImg.src = `https://static-cdn.jtvnw.net/ttv-boxart/./${urlEncodedName}-285x380.jpg`;
            }
        }

        /**
         * Dynamic live checker for target friends
         */
        async function fetchFriendsStatus() {
            const friendsList = [
                { username: "coralpoppa", displayName: "CoralPoppa" },
                { username: "graphixworkx", displayName: "GraphixWorkx" },
                { username: "griffinscoffin", displayName: "Griffinscoffin" },
                { username: "werewolf3788", displayName: "Werewolf3788" }
            ];

            if (DEBUG_MODE) {
                friendsPanel.innerHTML = "";
                return;
            }

            friendsPanel.innerHTML = ""; 

            for (const friend of friendsList) {
                try {
                    const uptimeRes = await fetch(`https://decapi.me/twitch/uptime/${friend.username}?cache=${Date.now()}`);
                    if (uptimeRes.ok) {
                        const uptimeText = (await uptimeRes.text()).trim().toLowerCase();
                        if (!uptimeText.includes("offline") && uptimeText.length > 0) {
                            let game = "Just Chatting";

                            const gameRes = await fetch(`https://decapi.me/twitch/game/${friend.username}?cache=${Date.now()}`);
                            if (gameRes.ok) {
                                game = (await gameRes.text()).trim();
                            }

                            const el = createFriendCard(friend.displayName, game);
                            friendsPanel.appendChild(el);
                        }
                    }
                } catch (e) {
                    console.error("Error fetching friend status for", friend.username, e);
                }
            }
        }

        function createFriendCard(name, game) {
            const card = document.createElement("div");
            card.className = "friend-card";
            card.innerHTML = `
                <div class="friend-info">
                    <div class="friend-name">
                        <span class="live-dot"></span>${name}
                    </div>
                    <div class="friend-game">${game}</div>
                </div>
            `;
            return card;
        }

        /**
         * Fetches real-time profile analytics from DecAPI endpoints
         */
        async function fetchTwitchData() {
            const timestamp = Date.now();
            
            try {
                const gameRes = await fetch(`https://decapi.me/twitch/game/phoenix_darkfire?cache=${timestamp}`);
                if (gameRes.ok) {
                    let game = (await gameRes.text()).trim();
                    if (game.toLowerCase().includes("offline") || !game) {
                        gameTitleField.innerText = DEBUG_MODE ? "PAPA'S PIZZERIA DELUXE" : "OFFLINE";
                        updateGameArt(DEBUG_MODE ? "Papa's Pizzeria Deluxe" : "");
                    } else {
                        gameTitleField.innerText = game.toUpperCase();
                        updateGameArt(game);
                    }
                }
            } catch (e) {
                if (DEBUG_MODE && gameTitleField.innerText === "SCANNING...") {
                    gameTitleField.innerText = "PAPA'S PIZZERIA DELUXE";
                    updateGameArt("Papa's Pizzeria Deluxe");
                }
            }

            try {
                const followRes = await fetch(`https://decapi.me/twitch/followcount/phoenix_darkfire?cache=${timestamp}`);
                if (followRes.ok) {
                    let count = (await followRes.text()).trim();
                    followerField.innerText = count || "0";
                }
            } catch (e) {}
        }

        // --- Execution Loops & Startup Protocols ---
        function startEngine() {
            fetchTwitchData();
            fetchFriendsStatus();
            
            setInterval(fetchTwitchData, 30000); 
            setInterval(fetchFriendsStatus, 30000);
            
            profileImg.src = `https://static-cdn.jtvnw.net/jtv_user_pictures/705599df-3e5f-4d6f-9c95-3ff34317d268-profile_image-70x70.png?t=${Date.now()}`;
        }

        window.addEventListener('load', startEngine);

        /* 
        ===================================================================
        STREAMELEMENTS INTEGRATION CAPTURE PROTOCOL
        ===================================================================
        Captures dynamic settings right from the left-hand field settings 
        panel to ensure visual options match what is saved in the dashboard.
        */
        window.addEventListener('onWidgetLoad', function (obj) {
            const fieldData = obj.detail.fieldData;
            
            // Map custom canvas background assets if defined in the configuration JSON
            if (fieldData && fieldData.customBackgroundWebUrl) {
                document.body.style.backgroundImage = `url('${fieldData.customBackgroundWebUrl}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
            }

            // Map editor panel debug override state toggles
            if (fieldData && typeof fieldData.enableDebugMode !== 'undefined') {
                DEBUG_MODE = fieldData.enableDebugMode;
            }
            
            fetchTwitchData();
            fetchFriendsStatus();
        });

        setTimeout(() => { 
            if (gameTitleField.innerText === "SCANNING...") {
                fetchTwitchData(); 
                fetchFriendsStatus();
            }
        }, 500);

        function triggerFollowerAlert(name) {
            beast.classList.remove('ignite');
            beast.style.opacity = "1"; 
            beast.style.left = "50%"; 
            beast.style.transform = "translate(-50%, -50%) scale(1.5)";
            setTimeout(() => {
                beast.classList.add('ignite');
                setTimeout(() => {
                    alertBox.style.display = "block";
                    nameField.innerHTML = `NEW FOLLOWER<br>${name}`;
                }, 600);
                setTimeout(() => {
                    beast.style.opacity = "0"; 
                    beast.style.left = "-100vw"; 
                    alertBox.style.display = "none";
                }, 8500);
            }, 1600);
        }

        window.addEventListener('onEventReceived', function (obj) {
            const sk = obj.detail.listener;
            const ev = obj.detail.event;
            if (!ev) return;

            if (sk === 'message') {
                const user = (ev.data.displayName || ev.data.nick || "").toLowerCase();
                if (user === 'cat_louves' || user === 'anakigod99' || user === 'corelpoppa') {
                    const particleCount = 40;
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    for (let i = 0; i < particleCount; i++) {
                        const p = document.createElement('div');
                        p.className = 'firework-particle';
                        p.style.left = centerX + 'px';
                        p.style.top = centerY + 'px';
                        fxContainer.appendChild(p);
                        const angle = Math.random() * Math.PI * 2;
                        const velocity = Math.random() * 20 + 10;
                        const destinationX = Math.cos(angle) * velocity * 20;
                        const destinationY = Math.sin(angle) * velocity * 20;
                        p.animate([
                            { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                            { transform: 'translate(' + destinationX + 'px, ' + destinationY + 'px) scale(0)', opacity: 0 }
                        ], { duration: 1500, easing: 'ease-out' });
                        setTimeout(() => p.remove(), 1500);
                    }
                }
                const rain = (icons) => {
                    for(let i=0; i<50; i++) {
                        setTimeout(() => {
                            const icon = document.createElement('div');
                            icon.className = 'falling-icon';
                            let selected = icons[Math.floor(Math.random() * icons.length)];
                            icon.innerHTML = selected;
                            icon.style.left = Math.random() * 100 + 'vw';
                            icon.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                            fxContainer.appendChild(icon);
                            setTimeout(() => icon.remove(), 3000);
                        }, i * 60);
                    }
                }
                if (user === 'nyxskillissue') rain(['🐈', '⚡', '🍪', '🐱', '⚡', '🍪', '😻', '⚡', '🍪', '😼']);
                if (user === 'phoenix_darkfire') rain(['🦅', '🔥', '🐦', '✨']); 
                if (user === 'werewolf3788') rain(['🐺', '🌕', '🐾', '🐺']);
            }
            if (sk === 'follower-latest') {
                triggerFollowerAlert(ev.name);
            }
        });
    </script>
