<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Cards preview - Werewolf3788</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CTYHDF4MSD"></script>
<script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-CTYHDF4MSD');</script>
<style>
  html, body { margin: 0; height: 100%; }
  #stage { position: relative; width: 100vw; height: 100vh; background: #000 url('/Images/wildlands/spots/ksf_ocoro_04.jpg') center/cover no-repeat; }
  body.clear #stage { background: transparent; }
  #bar { position: fixed; top: 10px; right: 10px; z-index: 99; display: flex; gap: 6px; font: 600 13px system-ui; }
  #bar button { padding: 6px 10px; border-radius: 8px; border: 0; background: #0f172a; color: #fff; cursor: pointer; }
</style>
<style id="widgetCss"></style>
</head>
<body>
<div id="bar">
  <button onclick="demo.chat()">+ chat</button><button onclick="demo.relay()">+ YouTube</button><button onclick="demo.bot()">+ bot</button>
  <button onclick="demo.alert('follower-latest')">+ follow</button><button onclick="demo.alert('subscriber-latest')">+ sub</button>
  <button onclick="demo.alert('raid-latest')">+ raid</button><button onclick="demo.alert('cheer-latest')">+ bits</button>
</div>
<div id="stage"></div>
<script>
// Loads the real widget files, fills the {{fields}} with their defaults, then plays sample events.
(async () => {
  if (new URLSearchParams(location.search).has('clear')) { document.body.classList.add('clear'); document.getElementById('bar').remove(); }
  const [html, css, fields] = await Promise.all(['se-cards.html', 'se-cards.css', 'se-cards.fields.json'].map(f => fetch(f, { cache: 'no-store' }).then(r => f.endsWith('json') ? r.json() : r.text())));
  const fd = Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, v.value]));
  document.getElementById('widgetCss').textContent = css.replace(/\{\{(\w+)\}\}/g, (_, k) => fd[k] ?? '');
  document.getElementById('stage').innerHTML = html;
  await new Promise((ok) => { const s = document.createElement('script'); s.src = 'se-cards.js?v=' + Date.now(); s.onload = ok; document.body.appendChild(s); });
  window.dispatchEvent(new CustomEvent('onWidgetLoad', { detail: { fieldData: fd } }));
  const send = (listener, event) => window.dispatchEvent(new CustomEvent('onEventReceived', { detail: { listener, event } }));
  const msg = (nick, text, color) => send('message', { data: { nick, displayName: nick, text, displayColor: color, msgId: Math.random() + '', userId: nick, badges: [], emotes: [] } });
  window.demo = {
    chat: () => msg('raymystyro', 'that sniper shot was clean 🔥 where is the next Kingslayer file?', '#22d3ee'),
    relay: () => msg('modem3788', '[YT] GhostFan99: watching from YouTube, love the stream!', '#a78bfa'),
    bot: () => msg('modem3788', '🏆 wildhorse_spirit just earned "The Whole Story"!', '#a78bfa'),
    alert: (l) => send(l, { name: ['terrdog420', 'Phoenix_Darkfire', 'raymystyro'][Math.floor(Math.random() * 3)], amount: l.startsWith('raid') ? 12 : l.startsWith('cheer') ? 500 : 1 }),
  };
  [() => demo.alert('follower-latest'), demo.chat, demo.relay, demo.bot, () => demo.alert('subscriber-latest')].forEach((f, i) => setTimeout(f, 300 + i * 700));
})();
</script>
</body>
</html>
