<!-- Main Overlay Engine Script -->
<script>
    // Section 6: Runtime Configuration (Lines 172-180)
    const APP_CONFIG = {
        twitchUser: "werewolf3788",
        psnUser: "wildhorse_spirit",
        psnDb: "https://playstation-stats-default-rtdb.firebaseio.com/psn/gamertags/",
        statusPosition: "right",   // "right" = under the game name, "top" = top centre of the screen
        timezone: "America/New_York",
        fallbackArtSvg: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='92' height='129' viewBox='0 0 92 129'><rect width='100%' height='100%' fill='%230f172a'/><text x='50%' y='50%' fill='%2394a3b8' font-family='sans-serif' font-size='9' font-weight='bold' text-anchor='middle'>NO GAME ART</text></svg>"
    };

    window.lastGlobalUpdateStamp = Date.now();
    window.psnPlaying = false;   // true while PlayStation says a game is running

    // Section 7: Protocol Helper (Lines 184-192)
    function formatAssetUrl(url) {
        if (!url || typeof url !== 'string') return null;
        const clean = url.trim();
        if (clean.startsWith('//')) return `https:${clean}`;
        if (clean.startsWith('http://')) return clean.replace('http://', 'https://');
        if (clean.startsWith('https://') || clean.startsWith('data:image')) return clean;
        return null;
    }

    function isApiErrorResponse(text) {
        if (!text) return true;
        const lower = text.toLowerCase().trim();
        return lower.includes('an error occurred') || 
               lower.includes('user not found') || 
               lower.includes('could not') || 
               lower.includes('rate limit') || 
               lower.includes('404') || 
               lower.includes('500') || 
               lower.startsWith('error');
    }

    // Section 8: Twitch Data Sync Engine (Lines 207-270)
    async function syncTwitchOverlay() {
        const cacheBust = Date.now();

        // 1. Fetch Twitch Avatar
        try {
            const pfpEl = document.getElementById('user-pfp');
            if (pfpEl) {
                const pfpRes = await fetch(`https://decapi.me/twitch/avatar/${APP_CONFIG.twitchUser}?v=${cacheBust}`);
                if (pfpRes.ok) {
                    const pfpRaw = await pfpRes.text();
                    const pfpUrl = formatAssetUrl(pfpRaw);
                    if (pfpUrl && !isApiErrorResponse(pfpUrl)) {
                        if (pfpEl.src !== pfpUrl) {
                            pfpEl.src = pfpUrl;
                        }
                        pfpEl.style.display = 'block';
                    }
                }
            }
        } catch (errPfp) {
            console.warn("Avatar fetch error:", errPfp);
        }

        // 2. Fetch Twitch Game Title & Build Box Art
        try {
            const gameRes = await fetch(`https://decapi.me/twitch/game/${APP_CONFIG.twitchUser}?v=${cacheBust}`);
            const gameRaw = (await gameRes.text()).trim();
            const activityEl = document.getElementById('current-activity');
            const boxArt = document.getElementById('game-boxart');

            if (window.psnPlaying) {
                // PlayStation is supplying the game name, poster art and status
            } else if (!isApiErrorResponse(gameRaw) && gameRaw !== "") {
                if (activityEl) {
                    activityEl.innerText = gameRaw.toUpperCase();
                }

                if (boxArt) {
                    // Pull standard vertical box art directly from Twitch CDN
                    const twitchArtUrl = `https://static-cdn.jtvnw.net/ttv-boxart/${encodeURIComponent(gameRaw)}-285x380.jpg`;
                    
                    boxArt.onerror = () => {
                        boxArt.src = APP_CONFIG.fallbackArtSvg;
                    };

                    if (boxArt.src !== twitchArtUrl) {
                        boxArt.dataset.wanted = '';
                        boxArt.src = twitchArtUrl;
                    }
                }
            } else {
                if (activityEl) {
                    activityEl.innerText = "WEREWOLF3788";
                }
                if (boxArt && (!boxArt.src || boxArt.src.includes('data:image'))) {
                    boxArt.src = APP_CONFIG.fallbackArtSvg;
                }
            }
        } catch (errGame) {
            console.warn("Twitch game fetch error:", errGame);
        }
    }

    // Section 8b: PlayStation Data Sync (poster art, game name, game status)
    async function syncPsnOverlay() {
        const activityEl = document.getElementById('current-activity');
        const statusEl = document.getElementById('game-status');
        const boxArt = document.getElementById('game-boxart');
        let card = null;
        const keys = [...new Set([APP_CONFIG.psnUser, APP_CONFIG.psnUser.toLowerCase()])];
        for (const key of keys) {
            try {
                const res = await fetch(`${APP_CONFIG.psnDb}${encodeURIComponent(key)}.json?v=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) continue;
                const data = await res.json();
                if (data && typeof data === 'object') { card = data; break; }
            } catch (errPsn) {
                console.warn("PSN fetch error:", errPsn);
            }
        }

        const hunt = (card && card.activeHunt) || {};
        const game = card ? String(card.currentGame || '').trim() : '';
        const wasPlaying = window.psnPlaying;
        window.psnPlaying = !!(card && card.online && game && !/dashboard/i.test(game));

        if (!window.psnPlaying) {
            if (statusEl) statusEl.innerText = '';
            if (wasPlaying) syncTwitchOverlay();   // hand the dock back to Twitch
            return;
        }

        if (activityEl) activityEl.innerText = game.toUpperCase();
        if (statusEl) statusEl.innerText = String(card.gameStatus || hunt.gameStatus || '').trim();

        if (boxArt) {
            const twitchArtUrl = `https://static-cdn.jtvnw.net/ttv-boxart/${encodeURIComponent(game)}-285x380.jpg`;
            const psnArt = formatAssetUrl(card.currentGameArt || card.posterArt || card.art || card.image || hunt.art || hunt.posterArt);
            const wanted = psnArt || twitchArtUrl;
            boxArt.onerror = () => {
                boxArt.onerror = () => { boxArt.src = APP_CONFIG.fallbackArtSvg; };
                boxArt.src = (wanted !== twitchArtUrl) ? twitchArtUrl : APP_CONFIG.fallbackArtSvg;
            };
            if (boxArt.dataset.wanted !== wanted) {
                boxArt.dataset.wanted = wanted;
                boxArt.src = wanted;
            }
        }
    }

    // Section 9: DOM Ready & Loop Initialization
    document.addEventListener('DOMContentLoaded', () => {
        const statusEl = document.getElementById('game-status');
        if (statusEl && APP_CONFIG.statusPosition === 'top') {
            statusEl.classList.add('top-center');
            document.getElementById('wp-custom-wrapper').appendChild(statusEl);
        }

        syncPsnOverlay();
        setInterval(syncPsnOverlay, 15000);

        syncTwitchOverlay();

        // Staggered initial checks to handle browser paint timing
        setTimeout(syncTwitchOverlay, 1500);
        setTimeout(syncTwitchOverlay, 4000);

        // Keep polling Twitch every 15 seconds
        setInterval(syncTwitchOverlay, 15000);
    });
</script>
