<!DOCTYPE html>
<!--
  Werewolf3788 "Now Playing" overlay (1600x900 canvas, transparent)
  Lower-right dock: poster art + game name + game status.
  Data: playstation-stats RTDB /psn/gamertags/<tag> (public read, no keys needed).

  URL options (all optional):
    ?psn=wildhorse_spirit   PSN gamertag key
    &twitch=werewolf3788    fallback game name / box art when PSN has no game
    &accent=9333ea          accent colour (hex, no #)
    &label=NOW%20PLAYING    small heading above the game name (label=0 hides it)
    &status=top             put the game status in a banner at the top centre instead of the dock
    &hide=1                 hide the whole dock when not playing anything
    &scale=1.25             make the dock bigger / smaller
    &sec=15                 refresh every N seconds

  OBS: Browser Source, 1600x900. StreamElements: paste into a Custom Widget's HTML tab.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werewolf3788 Now Playing Overlay</title>
<script async src="//www.googletagmanager.com/gtag/js?id=G-CTYHDF4MSD"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-CTYHDF4MSD');</script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500;0,700;1,900&display=swap" rel="stylesheet">
<style>
:root{--accent:#9333ea;--glow:rgba(147,51,234,.6);--scale:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px;overflow:hidden;background:transparent;font-family:'Roboto',Arial,sans-serif;color:#fff}
#dock{position:absolute;right:16px;bottom:16px;display:flex;align-items:flex-end;gap:14px;transform:scale(var(--scale));transform-origin:bottom right;transition:opacity .6s,transform .6s}
#dock.off{opacity:0;transform:scale(var(--scale)) translateY(24px)}
#info{display:flex;flex-direction:column;align-items:flex-end;text-align:right;max-width:560px;padding:10px 16px 10px 22px;border-right:4px solid var(--accent);border-radius:10px 0 0 10px;background:linear-gradient(270deg,rgba(8,10,18,.88),rgba(8,10,18,.55) 70%,rgba(8,10,18,0));margin-bottom:6px}
#label{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);text-shadow:0 0 10px var(--glow);margin-bottom:2px}
#title{font-size:30px;line-height:1.08;font-weight:900;font-style:italic;text-transform:uppercase;text-shadow:0 2px 6px #000,0 0 14px var(--glow);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#status{font-size:17px;line-height:1.25;font-weight:500;color:#e5e7eb;text-shadow:0 2px 4px #000;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#status:empty{display:none}
#status::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;margin-right:8px;vertical-align:middle;position:relative;top:-1px}
#dock.idle #status::before{background:#6b7280;box-shadow:none}
#art{width:138px;height:193px;border-radius:9px;border:3px solid var(--accent);box-shadow:0 0 22px var(--glow),0 6px 16px rgba(0,0,0,.7);object-fit:cover;background:#0b0f19;transition:opacity .5s}
#art.blank{display:none}
#top{position:absolute;top:16px;left:50%;transform:translateX(-50%);max-width:1000px;padding:9px 26px;border-bottom:3px solid var(--accent);border-radius:10px;background:rgba(8,10,18,.82);box-shadow:0 0 18px var(--glow);font-size:24px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 5px #000;transition:opacity .6s}
#top.off{opacity:0}
</style>
</head>
<body>
<div id="top" class="off"></div>
<div id="dock" class="off">
  <div id="info">
    <div id="label">Now Playing</div>
    <div id="title"></div>
    <div id="status"></div>
  </div>
  <img id="art" class="blank" alt="" referrerpolicy="no-referrer">
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const CFG = {
    psn: (q.get('psn') || 'wildhorse_spirit').trim(),
    twitch: (q.get('twitch') || 'werewolf3788').trim(),
    accent: (q.get('accent') || '9333ea').replace(/[^0-9a-f]/gi, ''),
    label: q.get('label'),
    hide: q.get('hide') === '1',
    top: /^(top|center|centre)$/i.test(q.get('status') || ''),
    scale: Math.min(3, Math.max(0.4, parseFloat(q.get('scale')) || 1)),
    sec: Math.max(5, parseInt(q.get('sec'), 10) || 15)
  };
  const DB = 'https://playstation-stats-default-rtdb.firebaseio.com/psn/gamertags/';
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement.style;
  if (/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(CFG.accent)) {
    let h = CFG.accent; if (h.length === 3) h = h.split('').map((x) => x + x).join('');
    const n = parseInt(h, 16);
    root.setProperty('--accent', '#' + h);
    root.setProperty('--glow', `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},.6)`);
  }
  root.setProperty('--scale', CFG.scale);
  if (CFG.label === '0') $('label').style.display = 'none';
  else if (CFG.label) $('label').textContent = CFG.label;

  const secure = (u) => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u.replace(/^http:/i, 'https:') : '';
  let shownArt = null, twitchGame = '', card = null;

  function setArt(url) {
    const a = $('art'); url = secure(url);
    if (url === shownArt) return;
    shownArt = url;
    if (!url) { a.classList.add('blank'); a.removeAttribute('src'); return; }
    const img = new Image(); img.referrerPolicy = 'no-referrer';
    img.onload = () => { if (shownArt === url) { a.src = url; a.classList.remove('blank'); } };
    img.onerror = () => { if (shownArt === url) { a.classList.add('blank'); } };
    img.src = url;
  }

  function setStatus(txt) {
    txt = String(txt || '').trim();
    if (CFG.top) { $('status').textContent = ''; $('top').textContent = txt; $('top').classList.toggle('off', !txt); }
    else $('status').textContent = txt;
  }

  function paint() {
    const c = card || {};
    const hunt = c.activeHunt || {};
    const game = String(c.currentGame || '').trim();
    const playing = !!(c.online && game && !/dashboard/i.test(game));
    const name = playing ? game : twitchGame;
    const dock = $('dock');
    if (!name) {
      dock.classList.add('idle');
      if (CFG.hide) { dock.classList.add('off'); setStatus(''); return; }
      $('title').textContent = 'Not playing';
      if (CFG.top) setStatus(''); else setStatus(c.online ? 'On the PlayStation dashboard' : 'Offline');
      setArt('');
      dock.classList.remove('off');
      return;
    }
    dock.classList.remove('idle');
    $('title').textContent = name;
    setStatus(playing ? (c.gameStatus || hunt.gameStatus || '') : '');
    const psnArt = c.currentGameArt || c.posterArt || c.art || c.image || hunt.art || hunt.posterArt || '';
    if (playing && psnArt) setArt(psnArt);
    else setArt(`https://static-cdn.jtvnw.net/ttv-boxart/${encodeURIComponent(name)}-285x380.jpg`);
    dock.classList.remove('off');
  }

  async function readCard() {
    const keys = [...new Set([CFG.psn, CFG.psn.toLowerCase()])];
    for (const k of keys) {
      try {
        const r = await fetch(`${DB}${encodeURIComponent(k)}.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!r.ok) continue;
        const v = await r.json();
        if (v && typeof v === 'object') { card = v; paint(); return; }
      } catch (e) { console.warn('[now-playing] PSN read failed:', e && e.message); }
    }
    paint();
  }

  async function twitch() {
    if (!CFG.twitch) return;
    try {
      const r = await fetch(`https://decapi.me/twitch/game/${encodeURIComponent(CFG.twitch)}`, { cache: 'no-store' });
      const t = (await r.text()).trim();
      twitchGame = (r.ok && t && t.length < 90 && !/error|not found|offline|no game/i.test(t)) ? t : '';
    } catch (e) { twitchGame = ''; }
    paint();
  }

  readCard(); setInterval(readCard, CFG.sec * 1000);
  twitch(); setInterval(twitch, 60000);
})();
</script>
</body>
</html>
