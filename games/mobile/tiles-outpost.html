<title>Tiles Outpost</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;min-height:100%;background:#0b1220;color:#e2e8f0;font-family:system-ui,sans-serif}
  body{padding:0 0 8px}
  #top{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;justify-content:space-between;padding:8px 10px;background:#0f172acc;backdrop-filter:blur(6px);border-bottom:1px solid #1e293b;font-size:.8rem}
  .chip{background:#1e293b;border-radius:999px;padding:5px 10px;font-weight:800}
  .gold{color:#fbd34d}
  #top a{color:#93c5fd;text-decoration:none;font-weight:800}
  .wrap{padding:10px}
  h2{font-size:1rem;margin:14px 0 8px}
  .story{background:#122033;border-left:3px solid #38bdf8;border-radius:8px;padding:9px 11px;font-size:.8rem;line-height:1.45;color:#cbd5e1;margin-bottom:10px}
  .card{background:#111c2e;border:1px solid #1e293b;border-radius:12px;padding:10px;margin-bottom:8px}
  .card.locked{opacity:.45}
  .mrow{display:flex;align-items:center;gap:10px}
  .num{width:30px;height:30px;border-radius:9px;background:#1e293b;display:grid;place-items:center;font-weight:900;font-size:.8rem;flex:none}
  .mrow .g{flex:1;min-width:0}
  .nm{font-weight:800;font-size:.86rem}
  .sm{font-size:.7rem;color:#94a3b8;margin-top:2px}
  .stars{color:#fbbf24;font-size:.75rem;letter-spacing:1px}
  button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:9px 12px;background:#22c55e;color:#04210f;cursor:pointer;font-size:.78rem}
  button.alt{background:#334155;color:#e2e8f0}
  button.ghost{background:#1e293b;color:#cbd5e1}
  button:disabled{background:#28354a;color:#64748b}
  .bar{height:7px;background:#0b1220;border-radius:4px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:#ef4444;transition:width .25s}
  .bar.hp i{background:#22c55e}
  .bar.mana i{background:#38bdf8}
  .battle{display:flex;flex-direction:column;gap:8px}
  .foe{display:flex;gap:8px;background:#2a1220;border:1px solid #7f1d1d;border-radius:12px;padding:8px;cursor:pointer}
  .foe.sel{outline:2px solid #f87171}
  .foe .ic{font-size:1.6rem;width:30px;text-align:center}
  .foe.dead{opacity:.35;filter:grayscale(1)}
  .hero{display:flex;gap:8px;align-items:center;background:#111c2e;border:1px solid #1e293b;border-radius:12px;padding:8px}
  .hero .ic{font-size:1.5rem}
  .hero.dead{opacity:.35;filter:grayscale(1)}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .acts button{width:100%}
  .log{background:#0b1220;border:1px solid #1e293b;border-radius:10px;padding:8px;font-size:.72rem;color:#94a3b8;min-height:44px;line-height:1.5}
  .log b{color:#e2e8f0}
  .res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
  .res div{background:#111c2e;border:1px solid #1e293b;border-radius:12px;padding:10px 6px;font-size:.72rem;color:#94a3b8}
  .res b{display:block;font-size:1.1rem;color:#e2e8f0;margin-bottom:2px}
  #toast{position:fixed;left:0;right:0;bottom:14px;text-align:center;pointer-events:none;z-index:9}
  #toast div{display:inline-block;background:#0f172aee;border:1px solid #334155;color:#fde68a;font-weight:700;padding:8px 14px;border-radius:999px;font-size:.78rem;margin-top:5px}
  .home{display:flex;gap:8px;margin-bottom:10px}
  .home a{flex:1;text-align:center;background:#1e293b;color:#cbd5e1;text-decoration:none;border-radius:10px;padding:9px;font-size:.76rem;font-weight:800}
</style>
</head>
<body>
<div id="top">
  <span class="chip">🪙 <b id="t-gold">0</b></span>
  <span class="chip">🧪 <b id="t-potions">0</b></span>
  <span class="chip" id="t-mission">Mission 1</span>
  <a href="index.html">☰ Games</a>
</div>
<div class="wrap" id="main"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var SAVE = 'tilesoutpost_v2';

var HEROES = [
  { id:'sarge', n:'Sarge', ic:'🪖', hp:42, atk:9, ab:{ n:'Shield Bash', ic:'🛡️', cd:2, txt:'9 damage and the target misses its next turn' } },
  { id:'rusty', n:'Rusty', ic:'🔧', hp:34, atk:7, ab:{ n:'Field Repair', ic:'➕', cd:2, txt:'Heals the hurt hero for 16' } },
  { id:'leila', n:'Leila', ic:'🎯', hp:30, atk:11, ab:{ n:'Volley', ic:'🏹', cd:3, txt:'6 damage to every enemy' } }
];

var MISSIONS = [
  { n:1, name:'The Broken Gate', story:'The wall came down in the night. Scavengers are already picking through the rubble, and the road to the temple is open. Push them back before word spreads.', foes:[{n:'Scavenger',ic:'🐀',hp:20,atk:4},{n:'Scavenger',ic:'🐀',hp:20,atk:4}], turnLimit:4, gold:26 },
  { n:2, name:'Dust and Rust', story:'Old Rusty says the pumps are dry, and something with too many legs has moved into the well house. The village needs water by nightfall.', foes:[{n:'Well Creeper',ic:'🕷️',hp:30,atk:5},{n:'Scavenger',ic:'🐀',hp:18,atk:4}], turnLimit:5, gold:30 },
  { n:3, name:'Ash on the Wind', story:'Smoke on the horizon: a raider band burning the outer farms. They have archers up on the ridge, so close the distance before you bleed.', foes:[{n:'Raider',ic:'🪓',hp:34,atk:7},{n:'Raider Archer',ic:'🏹',hp:26,atk:8}], turnLimit:5, gold:34 },
  { n:4, name:'The Toll Bridge', story:'A toll keeper with a spiked club has decided the only bridge belongs to him. Every crate of supplies is stuck on this side of the river.', foes:[{n:'Toll Keeper',ic:'👹',hp:52,atk:9},{n:'Hired Blade',ic:'🗡️',hp:30,atk:6}], turnLimit:6, gold:38 },
  { n:5, name:'Warden of the Pass', story:'Boss: the Warden wears the old temple armour and has not left the pass in forty years. He hits like falling stone, so keep your wounded behind cover.', boss:true, foes:[{n:'The Warden',ic:'⛰️',hp:110,atk:14,cleave:true},{n:'Acolyte',ic:'🔮',hp:30,atk:5}], turnLimit:8, gold:60 },
  { n:6, name:'Lanterns in the Marsh', story:'Will-o-wisps are leading travellers into the bog and taking their lanterns. Someone has to walk in with a light and come back with it.', foes:[{n:'Wisp',ic:'🕯️',hp:38,atk:9},{n:'Wisp',ic:'🕯️',hp:38,atk:9},{n:'Bog Hound',ic:'🐕',hp:30,atk:6}], turnLimit:6, gold:44 },
  { n:7, name:'The Quiet Mine', story:'The mine went silent three days ago. The cages are still down there, and the thing that came up the shaft is not wearing a miner\'s coat.', foes:[{n:'Shaft Crawler',ic:'🪱',hp:70,atk:10},{n:'Shaft Crawler',ic:'🪱',hp:70,atk:10}], turnLimit:7, gold:50 },
  { n:8, name:'Cold Camp', story:'A mercenary company is camped on the ridge and their captain is eyeing your grain stores. Strike the camp before they decide to take it.', foes:[{n:'Mercenary',ic:'🛡️',hp:60,atk:11},{n:'Mercenary',ic:'🛡️',hp:60,atk:11},{n:'Slinger',ic:'🪨',hp:34,atk:7}], turnLimit:7, gold:56 },
  { n:9, name:'Beneath the Temple', story:'The stair under the altar goes further down than the temple is tall. Something down there is breathing in time with the stones.', foes:[{n:'Stone Sentry',ic:'🗿',hp:95,atk:12},{n:'Stone Sentry',ic:'🗿',hp:95,atk:12}], turnLimit:8, gold:64 },
  { n:10, name:'The Behemoth', story:'Boss: it walked out of the dust at the head of the horde. Sarge says it has no eyes, only a mouth, and that Leila should not miss.', boss:true, foes:[{n:'Dust Behemoth',ic:'🦏',hp:230,atk:18,cleave:true},{n:'Horde Runner',ic:'👺',hp:44,atk:8}], turnLimit:10, gold:95 },
  { n:11, name:'The Long Night', story:'They come in waves now, all night, and the gate will not hold another one. Hold the line until the sky changes.', foes:[{n:'Night Raider',ic:'🌑',hp:80,atk:13},{n:'Night Raider',ic:'🌑',hp:80,atk:13},{n:'Howler',ic:'🐺',hp:55,atk:10}], turnLimit:9, gold:75 },
  { n:12, name:'Keeper of the Sun Gate', story:'Boss: the gate itself has a keeper, and the keeper has been waiting for a squad worth the walk. Beat it, and the road east opens for good.', boss:true, foes:[{n:'Sun Gate Keeper',ic:'☀️',hp:320,atk:21,cleave:true},{n:'Gate Sentinel',ic:'🗿',hp:90,atk:12}], turnLimit:12, gold:140 }
];

var S = { gold:30, potions:2, mission:1, stars:{}, heroes:{}, wins:0 };
HEROES.forEach(function(h){ S.heroes[h.id] = 1; });

function load(){
  try {
    var d = JSON.parse(localStorage.getItem(SAVE) || 'null');
    if (!d) return;
    ['gold','potions','mission','wins'].forEach(function(k){ if (typeof d[k] === 'number') S[k] = d[k]; });
    if (d.stars) S.stars = d.stars;
    if (d.heroes) for (var k in S.heroes) if (typeof d.heroes[k] === 'number') S.heroes[k] = d.heroes[k];
  } catch (e) {}
}
function save(){ try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
function toast(m){
  var box = $('toast'); box.innerHTML = '';
  var d = document.createElement('div'); d.textContent = m; box.appendChild(d);
  setTimeout(function(){ d.remove(); }, 2000);
}
function stat(h){
  var l = S.heroes[h.id];
  return { hp: h.hp + (l - 1) * 11, atk: h.atk + (l - 1) * 3, lvl: l };
}
function teamPower(){ return HEROES.reduce(function(a,h){ var s = stat(h); return a + s.atk * 4 + s.hp; }, 0); }
function upCost(h){ return { gold: 18 + (S.heroes[h.id] - 1) * 14 }; }

function hud(){
  $('t-gold').textContent = S.gold;
  $('t-potions').textContent = S.potions;
  $('t-mission').textContent = 'Mission ' + S.mission;
}

/* ---------------- mission select ---------------- */
function viewMissions(){
  hud();
  var html = '<div class="home"><a href="#" id="toHeroes">🪖 Squad</a></div>';
  html += '<div class="story">The outpost holds the only road east. Twelve missions stand between your three survivors and the Sun Gate — and nothing moves out here unless you move it.</div>';
  html += '<div class="res"><div><b>' + teamPower() + '</b>squad power</div><div><b>' + Object.keys(S.stars).length + '</b>missions cleared</div><div><b>' + S.wins + '</b>battles won</div></div>';
  if (S.ambush) html += '<div class="card" style="border-color:#f59e0b"><div class="mrow"><div class="num">⚡</div><div class="g"><div class="nm">Wandering horde</div><div class="sm">A tougher wave is passing the outpost. Double gold if you break it.</div></div><button id="ambushBtn">Fight</button></div></div>';
  MISSIONS.forEach(function(m){
    var cleared = S.stars[m.n] > 0, open = m.n <= S.mission, st = S.stars[m.n] || 0;
    html += '<div class="card' + (open ? '' : ' locked') + '"><div class="mrow"><div class="num">' + (m.boss ? '💀' : m.n) + '</div>' +
      '<div class="g"><div class="nm">' + m.name + (m.boss ? ' · boss' : '') + '</div>' +
      '<div class="sm">' + (cleared ? 'Cleared' : open ? 'Ready' : 'Locked') + ' · ' + m.gold + ' gold · limit ' + m.turnLimit + ' turns</div>' +
      '<div class="stars">' + '★'.repeat(st) + '☆'.repeat(3 - st) + '</div></div>' +
      (open ? '<button data-m="' + m.n + '"' + (cleared ? ' class="alt"' : '') + '>' + (cleared ? 'Replay' : 'Start') + '</button>' : '') +
      '</div></div>';
  });
  $('main').innerHTML = html;
  $('toHeroes').onclick = function(e){ e.preventDefault(); viewHeroes(); };
  var ab = $('ambushBtn'); if (ab) ab.onclick = function(){ startBattle(null, true); };
  [].forEach.call(document.querySelectorAll('[data-m]'), function(b){
    b.onclick = function(){ startBattle(+b.dataset.m, false); };
  });
}

function viewHeroes(){
  hud();
  var html = '<div class="home"><a href="#" id="back">← Missions</a><a href="index.html">☰ Games</a></div><h2>Your squad</h2>';
  HEROES.forEach(function(h){
    var s = stat(h), c = upCost(h);
    html += '<div class="card"><div class="mrow"><div style="font-size:1.7rem">' + h.ic + '</div><div class="g">' +
      '<div class="nm">' + h.n + ' · level ' + s.lvl + '</div>' +
      '<div class="sm">' + s.hp + ' HP · ' + s.atk + ' attack · ' + h.ab.n + ': ' + h.ab.txt + '</div></div>' +
      '<button data-h="' + h.id + '"' + (S.gold >= c.gold ? '' : ' disabled') + '>' + c.gold + ' 🪙</button></div></div>';
  });
  html += '<div class="card"><div class="mrow"><div style="font-size:1.7rem">🧪</div><div class="g"><div class="nm">Healing potion</div>' +
    '<div class="sm">Heals the whole squad for 22 inside a battle. One use per turn.</div></div>' +
    '<button id="buyPot" class="alt"' + (S.gold >= 14 ? '' : ' disabled') + '>14 🪙</button></div></div>';
  html += '<div class="story">Levels never reset. If a mission keeps beating you, farm an earlier one for gold and come back stronger.</div>';
  $('main').innerHTML = html;
  $('back').onclick = function(e){ e.preventDefault(); viewMissions(); };
  [].forEach.call(document.querySelectorAll('[data-h]'), function(b){
    b.onclick = function(){
      var id = b.dataset.h, h = HEROES.filter(function(x){ return x.id === id; })[0];
      var c = upCost(h);
      if (S.gold < c.gold) return;
      S.gold -= c.gold; S.heroes[id]++;
      toast(h.n + ' reached level ' + S.heroes[id]); save(); viewHeroes();
    };
  });
  $('buyPot').onclick = function(){ if (S.gold < 14) return; S.gold -= 14; S.potions++; toast('Potion stored'); save(); viewHeroes(); };
}

/* ---------------- battle ---------------- */
var B = null;

function startBattle(n, ambush){
  var m = ambush ? MISSIONS[Math.min(S.mission, 12) - 1] : MISSIONS.filter(function(x){ return x.n === n; })[0];
  var mul = ambush ? 1.45 : 1, goldMul = ambush ? 2 : (S.stars[n] ? 0.5 : 1);
  B = {
    m: m, n: n, ambush: !!ambush, turn: 1, limit: m.turnLimit + (ambush ? 1 : 0),
    goldMul: goldMul, used: {}, log: [], sel: 0, over: false,
    foes: m.foes.map(function(f){ return { n:f.n, ic:f.ic, hp: Math.round(f.hp * mul), max: Math.round(f.hp * mul), atk: Math.round(f.atk * mul), cleave: !!f.cleave, stun: 0 }; }),
    party: HEROES.map(function(h){ var s = stat(h); return { id:h.id, n:h.n, ic:h.ic, hp:s.hp, max:s.hp, atk:s.atk, cd:0, dead:false }; })
  };
  B.log.push('<b>' + (ambush ? 'Ambush!' : m.name) + '</b> — ' + (ambush ? 'A wandering horde blocks the road.' : m.story));
  renderBattle();
}

function aliveFoes(){ return B.foes.filter(function(f){ return f.hp > 0; }); }
function aliveParty(){ return B.party.filter(function(p){ return !p.dead; }); }
function logLine(t){ B.log.unshift(t); if (B.log.length > 6) B.log.pop(); }

function renderBattle(){
  hud();
  var b = B;
  if (!b) return viewMissions();
  var html = '<div class="battle">';
  html += '<div class="story" style="margin:0"><b>Turn ' + b.turn + ' / ' + b.limit + '</b> · ' + (b.m.boss ? 'boss fight' : 'skirmish') + '</div>';
  b.foes.forEach(function(f, i){
    var pct = Math.max(0, f.hp / f.max * 100);
    html += '<div class="foe' + (i === b.sel && f.hp > 0 ? ' sel' : '') + (f.hp <= 0 ? ' dead' : '') + '" data-f="' + i + '">' +
      '<div class="ic">' + f.ic + '</div><div class="g" style="flex:1"><div class="nm">' + f.n + ' · ' + f.atk + ' atk' +
      (f.stun ? ' · stunned' : '') + '</div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="sm">' + Math.max(0, f.hp) + ' / ' + f.max + ' HP' + (f.cleave ? ' · hits everyone' : '') + '</div></div></div>';
  });
  b.party.forEach(function(p){
    var pct = Math.max(0, p.hp / p.max * 100);
    var h = HEROES.filter(function(x){ return x.id === p.id; })[0];
    html += '<div class="hero' + (p.dead ? ' dead' : '') + '"><div class="ic">' + p.ic + '</div><div style="flex:1">' +
      '<div class="nm">' + p.n + ' · ' + p.atk + ' atk' + (p.cd > 0 ? ' · ability in ' + p.cd : ' · ability ready') + '</div>' +
      '<div class="bar hp"><i style="width:' + pct + '%"></i></div>' +
      '<div class="sm">' + Math.max(0, p.hp) + ' / ' + p.max + ' HP</div></div>' +
      (!p.dead && !b.used[p.id] && !b.over ? '<div style="display:flex;flex-direction:column;gap:4px">' +
        '<button data-atk="' + p.id + '">Attack</button>' +
        '<button class="ghost" data-ab="' + p.id + '"' + (p.cd > 0 ? ' disabled' : '') + '>' + h.ab.ic + '</button></div>' : '') +
      '</div>';
  });
  var waiting = b.party.some(function(p){ return !p.dead && !b.used[p.id]; });
  html += '<div class="log">' + b.log.map(function(l){ return l; }).join('<br>') + '</div>';
  if (!b.over) {
    html += '<div class="acts">';
    html += '<button class="alt" id="potBtn"' + (S.potions > 0 && waiting ? '' : ' disabled') + '>🧪 Potion (' + S.potions + ')</button>';
    html += '<button class="ghost" id="guardBtn"' + (waiting ? '' : ' disabled') + '>🛡️ Guard rest</button>';
    html += '</div>';
  } else {
    html += '<div class="acts"><button id="afterBtn">' + (b.won ? 'Collect' : 'Back to missions') + '</button></div>';
  }
  html += '</div>';
  $('main').innerHTML = html;
  [].forEach.call(document.querySelectorAll('[data-f]'), function(el){
    el.onclick = function(){ if (B.foes[+el.dataset.f].hp > 0) { B.sel = +el.dataset.f; renderBattle(); } };
  });
  [].forEach.call(document.querySelectorAll('[data-atk]'), function(el){ el.onclick = function(){ heroAct(el.dataset.atk, 'atk'); }; });
  [].forEach.call(document.querySelectorAll('[data-ab]'), function(el){ el.onclick = function(){ heroAct(el.dataset.ab, 'ab'); }; });
  if ($('potBtn')) $('potBtn').onclick = usePotion;
  if ($('guardBtn')) $('guardBtn').onclick = function(){
    aliveParty().forEach(function(p){ if (!B.used[p.id]) B.used[p.id] = true; });
    logLine('The squad digs in and waits.'); afterPhase();
  };
  if ($('afterBtn')) $('afterBtn').onclick = function(){ B.won ? finishWin() : (B = null, viewMissions()); };
}

function pickTarget(){
  if (B.foes[B.sel] && B.foes[B.sel].hp > 0) return B.foes[B.sel];
  return aliveFoes()[0];
}

function heroAct(id, kind){
  if (B.over) return;
  var p = B.party.filter(function(x){ return x.id === id; })[0];
  if (!p || p.dead || B.used[id]) return;
  var h = HEROES.filter(function(x){ return x.id === id; })[0];
  var t = pickTarget();
  if (!t) return;
  if (kind === 'atk') {
    t.hp -= p.atk;
    logLine('<b>' + p.n + '</b> hits ' + t.n + ' for ' + p.atk + '.');
  } else {
    if (p.cd > 0) return;
    p.cd = h.ab.cd + 1;
    if (id === 'sarge') { t.hp -= 9; t.stun = 1; logLine('<b>Sarge</b> shield-bashes ' + t.n + ' for 9 — it loses a turn.'); }
    else if (id === 'rusty') {
      var hurt = aliveParty().sort(function(a, c){ return a.hp / a.max - c.hp / c.max; })[0];
      hurt.hp = Math.min(hurt.max, hurt.hp + 16);
      logLine('<b>Rusty</b> patches ' + hurt.n + ' up for 16.');
    } else {
      aliveFoes().forEach(function(f){ f.hp -= 6; });
      logLine('<b>Leila</b> volleys — 6 damage to everything.');
    }
  }
  B.used[id] = true;
  if (t.hp <= 0) logLine(t.n + ' goes down.');
  afterPhase();
}

function usePotion(){
  if (B.over || S.potions <= 0) return;
  S.potions--;
  aliveParty().forEach(function(p){ p.hp = Math.min(p.max, p.hp + 22); });
  logLine('Potions out — the squad recovers 22.');
  aliveParty().forEach(function(p){ B.used[p.id] = true; });
  save(); afterPhase();
}

function afterPhase(){
  if (!aliveFoes().length) return endBattle(true);
  var waiting = B.party.some(function(p){ return !p.dead && !B.used[p.id]; });
  if (waiting) { renderBattle(); return; }
  enemyPhase();
}

function enemyPhase(){
  if (!aliveFoes().length) return endBattle(true);
  aliveFoes().forEach(function(f){
    if (f.stun > 0) { f.stun--; logLine(f.n + ' is stunned and cannot move.'); return; }
    if (f.cleave) {
      var cd = Math.max(1, Math.round(f.atk * 0.62));
      aliveParty().forEach(function(p){ p.hp -= cd; });
      logLine('<b>' + f.n + '</b> slams the whole squad for ' + cd + '.');
    } else {
      var targets = aliveParty();
      if (!targets.length) return;
      var t = targets[Math.floor(Math.random() * targets.length)];
      t.hp -= f.atk;
      logLine(f.n + ' hits <b>' + t.n + '</b> for ' + f.atk + '.');
    }
  });
  B.party.forEach(function(p){
    if (p.hp <= 0 && !p.dead) { p.dead = true; p.hp = 0; logLine('<b>' + p.n + '</b> is down.'); }
    if (p.cd > 0) p.cd--;
  });
  B.foes.forEach(function(f){ if (f.hp <= 0 && !f.down) { f.down = true; } });
  if (!aliveParty().length) return endBattle(false);
  B.turn++;
  B.used = {};
  if (B.turn > B.limit) { logLine('The window closes — you were too slow.'); return endBattle(false); }
  renderBattle();
}

function endBattle(won){
  B.over = true; B.won = won;
  if (!won) { logLine('The squad falls back. No shame in regrouping.'); renderBattle(); return; }
  var dead = B.party.filter(function(p){ return p.dead; }).length;
  var stars = 1 + (dead === 0 ? 1 : 0) + (B.turn <= B.limit - 1 ? 1 : 0);
  B.stars = Math.min(3, stars);
  var gold = Math.round(B.m.gold * B.goldMul);
  B.gain = gold;
  logLine('<b>Victory.</b> ' + gold + ' gold and ' + '★'.repeat(B.stars));
  renderBattle();
}

function finishWin(){
  var m = B.m;
  S.gold += B.gain;
  if (!B.ambush) {
    S.stars[m.n] = Math.max(S.stars[m.n] || 0, B.stars);
    if (m.n === S.mission && S.mission < 12) S.mission++;
  }
  S.wins++;
  S.ambush = !B.ambush && S.wins % 2 === 0;
  save();
  toast('+' + B.gain + ' gold');
  B = null;
  if (S.mission > 12) viewVictory(); else viewMissions();
}

function viewVictory(){
  hud();
  $('main').innerHTML = '<div class="story"><b>The Sun Gate is open.</b><br>Forty years of dust, one squad, and a road that finally runs east. The outpost will hold — but there are other roads, and other things walking them.</div>' +
    '<div class="res"><div><b>' + S.wins + '</b>battles won</div><div><b>' + Object.keys(S.stars).length + '/12</b>cleared</div><div><b>' + teamPower() + '</b>power</div></div>' +
    '<div class="card"><div class="mrow"><div class="g"><div class="nm">Keep playing</div><div class="sm">Replay missions for gold, level the squad and take the three-star runs.</div></div></div></div>' +
    '<div class="acts"><button id="againBtn">Back to missions</button></div>';
  $('againBtn').onclick = viewMissions;
}

load();
hud();
viewMissions();
})();
</script>
