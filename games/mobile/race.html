<title>Werewolf Racing</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#0b1220;color:#e2e8f0;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hud{position:fixed;z-index:5}
  #top{top:0;left:0;right:0;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;font-size:.82rem;background:linear-gradient(#000a,#0000);text-shadow:0 1px 3px #000;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  #top button{color:#e2e8f0;background:none;border:0;font:inherit;padding:0 4px;cursor:pointer}
  #stats{top:calc(40px + env(safe-area-inset-top));left:12px;text-shadow:0 2px 4px #000;pointer-events:none}
  #pos{font-size:2.4rem;font-weight:900;line-height:1} #pos small{font-size:1rem;color:#cbd5e1}
  #lap{font-weight:800;font-size:1.05rem} #times{font-size:.85rem;color:#cbd5e1;font-variant-numeric:tabular-nums}
  #spd{right:14px;top:calc(40px + env(safe-area-inset-top));text-align:right;text-shadow:0 2px 4px #000;pointer-events:none}
  #spd b{font-size:2.2rem;font-weight:900;font-variant-numeric:tabular-nums} #spd span{font-size:.8rem;color:#cbd5e1}
  #board{right:14px;top:calc(110px + env(safe-area-inset-top));font-size:.8rem;text-shadow:0 1px 3px #000;pointer-events:none;text-align:right;line-height:1.5}
  #board i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
  #count{left:0;right:0;top:32%;text-align:center;font-size:5rem;font-weight:900;text-shadow:0 4px 12px #000;pointer-events:none;display:none}
  #toast{left:0;right:0;top:calc(150px + env(safe-area-inset-top));text-align:center;color:#fde68a;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;padding:0 12px;min-height:1.3em}
  #map{left:12px;bottom:14px;width:150px;height:150px;border-radius:12px;background:#0008;pointer-events:none}
  body.touch #map{bottom:auto;top:calc(185px + env(safe-area-inset-top));width:110px;height:110px}
  #touch{display:none}
  body.touch #touch{display:block}
  body.pad #touch{display:none}
  .tb{position:fixed;z-index:6;border:0;border-radius:18px;background:#ffffff26;color:#fff;font-weight:900;font-size:1.6rem;touch-action:none;bottom:calc(18px + env(safe-area-inset-bottom))}
  .tb.on{background:#ffffff66}
  .stk{position:fixed;z-index:6;width:112px;height:112px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;touch-action:none;display:none;bottom:calc(18px + env(safe-area-inset-bottom))}
  .stk i{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#ffffff99;pointer-events:none}
  #sL{left:22px} #sR{right:22px}
  /* landscape: two sticks. Left steers, right = gas (up) / brake and reverse (down). Portrait keeps the buttons. */
  @media (orientation:landscape){ body.touch .stk{display:block} body.touch .tb{display:none} body.touch #padHint{bottom:calc(8px + env(safe-area-inset-bottom))} #ovBox{max-height:92vh} }
  #tL{left:14px;width:80px;height:80px} #tR{left:104px;width:80px;height:80px}
  #tGas{right:14px;width:92px;height:118px;background:#22c55e66} #tBrk{right:116px;width:80px;height:80px;background:#ef444466}
  #padHint{left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));text-align:center;font-size:.75rem;color:#cbd5e1;pointer-events:none;text-shadow:0 1px 3px #000}
  body.touch #padHint{bottom:calc(140px + env(safe-area-inset-bottom))}
  #ov{position:fixed;inset:0;z-index:20;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}
  #ovBox{background:#1e293b;border-radius:16px;padding:18px;width:min(94vw,440px);max-height:90vh;overflow-y:auto}
  #ovBox h2{margin:0 0 8px} .muted{color:#94a3b8;font-size:.85rem}
  #ovBox button{background:#22c55e;color:#04210f;border:0;border-radius:10px;padding:10px 14px;font-weight:800;font:inherit;font-weight:800;cursor:pointer;margin:4px 4px 0 0}
  #ovBox button.alt{background:#334155;color:#e2e8f0} #ovBox button.sel{outline:3px solid #fde68a}
  #ovBox button:disabled{opacity:.45}
  .plist div{padding:4px 0;border-bottom:1px solid #334155} .plist i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .optrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
  .optrow button{padding:6px 10px!important}
  .padsel{outline:3px solid #fde68a!important}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="top" class="hud"><span>🏎️ <b id="roomLabel">Werewolf Racing</b> · 👥 <b id="cnt">1</b></span><span><button id="muteBtn">🔊</button> <button id="shareBtn">Invite</button> · <button id="gamesBtn">☰ Games</button></span></div>
<div id="stats" class="hud"><div id="pos">1<small>/1</small></div><div id="lap">Lap 1/3</div><div id="times"></div></div>
<div id="spd" class="hud"><b id="kmh">0</b> <span>km/h</span></div>
<div id="board" class="hud"></div>
<div id="count" class="hud"></div>
<div id="toast" class="hud"></div>
<canvas id="map" class="hud" width="300" height="300"></canvas>
<div id="padHint" class="hud"></div>
<div id="touch">
  <button class="tb" id="tL" aria-label="Steer left">◀</button><button class="tb" id="tR" aria-label="Steer right">▶</button>
  <div class="stk" id="sL"><i></i></div><div class="stk" id="sR"><i></i></div>
  <button class="tb" id="tBrk" aria-label="Brake">⏪</button><button class="tb" id="tGas" aria-label="Gas">GAS</button>
</div>
<div id="ov"><div id="ovBox"><h2>🏎️ Werewolf Racing</h2><div class="muted">Loading…</div></div></div>
