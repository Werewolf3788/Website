<title>City Rush</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#150e22;color:#fff2e2;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100%}
  #hud{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:8px 10px;font-size:.78rem;font-weight:800;background:#1d1430}
  .pill{background:#2a1d40;border-radius:999px;padding:5px 9px}
  #hud a{color:#fbcfe8;text-decoration:none}
  #lane{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#1b1130,#2a1740 60%,#3b1f52)}
  #lane:before{content:'';position:absolute;left:0;right:0;bottom:0;height:26%;background:repeating-linear-gradient(90deg,#241934 0 14px,#2b1e3e 14px 28px)}
  #counter{position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(#f59e0b,#b45309);box-shadow:3px 0 12px #0006}
  .cust{position:absolute;top:34%;transform:translate(-50%,-50%);text-align:center;will-change:left;transition:opacity .25s}
  .cust .who{font-size:1.7rem;line-height:1;filter:drop-shadow(0 3px 4px #0007)}
  .cust .ord{font-size:1rem;background:#fff2e2;border-radius:999px;padding:1px 5px;margin-top:2px;display:inline-block;color:#1d1430}
  .cust .pat{width:38px;height:4px;background:#0006;border-radius:3px;margin:3px auto 0;overflow:hidden}
  .cust .pat i{display:block;height:100%;background:#4ade80}
  .cust.gone{opacity:0;transform:translate(-50%,-160%) scale(.7)}
  .cust.angry .pat i{background:#ef4444}
  #banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fbbf24;color:#3b1f05;font-weight:900;font-size:.72rem;padding:4px 10px;border-radius:999px;opacity:0;transition:opacity .2s}
  #banner.on{opacity:1}
  #combo{position:absolute;right:8px;top:8px;font-weight:900;color:#fda4af;font-size:.8rem}
  #floor{background:#1d1430;padding:8px 8px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #floor button{border:0;border-radius:14px;padding:10px 4px;font:inherit;font-weight:900;font-size:.72rem;color:#1d1430;background:#fcd34d;display:flex;flex-direction:column;align-items:center;gap:2px}
  #floor button b{font-size:1.5rem}
  #floor button:active{transform:scale(.96)}
  #floor button.off{filter:grayscale(1) brightness(.6)}
  #foot{display:flex;gap:6px;padding:8px;background:#1d1430}
  #foot button{flex:1;border:0;border-radius:10px;padding:9px;font:inherit;font-weight:800;font-size:.74rem;background:#3b2a55;color:#e9d5ff}
  #sheet{position:absolute;inset:0;background:#150e22f2;padding:16px;overflow:auto;display:none;z-index:6}
  #sheet.on{display:block}
  #sheet h2{margin:0 0 6px;font-size:1.15rem;color:#fbbf24}
  #sheet p{margin:0 0 12px;font-size:.85rem;line-height:1.5;color:#e9d5ff}
  .up{display:flex;align-items:center;gap:10px;background:#241832;border:1px solid #3b2a55;border-radius:12px;padding:10px;margin-bottom:8px}
  .up .g{flex:1}
  .up .nm{font-weight:800;font-size:.85rem}
  .up .sm{font-size:.7rem;color:#c4b5fd;margin-top:2px}
  .up button{border:0;border-radius:9px;padding:8px 10px;font:inherit;font-weight:900;font-size:.74rem;background:#4ade80;color:#04210f}
  .up button:disabled{background:#3b2a55;color:#8b7aa8}
  .big{width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:900;background:#fbbf24;color:#3b1f05;font-size:.9rem}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="pill">💰 <b id="cash">0</b></span>
    <span class="pill" id="goal">0 / 16</span>
    <span class="pill">❤️ <b id="lives">3</b></span>
    <a href="index.html">☰ Games</a>
  </div>
  <div id="lane">
    <div id="counter"></div>
    <div id="banner"></div>
    <div id="combo"></div>
  </div>
  <div id="floor">
    <button data-o="🍋"><b>🍋</b>Lemonade</button>
    <button data-o="☕"><b>☕</b>Café</button>
    <button data-o="🍩"><b>🍩</b>Bakery</button>
  </div>
  <div id="foot">
    <button id="pauseBtn">⏸ Pause</button>
    <button id="restartBtn">↻ Restart district</button>
  </div>
  <div id="sheet"></div>
</div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var LANE = $('lane'), SHEET = $('sheet');
var SAVE = 'cityrush_v1';

var DISTRICTS = [
  { n:'Lemonade Lane', goal:14, speed:15, gap:1.5, tip:3, who:['🧍','👩','🧑‍🦱'],
    story:'You borrow a folding table, a jug and a bag of lemons. One corner, one afternoon, and the first customer is already walking over.' },
  { n:'Old Market', goal:20, speed:12.5, gap:1.25, tip:4, who:['🧑‍🌾','👴','🧕'],
    story:'The market crowd is bigger and pickier. Keep the queue moving and the traders will start talking about the kid with the cart.' },
  { n:'Riverside Walk', goal:26, speed:11, gap:1.1, tip:5, who:['🚶','👨‍🦰','👵'],
    story:'A food cart licence, a proper awning, and joggers who order three things at once. Riverside does not wait for anyone.' },
  { n:'Station Row', goal:32, speed:9.5, gap:0.95, tip:6, who:['🧑‍💼','👩‍💻','🧑‍🎓'],
    story:'Commuters. Ninety seconds between trains and no patience at all. This is where a cart becomes a name.' },
  { n:'Uptown Terrace', goal:40, speed:8.2, gap:0.85, tip:8, who:['🎩','👗','🕴️'],
    story:'Uptown money, uptown manners, uptown queue. Rent is brutal, but one good afternoon here pays for the whole month.' },
  { n:'Grand Plaza', goal:48, speed:7, gap:0.72, tip:10, who:['🎉','🧑‍🚀','👑'],
    story:'The plaza is packed for the festival and your little cart is the only thing open. Keep serving — this is the shift they will remember.' }
];

var S = { district:0, cash:0, best:0, doubleTip:0, extraLife:0, slow:0, station3:true };
var G = null, raf = 0, last = 0;

function load(){
  try {
    var d = JSON.parse(localStorage.getItem(SAVE) || 'null');
    if (d) for (var k in S) if (typeof d[k] === 'number') S[k] = d[k];
  } catch (e) {}
}
function save(){ try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
function money(n){ S.cash += n; $('cash').textContent = Math.floor(S.cash); }

/* ---------------- district flow ---------------- */
function district(){ return DISTRICTS[Math.min(S.district, DISTRICTS.length - 1)]; }

function showSheet(html){ SHEET.innerHTML = html; SHEET.classList.add('on'); }
function hideSheet(){ SHEET.classList.remove('on'); }

function intro(){
  pause();
  var d = district();
  showSheet('<h2>District ' + (S.district + 1) + ' — ' + d.n + '</h2><p>' + d.story + '</p>' +
    '<p style="font-size:.78rem;color:#c4b5fd">Serve ' + d.goal + ' customers before you lose all three hearts. Tap the right counter for each order — wrong counter breaks your streak.</p>' +
    '<button class="big" id="beginBtn">Open the counter</button>');
  $('beginBtn').onclick = function(){ hideSheet(); startDistrict(); };
}

function startDistrict(){
  LANE.querySelectorAll('.cust').forEach(function(c){ c.remove(); });
  var d = district();
  G = { goal: d.goal, served: 0, lives: 3 + S.extraLife, combo: 0, spawnT: 0.6, custs: [], running: true,
        rush: 0, nextRush: 14, elapsed: 0, over: false };
  $('lives').textContent = G.lives;
  $('goal').textContent = '0 / ' + G.goal;
  $('combo').textContent = '';
  last = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function pause(){ if (G) G.running = false; cancelAnimationFrame(raf); }

function loop(now){
  if (!G || !G.running) return;
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  G.elapsed += dt;
  if (G.rush > 0) { G.rush -= dt; if (G.rush <= 0) setBanner(''); }
  if (G.elapsed >= G.nextRush) {
    G.rush = 7; G.nextRush += 22;
    setBanner('⚡ RUSH HOUR — double customers, double tips');
  }
  var d = district();
  var rate = (G.rush > 0 ? 2.1 : 1) * (1 + S.district * 0.05);
  G.spawnT -= dt;
  if (G.spawnT <= 0) { G.spawnT = d.gap / rate; spawn(d); }

  var W = LANE.clientWidth;
  for (var i = G.custs.length - 1; i >= 0; i--) {
    var c = G.custs[i];
    if (c.state === 'served') { c.t += dt; if (c.t > 0.35) { c.el.remove(); G.custs.splice(i, 1); } continue; }
    if (c.state === 'angry') { c.t += dt; if (c.t > 0.6) { c.el.remove(); G.custs.splice(i, 1); } continue; }
    c.x -= dt / c.speed;
    c.pat -= dt;
    c.el.style.left = (20 + c.x * (W - 40)) + 'px';
    var pct = Math.max(0, c.pat / c.maxPat * 100);
    c.el.querySelector('.pat i').style.width = pct + '%';
    c.el.classList.toggle('angry', pct < 30);
    if (c.x <= 0.02 || c.pat <= 0) miss(c);
  }
  raf = requestAnimationFrame(loop);
}

function spawn(d){
  var orders = S.station3 ? ['🍋', '☕', '🍩'] : ['🍋', '☕', '🍩', '🍋'];
  var c = {
    x: 1, speed: d.speed * (0.85 + Math.random() * 0.35),
    order: orders[Math.floor(Math.random() * orders.length)],
    maxPat: (6 + Math.random() * 3) * (1 + S.slow * 0.18), state: 'walk', t: 0
  };
  c.pat = c.maxPat;
  var el = document.createElement('div');
  el.className = 'cust';
  el.innerHTML = '<div class="who">' + d.who[Math.floor(Math.random() * d.who.length)] + '</div>' +
    '<div class="ord">' + c.order + '</div><div class="pat"><i style="width:100%"></i></div>';
  LANE.appendChild(el);
  c.el = el;
  el.style.left = (20 + c.x * (LANE.clientWidth - 40)) + 'px';
  G.custs.push(c);
}

function setBanner(t){
  var b = $('banner');
  b.textContent = t;
  b.classList.toggle('on', !!t);
}

function serve(order){
  if (!G || !G.running || G.over) return;
  var pick = null;
  G.custs.forEach(function(c){
    if (c.state !== 'walk' || c.order !== order) return;
    if (!pick || c.x < pick.x) pick = c;
  });
  if (!pick) { breakCombo(); flash(order, false); return; }
  G.combo++;
  var mult = Math.min(3, 1 + G.combo * 0.12);
  var d = district();
  var tip = Math.round((d.tip + S.doubleTip) * mult * (G.rush > 0 ? 2 : 1));
  money(tip); pick.state = 'served'; pick.el.classList.add('gone');
  pick.t = 0;
  pick.el.querySelector('.ord').textContent = '+' + tip;
  G.served++;
  $('goal').textContent = G.served + ' / ' + G.goal;
  $('combo').textContent = G.combo > 1 ? 'x' + G.combo + ' streak' : '';
  flash(order, true);
  if (G.served >= G.goal) clearDistrict();
}

function flash(order, good){
  var b = document.querySelector('#floor button[data-o="' + order + '"]');
  if (!b) return;
  b.style.background = good ? '#4ade80' : '#ef4444';
  setTimeout(function(){ b.style.background = '#fcd34d'; }, 120);
}

function breakCombo(){
  if (G.combo > 2) setBanner('Streak lost');
  G.combo = 0;
  $('combo').textContent = '';
}

function miss(c){
  if (c.state !== 'walk') return;
  c.state = 'angry';
  c.t = 0;
  c.el.classList.add('gone');
  c.el.querySelector('.ord').textContent = '😤';
  G.combo = 0;
  $('combo').textContent = '';
  G.lives--;
  $('lives').textContent = Math.max(0, G.lives);
  if (G.lives <= 0) loseDistrict();
}

function clearDistrict(){
  G.over = true; G.running = false;
  pause();
  save();
  var bonus = 20 + S.district * 25;
  money(bonus);
  setTimeout(function(){
    if (S.district >= DISTRICTS.length - 1) return ending();
    showSheet('<h2>District cleared — ' + district().n + '</h2>' +
      '<p>' + G.served + ' served, ' + bonus + ' bonus cash. Time for a proper upgrade before the next street.</p>' +
      '<div id="ups"></div><button class="big" id="nextBtn">Next district</button>');
    renderUpgrades();
    $('nextBtn').onclick = function(){
      S.district = Math.min(DISTRICTS.length - 1, S.district + 1);
      S.best = Math.max(S.best, S.district);
      save(); hideSheet(); intro();
    };
  }, 260);
}

function loseDistrict(){
  G.over = true; G.running = false;
  pause();
  save();
  setTimeout(function(){
    showSheet('<h2>Closing early</h2><p>The last customer walked off and the street emptied out. Nothing is lost — the cart is still yours, and the district will be just as busy in a minute.</p>' +
      '<button class="big" id="retryBtn">Try the district again</button>');
    $('retryBtn').onclick = function(){ hideSheet(); intro(); };
  }, 300);
}

var UPGRADES = [
  { k:'doubleTip', nm:'Better ingredients', sm:'+2 cash on every serve', cost:function(){ return 45 + S.doubleTip * 40; } },
  { k:'extraLife', nm:'Charm offensive', sm:'One more heart in every district', cost:function(){ return 70 + S.extraLife * 60; }, max:2 },
  { k:'slow', nm:'Comfier seating', sm:'Customers wait a bit longer', cost:function(){ return 50 + S.slow * 45; }, max:3 }
];

function renderUpgrades(){
  var html = '';
  UPGRADES.forEach(function(u, i){
    var maxed = u.max && S[u.k] >= u.max;
    var c = u.cost();
    html += '<div class="up"><div class="g"><div class="nm">' + u.nm + (maxed ? ' · maxed' : '') + '</div><div class="sm">' + u.sm + '</div></div>' +
      '<button data-u="' + i + '"' + (maxed || S.cash < c ? ' disabled' : '') + '>' + (maxed ? '✓' : c + ' 💰') + '</button></div>';
  });
  $('ups').innerHTML = html;
  [].forEach.call($('ups').querySelectorAll('[data-u]'), function(b){
    b.onclick = function(){
      var u = UPGRADES[+b.dataset.u], c = u.cost();
      if (S.cash < c) return;
      S.cash -= c; S[u.k]++;
      money(0); save(); renderUpgrades();
    };
  });
}

function ending(){
  showSheet('<h2>The plaza is yours</h2><p>Six districts, one folding table, and a queue that wraps the fountain. The city knows the cart now — and the cart knows what it is doing.</p>' +
    '<p style="font-size:.8rem">Keep playing: restart the plaza for a better score, or go back and take every district again with all the upgrades.</p>' +
    '<button class="big" id="againBtn">Back to Lemonade Lane</button>');
  $('againBtn').onclick = function(){ S.district = 0; save(); hideSheet(); intro(); };
}

$('floor').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (b && G && G.running) serve(b.dataset.o);
});
$('pauseBtn').onclick = function(){
  if (!G) return intro();
  if (G.running) { pause(); $('pauseBtn').textContent = '▶ Resume'; }
  else { G.running = true; last = performance.now(); $('pauseBtn').textContent = '⏸ Pause'; raf = requestAnimationFrame(loop); }
};
$('restartBtn').onclick = function(){ intro(); };
document.addEventListener('visibilitychange', function(){ if (document.hidden) pause(); });

load();
$('cash').textContent = Math.floor(S.cash);
$('lives').textContent = 3 + S.extraLife;
intro();
})();
</script>
</body>
</html>
