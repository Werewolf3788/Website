<html lang="en">

<meta name="theme-color" content="#0f172a">
<title>Idle City</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;min-height:100%;background:#0b1220;color:#e2e8f0;font-family:system-ui,sans-serif;overscroll-behavior:none}
  #app{max-width:620px;margin:0 auto;padding-bottom:20px}
  #top{position:sticky;top:0;z-index:5;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0f172a;border-bottom:1px solid #1e293b}
  #top .t{font-size:.8rem;color:#94a3b8} #top b{color:#fde047}
  #top button{background:none;border:0;color:#e2e8f0;font:inherit;cursor:pointer}
  #cash{font-size:1.15rem;font-weight:900}
  #sky{position:relative;height:132px;margin:10px 12px 0;border-radius:14px;overflow:hidden;
       background:linear-gradient(#0b1e3a 0%,#123a63 45%,#1e5d7a 72%,#2c7a5f 100%);cursor:pointer}
  #stars{position:absolute;inset:0;opacity:.7}
  #ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(#1f5f3f,#143c2a)}
  #city{position:absolute;left:0;right:0;bottom:30px;height:98px;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:0 6px}
  .bld{width:13px;border-radius:3px 3px 0 0;background:#334155;border:1px solid #0b1220;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .bld::after{content:'';position:absolute;inset:3px 2px auto;height:3px;background:rgba(253,224,71,.75);border-radius:1px;box-shadow:0 8px 0 rgba(253,224,71,.5),0 16px 0 rgba(253,224,71,.35)}
  #hint1{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:.72rem;color:#cbd5e1;text-shadow:0 1px 4px #000;pointer-events:none}
  .float{position:absolute;font-weight:900;color:#fde047;text-shadow:0 2px 6px #000;pointer-events:none;animation:up .9s ease-out forwards;font-size:1rem;z-index:9}
  @keyframes up{to{transform:translateY(-46px);opacity:0}}
  #tabs{display:flex;gap:6px;margin:10px 12px 0}
  #tabs button{flex:1;background:#1e293b;color:#cbd5e1;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
  #tabs button.on{background:#22c55e;color:#04210f}
  #list{padding:10px 12px}
  .brow{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;background:#1e293b;border-radius:12px;padding:10px;margin-bottom:8px}
  .brow .ic{font-size:24px;text-align:center}
  .brow .nm{font-weight:800;font-size:.92rem} .brow .sub{font-size:.72rem;color:#94a3b8;margin-top:2px}
  .brow button{background:#22c55e;color:#04210f;border:0;border-radius:9px;padding:10px 10px;font:inherit;font-weight:800;font-size:.78rem;cursor:pointer;min-width:96px;line-height:1.25}
  .brow button:disabled{background:#334155;color:#64748b;cursor:default}
  .brow button .c{display:block;font-weight:700;font-size:.68rem;opacity:.85}
  #bulk{display:flex;gap:6px;margin:0 12px 4px}
  #bulk button{flex:1;background:#334155;color:#cbd5e1;border:0;border-radius:999px;padding:8px;font:inherit;font-size:.78rem;font-weight:800;cursor:pointer}
  #bulk button.on{background:#38bdf8;color:#04210f}
  #foot{color:#64748b;font-size:.72rem;text-align:center;padding:5px 12px 0}
  #ov{position:fixed;inset:0;z-index:20;background:#000c;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:24px}
  #ov button{background:#22c55e;color:#04210f;font-weight:800;border:0;border-radius:10px;padding:12px 20px;font:inherit;cursor:pointer}
  #ovT{font-size:1.4rem;font-weight:900} #ovS{color:#cbd5e1;max-width:400px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div><div class="t">Cash</div><div id="cash">0</div></div>
    <div style="text-align:center"><div class="t">Per second</div><div id="sps" style="font-weight:800">0</div></div>
    <div style="text-align:right"><div class="t">Tap gives</div><div id="tapv" style="font-weight:800">1</div></div>
    <button id="gamesBtn">☰</button>
  </div>
  <div id="sky"><div id="stars"></div><div id="city"></div><div id="ground"></div><div id="hint1">tap the city to earn</div></div>
  <div id="bulk"><button data-k="1" class="on">Buy ×1</button><button data-k="10">Buy ×10</button><button data-k="max">Buy max</button></div>
  <div id="tabs"><button data-t="b" class="on">🏗️ Buildings</button><button data-t="u">⭐ Upgrades</button></div>
  <div id="list"></div>
  <div id="foot">Your city earns cash while you are away (up to 2 hours at half speed). Everything saves on this device.</div>
</div>
<div id="ov"><div id="ovT"></div><div id="ovS"></div><button id="ovBtn">Nice</button></div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

var BUILDINGS = [
  { id:'stand',  n:'Lemonade Stand', ic:'🍋', cost:15,       inc:0.15,  col:'#facc15' },
  { id:'shop',   n:'Corner Shop',    ic:'🏪', cost:120,      inc:1.2,   col:'#fb923c' },
  { id:'cafe',   n:'Café',           ic:'☕', cost:900,      inc:7,     col:'#f472b6' },
  { id:'bakery', n:'Bakery',         ic:'🥐', cost:6500,     inc:38,    col:'#38bdf8' },
  { id:'mart',   n:'Supermarket',    ic:'🛒', cost:45000,    inc:210,   col:'#4ade80' },
  { id:'office', n:'Office Block',   ic:'🏢', cost:320000,   inc:1400,  col:'#a78bfa' },
  { id:'mall',   n:'Shopping Mall',  ic:'🏬', cost:2400000,  inc:9200,  col:'#f97316' },
  { id:'tower',  n:'Sky Tower',      ic:'🏙️', cost:18000000, inc:62000, col:'#22d3ee' }
];
var GROWTH = 1.15;
var SAVE = 'idlecity_v1';

var S = { coins:0, tapLvl:0, mult:0, counts:{}, earned:0, last:Date.now() };
var bulk = 1, tab = 'b';
var rows = {}, sig = '';

function load(){
  try {
    var raw = localStorage.getItem(SAVE);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (!d) return;
    S.coins = +d.coins || 0; S.tapLvl = +d.tapLvl || 0; S.mult = +d.mult || 0;
    S.earned = +d.earned || 0; S.last = +d.last || Date.now();
    S.counts = d.counts || {};
  } catch (e) {}
}
function save(){
  S.last = Date.now();
  try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
}

function fmt(n){
  if (!isFinite(n)) return '0';
  var a = Math.abs(n);
  if (a >= 1e15) return (n / 1e15).toFixed(2) + 'Q';
  if (a >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (a >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (a >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  if (a >= 100) return Math.floor(n).toLocaleString();
  return (Math.round(n * 10) / 10).toString();
}

function owned(b){ return S.counts[b.id] | 0; }
function mult(){ return 1 + S.mult * 0.1; }
function sps(){
  var t = 0;
  for (var i = 0; i < BUILDINGS.length; i++) t += owned(BUILDINGS[i]) * BUILDINGS[i].inc;
  return t * mult();
}
function tapValue(){ return (1 + S.tapLvl * 2 + sps() * 0.12) * 1; }
function nextCost(b){ return Math.ceil(b.cost * Math.pow(GROWTH, owned(b))); }
function bulkCost(b, k){
  var c = 0, n = owned(b);
  for (var i = 0; i < k; i++) c += Math.ceil(b.cost * Math.pow(GROWTH, n + i));
  return c;
}
function maxBuy(b){
  var n = 0, c = owned(b), total = 0;
  while (total + Math.ceil(b.cost * Math.pow(GROWTH, c + n)) <= S.coins && n < 500) { total += Math.ceil(b.cost * Math.pow(GROWTH, c + n)); n++; }
  return { n:n, cost:total };
}
var TAP_UP_COST = function(){ return Math.ceil(40 * Math.pow(2.1, S.tapLvl)); };
var MULT_UP_COST = function(){ return Math.ceil(600 * Math.pow(3.2, S.mult)); };

/* ---------- rendering ---------- */
function buildRows(){
  var list = $('list');
  list.innerHTML = '';
  rows = {};
  if (tab === 'b') {
    BUILDINGS.forEach(function(b){
      var d = document.createElement('div');
      d.className = 'brow';
      d.innerHTML = '<div class="ic">' + b.ic + '</div>' +
        '<div><div class="nm">' + b.n + '</div><div class="sub"></div></div>' +
        '<button></button>';
      list.appendChild(d);
      var btn = d.querySelector('button');
      btn.onclick = function(){ buy(b); };
      var sub = d.querySelector('.sub');
      rows[b.id] = { own: sub, btn: btn };
    });
  } else {
    addUpgrade('👆 Tap power', 'Each tap earns more cash', TAP_UP_COST, function(){ S.tapLvl++; }, function(){ return 'Lv ' + S.tapLvl; });
    addUpgrade('💹 City income', '+10% to every building', MULT_UP_COST, function(){ S.mult++; }, function(){ return '+ ' + (S.mult * 10) + '%'; });
  }
  updateRows();
}
function addUpgrade(name, desc, costFn, apply, valueFn){
  var d = document.createElement('div');
  d.className = 'brow';
  d.innerHTML = '<div class="ic">' + name.split(' ')[0] + '</div><div><div class="nm">' + name.replace(/^\S+\s/, '') +
    '</div><div class="sub">' + desc + '</div></div><button></button>';
  $('list').appendChild(d);
  var btn = d.querySelector('button'), sub = d.querySelector('.sub');
  btn.onclick = function(){ var c = costFn(); if (S.coins < c) return; S.coins -= c; apply(); refresh(); save(); };
  rows['up_' + name] = { own: { textContent: '' }, btn: btn, cost: costFn, value: valueFn, sub: sub };
}

function updateRows(){
  $('cash').textContent = '$' + fmt(S.coins);
  $('sps').textContent = '$' + fmt(sps()) + '/s';
  $('tapv').textContent = '$' + fmt(tapValue());
  if (tab === 'b') {
    BUILDINGS.forEach(function(b){
      var r = rows[b.id]; if (!r) return;
      var k = bulk === 'max' ? Math.max(1, maxBuy(b).n) : bulk;
      var cost = bulkCost(b, k);
      r.own.textContent = owned(b) + ' owned · ' + fmt(owned(b) * b.inc * mult()) + '/s each';
      r.btn.innerHTML = (bulk === 'max' ? 'Buy ' + Math.max(1, maxBuy(b).n) : 'Buy ' + k) + '<span class="c">$' + fmt(cost) + '</span>';
      r.btn.disabled = S.coins < cost;
    });
  } else {
    Object.keys(rows).forEach(function(k){
      var r = rows[k]; if (k.indexOf('up_') !== 0) return;
      var c = r.cost();
      r.btn.innerHTML = 'Upgrade<span class="c">$' + fmt(c) + '</span>';
      r.btn.disabled = S.coins < c;
      r.own.textContent = r.value();
    });
  }
  drawCity();
}

function drawCity(){
  var items = [];
  BUILDINGS.forEach(function(b, i){
    var n = Math.min(owned(b), 9);
    for (var k = 0; k < n; k++) items.push({ i:i, col:b.col });
  });
  items = items.slice(0, 34);
  var key = items.map(function(x){ return x.i + x.col; }).join('|');
  if (key === sig) return;
  sig = key;
  var city = $('city');
  city.innerHTML = items.map(function(x){
    var h = 16 + x.i * 10 + Math.random() * 8;
    return '<div class="bld" style="height:' + h.toFixed(0) + 'px;background:' + x.col + '"></div>';
  }).join('');
}

function refresh(){ updateRows(); }

/* ---------- actions ---------- */
function buy(b){
  var r = rows[b.id]; if (!r) return;
  var k = bulk === 'max' ? maxBuy(b).n : bulk;
  if (k < 1) return;
  var cost = bulkCost(b, k);
  if (S.coins < cost) return;
  S.coins -= cost;
  S.counts[b.id] = owned(b) + k;
  sig = '';
  refresh(); save();
}

function tapAt(ev){
  var gain = tapValue();
  S.coins += gain; S.earned += gain;
  var r = $('sky').getBoundingClientRect();
  var f = document.createElement('div');
  f.className = 'float';
  f.textContent = '+$' + fmt(gain);
  f.style.left = Math.max(6, Math.min(r.width - 60, ev.clientX - r.left - 16)) + 'px';
  f.style.top = Math.max(4, Math.min(r.height - 30, ev.clientY - r.top)) + 'px';
  $('sky').appendChild(f);
  setTimeout(function(){ f.remove(); }, 900);
  refresh();
}

$('sky').addEventListener('pointerdown', function(e){ e.preventDefault(); tapAt(e); }, { passive:false });

$('bulk').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  bulk = b.dataset.k === 'max' ? 'max' : (+b.dataset.k);
  [].forEach.call($('bulk').children, function(x){ x.classList.toggle('on', x === b); });
  updateRows();
});
$('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.t;
  [].forEach.call($('tabs').children, function(x){ x.classList.toggle('on', x === b); });
  buildRows();
});
$('gamesBtn').onclick = function(){ location.href = 'index.html'; };
$('ovBtn').onclick = function(){ $('ov').style.display = 'none'; };

/* ---------- tick ---------- */
var last = performance.now();
setInterval(function(){
  var now = performance.now();
  var dt = Math.min(1, (now - last) / 1000);
  last = now;
  S.coins += sps() * dt;
  S.earned += sps() * dt;
  refresh();
}, 250);
setInterval(save, 5000);
addEventListener('beforeunload', save);

/* stars */
(function(){
  var h = '';
  for (var i = 0; i < 46; i++) h += '<div style="position:absolute;width:2px;height:2px;background:#e0f2fe;border-radius:50%;opacity:' +
    (0.3 + Math.random() * 0.7).toFixed(2) + ';left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 55).toFixed(1) + '%"></div>';
  $('stars').innerHTML = h;
})();

/* ---------- boot ---------- */
load();
var away = (Date.now() - S.last) / 1000;
if (away > 60 && sps() > 0) {
  var gain = sps() * Math.min(away, 7200) * 0.5;
  S.coins += gain;
  $('ovT').textContent = '🏙️ Welcome back!';
  $('ovS').textContent = 'Your city kept working while you were away and brought in $' + fmt(gain) + '.';
  $('ov').style.display = 'flex';
}
S.last = Date.now();
buildRows();
refresh();
save();
})();
</script>
</body>
</html>
