<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOTH2 Tactical Master Data Studio</title>
  <style>
    :root {
      --bg: #07090d;
      --surface: #0f141c;
      --card: #151c27;
      --border: #243042;
      --accent: #f5a623;
      --text: #f0f4f8;
      --muted: #8b9bb4;
      --success: #2ecc71;
      --danger: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; }
    .studio-shell { max-width: 1000px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { font-size: 1.3rem; color: var(--accent); margin-bottom: 6px; }
    p { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; }
    input, select, textarea { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 4px; font-size: 0.85rem; outline: none; width: 100%; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    .dynamic-box { background: rgba(0,0,0,0.3); border: 1px dashed var(--border); border-radius: 6px; padding: 16px; margin: 16px 0; max-height: 60vh; overflow-y: auto; }
    .fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn { padding: 9px 16px; border-radius: 4px; font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #e09418; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #1c2738; }
    .status-banner { font-size: 0.8rem; padding: 8px 12px; border-radius: 4px; background: rgba(46, 204, 113, 0.15); border: 1px solid var(--success); color: var(--success); margin-top: 14px; display: none; }
  </style>
</head>
<body>

<div class="studio-shell">
  <h1>WOTH2 Tactical Master Data Studio</h1>
  <p>Manage, add, and append entries across all 19 official WOTH2 game datasets without writing raw JSON code.</p>

  <div class="grid-2">
    <div class="form-group">
      <label for="datasetSelect">1. Target Dataset (19 Available)</label>
      <select id="datasetSelect">
        <option value="woth2_challenges.json">woth2_challenges.json</option>
        <option value="woth2_dog_skills.json">woth2_dog_skills.json</option>
        <option value="woth2_game_data.json">woth2_game_data.json</option>
        <option value="woth2_gear.json">woth2_gear.json</option>
        <option value="woth2_harvest_schemas.json" selected>woth2_harvest_schemas.json</option>
        <option value="woth2_infrastructure.json">woth2_infrastructure.json</option>
        <option value="woth2_lifecycles.json">woth2_lifecycles.json</option>
        <option value="woth2_missions.json">woth2_missions.json</option>
        <option value="woth2_need_zones.json">woth2_need_zones.json</option>
        <option value="woth2_news_update.json">woth2_news_update.json</option>
        <option value="woth2_progression_gear.json">woth2_progression_gear.json</option>
        <option value="woth2_regions.json">woth2_regions.json</option>
        <option value="woth2_reserves.json">woth2_reserves.json</option>
        <option value="woth2_runtime_save.json">woth2_runtime_save.json</option>
        <option value="woth2_schema-update.json">woth2_schema-update.json</option>
        <option value="woth2_species.json">woth2_species.json</option>
        <option value="woth2_stewardship.json">woth2_stewardship.json</option>
        <option value="woth2_trails.json">woth2_trails.json</option>
        <option value="woth2_world_wildlife.json">woth2_world_wildlife.json</option>
      </select>
    </div>

    <div class="form-group">
      <label for="entitySelect">2. Target Entry / Record</label>
      <select id="entitySelect"></select>
    </div>
  </div>

  <div id="dynamicFormContainer" class="dynamic-box">
    <!-- Dynamic inputs generated based on schema definition -->
  </div>

  <div class="btn-row">
    <button type="button" id="appendBtn" class="btn btn-primary">💾 Save / Append Record</button>
    <button type="button" id="downloadJsonBtn" class="btn btn-secondary">📥 Export Clean JSON File</button>
  </div>

  <div id="statusAlert" class="status-banner"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const datasetSelect = document.getElementById("datasetSelect");
  const entitySelect = document.getElementById("entitySelect");
  const container = document.getElementById("dynamicFormContainer");
  const statusAlert = document.getElementById("statusAlert");

  const memoryStore = {};

  async function loadFile(fileName) {
    if (memoryStore[fileName]) return memoryStore[fileName];
    const paths = [
      `../../data/${fileName}`,
      `../data/${fileName}`,
      `./data/${fileName}`,
      `/Website/data/${fileName}`,
      `//werewolf3788.github.io/Website/data/${fileName}`
    ];
    for (const p of paths) {
      try {
        const res = await fetch(`${p}?v=${Date.now()}`);
        if (res.ok) {
          memoryStore[fileName] = await res.json();
          return memoryStore[fileName];
        }
      } catch (e) {}
    }
    memoryStore[fileName] = {};
    return memoryStore[fileName];
  }

  function getArrayKey(data) {
    if (!data || typeof data !== "object") return null;
    const candidates = [
      "species", "schemas", "tasks", "missions", "clusters", "regions", 
      "reserves", "species_lifecycles", "seasonal_corridors", "gear", "trees", 
      "skills", "updates", "items", "entries"
    ];
    for (const k of candidates) {
      if (Array.isArray(data[k])) return k;
    }
    for (const [k, v] of Object.entries(data)) {
      if (Array.isArray(v)) return k;
    }
    return null;
  }

  async function refreshEntities() {
    const file = datasetSelect.value;
    const data = await loadFile(file);
    entitySelect.innerHTML = "";

    const arrayKey = getArrayKey(data);

    if (arrayKey && Array.isArray(data[arrayKey])) {
      const arr = data[arrayKey];
      arr.forEach((item, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        const title = item.name || item.species || item.title || item.type || item.location || item.id || `Item #${idx + 1}`;
        opt.textContent = `${title}`;
        entitySelect.appendChild(opt);
      });
      const newOpt = document.createElement("option");
      newOpt.value = "__new__";
      newOpt.textContent = `➕ Add New Record to [${arrayKey}]...`;
      entitySelect.appendChild(newOpt);
    } else if (typeof data === "object" && data !== null) {
      Object.keys(data).forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = `${k}`;
        entitySelect.appendChild(opt);
      });
      const newOpt = document.createElement("option");
      newOpt.value = "__new__";
      newOpt.textContent = "➕ Add New Key...";
      entitySelect.appendChild(newOpt);
    }

    renderFields();
  }

  function renderFields() {
    const file = datasetSelect.value;
    const data = memoryStore[file] || {};
    const sel = entitySelect.value;
    container.innerHTML = "";

    const arrayKey = getArrayKey(data);
    let targetObj = {};
    const isNew = sel === "__new__";

    if (arrayKey && Array.isArray(data[arrayKey])) {
      if (!isNew && data[arrayKey][sel]) {
        targetObj = data[arrayKey][sel];
      } else if (isNew && data[arrayKey].length > 0) {
        // Clone prototype fields with empty values
        Object.keys(data[arrayKey][0]).forEach(k => targetObj[k] = "");
      }
    } else {
      if (!isNew && data[sel]) {
        targetObj = data[sel];
      }
    }

    const title = isNew ? "Add New Record" : (targetObj.name || targetObj.species || targetObj.title || sel);
    let html = `<h4 style="color:var(--accent); font-size:0.95rem; margin-bottom:14px;">Configuring: ${title}</h4><div class="fields-grid">`;

    if (isNew && !arrayKey) {
      html += `
        <div class="form-group" style="grid-column: 1/-1;">
          <label>New Object Key Name</label>
          <input type="text" id="prop___key_name" placeholder="e.g. snowshoe_hare">
        </div>
      `;
    }

    if (typeof targetObj === "object" && targetObj !== null && Object.keys(targetObj).length > 0) {
      Object.entries(targetObj).forEach(([k, v]) => {
        const valStr = typeof v === "object" ? JSON.stringify(v) : (v !== undefined && v !== null ? v : "");
        const isLong = typeof v === "object" || (typeof v === "string" && v.length > 50);

        html += `
          <div class="form-group" style="${isLong ? 'grid-column: 1/-1;' : ''}">
            <label>${k}</label>
            ${isLong
              ? `<textarea id="prop_${k}" rows="2">${valStr}</textarea>`
              : `<input type="text" id="prop_${k}" value="${valStr}">`
            }
          </div>
        `;
      });
    } else {
      html += `
        <div class="form-group" style="grid-column: 1/-1;">
          <label>Entry Payload (JSON / String)</label>
          <textarea id="prop___raw_value" rows="6" placeholder='{\n  "name": "New Entry",\n  "value": 100\n}'></textarea>
        </div>
      `;
    }

    html += `</div>`;
    container.innerHTML = html;
  }

  datasetSelect.addEventListener("change", refreshEntities);
  entitySelect.addEventListener("change", renderFields);

  document.getElementById("appendBtn").addEventListener("click", () => {
    const file = datasetSelect.value;
    const data = memoryStore[file] || {};
    const sel = entitySelect.value;
    const arrayKey = getArrayKey(data);
    const isNew = sel === "__new__";

    const updated = {};
    document.querySelectorAll('[id^="prop_"]').forEach(el => {
      const field = el.id.replace("prop_", "");
      if (field === "__key_name" || field === "__raw_value") return;

      let val = el.value.trim();
      if (!isNaN(val) && val !== "") {
        val = Number(val);
      } else if (val.toLowerCase() === "true") {
        val = true;
      } else if (val.toLowerCase() === "false") {
        val = false;
      } else if (val.startsWith("{") || val.startsWith("[")) {
        try { val = JSON.parse(val); } catch (e) {}
      }
      updated[field] = val;
    });

    const rawEl = document.getElementById("prop___raw_value");
    if (rawEl && rawEl.value.trim()) {
      try {
        Object.assign(updated, JSON.parse(rawEl.value.trim()));
      } catch (e) {
        alert("Invalid JSON format in custom payload box.");
        return;
      }
    }

    if (arrayKey && Array.isArray(data[arrayKey])) {
      if (isNew) {
        data[arrayKey].push(updated);
      } else {
        data[arrayKey][sel] = Object.assign(data[arrayKey][sel], updated);
      }
    } else {
      if (isNew) {
        const keyName = document.getElementById("prop___key_name").value.trim();
        if (!keyName) return alert("Please specify an object key name.");
        data[keyName] = updated;
      } else {
        data[sel] = Object.assign(data[sel] || {}, updated);
      }
    }

    statusAlert.style.display = "block";
    statusAlert.textContent = `✔ Successfully updated record inside ${file}!`;
    setTimeout(() => { statusAlert.style.display = "none"; }, 3500);

    refreshEntities();
  });

  document.getElementById("downloadJsonBtn").addEventListener("click", () => {
    const file = datasetSelect.value;
    const data = memoryStore[file] || {};
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
    const dlAnchor = document.createElement("a");
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", file);
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
  });

  refreshEntities();
});
</script>
</body>
</html>
