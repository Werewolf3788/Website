<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FS25 Dedicated Server Dashboard</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Modular Web SDK v9+ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://game-tracker-5b2ef-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Global Cache & State
    window.FS25_DATA = {};

    // Real-Time Firebase Listener with Auto-Reconnect Failsafe
    const fs25Ref = ref(db, 'fs25');
    onValue(fs25Ref, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        window.FS25_DATA = data;
        renderDashboard(data);
      }
    }, (error) => {
      console.error("Firebase Sync Disconnected:", error);
    });

    // Handle Tab Focus (Page Visibility API) to ensure zero stale state
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && window.FS25_DATA) {
        renderDashboard(window.FS25_DATA);
      }
    });
  </script>

  <style>
    /* CSS Variables & Custom Branding */
    :root {
      --bg-gradient: linear-gradient(180deg, #990000 0%, #000000 100%);
      --surface-dark: #1e1c1c;
      --surface-card: #282424;
      --text-main: #ffffff;
      --accent-gold: #ffcc00;
      --accent-red: #cc0000;
      --accent-green: #00e676;
      --accent-blue: #00e5ff;
      --border-color: #383232;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    /* Navigation / Header */
    header {
      background: rgba(30, 28, 28, 0.95);
      border-radius: 12px;
      padding: 15px 25px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .server-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .server-meta {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .meta-badge {
      background: #141212;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-badge i { color: var(--accent-gold); }

    /* Smart Flexible Layout Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    /* Cards / Containers */
    .card {
      background: var(--surface-dark);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    /* Farms Layout */
    .farm-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-card);
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .farm-money {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    /* Vehicle Cards Layout */
    .vehicle-item {
      background: var(--surface-card);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border-left: 4px solid var(--accent-gold);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .vehicle-icon {
      width: 48px;
      height: 48px;
      background: #141212;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--accent-gold);
      flex-shrink: 0;
    }

    .vehicle-details {
      flex-grow: 1;
    }

    .vehicle-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .vehicle-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .badge-stat {
      font-size: 0.75rem;
      background: #141212;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .plate-badge {
      background: #ffffff;
      color: #000000;
      font-weight: 800;
      letter-spacing: 1px;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 0.75rem;
      border: 1px solid #000;
    }

    /* Field Status Cards */
    .field-item {
      background: var(--surface-card);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-status-pills {
      display: flex;
      gap: 6px;
    }

    .pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .pill-green { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); }
    .pill-gold { background: rgba(255, 204, 0, 0.2); color: var(--accent-gold); }
    .pill-blue { background: rgba(0, 229, 255, 0.2); color: var(--accent-blue); }

    /* Contract Priority Highlights */
    .contract-active {
      border: 2px solid var(--accent-gold);
      background: rgba(255, 204, 0, 0.08);
    }

    .empty-state {
      font-size: 0.85rem;
      color: #888888;
      font-style: italic;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Telemetry Bar -->
    <header>
      <div class="server-title">
        <i class="fa-solid fa-server"></i>
        <span id="server-name">Loading Server...</span>
      </div>
      <div class="server-meta">
        <div class="meta-badge"><i class="fa-solid fa-map-location-dot"></i> <span id="server-map">Map: --</span></div>
        <div class="meta-badge"><i class="fa-solid fa-clock"></i> <span id="server-time">Time: --:--</span></div>
        <div class="meta-badge"><i class="fa-solid fa-calendar-days"></i> <span id="server-month">Month: --</span></div>
        <div class="meta-badge"><i class="fa-solid fa-cloud-sun"></i> <span id="server-weather">Weather: --</span></div>
        <div class="meta-badge"><i class="fa-solid fa-users"></i> <span id="server-players">Players: 0/0</span></div>
      </div>
    </header>

    <!-- Main Dynamic Grid -->
    <div class="dashboard-grid">

      <!-- Registered Server Farms (Dynamic Compact Width) -->
      <div class="card full-width" id="farms-card">
        <div class="card-header">
          <span><i class="fa-solid fa-tractor"></i> Registered Server Farms</span>
        </div>
        <div id="farms-container">
          <div class="empty-state">Reading farm finances...</div>
        </div>
      </div>

      <!-- Tractors & Harvesters -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-truck-monster"></i> Tractors & Harvesters</span>
        </div>
        <div id="tractors-container"></div>
      </div>

      <!-- Implements & Tools -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-gears"></i> Implements & Tools</span>
        </div>
        <div id="implements-container"></div>
      </div>

      <!-- Active Contracts & Missions (Pinned Priority) -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-file-contract"></i> Active Contracts & Jobs</span>
        </div>
        <div id="contracts-container"></div>
      </div>

      <!-- Field Status & Crops -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-wheat-awn"></i> Field Crops & Precision Stats</span>
        </div>
        <div id="fields-container"></div>
      </div>

      <!-- Production Factories & Storage -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-industry"></i> Production Factories & Storage</span>
        </div>
        <div id="production-container"></div>
      </div>

      <!-- Commodity Market Economy -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-chart-line"></i> Commodity Market Prices</span>
        </div>
        <div id="economy-container"></div>
      </div>

    </div>
  </div>

  <script>
    // Utility Function: Insert spaces into PascalCase names (e.g. WelkersBigBudKTTA700 -> Welkers Big Bud KTTA 700)
    function formatName(str) {
      if (!str) return 'Unknown Item';
      return str
        .replace(/([a-z])([A-Z])/g, '$1 $2')
        .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
        .replace(/([a-zA-Z])([0-9])/g, '$1 $2')
        .replace(/([0-9])([a-zA-Z])/g, '$1 $2')
        .trim();
    }

    // Helper: Safely parse XML strings
    function parseXML(xmlString) {
      if (!xmlString) return null;
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");
        return xmlDoc.getElementsByTagName("parsererror").length > 0 ? null : xmlDoc;
      } catch (e) {
        return null;
      }
    }

    // Main Renderer
    function renderDashboard(data) {
      if (!data) return;

      // 1. Render Header Telemetry
      const statsXml = parseXML(data.stats?.data || data.stats);
      if (statsXml) {
        const serverNode = statsXml.querySelector("Server");
        if (serverNode) {
          document.getElementById('server-name').textContent = serverNode.getAttribute("name") || "FS25 Dedicated Server";
          document.getElementById('server-map').textContent = `Map: ${serverNode.getAttribute("mapName") || "Riverbend Springs"}`;
          document.getElementById('server-players').textContent = `Players: ${serverNode.getAttribute("numPlayers") || 0}/${serverNode.getAttribute("capacity") || 16}`;
        }
      }

      // Render Environment (Month & Weather)
      const envXml = parseXML(data.environment?.data || data.environment_xml?.data);
      if (envXml) {
        const dayTime = envXml.querySelector("dayTime")?.textContent;
        const currentMonth = envXml.querySelector("currentMonth")?.textContent;
        const weather = envXml.querySelector("weather")?.getAttribute("currentWeather");

        const monthNames = ["Late Winter", "Early Spring", "Spring", "Late Spring", "Early Summer", "Summer", "Late Summer", "Early Autumn", "Autumn", "Late Autumn", "Early Winter", "Winter"];
        if (currentMonth !== undefined) {
          document.getElementById('server-month').textContent = `Month: ${monthNames[parseInt(currentMonth) - 1] || 'Spring'}`;
        }
        if (weather) {
          document.getElementById('server-weather').textContent = `Weather: ${weather.toUpperCase()}`;
        }
      }

      // 2. Render Farms & Finances
      const farmsXml = parseXML(data.farms?.data || data.farms_xml?.data);
      const farmsContainer = document.getElementById('farms-container');
      if (farmsXml) {
        const farmNodes = farmsXml.querySelectorAll("farm");
        let html = "";
        farmNodes.forEach(farm => {
          const farmId = farm.getAttribute("farmId");
          const name = farm.getAttribute("name");
          const money = parseFloat(farm.getAttribute("money") || "0");
          if (farmId !== "0") {
            html += `
              <div class="farm-row">
                <div><strong>${name}</strong> (Farm ID: ${farmId})</div>
                <div class="farm-money">$${money.toLocaleString()}</div>
              </div>`;
          }
        });
        farmsContainer.innerHTML = html || '<div class="empty-state">No registered farm data found.</div>';
      }

      // 3. Render Vehicles & Implements (With Fuel %, Condition %, License Plate)
      const vehXml = parseXML(data.vehicles?.data || data.vehicles_xml?.data);
      const tractorsContainer = document.getElementById('tractors-container');
      const implementsContainer = document.getElementById('implements-container');

      if (vehXml) {
        const vehicles = vehXml.querySelectorAll("vehicle");
        let tractorsHtml = "";
        let implementsHtml = "";

        vehicles.forEach(veh => {
          const rawName = veh.getAttribute("filename")?.split('/')?.pop()?.replace('.xml', '') || "Vehicle";
          const formattedName = formatName(rawName);
          const age = veh.getAttribute("age") || "0";

          // Damage / Operating Condition
          const wearNode = veh.querySelector("wearable");
          const damage = wearNode ? Math.round((1 - parseFloat(wearNode.getAttribute("damage") || "0")) * 100) : 100;

          // Fuel Level
          const fuelNode = veh.querySelector("fuelFillUnit");
          const fuelPct = fuelNode ? Math.round(parseFloat(fuelNode.getAttribute("fillLevel") || "0")) : null;

          // License Plate
          const plateNode = veh.querySelector("licensePlate");
          const licensePlate = plateNode ? plateNode.textContent : null;

          const vehCard = `
            <div class="vehicle-item">
              <div class="vehicle-icon"><i class="fa-solid fa-truck-pickup"></i></div>
              <div class="vehicle-details">
                <div class="vehicle-title">${formattedName}</div>
                <div class="vehicle-badges">
                  <span class="badge-stat"><i class="fa-solid fa-wrench"></i> Condition: ${damage}%</span>
                  ${fuelPct !== null ? `<span class="badge-stat"><i class="fa-solid fa-gas-pump"></i> Fuel: ${fuelPct}%</span>` : ''}
                  ${licensePlate ? `<span class="plate-badge">${licensePlate}</span>` : ''}
                </div>
              </div>
            </div>`;

          if (rawName.toLowerCase().includes("tractor") || rawName.toLowerCase().includes("harvester") || rawName.toLowerCase().includes("bigbud") || rawName.toLowerCase().includes("truck")) {
            tractorsHtml += vehCard;
          } else {
            implementsHtml += vehCard;
          }
        });

        tractorsContainer.innerHTML = tractorsHtml || '<div class="empty-state">No active heavy machinery online.</div>';
        implementsContainer.innerHTML = implementsHtml || '<div class="empty-state">No tools attached.</div>';
      }

      // 4. Render Active Contracts & Jobs (Pinned Active to Top)
      const missionsXml = parseXML(data.missions?.data || data.missions_xml?.data);
      const contractsContainer = document.getElementById('contracts-container');
      if (missionsXml) {
        const missions = missionsXml.querySelectorAll("mission");
        let html = "";
        let activeList = [];
        let availableList = [];

        missions.forEach(m => {
          const type = formatName(m.getAttribute("type") || "Contract");
          const fieldId = m.getAttribute("fieldId");
          const reward = parseFloat(m.getAttribute("reward") || "0").toLocaleString();
          const status = m.getAttribute("status"); // 1 = Active

          const card = `
            <div class="field-item ${status === "1" ? "contract-active" : ""}">
              <div>
                <strong>${type}</strong> (Field #${fieldId})
                ${status === "1" ? '<span class="pill pill-gold">ACTIVE IN-PROGRESS</span>' : ''}
              </div>
              <div class="farm-money" style="font-size:1rem;">$${reward}</div>
            </div>`;

          if (status === "1") {
            activeList.push(card);
          } else {
            availableList.push(card);
          }
        });

        // Combine with Active Contracts at the top
        html = [...activeList, ...availableList].join("");
        contractsContainer.innerHTML = html || '<div class="empty-state">No available contracts on board.</div>';
      }

      // 5. Production Factories & Storage
      const placeXml = parseXML(data.placeables?.data || data.placeables_xml?.data);
      const productionContainer = document.getElementById('production-container');
      if (placeXml) {
        const placeables = placeXml.querySelectorAll("placeable");
        let html = "";
        placeables.forEach(p => {
          const rawName = p.getAttribute("filename")?.split('/')?.pop()?.replace('.xml', '') || "Placeable";
          const formatted = formatName(rawName);
          if (!rawName.includes("fence") && !rawName.includes("gate")) {
            html += `
              <div class="field-item">
                <div><i class="fa-solid fa-building-wheat" style="color:var(--accent-gold); margin-right:8px;"></i> <strong>${formatted}</strong></div>
                <span class="pill pill-blue">Operational</span>
              </div>`;
          }
        });
        productionContainer.innerHTML = html || '<div class="empty-state">No active factories deployed.</div>';
      }

      // 6. Commodity Market Prices
      const ecoXml = parseXML(data.economy?.data || data.economy_xml?.data);
      const economyContainer = document.getElementById('economy-container');
      if (ecoXml) {
        const fillTypes = ecoXml.querySelectorAll("fillType");
        let html = "";
        fillTypes.forEach(f => {
          const name = formatName(f.getAttribute("name"));
          const price = (parseFloat(f.getAttribute("price") || "1") * 1000).toFixed(2);
          if (parseFloat(price) > 0) {
            html += `
              <div class="field-item">
                <div><strong>${name}</strong></div>
                <div class="farm-money" style="font-size:0.95rem;">$${price} / kL</div>
              </div>`;
          }
        });
        economyContainer.innerHTML = html || '<div class="empty-state">Market data initializing...</div>';
      }
    }
  </script>
</body>
</html>
