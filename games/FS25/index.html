<!-- Firebase SDK v9+ Live Realtime Listener with Debounce Protection -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // Your Firebase Configuration
  const firebaseConfig = {
    databaseURL: "https://game-tracker-5b2ef-default-rtdb.firebaseio.com"
  };

  // Initialize Firebase Connection
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const fs25Ref = ref(db, 'fs25');

  let syncDebounceTimer = null;

  // Real-time Push Observer (Replaces Refresh/Polling)
  onValue(fs25Ref, (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    // Debounce Buffer (500ms): Waits for fs25.js to finish writing all XML nodes
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(() => {
      if (typeof window.renderDashboard === 'function') {
        window.renderDashboard(data);
      }
    }, 500);
  }, (error) => {
    console.warn("⚠️ Firebase stream dropped, auto-reconnecting...", error);
  });

  // Re-verify stale data when user switches back to the tab
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      // Browser tab regained focus; WebSocket will auto-sync missing snapshots
    }
  });
</script>
