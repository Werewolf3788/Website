  <!-- Firebase Modular Web SDK v9+ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://game-tracker-5b2ef-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.FS25_DATA = {};

    // Real-Time Firebase Listener
    const fs25Ref = ref(db, 'fs25');
    onValue(fs25Ref, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        window.FS25_DATA = data;
        renderDashboard(data);
      }
    }, (error) => {
      console.error("Firebase Listener Error:", error);
    });

    // Page Visibility State Observer
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && window.FS25_DATA) {
        renderDashboard(window.FS25_DATA);
      }
    });
  </script>

  <script>
    function formatName(str) {
      if (!str) return 'Unknown Item';
      let clean = str.split('/').pop().replace('.xml', '').replace('data_', '');
      return clean.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ').toUpperCase();
    }

    function resolvePlaceableName(filename) {
      if (!filename) return "Storage Facility";
      const name = filename.toLowerCase();
      if (name.includes("silo")) return "Grain Elevator Silo";
      if (name.includes("cow")) return "Dairy Cow Barn";
      if (name.includes("dairy")) return "Milk Dairy Factory";
      if (name.includes("bakery")) return "Commercial Bakery";
      if (name.includes("sawmill")) return "Lumber Sawmill";
      return formatName(filename);
    }

    function resolveCropName(typeName) {
      if (!typeName) return "Grain Crop";
      const map = { "WHEAT":"Wheat", "BARLEY":"Barley", "CANOLA":"Canola", "OAT":"Oats", "MAIZE":"Corn", "SOYBEAN":"Soybeans" };
      return map[typeName.toUpperCase()] || formatName(typeName);
    }

    function parseXML(xmlString) {
      if (!xmlString) return null;
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");
        return xmlDoc.getElementsByTagName("parsererror").length > 0 ? null : xmlDoc;
      } catch (e) { return null; }
    }

    function renderDashboard(data) {
      if (!data) return;

      const statsXml = parseXML(data.stats?.data || data.stats);
      if (statsXml) {
        const serverNode = statsXml.querySelector("Server");
        if (serverNode) {
          document.getElementById('server-name').textContent = serverNode.getAttribute("name") || "FS25 Dedicated Server";
          document.getElementById('server-map').textContent = `Map: ${serverNode.getAttribute("mapName") || "Riverbend Springs"}`;
          document.getElementById('server-players').textContent = `Players: ${serverNode.getAttribute("numPlayers") || 0}/${serverNode.getAttribute("capacity") || 16}`;
        }
      }

      // Farms
      const farmsXml = parseXML(data.farms?.data || data.farms_xml?.data);
      const farmsContainer = document.getElementById('farms-container');
      if (farmsXml) {
        let html = "";
        farmsXml.querySelectorAll("farm").forEach(farm => {
          if (farm.getAttribute("farmId") !== "0") {
            html += `<div class="item-card"><div><strong>${farm.getAttribute("name")}</strong></div><div class="farm-money">$${parseFloat(farm.getAttribute("money")||"0").toLocaleString()}</div></div>`;
          }
        });
        farmsContainer.innerHTML = html || '<div class="empty-state">No registered farm data.</div>';
      }

      // Machinery
      const vehXml = parseXML(data.vehicles?.data || data.vehicles_xml?.data);
      if (vehXml) {
        let tractorsHtml = "";
        let implementsHtml = "";
        vehXml.querySelectorAll("vehicle").forEach(veh => {
          const rawName = veh.getAttribute("filename") || "Vehicle";
          const wearNode = veh.querySelector("wearable");
          const damage = wearNode ? Math.round((1 - parseFloat(wearNode.getAttribute("damage") || "0")) * 100) : 100;
          const plateNode = veh.querySelector("licensePlate");
          const plate = plateNode ? plateNode.textContent : null;

          const card = `<div class="item-card"><div><strong>${formatName(rawName)}</strong></div><span class="badge-stat"><i class="fa-solid fa-wrench"></i> ${damage}%</span> ${plate ? `<span class="plate-badge">${plate}</span>` : ''}</div>`;
          if (rawName.toLowerCase().match(/(tractor|harvester|bigbud|truck|locomotive)/)) {
            tractorsHtml += card;
          } else {
            implementsHtml += card;
          }
        });
        document.getElementById('tractors-container').innerHTML = tractorsHtml || '<div class="empty-state">No active machinery.</div>';
        document.getElementById('implements-container').innerHTML = implementsHtml || '<div class="empty-state">No tools online.</div>';
      }

      // Economy
      const ecoXml = parseXML(data.economy?.data || data.economy_xml?.data);
      if (ecoXml) {
        let html = "";
        ecoXml.querySelectorAll("fillType").forEach(f => {
          const price = (parseFloat(f.getAttribute("price") || "1") * 1000).toFixed(2);
          if (parseFloat(price) > 0) {
            html += `<div class="item-card"><div><strong>${resolveCropName(f.getAttribute("name"))}</strong></div><div class="farm-money">$${price} / kL</div></div>`;
          }
        });
        document.getElementById('economy-container').innerHTML = html || '<div class="empty-state">Market data offline.</div>';
      }
    }
  </script>
