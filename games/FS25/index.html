<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FS25 Dedicated Server Dashboard</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Modular Web SDK v9+ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://game-tracker-5b2ef-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.FS25_DATA = {};

    // Real-Time Firebase Listener
    const fs25Ref = ref(db, 'fs25');
    onValue(fs25Ref, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        window.FS25_DATA = data;
        renderDashboard(data);
      }
    }, (error) => {
      console.error("Firebase Sync Error:", error);
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && window.FS25_DATA) {
        renderDashboard(window.FS25_DATA);
      }
    });
  </script>

  <style>
    :root {
      --surface-dark: rgba(30, 28, 28, 0.94);
      --surface-card: #282424;
      --text-main: #ffffff;
      --accent-gold: #ffcc00;
      --accent-red: #cc0000;
      --accent-green: #00e676;
      --accent-blue: #00e5ff;
      --border-color: #383232;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    /* FS25 Background Poster */
    body {
      background: url('https://cdn.cloudflare.steamstatic.com/steam/apps/2300320/header.jpg') no-repeat center center fixed;
      background-size: cover;
      background-color: #000000;
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    /* Dynamic Menu Navigation Styling */
    .top-menu-bar {
      background: var(--surface-dark);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .nav-item {
      position: relative;
      display: inline-block;
    }

    .nav-btn {
      background: var(--surface-card);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: var(--accent-red);
      color: #ffffff;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--surface-dark);
      min-width: 200px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
      border-radius: 6px;
      border: 1px solid var(--border-color);
      z-index: 100;
      padding: 6px 0;
      margin-top: 4px;
    }

    .dropdown-content a {
      color: var(--text-main);
      padding: 10px 16px;
      text-decoration: none;
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .dropdown-content a:hover {
      background: var(--accent-red);
    }

    .nav-item:hover .dropdown-content {
      display: block;
    }

    /* Header Bar */
    header {
      background: var(--surface-dark);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(8px);
    }

    .server-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .server-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-badge {
      background: #141212;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-badge i { color: var(--accent-gold); }

    /* Dashboard Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
    }

    .full-width { grid-column: 1 / -1; }

    /* Card Panels */
    .card {
      background: var(--surface-dark);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }

    .card-header {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    /* Vertical Scroll Box (Caps at ~5 items) */
    .vertical-scroll-body {
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .vertical-scroll-body::-webkit-scrollbar { width: 6px; }
    .vertical-scroll-body::-webkit-scrollbar-thumb { background: var(--accent-red); border-radius: 4px; }
    .vertical-scroll-body::-webkit-scrollbar-track { background: #141212; }

    .item-card {
      background: var(--surface-card);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid var(--accent-gold);
    }

    .item-thumb {
      width: 44px;
      height: 44px;
      background: #141212;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--accent-gold);
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .item-info { flex-grow: 1; }
    .item-title { font-weight: 700; font-size: 0.9rem; color: #ffffff; }
    .farm-money { font-size: 1.1rem; font-weight: 800; color: var(--accent-green); }

    .badge-stat {
      font-size: 0.75rem;
      background: #141212;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      display: inline-block;
      margin-top: 4px;
    }

    .plate-badge {
      background: #ffffff;
      color: #000000;
      font-weight: 800;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 0.75rem;
      margin-left: 4px;
    }

    .empty-state {
      font-size: 0.85rem;
      color: #aaaaaa;
      font-style: italic;
      padding: 8px 0;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Dynamically Populated Google Sheets Navigation Menu -->
    <nav class="top-menu-bar" id="dynamic-menu">
      <div class="empty-state" style="padding:0;">Loading Navigation Menu...</div>
    </nav>

    <!-- Header Telemetry Bar -->
    <header>
      <div class="server-title">
        <i class="fa-solid fa-server"></i>
        <span id="server-name">FS25 Dedicated Server</span>
      </div>
      <div class="server-meta">
        <div class="meta-badge"><i class="fa-solid fa-map-location-dot"></i> <span id="server-map">Map: Riverbend Springs</span></div>
        <div class="meta-badge"><i class="fa-solid fa-users"></i> <span id="server-players">Players: 0/16</span></div>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="dashboard-grid">

      <!-- Registered Server Farms -->
      <div class="card full-width" id="farms-card">
        <div class="card-header">
          <span><i class="fa-solid fa-tractor"></i> Registered Server Farms</span>
        </div>
        <div class="vertical-scroll-body" id="farms-container"></div>
      </div>

      <!-- Tractors & Machinery -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-truck-monster"></i> Machinery & Vehicles</span>
        </div>
        <div class="vertical-scroll-body" id="tractors-container"></div>
      </div>

      <!-- Implements & Tools -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-gears"></i> Implements & Equipment</span>
        </div>
        <div class="vertical-scroll-body" id="implements-container"></div>
      </div>

      <!-- Active Contracts -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-file-contract"></i> Active Contracts & Missions</span>
        </div>
        <div class="vertical-scroll-body" id="contracts-container"></div>
      </div>

      <!-- Installed Server Mods -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-puzzle-piece"></i> Active Installed Mods</span>
        </div>
        <div class="vertical-scroll-body" id="mods-container"></div>
      </div>

      <!-- Factories & Storage -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-industry"></i> Factories & Storage</span>
        </div>
        <div class="vertical-scroll-body" id="production-container"></div>
      </div>

      <!-- Commodity Market Economy -->
      <div class="card">
        <div class="card-header">
          <span><i class="fa-solid fa-chart-line"></i> Commodity Market Prices</span>
        </div>
        <div class="vertical-scroll-body" id="economy-container"></div>
      </div>

    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Google Sheets Menu Feed Engine with Smart Tabs Interceptor
    // -------------------------------------------------------------
    const menuCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7s86dWkDdx-SomMJamUCFEEsQEpgcPBxUFmanAuYrWqqVSfDqOEhgLs1hZfLRFOPK7vLFeXKcMXqK/pub?output=csv";

    // Smart Tab Channel for focus jumping
    const tabChannel = new BroadcastChannel('smart_tabs_channel');

    async function loadGoogleSheetsMenu() {
      try {
        const response = await fetch(`${menuCsvUrl}&v=${Date.now()}`);
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const menuContainer = document.getElementById('dynamic-menu');
        menuContainer.innerHTML = '';

        const categories = {};

        rows.forEach((row, index) => {
          if (index === 0) return; // Skip Header
          const [category, title, url, icon] = row.map(cell => cell ? cell.trim() : '');

          if (!category || !url) return;

          if (!categories[category]) {
            categories[category] = [];
          }
          categories[category].push({ title, url, icon });
        });

        // Render Dropdowns or Standalone Buttons
        Object.keys(categories).forEach(catName => {
          const items = categories[catName];

          if (items.length === 1 && items[0].title.toLowerCase() === catName.toLowerCase()) {
            // Standalone Button
            const item = items[0];
            const btn = document.createElement('a');
            btn.className = 'nav-btn smart-link';
            btn.href = formatNativeUrl(item.url);
            btn.innerHTML = `${item.icon ? `<i class="${item.icon}"></i>` : ''} ${catName}`;
            menuContainer.appendChild(btn);
          } else {
            // Dropdown Group
            const navGroup = document.createElement('div');
            navGroup.className = 'nav-item';

            let dropdownHtml = `
              <button class="nav-btn">
                ${catName} <i class="fa-solid fa-caret-down"></i>
              </button>
              <div class="dropdown-content">`;

            items.forEach(sub => {
              dropdownHtml += `<a href="${formatNativeUrl(sub.url)}" class="smart-link">${sub.icon ? `<i class="${sub.icon}"></i>` : ''} ${sub.title}</a>`;
            });

            dropdownHtml += `</div>`;
            navGroup.innerHTML = dropdownHtml;
            menuContainer.appendChild(navGroup);
          }
        });

        attachSmartTabHandlers();
      } catch (err) {
        console.error("Failed to load Google Sheets Menu:", err);
        document.getElementById('dynamic-menu').innerHTML = '<div class="empty-state">Unable to load navigation feed.</div>';
      }
    }

    // CSV Parser Utility
    function parseCSV(text) {
      const lines = text.split('\n');
      return lines.map(line => line.split(','));
    }

    // Native Link Formatter
    function formatNativeUrl(url) {
      if (url.startsWith('tel:') || url.startsWith('mailto:') || url.includes('wa.me/')) {
        return url;
      }
      return url;
    }

    // Smart Tabs Interceptor Rule
    function attachSmartTabHandlers() {
      document.querySelectorAll('.smart-link').forEach(link => {
        link.addEventListener('click', (e) => {
          const href = link.getAttribute('href');
          if (href.startsWith('tel:') || href.startsWith('mailto:')) return; // Allow native protocols

          e.preventDefault();
          tabChannel.postMessage({ action: 'focus_or_open', targetUrl: href });
          window.open(href, href); // Fallback standard navigation
        });
      });
    }

    // Listen for tab focus requests across browser windows
    tabChannel.onmessage = (event) => {
      if (event.data.action === 'focus_or_open' && window.name === event.data.targetUrl) {
        window.focus();
      }
    };

    // Initialize Menu
    loadGoogleSheetsMenu();

    // -------------------------------------------------------------
    // Dashboard Telemetry Rendering Engine
    // -------------------------------------------------------------
    function formatName(str) {
      if (!str) return 'Unknown Item';
      let clean = str.split('/').pop().replace('.xml', '').replace('data_', '');
      return clean.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ').toUpperCase();
    }

    function getCategoryIcon(rawName) {
      const lower = rawName.toLowerCase();
      if (lower.includes("tractor") || lower.includes("bigbud")) return '<i class="fa-solid fa-tractor"></i>';
      if (lower.includes("harvester") || lower.includes("combine")) return '<i class="fa-solid fa-wheat-awn"></i>';
      if (lower.includes("truck") || lower.includes("pickup")) return '<i class="fa-solid fa-truck-pickup"></i>';
      return '<i class="fa-solid fa-toolbox"></i>';
    }

    function resolvePlaceableName(filename) {
      if (!filename) return "Storage Building";
      const name = filename.toLowerCase();
      if (name.includes("silo")) return "Grain Elevator Silo";
      if (name.includes("cow")) return "Dairy Cow Barn";
      if (name.includes("dairy")) return "Milk Dairy Factory";
      return formatName(filename);
    }

    function resolveCropName(typeName) {
      if (!typeName) return "Grain Crop";
      const map = { "WHEAT": "Wheat", "BARLEY": "Barley", "CANOLA": "Canola", "OAT": "Oats", "MAIZE": "Corn" };
      return map[typeName.toUpperCase()] || formatName(typeName);
    }

    function parseXML(xmlString) {
      if (!xmlString) return null;
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");
        return xmlDoc.getElementsByTagName("parsererror").length > 0 ? null : xmlDoc;
      } catch (e) { return null; }
    }

    function renderDashboard(data) {
      if (!data) return;

      const statsXml = parseXML(data.stats?.data || data.stats);
      if (statsXml) {
        const serverNode = statsXml.querySelector("Server");
        if (serverNode) {
          document.getElementById('server-name').textContent = serverNode.getAttribute("name") || "FS25 Dedicated Server";
          document.getElementById('server-map').textContent = `Map: ${serverNode.getAttribute("mapName") || "Riverbend Springs"}`;
          document.getElementById('server-players').textContent = `Players: ${serverNode.getAttribute("numPlayers") || 0}/${serverNode.getAttribute("capacity") || 16}`;
        }
      }

      // Farms
      const farmsXml = parseXML(data.farms?.data || data.farms_xml?.data);
      if (farmsXml) {
        let html = "";
        farmsXml.querySelectorAll("farm").forEach(farm => {
          if (farm.getAttribute("farmId") !== "0") {
            html += `<div class="item-card"><div class="item-thumb"><i class="fa-solid fa-house-chimney-crack"></i></div><div class="item-info"><div class="item-title">${farm.getAttribute("name")}</div></div><div class="farm-money">$${parseFloat(farm.getAttribute("money")||"0").toLocaleString()}</div></div>`;
          }
        });
        document.getElementById('farms-container').innerHTML = html || '<div class="empty-state">No active farm finances.</div>';
      }

      // Vehicles
      const vehXml = parseXML(data.vehicles?.data || data.vehicles_xml?.data);
      if (vehXml) {
        let tractorsHtml = "";
        let implementsHtml = "";

        vehXml.querySelectorAll("vehicle").forEach(veh => {
          const rawName = veh.getAttribute("filename") || "Vehicle";
          const formatted = formatName(rawName);
          const wearNode = veh.querySelector("wearable");
          const damage = wearNode ? Math.round((1 - parseFloat(wearNode.getAttribute("damage") || "0")) * 100) : 100;
          const plateNode = veh.querySelector("licensePlate");
          const plate = plateNode ? plateNode.textContent : null;

          const card = `<div class="item-card"><div class="item-thumb">${getCategoryIcon(rawName)}</div><div class="item-info"><div class="item-title">${formatted}</div><div><span class="badge-stat"><i class="fa-solid fa-wrench"></i> ${damage}%</span>${plate ? `<span class="plate-badge">${plate}</span>` : ''}</div></div></div>`;
          if (rawName.toLowerCase().match(/(tractor|harvester|bigbud|truck|locomotive)/)) {
            tractorsHtml += card;
          } else {
            implementsHtml += card;
          }
        });

        document.getElementById('tractors-container').innerHTML = tractorsHtml || '<div class="empty-state">No heavy machinery active.</div>';
        document.getElementById('implements-container').innerHTML = implementsHtml || '<div class="empty-state">No equipment attached.</div>';
      }

      // Economy
      const ecoXml = parseXML(data.economy?.data || data.economy_xml?.data);
      if (ecoXml) {
        let html = "";
        ecoXml.querySelectorAll("fillType").forEach(f => {
          const price = (parseFloat(f.getAttribute("price") || "1") * 1000).toFixed(2);
          if (parseFloat(price) > 0) {
            html += `<div class="item-card"><div class="item-thumb"><i class="fa-solid fa-coins"></i></div><div class="item-info"><div class="item-title">${resolveCropName(f.getAttribute("name"))}</div></div><div class="farm-money">$${price} / kL</div></div>`;
          }
        });
        document.getElementById('economy-container').innerHTML = html || '<div class="empty-state">Market economy offline.</div>';
      }
    }
  </script>
</body>
</html>
