<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>618 ADMIN | TOTAL RECON UPLINK v2.4</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="main-container">
        <header class="glossy-header">
            <h1>MANUAL G-PORTAL UPLINK <span>v2.4</span></h1>
            <div class="status-badge">SYSTEM: ONLINE</div>
        </header>
        
        <section class="override-panel">
            <label for="xml-file-type">TARGET DATASET (Full Directory & Log Coverage):</label>
            <select id="xml-file-type">
                <option value="vehicles">vehicles.xml</option>
                <option value="economy">economy.xml</option>
                <option value="careerSavegame">careerSavegame.xml</option>
                <option value="farms">farms.xml</option>
                <option value="placeables">placeables.xml</option>
                <option value="missions">missions.xml</option>
                <option value="animals">animals.xml</option>
                <option value="farmland">farmland.xml</option>
                <option value="precisionFarming">precisionFarming.xml</option>
                <option value="collectibles">collectibles.xml</option>
                <option value="cultivator">cultivator.xml</option>
                <option value="items">items.xml</option>
                <option value="pedestrians">pedestrians.xml</option>
                <option value="silo">silo.xml</option>
                <option value="trafficSystem">trafficSystem.xml</option>
                <option value="vehicleTypes">vehicleTypes.xml</option>
                <option value="systemLogs">serverLog.txt (System Logs)</option>
            </select>
            
            <textarea id="manual-xml-input" placeholder="Paste raw XML data or serverLog text here..."></textarea>
            
            <button class="action-btn" onclick="executeAdvancedSync()">EXECUTE DEEP SYNC</button>
            
            <div id="upload-status">STATUS: READY FOR INGESTION</div>
        </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database-compat.js"></script>
    <script src="./js/main.js?v=1.3"></script>
</body>
</html>
