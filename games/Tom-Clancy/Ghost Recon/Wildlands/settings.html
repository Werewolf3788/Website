<!-- ==========================================================================

     ARCHITECTURE: Firebase Firestore (entertainment-71888)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Werewolf Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Inter', sans-serif; }
        .custom-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="bg-slate-900/90 sticky top-0 z-50 border-b border-slate-700 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="text-xl font-black text-sky-400">WEREWOLF<span class="text-white">PROJECT</span></a>
                    <span class="text-xs bg-slate-800 text-slate-400 font-mono px-2 py-1 rounded">SETTINGS</span>
                </div>
                <div id="authContainer" class="flex items-center gap-3">
                    <button id="googleSignInBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2 px-4 rounded-lg flex items-center gap-2">
                        <i class="fa-brands fa-google"></i><span>Login with Google</span>
                    </button>
                    <div id="userProfileStatus" class="hidden items-center gap-3">
                        <img id="userAvatar" src="" class="w-8 h-8 rounded-full border-2 border-sky-400 object-cover" alt="">
                        <span id="userAccountEmail" class="text-xs text-slate-300 font-mono"></span>
                        <button id="signOutBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs py-1.5 px-3 rounded-lg">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8">
        <form id="settingsForm" class="space-y-8">
            <div class="custom-card p-6">
                <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-id-card text-sky-400 mr-2"></i>Operator Identity</h2>
                <div>
                    <label class="block text-xs font-black uppercase text-slate-300 mb-2">Gaming Nickname / Handle</label>
                    <input type="text" id="operatorNameInput" required value="Werewolf3788" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2.5 px-4 text-sm text-white">
                </div>
            </div>

            <div class="custom-card p-6">
                <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-gamepad text-emerald-400 mr-2"></i>Platform Handles</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div><label class="block text-xs uppercase text-slate-300 mb-1">PlayStation PSN</label><input type="text" id="psnTagInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm text-white"></div>
                    <div><label class="block text-xs uppercase text-slate-300 mb-1">Xbox Live</label><input type="text" id="xboxTagInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm text-white"></div>
                    <div><label class="block text-xs uppercase text-slate-300 mb-1">Steam ID</label><input type="text" id="steamTagInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm text-white"></div>
                </div>
            </div>

            <div class="flex justify-between items-center">
                <span id="saveStatusMessage" class="text-xs font-mono text-emerald-400 font-bold"></span>
                <button type="submit" class="bg-orange-600 hover:bg-orange-500 text-white font-black text-sm py-3 px-8 rounded-xl shadow-lg">Save Settings</button>
            </div>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, setPersistence, browserLocalPersistence, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDeuNBGHcwU4rFyOcsfGxLHjmEdpADacmc",
            authDomain: "entertainment-71888.firebaseapp.com",
            databaseURL: "https://entertainment-71888-default-rtdb.firebaseio.com",
            projectId: "entertainment-71888",
            storageBucket: "entertainment-71888.firebasestorage.app",
            messagingSenderId: "660524340277",
            appId: "1:660524340277:web:ef8f4ed04fa985a4f88d7c",
            measurementId: "G-JDNSLD3GFE"
        };

        let auth, db, currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const app = initializeApp(firebaseConfig, 'Settings-App');
            auth = getAuth(app);
            db = getFirestore(app);

            await setPersistence(auth, browserLocalPersistence);

            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                const googleBtn = document.getElementById("googleSignInBtn");
                const userStatus = document.getElementById("userProfileStatus");
                const userAvatar = document.getElementById("userAvatar");
                const userEmail = document.getElementById("userAccountEmail");

                if (user) {
                    if (googleBtn) googleBtn.style.display = "none";
                    if (userStatus) userStatus.style.display = "flex";
                    if (userAvatar) userAvatar.src = user.photoURL || "";
                    if (userEmail) userEmail.textContent = user.email;

                    const savedNickname = localStorage.getItem('active_gaming_nickname') || user.displayName || "Werewolf3788";
                    document.getElementById('operatorNameInput').value = savedNickname;
                } else {
                    if (googleBtn) googleBtn.style.display = "inline-flex";
                    if (userStatus) userStatus.style.display = "none";
                }
            });

            document.getElementById("googleSignInBtn")?.addEventListener("click", () => {
                const provider = new GoogleAuthProvider();
                signInWithPopup(auth, provider);
            });

            document.getElementById("signOutBtn")?.addEventListener("click", () => {
                signOut(auth).then(() => location.reload());
            });

            document.getElementById('settingsForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nickname = document.getElementById('operatorNameInput').value.trim();
                localStorage.setItem('active_gaming_nickname', nickname);

                if (db) {
                    await setDoc(doc(db, 'users', nickname), {
                        displayName: nickname,
                        email: currentUser ? currentUser.email : "",
                        lastUpdated: new Date().toISOString()
                    }, { merge: true });

                    const msg = document.getElementById('saveStatusMessage');
                    if (msg) msg.innerText = "✓ Settings Saved cleanly to entertainment-71888!";
                }
            });
        });
    </script>
</body>
</html>
