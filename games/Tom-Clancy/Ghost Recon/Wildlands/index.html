<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Recon Wildlands Squad Operations Hub</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=8.0">
</head>
<body>

    <header class="hub-header">
        <div class="header-container">
            <h1 class="logo-text">GHOST HUB</h1>

            <!-- DROPDOWNS: USER & PLATFORM -->
            <div class="header-controls-group">
                <div class="user-selector-wrapper">
                    <select id="userSelect" class="styled-select">
                        <option value="Werewolf3788">Werewolf3788 (Kevin)</option>
                        <option value="Raymystyro">Raymystyro (Ray)</option>
                        <option value="terrdog420">terrdog420 (TJ)</option>
                        <option value="DesdemonaTiger">DesdemonaTiger (Marc)</option>
                    </select>
                </div>

                <div class="platform-selector-wrapper">
                    <select id="platformSelect" class="styled-select platform-highlight">
                        <option value="pc">💻 PC (Ubisoft Connect)</option>
                        <option value="playstation">🎮 PlayStation (PS5/PS4)</option>
                        <option value="xbox">💚 Xbox (Series X/S)</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="hub-container">
        
        <!-- LEFT PANEL: PROFILE STATS & EDIT FORM -->
        <section class="card-panel profile-panel">
            <div class="profile-header">
                <h2 id="operatorName" class="outline-text">Operator</h2>
                <div id="tierContainer" class="tier-badge-container">
                    <span class="tier-label">TIER</span>
                    <span id="tierLevel" class="tier-value">--</span>
                </div>
            </div>

            <!-- ON-SCREEN LIVE FIRESTORE STATUS INDICATOR -->
            <div id="syncStatus" style="background:#161d26; border:1px solid #2c3a4e; color:#8a99ad; padding:8px 12px; border-radius:4px; font-size:11px; font-weight:bold; text-align:center;">
                Connecting to Cloud Firestore...
            </div>
            
            <div class="stat-category-block">
                <h3 class="category-header">PLAYSTYLE <span id="playstyleType" class="header-highlight">--</span></h3>
                <div class="stat-row"><span>Average Kill Distance</span><span id="avgKillDist" class="stat-val">--</span></div>
            </div>

            <div class="stat-category-block">
                <h3 class="category-header">COMBAT</h3>
                <div class="stat-row"><span>Lifetime</span><span id="statLifetime" class="stat-val">--</span></div>
                <div class="stat-row"><span>Longest Shot</span><span id="longestShot" class="stat-val">--</span></div>
                <div class="weapons-fav-row">
                    <div class="weapon-tag"><strong>Favorite Weapon:</strong> <span id="favWeapon">--</span></div>
                    <div class="weapon-tag"><strong>2nd Favorite Weapon:</strong> <span id="favWeapon2">--</span></div>
                </div>
            </div>

            <div class="edit-stats-trigger-container">
                <button id="toggleEditStats" class="edit-panel-btn">✏️ Edit Ghost Profile Inputs</button>
            </div>

            <div id="editStatsPanel" class="edit-stats-panel hidden">
                <div class="edit-row">
                    <label>Tier Level:</label>
                    <input type="text" id="editTierLevel" placeholder="e.g. 5">
                </div>
                <hr class="panel-divider">
                <h4 class="form-section-title">Playstyle & Combat Inputs</h4>
                <div class="edit-grid-inputs">
                    <div><label>Playstyle</label><input type="text" id="editPlaystyle" placeholder="e.g. Raider"></div>
                    <div><label>Avg Kill Dist</label><input type="text" id="editAvgDist" placeholder="e.g. 38 m"></div>
                    <div><label>Lifetime</label><input type="text" id="editLifetime" placeholder="e.g. 0h 20min"></div>
                    <div><label>Longest Shot</label><input type="text" id="editLongest" placeholder="e.g. 89 m"></div>
                    <div><label>Fav Weapon</label><select id="editFav1"></select></div>
                    <div><label>2nd Fav Weapon</label><select id="editFav2"></select></div>
                </div>
                <button id="saveStatsBtn" class="save-stats-btn">Save Tactical Update to Firebase</button>
                <button id="clearStatsBtn" style="background:#8b0000; color:#fff; border:1px solid #ff4444; width:100%; padding:10px; border-radius:4px; cursor:pointer; font-weight:bold; margin-top:8px;">🗑️ Clear All Profile Data to Blank</button>
            </div>
        </section>

        <!-- RIGHT PANEL: SKILLS MATRIX -->
        <section class="card-panel skills-panel">
            <div id="skillsCategoryTabs" class="skills-tabs"></div>
            <div id="section-container" class="skills-tree-grid"></div>
        </section>

    </main>

    <script type="module" src="app.js?v=8.0"></script>
</body>
</html>
