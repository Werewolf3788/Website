<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper Elite 5: Master Tracker</title>
    <!-- Linked to correct style.css filename in repo directory -->
    <link rel="stylesheet" href="style.css?v=20260722_2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- TOP GLOBAL DYNAMIC NAVIGATION -->
    <header class="site-header">
        <nav class="nav-container">
            <div id="dynamic-nav-links" class="nav-links">
                <!-- Dynamically populated via tracker.js from Menu.json -->
            </div>
        </nav>
    </header>

    <!-- TRACKER HEADER & OPERATIVE SELECTOR -->
    <main class="main-wrapper">
        <header class="tracker-header">
            <div class="header-titles">
                <h1 class="game-title">SNIPER ELITE 5: MASTER LOG</h1>
                <div class="system-status">ACTIVE OPERATIVE: <span id="hunter-display">WEREWOLF3788</span></div>
            </div>

            <!-- Profile Selector Buttons -->
            <div class="profile-selector">
                <button class="profile-btn active-btn" data-profile="Werewolf3788">Werewolf3788</button>
                <button class="profile-btn" data-profile="Ray">Ray</button>
                <button class="profile-btn" data-profile="TJ">TJ</button>
            </div>
        </header>

        <!-- PROGRESS HUD METRICS -->
        <section class="progress-hud">
            <div class="progress-info">
                <span id="percent-text" class="percent-label">TOTAL CAMPAIGN COLLECTION: 0%</span>
            </div>
            <div class="progress-track">
                <div id="overall-bar" class="progress-fill" style="width: 0%;"></div>
            </div>
        </section>

        <!-- MAIN CHECKLIST CONTAINER -->
        <section id="section-container" class="checklist-container">
            <!-- Dynamically populated via tracker.js -->
        </section>
    </main>

    <!-- LIGHTBOX OVERLAY FOR COLLECTIBLE MEDIA -->
    <div id="lightbox" class="lightbox-modal" onclick="if(event.target === this) this.style.display='none'">
        <span class="lightbox-close" onclick="document.getElementById('lightbox').style.display='none'">&times;</span>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Collectible Detail">
            <div id="lightbox-caption" class="lightbox-caption"></div>
        </div>
    </div>

    <!-- MAIN TRACKER CONTROLLER SCRIPT -->
    <script type="module" src="tracker.js?v=20260722_2"></script>
</body>
</html>
