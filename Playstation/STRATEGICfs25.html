<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>618 CREW | STRATEGIC OPERATIONS DASHBOARD</title>
    <style>
        /* --- CSS: AGRI-TECH GLOSS PROTOCOL --- */
        :root {
            --jet-orange: #FF4500;
            --solid-black: #000000;
            --livid-blue: #00D2FF;
            --bg-base: #0d120d; 
            --card-gradient: linear-gradient(145deg, #182018, #111611);
            --card-border: #232b23;
            --text-main: #e8eee8;
            --accent-green: #4CAF50;
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.05);
        }

        [data-theme="light"] {
            --bg-base: #dcd3c6; 
            --card-gradient: linear-gradient(145deg, #ebe5dc, #d4cbb9);
            --card-border: #bdae93;
            --text-main: #2b2b2b;
        }

        body {
            margin: 0;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            background-image: radial-gradient(circle at top right, rgba(76, 175, 80, 0.08), transparent 50%);
            transition: background-color 0.3s ease;
        }

        .main-container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }

        .outlined-text {
            text-shadow: -1.5px -1.5px 0 var(--solid-black), 1.5px -1.5px 0 var(--solid-black),
                         -1.5px 1.5px 0 var(--solid-black), 1.5px 1.5px 0 var(--solid-black);
            color: #fff;
        }

        .ops-header, .dynamic-section, .farm-column {
            background: var(--card-gradient);
            border: 1px solid var(--card-border);
            box-shadow: var(--glass-shadow);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .ops-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--jet-orange);
        }

        .liquidity-box { display: flex; gap: 40px; }

        .farm-group-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .farm-column {
            flex: 1;
            min-width: 320px;
            border-top: 4px solid var(--accent-green);
        }

        .detail-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--jet-orange);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }

        .detail-card:hover { transform: translateY(-3px); background: rgba(0,0,0,0.3); }
        .jet-orange { color: var(--jet-orange); }

        .footer-bar { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
        .kf-signature { font-size: 36px; font-weight: 900; }
        .k-letter { color: var(--jet-orange); display: inline-block; transform: scaleX(-1); }
        .f-letter { color: var(--solid-black); margin-left: -0.22em; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; border-bottom: 2px solid var(--accent-green); padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid var(--card-border); }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="ops-header">
            <div class="liquidity-box">
                <div>
                    <span class="outlined-text">FARM 01 LIQUIDITY</span>
                    <h2 id="farm-1-money" class="outlined-text jet-orange">$0</h2>
                </div>
                <div>
                    <span class="outlined-text">FARM 02 LIQUIDITY</span>
                    <h2 id="farm-2-money" class="outlined-text" style="color:var(--livid-blue)">$0</h2>
                </div>
            </div>
            <div style="text-align: right;">
                <h1 class="outlined-text">STRATEGIC OPERATIONS</h1>
                <div id="sync-status" style="font-weight: bold; color: #FF4500;">UPLINK: OFFLINE</div>
            </div>
        </header>

        <div style="margin-bottom: 20px;">
            <button onclick="toggleTheme()" style="padding:8px; cursor:pointer; background: #333; color: white; border: 1px solid #555; border-radius: 4px;">Toggle Theme</button>
        </div>

        <main id="dynamic-grid"></main>

        <footer class="footer-bar">
            <div class="kf-signature">
                <span class="k-letter">K</span><span class="f-letter">F</span>
            </div>
            <div class="outlined-text" id="nyt-stamp">618 CREW | STRATEGIC COMMAND</div>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://game-tracker-5b2ef-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('fs25/live_stats/Strategic Ops').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            document.getElementById('farm-1-money').innerText = `$${(data.Server?.money?.farm_1 || 0).toLocaleString()}`;
            document.getElementById('farm-2-money').innerText = `$${(data.Server?.money?.farm_2 || 0).toLocaleString()}`;
            
            const status = document.getElementById('sync-status');
            status.innerText = "UPLINK: ONLINE";
            status.style.color = "#00FF00";

            const grid = document.getElementById('dynamic-grid');
            grid.innerHTML = "";

            if (data.Agronomy && data.Agronomy.length > 0) {
                let agroHtml = `<section class="dynamic-section">
                    <h3 class="outlined-text">COMPREHENSIVE PARCEL REGISTRY</h3>
                    <table>
                        <thead><tr><th>FIELD</th><th>CROP</th><th>NITROGEN</th><th>STATUS</th></tr></thead>
                        <tbody>${data.Agronomy.map(f => `<tr>
                            <td class="jet-orange">#${f.id}</td><td>${f.crop}</td>
                            <td>${f.nitrogen}</td><td style="color:${f.status === 'READY' ? '#00FF00' : '#FFD700'}">${f.status}</td>
                        </tr>`).join('')}</tbody>
                    </table></section>`;
                grid.insertAdjacentHTML('beforeend', agroHtml);
            }

            if (data.Fleet && data.Fleet.length > 0) {
                const grouped = {};
                data.Fleet.forEach(v => {
                    const id = v.farmId || "0";
                    if (!grouped[id]) grouped[id] = [];
                    grouped[id].push(v);
                });

                const names = { "0": "PUBLIC / NPC", "1": "WEREWOLF3788", "2": "ONELIVIDMAN" };
                let fleetHtml = `<section class="dynamic-section"><h3 class="outlined-text">ACTIVE FLEET RECON</h3><div class="farm-group-container">`;

                for (const [id, units] of Object.entries(grouped)) {
                    fleetHtml += `<div class="farm-column">
                        <h4 class="outlined-text" style="border-bottom:1px solid #333; padding-bottom:5px;">FARM 0${id} (${names[id]})</h4>
                        ${units.map(u => `<div class="detail-card">
                            <strong class="outlined-text">${u.type}</strong><br>
                            <span>Fuel: ${u.fuel}% | Wear: ${u.wear}</span><br>
                            <span class="jet-orange">HAULING: ${u.hauling}</span>
                        </div>`).join('')}
                    </div>`;
                }
                fleetHtml += `</div></section>`;
                grid.insertAdjacentHTML('beforeend', fleetHtml);
            }
        });

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }
    </script>
</body>
</html>
