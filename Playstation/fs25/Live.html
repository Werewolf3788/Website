        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

<!-- ================= JAVASCRIPT LOGIC ===================== -->
<!-- ======================================================== -->
<script>
    // --- AUTO NIGHT MODE LOGIC (Master Dev Protocol) ---
    function applyAutoTheme() {
        const hour = new Date().getHours();
        const isNight = (hour >= 18 || hour < 6);
        const savedTheme = localStorage.getItem('site_theme');
        
        if (savedTheme === 'light') document.documentElement.classList.remove('dark');
        else if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        else if (isNight) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
    }
    applyAutoTheme();

    function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('site_theme', isDark ? 'dark' : 'light');
    }

    // --- FIREBASE UPLINK LOGIC ---
    const firebaseConfig = { 
        databaseURL: "https://game-tracker-5b2ef-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function formatNumber(num) {
        let n = parseFloat(num);
        return isNaN(n) ? "0" : n.toLocaleString();
    }

    function getFarmClass(farmId) {
        if (farmId === "1" || farmId === 1) return "f1-text font-black";
        if (farmId === "2" || farmId === 2) return "f2-text font-black";
        return "";
    }

    // Listen directly to the path your Google Apps Script pushes to
    db.ref('fs25/live_stats/Strategic Ops').on('value', (snapshot) => {
        const data = snapshot.val();
        const statusEl = document.getElementById('sync-status');
        const dumpZone = document.getElementById('dynamic-dump-zone');
        
        if (!data) {
            statusEl.innerText = "UPLINK: AWAITING DATA FROM APPS SCRIPT...";
            statusEl.style.color = "#FFD700";
            return;
        }

        statusEl.innerText = `UPLINK: ONLINE [GAS SYNCED @ ${data.Sync || new Date().toLocaleTimeString()}]`;
        statusEl.style.color = "#22c55e"; 
        dumpZone.innerHTML = "";

        // 1. UPDATE LIQUIDITY
        if (data.Server && data.Server.money) {
            const m1 = data.Server.money.farm_1 || 0;
            const m2 = data.Server.money.farm_2 || 0;
            document.getElementById('f1-money').innerText = `$${formatNumber(m1)}`;
            document.getElementById('f2-money').innerText = `$${formatNumber(m2)}`;
        }

        // 2. BUILD FLEET TABLE (Consuming your Apps Script payload)
        if (data.Fleet && Array.isArray(data.Fleet)) {
            let fleetHtml = `<div class="glass border-l-4 border-white/20"><span class="ts">FLEET TRACKER</span><h3>Asset Telemetry & Diagnostics</h3><table><thead><tr><th>Unit Identity</th><th>Farm Assignment</th><th>Fuel Level</th><th>Wear / Damage</th><th>Payload Status</th><th>Attached Implements</th></tr></thead><tbody>`;
            
            data.Fleet.forEach(veh => {
                if (veh.farmId === "0") return; // Skip NPCs

                const farmId = String(veh.farmId);
                const cssClass = getFarmClass(farmId);
                const ownerLabel = farmId === "1" ? "WEREWOLF" : (farmId === "2" ? "RAY" : `FARM ${farmId}`);

                // Visual Formatting
                let wearVal = parseFloat(veh.wear);
                let wearHtml = `<span class="text-green-500 font-bold opacity-50">Pristine</span>`;
                if (!isNaN(wearVal)) {
                    if (wearVal > 10.0) wearHtml = `<span class="critical-badge">${wearVal.toFixed(1)}% DMG</span>`;
                    else if (wearVal > 0.0) wearHtml = `<span class="text-orange-400">${wearVal.toFixed(1)}% Wear</span>`;
                }

                let haulingHtml = veh.hauling === "EMPTY" || !veh.hauling ? `<span class="opacity-50">Empty</span>` : `<span class="text-blue-400 font-bold">${veh.hauling}</span>`;
                
                let attachHtml = `<span class="opacity-30">None</span>`;
                if (veh.attachmentCount && parseInt(veh.attachmentCount) > 0) {
                    attachHtml = `<span class="text-yellow-400 font-bold uppercase">${veh.attachmentCount} Mounted</span>`;
                }

                let fuelHtml = `<span class="mono">${veh.fuel}%</span>`;
                if (parseFloat(veh.fuel) < 15) fuelHtml = `<span class="text-red-500 font-bold mono animate-pulse">${veh.fuel}% (LOW)</span>`;

                fleetHtml += `<tr class="${cssClass}">
                    <td><span class="font-bold text-md">${veh.type}</span></td>
                    <td><span class="${farmId==="1"?'f1-bg':(farmId==="2"?'f2-bg':'bg-slate-700')} text-black px-2 py-1 rounded font-black text-[10px]">${ownerLabel}</span></td>
                    <td>${fuelHtml}</td>
                    <td>${wearHtml}</td>
                    <td>${haulingHtml}</td>
                    <td>${attachHtml}</td>
                </tr>`;
            });
            fleetHtml += `</tbody></table></div>`;
            dumpZone.insertAdjacentHTML('beforeend', fleetHtml);
        }
    });
</script>
