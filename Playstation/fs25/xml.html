<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>618 ADMIN | TOTAL RECON UPLINK v2.2</title>
    <style>
        :root { --jet-orange: #FF4500; --solid-black: #000000; --livid-blue: #00D2FF; --bg-base: #0d120d; --card-gradient: linear-gradient(145deg, #182018, #111611); --text-main: #e8eee8; }
        body { margin: 0; background-color: var(--bg-base); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px 20px; }
        .main-container { max-width: 1000px; margin: 0 auto; }
        .override-panel { background: var(--card-gradient); border-radius: 12px; padding: 30px; display: flex; flex-direction: column; gap: 20px; border: 1px solid #333; }
        textarea { background: rgba(0,0,0,0.5); border: 1px solid #333; color: var(--livid-blue); padding: 15px; border-radius: 6px; font-family: monospace; height: 400px; }
        .action-btn { background: var(--jet-orange); color: white; padding: 15px; border: none; cursor: pointer; font-weight: bold; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>MANUAL G-PORTAL UPLINK v2.2</h1>
        <section class="override-panel">
            <label>TARGET DATASET (Full Directory Coverage):</label>
            <select id="xml-file-type">
                <!-- Core Save Files -->
                <option value="vehicles">vehicles.xml</option>
                <option value="economy">economy.xml</option>
                <option value="careerSavegame">careerSavegame.xml</option>
                <option value="farms">farms.xml</option>
                <option value="placeables">placeables.xml</option>
                <option value="missions">missions.xml</option>
                <option value="animals">animals.xml</option>
                <option value="farmland">farmland.xml</option>
                <option value="precisionFarming">precisionFarming.xml</option>
                <option value="collectibles">collectibles.xml</option>
                <!-- Additional Files identified from Directory -->
                <option value="cultivator">cultivator.xml</option>
                <option value="items">items.xml</option>
                <option value="pedestrians">pedestrians.xml</option>
                <option value="silo">silo.xml</option>
                <option value="trafficSystem">trafficSystem.xml</option>
                <option value="vehicleTypes">vehicleTypes.xml</option>
            </select>
            <textarea id="manual-xml-input" placeholder="Paste raw XML here..."></textarea>
            <button class="action-btn" onclick="executeAdvancedSync()">EXECUTE DEEP SYNC</button>
            <div id="upload-status">READY</div>
        </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_O_Qm3bazJpi6wPqafsKLNNJdIUCvQGM",
            authDomain: "game-tracker-5b2ef.firebaseapp.com",
            databaseURL: "https://game-tracker-5b2ef-default-rtdb.firebaseio.com",
            projectId: "game-tracker-5b2ef",
            storageBucket: "game-tracker-5b2ef.firebasestorage.app",
            messagingSenderId: "555667047127",
            appId: "1:555667047127:web:af6f468ca3cf06759aa692"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function xmlToJson(node) {
            let obj = {};
            if (node.nodeType === 1) {
                if (node.attributes.length > 0) {
                    for (let j = 0; j < node.attributes.length; j++) {
                        let attribute = node.attributes.item(j);
                        obj["@" + attribute.nodeName] = attribute.nodeValue;
                    }
                }
            } else if (node.nodeType === 3) {
                obj = node.nodeValue;
            }
            if (node.hasChildNodes()) {
                for (let i = 0; i < node.childNodes.length; i++) {
                    let item = node.childNodes.item(i);
                    let nodeName = item.nodeName;
                    if (typeof (obj[nodeName]) === "undefined") {
                        obj[nodeName] = xmlToJson(item);
                    } else {
                        if (typeof (obj[nodeName].push) === "undefined") {
                            let old = obj[nodeName];
                            obj[nodeName] = [];
                            obj[nodeName].push(old);
                        }
                        obj[nodeName].push(xmlToJson(item));
                    }
                }
            }
            return obj;
        }

        async function executeAdvancedSync() {
            const xmlInput = document.getElementById('manual-xml-input').value;
            const fileType = document.getElementById('xml-file-type').value;
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlInput, "text/xml");
            
            const jsonData = xmlToJson(xmlDoc.documentElement);
            
            const path = `fs25/live_stats/Strategic Ops/${fileType}`;
            try {
                await db.ref(path).set(jsonData);
                document.getElementById('upload-status').innerText = "✅ SYNCED: " + fileType;
            } catch (e) {
                document.getElementById('upload-status').innerText = "❌ ERROR: " + e.message;
            }
        }
    </script>
</body>
</html>
