<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){var p=location.pathname.replace(/[^\/]*$/,'');document.write('<base href="'+p+'">');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Neighborly Acre</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#0b1220;color:#e2e8f0;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hud{position:fixed;z-index:5}
  #top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-size:.85rem;background:linear-gradient(#0009,#0000);text-shadow:0 1px 3px #000}
  #top a,#top button{color:#e2e8f0;text-decoration:none;background:none;border:0;font:inherit;padding:0;cursor:pointer}
  #toast{top:46px;left:0;right:0;text-align:center;color:#fde68a;font-size:.9rem;text-shadow:0 1px 3px #000;pointer-events:none;min-height:1.3em;padding:0 12px}
  #prompt{bottom:128px;left:0;right:0;text-align:center;pointer-events:none}
  #prompt span{background:#000a;color:#fff;padding:6px 12px;border-radius:999px;font-size:.9rem;display:inline-block}
  #bar{bottom:0;left:0;right:0;display:flex;gap:6px;padding:8px;justify-content:center;flex-wrap:wrap;background:linear-gradient(#0000,#000a)}
  #bar button{background:#1e293bcc;color:#e2e8f0;border:2px solid transparent;border-radius:12px;padding:9px 11px;font:inherit;font-size:.85rem;cursor:pointer}
  #bar button.sel{border-color:#22c55e;background:#14532dcc}
  #joy{left:18px;bottom:96px;width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;touch-action:none;display:none}
  #knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff88}
  #useBtn{right:18px;bottom:104px;width:96px;height:96px;border-radius:50%;border:0;background:#22c55ecc;color:#04210f;font-weight:800;font-size:1rem;display:none;touch-action:none}
  body.touch #joy,body.touch #useBtn{display:block} body.touch #useBtn{display:block}
  #shop{inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:20}
  #shop .box{background:#1e293b;border-radius:16px;padding:16px;width:min(92vw,380px)}
  #shop h2{margin:0 0 8px} #shop .item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #334155}
  #shop button{background:#22c55e;color:#04210f;font-weight:700;border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer} #shop button:disabled{opacity:.4}
  #shop button.close{background:#334155;color:#e2e8f0;margin-top:10px;width:100%}
  #gate{position:fixed;inset:0;z-index:30;background:#0f172a;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px}
  #gate button{background:#22c55e;color:#04210f;font-weight:700;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="hud">
  <span>🌾 <b id="roomLabel">Neighborly Acre</b> · 👥 <b id="count">1</b> · ☀️ <span id="clock">--:--</span></span>
  <span>🪙 <b id="coins">0</b></span>
  <span><button id="shareBtn">Invite</button> · <a href="index.html">Hub</a></span>
</div>
<div id="toast" class="hud"></div>
<div id="prompt" class="hud"></div>
<div id="joy" class="hud"><div id="knob"></div></div>
<button id="useBtn" class="hud">Use</button>
<div id="bar" class="hud"></div>
<div id="shop" class="hud"><div class="box"><h2>🏪 Barn Shop</h2><div id="shopItems"></div><button class="close" id="shopClose">Close</button></div></div>
<div id="gate"><div id="gateText">Sign in to play</div><button id="gateBtn" style="display:none">Sign in with Google</button><button id="soloBtn" style="background:#334155;color:#e2e8f0">Play solo instead</button></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>document.write('<script src="js/common.js"><\/script>');</script>
<script>document.write('<script type="module" src="js/farm3d.js"><\/script>');</script>
</body>
</html>
