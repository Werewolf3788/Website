services:
  - type: web
    name: ww-stream-sync
    runtime: node
    plan: free
    rootDir: Claude-Test/stream-sync
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - Claude-Test/stream-sync/**
    envVars:
      - key: PUBLIC_URL
        value: https://ww-stream-sync.onrender.com
      - key: STREAM_SYNC_APP_OWNER_KEY
        value: raykevin71888_at_gmail_com
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: STATE_SECRET
        generateValue: true
