services:
  - type: web
    name: ww-discord-auth
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_URL
        value: https://ww-discord-auth.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://werewolf3788.github.io
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: STATE_SECRET
        generateValue: true
