<!DOCTYPE html>
<!-- ============================================================================
 * Music Releases  -  /Claude-Test/music.html
 * Every album / single from Firebase RTDB /music_releases (entertainment-71888),
 * the same feed the home-page badge uses.
 *   - "Next release" hero with a live countdown (soonest upcoming date)
 *   - Upcoming: every future release, each with its own countdown
 *   - Out now: everything already released (or with no date set)
 * The home-page badge now only appears while a countdown is running and links here.
 * ========================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17121F">
<title>Music Releases | Werewolf</title>
<script src="//cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/ww-shell.css">
<style id="ww-reserve">@media (min-width:768px) and (pointer:fine){[data-ww-nav-slot]:empty{min-height:44px}}</style>
<script defer src="../assets/ww-shell.js"></script>
<style>
  @import url('//fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');
  :root{
    --bg:#17121F; --panel:rgba(38,31,51,.72); --line:rgba(244,201,93,.18);
    --text:#F3EDE2; --mute:#a9a0b8; --gold:#F4C95D; --accent:#FF5500; --ok:#34d399;
  }
  html:root{ --ww-bg:#17121F; --ww-bg-2:#261F33; --ww-accent:#F4C95D; --ww-border:rgba(244,201,93,.18); }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(255,85,0,.14),transparent 60%),var(--bg);
       color:var(--text);font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;
       padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .wrap{width:calc(100% - 1.5rem);margin:0 auto}
  @media(min-width:1024px){.wrap{width:80vw;max-width:1850px}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:1.25rem;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .eyebrow{font:800 11px/1 Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .mono{font-family:'JetBrains Mono',monospace}
  .mute{color:var(--mute)}

  /* Hero */
  .hero{display:grid;gap:1.25rem;padding:1.25rem;
        background:linear-gradient(135deg,rgba(244,201,93,.14),rgba(255,85,0,.12) 55%,rgba(23,18,31,.92));
        border:1px solid rgba(255,85,0,.45);box-shadow:0 0 30px rgba(255,85,0,.18)}
  @media(min-width:768px){.hero{grid-template-columns:240px 1fr;align-items:center;padding:1.75rem}}
  .hero img{width:100%;max-width:280px;aspect-ratio:1;object-fit:cover;border-radius:1rem;margin:0 auto;
            border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 30px rgba(0,0,0,.55)}
  .cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;max-width:520px}
  .cd div{background:rgba(12,10,20,.7);border:1px solid rgba(255,255,255,.1);border-radius:.9rem;padding:.7rem .3rem;text-align:center}
  .cd b{display:block;font:700 clamp(1.4rem,4vw,2.3rem)/1 'JetBrains Mono',monospace;color:var(--ok)}
  .cd span{font:800 10px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

  /* Grids: multi-column on desktop, stacked on phones */
  .grid{display:grid;gap:1rem;grid-template-columns:1fr}
  @media(min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(min-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(min-width:1440px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .rel{display:flex;gap:.9rem;align-items:center;padding:.8rem;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
  .rel:hover{border-color:var(--accent);transform:translateY(-2px)}
  .rel img{width:72px;height:72px;flex:none;border-radius:.75rem;object-fit:cover;border:1px solid rgba(255,255,255,.15)}
  .rel h3{margin:0;font-size:.95rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .55rem;border-radius:999px;font:800 10px/1.6 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .pill.up{color:var(--ok);border:1px solid rgba(52,211,153,.45)}
  .pill.out{color:var(--accent);border:1px solid rgba(255,85,0,.45)}
  .btn{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:.55rem 1.1rem;border-radius:999px;
       background:var(--accent);color:#fff;font-weight:900;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none}
  .btn:hover{filter:brightness(1.1)}
  h2.sec{margin:0 0 .9rem;font-size:.85rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.6rem}
  h2.sec small{color:var(--mute);font-weight:700;letter-spacing:.05em}
</style>
</head>
<body>
  <div data-ww-nav-slot></div>

  <main class="wrap" style="padding-top:1.5rem">
    <header class="flex items-end justify-between gap-4 flex-wrap mb-5">
      <div>
        <div class="eyebrow">Werewolf Music</div>
        <h1 class="text-3xl md:text-4xl font-black mt-2">Releases</h1>
      </div>
      <a href="../index.html" class="mute text-sm font-bold hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i>Home</a>
    </header>

    <div id="status" class="card p-6 text-center mute">Loading releases…</div>

    <!-- Next release countdown -->
    <section id="hero-wrap" class="hidden mb-8">
      <div class="card hero">
        <img id="hero-img" src="" alt="">
        <div class="min-w-0">
          <div class="eyebrow" style="color:var(--accent)">New release countdown</div>
          <h2 id="hero-title" class="text-2xl md:text-4xl font-black mt-2 mb-1 break-words"></h2>
          <p id="hero-date" class="mute text-sm mb-4"></p>
          <div class="cd mb-5" aria-live="polite">
            <div><b id="cd-d">0</b><span>Days</span></div>
            <div><b id="cd-h">0</b><span>Hours</span></div>
            <div><b id="cd-m">0</b><span>Min</span></div>
            <div><b id="cd-s">0</b><span>Sec</span></div>
          </div>
          <a id="hero-link" class="btn" href="#" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-bell"></i>Pre-save / Details</a>
        </div>
      </div>
    </section>

    <section id="up-wrap" class="hidden mb-8">
      <h2 class="sec"><i class="fa-solid fa-hourglass-half"></i>Upcoming <small id="up-count"></small></h2>
      <div id="up-grid" class="grid"></div>
    </section>

    <section id="out-wrap" class="hidden mb-8">
      <h2 class="sec"><i class="fa-solid fa-compact-disc"></i>Out now <small id="out-count"></small></h2>
      <div id="out-grid" class="grid"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "//www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "//www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Public web config for entertainment-71888 (same one index.html uses)
    const app = initializeApp({
      apiKey: "AIzaSyDeuNBGHcwU4rFyOcsfGxLHjmEdpADacmc",
      authDomain: "entertainment-71888.firebaseapp.com",
      databaseURL: "https://entertainment-71888-default-rtdb.firebaseio.com",
      projectId: "entertainment-71888",
      storageBucket: "entertainment-71888.firebasestorage.app",
      messagingSenderId: "660524340277",
      appId: "1:660524340277:web:ef8f4ed04fa985a4f88d7c"
    }, "musicPage");
    const db = getDatabase(app);

    const PLACEHOLDER = '//placehold.co/200x200/261F33/ff5500?text=MUSIC';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // Same date rules as the home badge: YYYY-MM-DD = local midnight on that day
    function parseDittoDate(raw) {
      if (!raw) return NaN;
      const str = String(raw).trim();
      if (!str || str.toUpperCase() === 'N/A') return NaN;
      const m = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]).getTime();
      return Date.parse(str);
    }
    function fixUrl(u, fallback) {
      if (!u) return fallback;
      u = String(u).trim();
      if (!u || u === '#') return fallback;
      return (/^(https?:)?\/\//i.test(u)) ? u : '//' + u.replace(/^\/+/, '');
    }
    const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { weekday:'short', month:'long', day:'numeric', year:'numeric' });

    function split(diff) {
      return {
        d: Math.floor(diff / 864e5),
        h: Math.floor(diff % 864e5 / 36e5),
        m: Math.floor(diff % 36e5 / 6e4),
        s: Math.floor(diff % 6e4 / 1e3)
      };
    }

    let releases = [];

    function card(r, upcoming) {
      const sub = isNaN(r.date) ? 'Streaming now' : (upcoming ? fmtDate(r.date) : 'Released ' + fmtDate(r.date));
      return `
        <a class="card rel" href="${esc(r.url)}" ${r.url === '#' ? '' : 'target="_blank" rel="noopener noreferrer"'}>
          <img src="${esc(r.image)}" alt="" loading="lazy" onerror="this.src='${PLACEHOLDER}'">
          <div class="min-w-0 flex-1">
            <span class="pill ${upcoming ? 'up' : 'out'}">${upcoming ? '<i class="fa-solid fa-clock"></i>Upcoming' : '<i class="fa-solid fa-play"></i>Out now'}</span>
            <h3 class="mt-1">${esc(r.name)}</h3>
            <div class="mute text-xs mt-0.5">${esc(sub)}</div>
            ${upcoming ? `<div class="mono text-xs font-bold mt-1" style="color:var(--ok)" data-cd="${r.date}"></div>` : ''}
          </div>
        </a>`;
    }

    function render() {
      const now = Date.now();
      const up  = releases.filter(r => !isNaN(r.date) && r.date > now).sort((a, b) => a.date - b.date);
      const out = releases.filter(r => isNaN(r.date) || r.date <= now)
                          .sort((a, b) => (isNaN(b.date) ? -Infinity : b.date) - (isNaN(a.date) ? -Infinity : a.date));

      $('status').classList.toggle('hidden', releases.length > 0);
      if (!releases.length) $('status').textContent = 'No releases yet.';

      // Hero = the soonest upcoming release
      const next = up[0];
      $('hero-wrap').classList.toggle('hidden', !next);
      if (next) {
        $('hero-img').src = next.image;
        $('hero-img').onerror = function () { this.src = PLACEHOLDER; };
        $('hero-title').textContent = next.name;
        $('hero-date').textContent = 'Drops ' + fmtDate(next.date);
        $('hero-link').href = next.url;
        $('hero-link').classList.toggle('hidden', next.url === '#');
        $('hero-wrap').dataset.target = next.date;
      }

      $('up-wrap').classList.toggle('hidden', !up.length);
      $('up-count').textContent = up.length ? `(${up.length})` : '';
      $('up-grid').innerHTML = up.map(r => card(r, true)).join('');

      $('out-wrap').classList.toggle('hidden', !out.length);
      $('out-count').textContent = out.length ? `(${out.length})` : '';
      $('out-grid').innerHTML = out.map(r => card(r, false)).join('');

      tick();
    }

    function tick() {
      const now = Date.now();
      let expired = false;

      const target = +$('hero-wrap').dataset.target;
      if (target && !$('hero-wrap').classList.contains('hidden')) {
        const diff = target - now;
        if (diff <= 0) expired = true;
        else {
          const t = split(diff);
          $('cd-d').textContent = t.d;
          $('cd-h').textContent = String(t.h).padStart(2, '0');
          $('cd-m').textContent = String(t.m).padStart(2, '0');
          $('cd-s').textContent = String(t.s).padStart(2, '0');
        }
      }
      document.querySelectorAll('[data-cd]').forEach(el => {
        const diff = +el.dataset.cd - now;
        if (diff <= 0) { expired = true; return; }
        const t = split(diff);
        el.textContent = `${t.d}d ${t.h}h ${t.m}m ${t.s}s`;
      });

      // Something just dropped: move it from Upcoming to Out now
      if (expired) render();
    }
    setInterval(tick, 1000);

    onValue(ref(db, 'music_releases'), (snap) => {
      const data = snap.val() || {};
      releases = Object.keys(data).map(key => {
        const it = data[key];
        if (!it) return null;
        return {
          name: it.name || it.title || key.replace(/_/g, ' '),
          url: fixUrl(it.url || it.link, '#'),
          date: parseDittoDate(it.date),
          image: fixUrl(it.image || it.img || it.icon, PLACEHOLDER)
        };
      }).filter(Boolean);
      render();
    }, (err) => {
      console.error('music_releases read failed:', err);
      $('status').textContent = 'Could not load releases right now.';
    });
  </script>
</body>
</html>
