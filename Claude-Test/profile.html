<!DOCTYPE html>
<!-- ============================================================================
 * Social Profile  -  /Claude-Test/profile.html
 * Shows the SIGNED-IN user's own profile.  ?u=<username | friend code | emailKey>
 * opens a friend's profile instead.  Nothing here is tied to one person.
 *
 * Needs:  ww-social.js (same folder)  -  shared sign-in + site-wide messenger
 *
 * Privacy reuses Settings (psn/xbox/steam scopes, tracking_scope, close friends);
 * trophy lists + online status get their own Everyone/Friends/Close friends/Only me setting.
 * ========================================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070709">

<script src="//cdn.tailwindcss.com"></script>

<style id="ww-reserve">@media (min-width:768px) and (pointer:fine){[data-ww-nav-slot]:empty{min-height:44px}}</style>

<style>
  @import url('//fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');
  :root{
    --bg:#070709; --panel:rgba(22,22,30,.74); --panel-solid:#16161e; --line:rgba(255,255,255,.12);
    --text:#e8ecf3; --mute:#9aa4b2; --accent:#ff5f1f; --ok:#10b981; --warn:#f59e0b;
    --ps:#3b82f6; --xb:#22c55e; --st:#66c0f4; --dim:.55; --bg-img:none;
  }
  @media (prefers-color-scheme: light){
    body:not(.has-bg){ --bg:#eef1f6; --panel:rgba(255,255,255,.82); --panel-solid:#fff; --line:rgba(0,0,0,.1); --text:#12151c; --mute:#566070; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;
       padding-bottom:calc(90px + env(safe-area-inset-bottom));overflow-x:hidden}
  .bg-layer{position:fixed;inset:0;z-index:-2;background:var(--bg-img) center/cover no-repeat;}
  .bg-dim{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,var(--dim));display:none}
  body.has-bg .bg-dim{display:block}
  .wrap{width:calc(100% - 1.5rem);margin:0 auto}
  @media(min-width:1024px){.wrap{width:80%;max-width:1850px}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:1.25rem;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  h1,h2,h3{margin:0;font-weight:900}
  .h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:900;display:flex;align-items:center;gap:.5rem}
  .mute{color:var(--mute)}
  .mono{font-family:'JetBrains Mono',monospace}
  button,select,input,textarea{font:inherit;color:inherit}
  .btn{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:.55rem 1rem;border-radius:.8rem;border:1px solid var(--line);background:rgba(127,127,127,.14);font-weight:800;font-size:.8rem;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:#ef4444}
  .chip{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .65rem;border-radius:999px;border:1px solid var(--line);background:rgba(127,127,127,.14);font-size:.72rem;font-weight:800;text-transform:uppercase}
  .chip.live{color:var(--ok);border-color:rgba(16,185,129,.5)}
  .tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.25rem 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;min-height:44px;padding:.5rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:900;font-size:.78rem;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:.5rem}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .stat{padding:1rem;text-align:center}
  .stat .v{font-size:1.7rem;font-weight:900}
  .stat .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:800}
  .bar{height:8px;border-radius:99px;background:rgba(127,127,127,.25);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ef4444,#f59e0b,#84cc16,#10b981);background-size:400% 100%}
  .games{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
  @media(min-width:640px){.games{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1024px){.games{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:1400px){.games{grid-template-columns:repeat(6,1fr)}}
  .game{position:relative;aspect-ratio:2/3;border-radius:1rem;overflow:hidden;background:#1a1a22;border:1px solid var(--line);cursor:pointer;transition:transform .2s}
  .game:hover{transform:translateY(-3px);border-color:var(--accent)}
  .game img{width:100%;height:100%;object-fit:cover;display:block}
  .game .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.2) 55%,transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:.65rem;color:#fff;gap:.25rem}
  .game .ttl{font-weight:900;font-size:.78rem;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pf{position:absolute;top:.5rem;left:.5rem;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff}
  .pf.psn{background:var(--ps)}.pf.xbox{background:var(--xb)}.pf.steam{background:#1b2838}
  .st{position:absolute;top:.5rem;right:.5rem;padding:.1rem .5rem;border-radius:99px;font-size:.62rem;font-weight:900;text-transform:uppercase;background:rgba(0,0,0,.7);color:#fff}
  .st.live{background:var(--ok)}.st.done{background:#a855f7}.st.prog{background:var(--warn);color:#000}
  .row{display:flex;align-items:center;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
  .row img{width:48px;height:48px;border-radius:.6rem;object-fit:cover;flex:none}
  .avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--accent);background:#1e1e24;flex:none}
  @media(min-width:768px){.avatar{width:160px;height:160px}}
  /* modal + drawer */
  .modal{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(10px)}
  .modal.open{display:flex}
  .modal .box{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:1.25rem}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:5001;background:var(--panel-solid);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:calc(1rem + env(safe-area-inset-top)) 1rem calc(6rem + env(safe-area-inset-bottom))}
  .drawer.open{transform:none}
  .fld{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.9rem}
  .fld label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--mute)}
  .fld input[type=text],.fld input[type=url],.fld textarea,.fld select{background:rgba(127,127,127,.14);border:1px solid var(--line);border-radius:.7rem;padding:.65rem .8rem;font-size:16px;width:100%}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent)}
  .priv{display:grid;grid-template-columns:1fr 150px;gap:.5rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.85rem;font-weight:700}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel-solid);border:1px solid var(--accent);padding:.7rem 1.2rem;border-radius:999px;font-weight:800;z-index:6000;font-size:.85rem}
  .sticky-save{position:sticky;bottom:0;padding-top:.75rem;background:linear-gradient(to top,var(--panel-solid) 70%,transparent)}
  [hidden]{display:none!important}
  .nowrap-trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body class="">
<div class="bg-layer" id="bg-layer"></div><div class="bg-dim" id="bg-dim"></div>

<!-- top bar -->
<header class="wrap" style="padding-top:calc(.75rem + env(safe-area-inset-top))">

  <div class="box"><div id="modal-body"></div></div>

<script>
(async function () {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const W = window.WW;
const esc = (s) => W.esc(s);

const LEVELS = [['public','Everyone'],['friends','Friends'],['close','Close friends'],['private','Only me']];
const LV_RANK = { public:0, friends:1, close:2, private:3 };
const REL_LABEL = ['Public view','Friend view','Close-friend view'];
const PLATS = { psn:{name:'PlayStation',icon:'fab fa-playstation'}, xbox:{name:'Xbox',icon:'fab fa-xbox'}, steam:{name:'Steam',icon:'fab fa-steam'} };
const RAY_DB = 'https://playstation-stats-default-rtdb.firebaseio.com';   // Xbox sync output lives here (Xbox/xbox.js)
// Game Companion saves: Firestore  user/{key}/platform/{ps|xbox|steam|pc}/game/{gameName}
const TRACK_PLATS = { ps:'psn', xbox:'xbox', steam:'steam', pc:'steam' };

const S = { ownerKey:null, isOwner:false, rel:0, viewAs:null, U:{}, profile:{}, media:{}, plat:{}, psnRaw:null,
            tab:'all', tracking:null, presence:null, myFriends:{}, edit:null };

/* ---------- helpers ---------- */
const DB = () => W.config.firebase.databaseURL.replace(/\/$/, '');
const arr = (d) => !d ? [] : Array.isArray(d) ? d.filter(Boolean) : typeof d === 'object' ? Object.values(d) : [];
const secure = (u) => (typeof u === 'string' ? u.trim().replace(/^http:\/\//i, 'https://') : '');
const num = (n, d = 0) => { n = Number(n); return isNaN(n) ? d : n; };
function ago(ts) {
  const t = typeof ts === 'number' ? ts : new Date(ts).getTime(); if (!t || isNaN(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 2592000) return Math.floor(s / 86400) + 'd ago';
  return Math.floor(s / 2592000) + 'mo ago';
}
const fmtDate = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' }); };
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const ph = (w, h, t) => `//via.placeholder.com/${w}x${h}/1e1e24/ff5f1f?text=${encodeURIComponent(t || '')}`;

/* ---------- privacy ----------
 * PlayStation / Xbox / Steam / Game tracking use the settings you already have in Settings
 * (psn_username_scope, xbox_gamertag_scope, steam_id_scope, tracking_scope).
 * Trophy lists & online status are new and live in profiles/{key}/privacy. */
const viewRank = () => S.isOwner ? (S.viewAs === null ? 3 : S.viewAs) : S.rel;
const SCOPE_FIELD = { psn:'psn_username_scope', xbox:'xbox_gamertag_scope', steam:'steam_id_scope', tracking:'tracking_scope' };
const levelOf = (sec) => SCOPE_FIELD[sec]
  ? (S.U[SCOPE_FIELD[sec]] || (sec === 'tracking' ? 'friends' : 'private'))
  : ((S.profile.privacy || {})[sec] || 'friends');
const canSee = (sec) => viewRank() >= (LV_RANK[levelOf(sec)] ?? 3);
const platId = (p) => String(S.U[{ psn:'psn_username', xbox:'xbox_gamertag', steam:'steam_id' }[p]] || '').trim();
const visiblePlats = () => Object.keys(PLATS).filter(p => platId(p) && canSee(p) && S.plat[p]);
const displayName = () => S.profile.displayName || S.U.username || S.U.display_name || 'Player';
const avatarOf = () => S.U.avatar_url || '';

/* ---------- boot ---------- */
async function boot() {
  try { await W.ready; } catch (e) { return fail('Could not start Firebase. Reload and try again.'); }
  if (!W.me) return signInView();
  const q = new URLSearchParams(location.search).get('u');
  S.ownerKey = q ? await resolveUser(q) : W.me.key;
  if (!S.ownerKey) return fail('That profile could not be found.');
  S.isOwner = S.ownerKey === W.me.key;
  await loadProfile();
  if (!Object.keys(S.U).length) return fail('That profile could not be found.');
  await loadPlatforms();
  document.title = displayName() + ' | Pack Hub';
  setTabIcon(avatarOf() || (S.isOwner && W.me.photoURL) || Object.values(S.plat).map(x => x && x.avatar).find(Boolean) || '');
  $('#state-msg').hidden = true; $('#profile-root').hidden = false;
  if (S.profile.defaultTab) S.tab = S.profile.defaultTab;
  render();
  watchPresence();
}

/* browser-tab icon = this profile's avatar (round); falls back to the plain image if the host blocks canvas use */
function setTabIcon(url) {
  if (!url) return;
  const apply = (href) => {
    document.querySelectorAll('link[rel~="icon"],link[rel="shortcut icon"]').forEach(l => l.remove());
    const l = document.createElement('link'); l.rel = 'icon'; l.href = href; document.head.appendChild(l);
  };
  const img = new Image(); img.crossOrigin = 'anonymous'; img.referrerPolicy = 'no-referrer';
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
      x.beginPath(); x.arc(32, 32, 32, 0, Math.PI * 2); x.clip();
      const m = Math.min(img.naturalWidth, img.naturalHeight);
      x.drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, 64, 64);
      apply(c.toDataURL('image/png'));
    } catch (e) { apply(url); }
  };
  img.onerror = () => apply(url);
  img.src = url;
}

function fail(html) { $('#state-msg').innerHTML = html; }
function signInView() {
  $('#state-msg').innerHTML = `<div class="h2" style="justify-content:center;margin-bottom:.75rem"><i class="fas fa-user-lock"></i> Sign in to see your profile</div>
    <button class="btn primary" id="signin-btn"><i class="fab fa-google"></i> Sign in with Google</button>
    ${W.config.discordAuthUrl ? '<button class="btn" id="signin-discord" style="margin-left:.5rem"><i class="fab fa-discord"></i> Sign in with Discord</button>' : ''}
    <div class="mute" style="margin-top:.8rem;font-size:.8rem">Other sign-in methods are in the menu at the top.</div>`;
  const dc = $('#signin-discord'); if (dc) dc.onclick = () => W.signInDiscord();
  $('#signin-btn').onclick = async () => {
    if (W.config.loginUrl) { location.href = W.config.loginUrl + (W.config.loginUrl.includes('?') ? '&' : '?') + 'next=' + encodeURIComponent(location.href); return; }
    try { await W.auth.signInWithPopup(new W.firebase.auth.GoogleAuthProvider()); location.reload(); }
    catch (e) { toast('Sign-in failed: ' + (e.code || e.message)); }
  };
}

// ?u= accepts a friend code or an account key
async function resolveUser(t) {
  t = String(t).trim();
  if (/_at_/.test(t)) return t.toLowerCase();
  return await W.ownerKeyOfCode(t);
}

/* ---------- load profile, relation, media ---------- */
async function loadProfile() {
  const key = S.ownerKey, db = W.db;
  const [uSnap, pSnap, mSnap, meSnap] = await Promise.all([
    db.ref('users/' + key).once('value').catch(() => null),
    db.ref('profiles/' + key).once('value').catch(() => null),
    db.ref('profileMedia/' + key).once('value').catch(() => null),
    S.isOwner ? null : db.ref('users/' + W.me.key + '/friends').once('value').catch(() => null)
  ]);
  S.U = (uSnap && uSnap.val()) || {};
  S.profile = (pSnap && pSnap.val()) || {};
  S.media = (mSnap && mSnap.val()) || {};
  S.myFriends = S.isOwner ? (S.U.friends || {}) : ((meSnap && meSnap.val()) || {});
  if (!S.isOwner) {
    // relation comes from the owner's own friends list (Settings): friend entry, plus the close_friend tick
    const mine = W.me.friendCode, f = mine && S.U.friends && S.U.friends[mine];
    S.rel = f ? (f.close_friend === true ? 2 : 1) : 0;
  }
  applyTheme();
  if (canSee('tracking')) loadTracking(); else S.tracking = null;
}

function applyTheme() {
  const p = S.profile, b = document.body;
  b.style.setProperty('--accent', p.accent || S.U.primary_color || '#ff5f1f');
  b.style.setProperty('--dim', String(p.bgDim != null ? p.bgDim : .55));
  const bg = S.media.bg || '';
  const ok = /^(data:image\/|https:\/\/)/.test(bg);
  $('#bg-layer').style.setProperty('--bg-img', ok ? `url("${bg.replace(/"/g, '%22')}")` : 'none');
  b.classList.toggle('has-bg', ok);
}

/* ---------- platform loaders ---------- */
async function loadPlatforms() {
  S.plat = {}; S.psnRaw = null;
  const fns = { psn: loadPsn, xbox: loadXbox, steam: loadSteam };
  await Promise.all(Object.keys(PLATS).map(async (p) => {
    const id = platId(p); if (!id) return;
    if (!S.isOwner && !canSee(p)) return;                // never even fetch what the viewer may not see
    let d = null;
    try { d = await fns[p](id); } catch (e) { console.warn('[profile]', p, e); }
    // keep the platform visible even with no synced data, so it never silently disappears
    S.plat[p] = d || { platform:p, name:id, avatar:'', online:false, currentGame:'', activity:'', stats:[['Status','No data yet']], games:[], recent:[], empty:true };
  }));
}

async function loadPsn(tag) {
  let u = null;
  let src = DB();
  outer: for (const base of [...new Set([DB(), RAY_DB])]) for (const t of [...new Set([tag, tag.toLowerCase()])]) {
    try { const r = await fetch(`${base}/psn/gamertags/${encodeURIComponent(t)}.json?t=${Date.now()}`);
      if (r.ok) { u = await r.json(); if (u) { src = base; break outer; } } } catch (e) {}
  }
  if (!u) return null;
  S.psnRaw = u; S.psnSrc = src;
  const ah = u.activeHunt || {};
  const activeId = String(u.commId || ah.commId || ah.npCommunicationId || '').toUpperCase();
  const online = u.online === true || u.online === 'true';
  const list = arr(u.recentGames).map(g => {
    const id = String(g.npCommunicationId || g.commId || '').toUpperCase();
    return { platform:'psn', id, title:g.name || g.trophyTitleName || 'Game', poster:secure(g.posterArt || g.art || ''),
      progress:num(g.progress), earned:g.earnedTotal, total:g.definedTotal, hours:g.nativePlaytimeFormatted || '',
      lastPlayed:g.lastPlayedDateTime || g.lastUpdatedDateTime || '', playing: online && !!id && id === activeId };
  });
  { // the same title often appears twice (PS4 + PS5 edition, repeated syncs): keep one card, the furthest along
    const seen = new Map();
    for (const g of list.splice(0)) {
      const k = (g.title || g.id).toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\b(ps4|ps5|playstation (4|5)|director s cut|edition)\b/g, '').trim() || g.id;
      const cur = seen.get(k);
      if (!cur || (g.playing && !cur.playing) || (!(cur.playing && !g.playing) && g.progress > cur.progress)) seen.set(k, g);
    }
    list.push(...seen.values());
  }
  if (activeId && !list.some(g => g.id === activeId)) {
    list.unshift({ platform:'psn', id:activeId, title:ah.title || u.currentGame || 'Active hunt', poster:secure(ah.art || ah.posterArt || u.currentGameArt || ''),
      progress:num(ah.progress), earned:undefined, total:undefined, hours:ah.nativePlaytimeFormatted || '', lastPlayed:u.lastUpdated || '', playing: online });
  }
  // fill missing posters/totals from the master skeleton (same source the squad hub uses)
  await Promise.all(list.slice(0, 12).filter(g => g.id.startsWith('NPWR') && (!g.poster || g.total == null)).map(async g => {
    try {
      const r = await fetch(`${src}/psn/games/${g.id}.json`); if (!r.ok) return; const s = await r.json(); if (!s) return;
      g.poster = g.poster || secure(s.posterArt || '');
      if (g.title === 'Active hunt') g.title = s.name || s.trophyTitleName || g.title;
      if (g.total == null) g.total = arr(s.trophies).length || undefined;
    } catch (e) {}
  }));
  const sm = u.trophySummary || {}, et = sm.earnedTrophies || {};
  const g4 = k => sm[k] !== undefined ? sm[k] : (et[k] || 0);
  const total = sm.total !== undefined ? sm.total : g4('platinum') + g4('gold') + g4('silver') + g4('bronze');
  return {
    platform:'psn', name:u.onlineId || tag, avatar:secure(u.avatar || u.image || (u.allAvatars && u.allAvatars[0]) || ''),
    online, currentGame:online ? (u.currentGame || '') : '', activity:u.currentGameActivity || '', plus:!!u.plus,
    stats:[['Level', u.level || sm.trophyLevel || '--'], ['Trophies', num(total).toLocaleString()], ['Games', u.gamesPlayed || list.length]],
    breakdown:{ platinum:g4('platinum'), gold:g4('gold'), silver:g4('silver'), bronze:g4('bronze') },
    games:list, recent:arr(u.mostRecentTrophies)
  };
}

// Xbox: written by Xbox/xbox.js to the playstation-stats DB at /xbox/gamertags/{gamertag}
async function loadXbox(tag) {
  let d = null;
  const tags = [...new Set([tag, tag.toLowerCase()])];
  // 1) Kevin's DB through the member's sign-in (Xbox sync mirrors cards here)
  for (const t of tags) { if (d) break; try { d = (await W.db.ref('xbox/gamertags/' + t.replace(/[.$#\[\]\/]/g, '_')).once('value')).val(); } catch (e) {} }
  // 2) the sync's original home in Ray's DB, then public REST on Kevin's DB
  outer: for (const base of d ? [] : [...new Set([RAY_DB, DB()])]) for (const t of tags) {
    try { const r = await fetch(`${base}/xbox/gamertags/${encodeURIComponent(t)}.json?t=${Date.now()}`);
      if (r.ok) { d = await r.json(); if (d) break outer; } } catch (e) {}
  }
  if (!d) return null;
  const online = /online/i.test(d.presenceState || '');
  const games = arr(d.recentTitles).map(t => {
    const total = num(t.totalAchievements), got = num(t.currentAchievements);
    return { platform:'xbox', id:String(t.titleName), title:t.titleName || 'Game', poster:'', progress: total ? Math.round(got / total * 100) : 0,
      earned:got, total:total || undefined, hours:t.totalGamerscore ? `${num(t.currentGamerscore)}/${num(t.totalGamerscore)} G` : '', lastPlayed:'',
      playing: online && !!d.presenceText && String(d.presenceText).toLowerCase().includes(String(t.titleName || '').toLowerCase()), achievements:[] };
  });
  const gotAll = games.reduce((n, g) => n + num(g.earned), 0);
  return { platform:'xbox', name:d.gamertag || tag, avatar:secure(d.gamerPicture || ''), online,
    currentGame: online ? (d.presenceText || '') : '', activity:'',
    stats:[['Gamerscore', num(d.gamerscore).toLocaleString()], ['Recent games', games.length], ['Achievements', gotAll.toLocaleString()]],
    games, recent:[] };
}

// Steam: written by scripts/steam-sync.js to /steam_users/{steamId64}
async function loadSteam(raw) {
  let id = String(raw).trim().replace(/\/+$/, '').split('/').pop();
  if (!/^7656119\d{10}$/.test(id)) {
    const vn = (await W.db.ref('steam_vanity/' + id.toLowerCase().replace(/[.$#\[\]\/]/g, '_')).once('value').catch(() => null));
    id = vn && typeof vn.val() === 'string' ? vn.val() : '';
    if (!id) return null;
  }
  const g = async (c) => (await W.db.ref(`steam_users/${id}/${c}`).once('value').catch(() => ({ val: () => null }))).val();
  const [profile, games, ach, tot, lib] = await Promise.all([g('profile'), g('games'), g('ach'), g('achTotals'), g('library')]);
  if (!profile) return null;
  const achOf = (appid) => (ach && ach[appid]) || {};
  // every owned game (library), recently played first, then by last played / hours; falls back to the recent list
  const recentIds = new Set(arr(games && games.recent).map(r => String(r.appid)));
  const all = lib && typeof lib === 'object'
    ? Object.entries(lib).map(([appid, v]) => ({ appid, name:v.n, minutesTotal:v.t || 0, last:v.l || 0 }))
        .sort((a, b) => (recentIds.has(b.appid) - recentIds.has(a.appid)) || (b.last - a.last) || (b.minutesTotal - a.minutesTotal))
    : arr(games && games.recent).map(r => ({ appid:String(r.appid), name:r.name, minutesTotal:r.minutesTotal || 0, last:0 }));
  const list = all.map(r => {
    const a = achOf(r.appid), total = num(a.total), got = num(a.got);
    return { platform:'steam', id:String(r.appid), title:r.name || ('App ' + r.appid), progress: total ? Math.round(got / total * 100) : 0,
      poster:`https://cdn.cloudflare.steamstatic.com/steam/apps/${r.appid}/library_600x900.jpg`,
      earned: total ? got : undefined, total: total || undefined,
      hours: r.minutesTotal ? (r.minutesTotal / 60).toFixed(1) + ' hrs' : '', lastPlayed:'',
      playing: !!profile.currentGameId && String(profile.currentGameId) === String(r.appid), achievements:[] };
  });
  if (profile.currentGameId && !list.some(x => x.playing)) {
    list.unshift({ platform:'steam', id:String(profile.currentGameId), title:profile.currentGame || 'Playing', progress:0, poster:`https://cdn.cloudflare.steamstatic.com/steam/apps/${profile.currentGameId}/library_600x900.jpg`, hours:'', playing:true, achievements:[] });
  }
  return { platform:'steam', name:profile.name || id, avatar:secure(profile.avatar || ''), online: !!profile.state && profile.state !== 'offline',
    currentGame:profile.currentGame || '', activity:'',
    stats:[['Games', (games && games.count) || list.length], ['Achievements', num(tot && tot.got).toLocaleString()], ['Perfect games', num(tot && tot.perfect)]],
    games:list, recent:[] };
}

/* Game Companion saves (Firestore user/{key}/platform/{p}/game/{name}) */
// Game Companion saves under the friend code (fallback: account key). Returns rows for one person.
async function readTracking(fs, ids) {
  const out = [], seen = new Set();
  for (const id of ids) for (const p of Object.keys(TRACK_PLATS)) {
    let snap; try { snap = await fs.collection('user').doc(id).collection('platform').doc(p).collection('game').get(); } catch (e) { continue; }
    snap.forEach(doc => {
      const sk = p + '|' + doc.id; if (seen.has(sk)) return; seen.add(sk);
      const d = doc.data() || {};
      const sets = [d.trophies, d.medals, d.missions].filter(Boolean).map(o => Object.values(o));
      const total = sets.reduce((n, a) => n + a.length, 0);
      const done = sets.reduce((n, a) => n + a.filter(x => x && (x.earned || x.completed)).length, 0)
                 + Object.values(d.collectibles || {}).reduce((n, c) => n + Object.values((c && c.items) || {}).filter(i => i && i.collected).length, 0);
      out.push({ title:doc.id, platform:({ ps:'PlayStation', xbox:'Xbox', steam:'Steam', pc:'PC' })[p], status: total && done >= total ? 'Completed' : (done ? 'In progress' : 'Started'),
        progress: total ? Math.round(Math.min(done, total) / total * 100) : null, poster:'', note: total ? `${Math.min(done, total)}/${total} tracked` : '', updated:d.updatedAt || 0 });
    });
  }
  out.sort((a, b) => num(b.updated) - num(a.updated));
  return out;
}
const idsFor = (code, key) => [...new Set([String(code || '').toUpperCase(), String(code || ''), key].filter(Boolean))];

async function loadTracking() {
  try {
    const fs = await W.loadFirestore();
    S.tracking = await readTracking(fs, idsFor(S.U.friend_code, S.ownerKey));
  } catch (e) { console.warn('[tracking]', e); S.tracking = { error:true }; }
  if (!$('#profile-root').hidden) render();
  loadFriendProgress();
}

/* Friends' progress: each friend's tracked games, honouring THEIR tracking_scope (same rule as the Game Companion) */
async function loadFriendProgress() {
  if (!S.isOwner || !canSee('tracking')) { S.friendsProg = null; return; }
  try {
    const fs = await W.loadFirestore(), friends = S.U.friends || {};
    S.friendsProg = await Promise.all(Object.entries(friends).map(async ([fk, fo]) => {
      fo = fo || {}; const code = String(fo.friend_code || fk).toUpperCase();
      const key = await W.ownerKeyOfCode(code);
      let prof = {}; if (key) { try { prof = (await W.db.ref('users/' + key).once('value')).val() || {}; } catch (e) {} }
      const name = prof.username || prof.display_name || fo.username || code, scope = prof.tracking_scope || 'friends';
      let ok = scope !== 'private';
      if (scope === 'close') ok = !!(prof.friends && prof.friends[S.U.friend_code] && prof.friends[S.U.friend_code].close_friend === true);
      if (!ok) return { code, name, hidden:true, games:[] };
      return { code, name, games:(await readTracking(fs, idsFor(code, key))).slice(0, 4) };
    }));
  } catch (e) { console.warn('[friends progress]', e); S.friendsProg = null; }
  if (!$('#profile-root').hidden) render();
}

/* friends' tracking lives inside the same Game tracking card as yours (same rows, same colours) */
function friendsInner() {
  if (!S.friendsProg) return '';
  const head = `<div class="h2" style="margin:1rem 0 .5rem"><i class="fas fa-user-group"></i> Friends</div>`;
  if (!S.friendsProg.length) return head + '<div class="mute" style="font-size:.85rem">No friends added yet.</div>';
  return head + S.friendsProg.map(f => `<div style="margin-bottom:.8rem"><div style="font-weight:800;margin-bottom:.3rem">${esc(f.name)}</div>` +
    (f.hidden ? '<div class="mute" style="font-size:.8rem">Keeps their tracking private.</div>' : f.games.length ? trackingRows(f.games) : '<div class="mute" style="font-size:.8rem">No tracked games yet.</div>') + '</div>').join('');
}

/* progress colour: 0% red -> yellow -> green -> blue -> diamond blue at 100%, blended smoothly in between */
const PCT_STOPS = [[0, [239, 68, 68]], [25, [250, 204, 21]], [50, [34, 197, 94]], [75, [59, 130, 246]], [100, [103, 232, 249]]];
function pctColor(p) {
  p = Math.max(0, Math.min(100, +p || 0));
  for (let i = 1; i < PCT_STOPS.length; i++) {
    const a = PCT_STOPS[i - 1], b = PCT_STOPS[i]; if (p <= b[0]) { const f = (p - a[0]) / (b[0] - a[0]); return 'rgb(' + a[1].map((v, k) => Math.round(v + (b[1][k] - v) * f)).join(',') + ')'; }
  }
  return 'rgb(103,232,249)';
}
const pctBar = (p) => { const c = pctColor(p), d = p >= 100; return `<div class="bar" style="margin-top:.35rem"><i style="width:${Math.min(100, p)}%;background:${d ? 'linear-gradient(90deg,#67e8f9,#e0faff,#67e8f9)' : c};${d ? 'box-shadow:0 0 8px #67e8f9;' : ''}"></i></div>`; };

        <div class="mono mute" style="font-size:.78rem;margin-top:.3rem">${g.progress}%${g.earned != null && g.total != null ? ` &bull; ${esc(g.earned)}/${esc(g.total)}` : ''}${g.hours ? ' &bull; ' + esc(g.hours) : ''}${g.lastPlayed ? ' &bull; ' + esc(ago(g.lastPlayed)) : ''}</div></div>
      <button class="btn" onclick="closeModal()" aria-label="Close"><i class="fas fa-times"></i></button></div>
    <div id="trophy-list" style="padding:1rem" class="mute">${canSee('trophies') ? 'Loading trophies&hellip;' : 'Trophy list is private.'}</div>`;
  $('#modal').classList.add('open');
  if (!canSee('trophies')) return;

  let items = [];
  if (g.platform === 'psn') {
    try {
      const r = await fetch(`${S.psnSrc || DB()}/psn/games/${g.id}.json`); const s = r.ok ? await r.json() : null;
      const live = (S.psnRaw && S.psnRaw.liveTrophyProgress && S.psnRaw.liveTrophyProgress[g.id]) || {};
      items = arr(s && s.trophies).map(t => { const l = live[t.trophyId] || live[String(t.trophyId)] || {};
        return { name:t.trophyName || t.name, desc:t.trophyDetail || t.description, icon:secure(t.trophyIconUrl || t.icon || ''), earned:!!l.earned, at:l.earnedDate || l.earnedDateTime || l.timestamp || '' }; });
    } catch (e) {}
  } else {
    items = g.achievements.map(a => ({ name:a.name || a.title, desc:a.description || a.desc, icon:secure(a.icon || a.image || ''), earned:!!(a.earned ?? a.achieved ?? a.unlocked), at:a.earnedAt || a.unlockTime || '' }));
  }
  const box = $('#trophy-list');
  if (!items.length) { box.textContent = 'No trophy/achievement list available for this game yet.'; return; }
  items.sort((a, b) => (b.earned ? 1 : 0) - (a.earned ? 1 : 0));
  box.classList.remove('mute');
  box.innerHTML = items.map(t => `<div class="row" style="${t.earned ? '' : 'opacity:.55'}">
      <img src="${esc(t.icon)}" alt="" onerror="this.src='${ph(64, 64, '🏆')}'">
      <div style="min-width:0;flex:1"><div style="font-weight:800">${esc(t.name)}</div><div class="mute" style="font-size:.78rem">${esc(t.desc || '')}</div>
      ${t.earned && t.at ? `<div style="font-size:.72rem;color:var(--ok)">${esc(fmtDate(t.at))}</div>` : ''}</div>
      <span class="chip ${t.earned ? 'live' : ''}">${t.earned ? 'Earned' : 'Locked'}</span></div>`).join('');
}

function compressImage(file, maxW, quality, maxBytes) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = Math.min(maxW, img.width), h = Math.round(img.height * (w / img.width)), q = quality, out;
      const c = document.createElement('canvas');
      for (let i = 0; i < 6; i++) {
        c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
        out = c.toDataURL('image/jpeg', q);
        if (out.length * 0.75 <= maxBytes) break;
        q = Math.max(.4, q - .1); w = Math.round(w * .85); h = Math.round(h * .85);
      }
      URL.revokeObjectURL(url);
      out.length * 0.75 <= maxBytes ? resolve(out) : reject(new Error('Image is too large even after compression'));
    };
    img.onerror = () => reject(new Error('Could not read that image'));
    img.src = url;
  });
}


function openEdit() {
  const p = S.profile, pv = p.privacy || {};
  S.edit = { bg: S.media.bg || '' };
  const d = $('#drawer');
  const row = (k, label, icon, val) => `<div class="priv"><span><i class="${icon}" style="width:1.4rem"></i>${label}</span>
      <select class="fld-sel" data-sec="${k}" style="background:rgba(127,127,127,.14);border:1px solid var(--line);border-radius:.6rem;padding:.5rem">${LEVELS.map(([v, l]) => `<option value="${v}" ${val === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
  const scopeLabel = (s) => (LEVELS.find(l => l[0] === s) || [0, 'Only me'])[1];
  d.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h2 style="font-size:1.2rem;text-transform:uppercase">Edit profile</h2>
      <button class="btn" id="ed-close" aria-label="Close"><i class="fas fa-times"></i></button></div>

    <div class="h2" style="margin:.5rem 0">About you</div>
    <div class="fld"><label>Display name (blank = your username)</label><input type="text" id="ed-name" maxlength="40" value="${esc(p.displayName || '')}" placeholder="${esc(S.U.username || '')}"></div>
    <div class="fld"><label>Bio</label><textarea id="ed-bio" rows="3" maxlength="280">${esc(p.bio)}</textarea></div>

    <div class="h2" style="margin:1.2rem 0 .5rem">Look</div>
    <div class="fld"><label>Background image</label>
      <input type="file" id="ed-bg-file" accept="image/*">
      <input type="url" id="ed-bg-url" placeholder="&hellip;or paste an https:// image link" style="margin-top:.4rem">
      <button class="btn danger" id="ed-bg-clear" type="button" style="margin-top:.4rem">Remove background</button></div>
    <div class="fld"><label>Background darkness</label><input type="range" id="ed-dim" min="0" max="90" value="${Math.round((p.bgDim != null ? p.bgDim : .55) * 100)}"></div>
    <div class="fld"><label>Accent color</label><input type="color" id="ed-accent" value="${esc(p.accent || S.U.primary_color || '#ff5f1f')}" style="height:44px;width:100%;border-radius:.7rem;border:1px solid var(--line);background:transparent"></div>

    <div class="h2" style="margin:1.2rem 0 .3rem">Who can see what</div>
    ${row('trophies', 'Trophy lists & latest unlocks', 'fas fa-trophy', pv.trophies || 'friends')}
    ${row('activity', 'Online status & now playing', 'fas fa-signal', pv.activity || 'friends')}
    ${row('tracking', 'Game tracking', 'fas fa-bullseye', S.U.tracking_scope || 'friends')}
    <div class="mute" style="font-size:.8rem;margin:.8rem 0">
      Your accounts use the privacy you already set in <a href="../security/setting.html" style="color:var(--accent)"><b>Settings</b></a>:
      PlayStation &ndash; ${scopeLabel(S.U.psn_username_scope || 'private')}, Xbox &ndash; ${scopeLabel(S.U.xbox_gamertag_scope || 'private')}, Steam &ndash; ${scopeLabel(S.U.steam_id_scope || 'private')}.
      Usernames, avatar, friends and close friends are managed there too.</div>
    <div class="fld"><label>Default tab when someone opens your profile</label>
      <select id="ed-tab"><option value="all">All platforms</option><option value="psn" ${p.defaultTab === 'psn' ? 'selected' : ''}>PlayStation</option><option value="xbox" ${p.defaultTab === 'xbox' ? 'selected' : ''}>Xbox</option><option value="steam" ${p.defaultTab === 'steam' ? 'selected' : ''}>Steam</option></select></div>

    <div class="sticky-save"><button class="btn primary" id="ed-save" style="width:100%;justify-content:center"><i class="fas fa-floppy-disk"></i> Save profile</button></div>`;
  d.classList.add('open');

  $('#ed-close').onclick = () => d.classList.remove('open');
  const preview = () => { S.media.bg = S.edit.bg; S.profile.bgDim = $('#ed-dim').value / 100; S.profile.accent = $('#ed-accent').value; applyTheme(); };
  $('#ed-dim').oninput = preview; $('#ed-accent').oninput = preview;
  $('#ed-bg-file').onchange = async (e) => { const f = e.target.files[0]; if (!f) return;
    try { S.edit.bg = await compressImage(f, 1600, .78, 380000); preview(); } catch (err) { toast(err.message); } };
  $('#ed-bg-url').onchange = (e) => { const v = e.target.value.trim(); if (v && !/^https:\/\//.test(v)) return toast('Use an https:// link'); S.edit.bg = v; preview(); };
  $('#ed-bg-clear').onclick = () => { S.edit.bg = ''; preview(); };
  $('#ed-save').onclick = saveProfile;
}

async function saveProfile() {
  const btn = $('#ed-save'); btn.disabled = true;
  try {
    const me = W.me, db = W.db, SV = W.firebase.database.ServerValue;
    const sec = {}; document.querySelectorAll('.fld-sel').forEach(s => sec[s.dataset.sec] = s.value);
    const prof = { displayName:$('#ed-name').value.trim().slice(0, 40), bio:$('#ed-bio').value.trim().slice(0, 280),
                   accent:$('#ed-accent').value, bgDim:Number($('#ed-dim').value) / 100, defaultTab:$('#ed-tab').value,
                   privacy:{ trophies:sec.trophies, activity:sec.activity }, updatedAt:SV.TIMESTAMP };
    await db.ref('profiles/' + me.key).update(prof);
    await db.ref('profileMedia/' + me.key).set({ bg:S.edit.bg || null });
    if (sec.tracking !== (S.U.tracking_scope || 'friends')) {          // same field Settings uses
      await db.ref('users/' + me.key + '/tracking_scope').set(sec.tracking); S.U.tracking_scope = sec.tracking;
    }
    Object.assign(S.profile, prof); S.media = { bg:S.edit.bg };
    me.name = displayName();
    $('#drawer').classList.remove('open');
    toast('Profile saved');
    applyTheme();
    if (canSee('tracking')) await loadTracking();
    render();
  } catch (e) { console.error(e); toast('Save failed: ' + (e.code || e.message)); }
  btn.disabled = false;
}

/* ---------- go ---------- */
await boot();
})();
</script>
