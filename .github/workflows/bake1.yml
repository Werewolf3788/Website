name: bake
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: apply
        run: |
          set -e
          echo '' > /tmp/b64
          base64 -d /tmp/b64 | gunzip > /tmp/plu.patch
          test "$(sha256sum /tmp/plu.patch | cut -d' ' -f1)" = "6e5e7304f8beda601ddf8051f3c406036f13576578185c3749c3ae8080fd7ff0"
          if git apply --check /tmp/plu.patch; then
            git apply /tmp/plu.patch
            git config user.name 'bake'
            git config user.email 'bake@users.noreply.github.com'
            git add plu.html
            git commit -m 'Fix mobile double-tap zoom on PLU page'
            git push origin HEAD:main
          fi
          git rm -q .github/workflows/bake1.yml
          git commit -m 'Remove bake workflow' || true
          git push origin HEAD:main || true
      - name: deploy
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
