name: Bastion place-fix bake (one-off)

# One-off helper: applies the "placing on phones" patch, commits it, removes itself,
# then kicks off the normal deploy workflow.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bastion-placefix-bake.yml'

permissions:
  contents: write
  actions: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        env:
          PATCH: ""
        run: |
          echo "$PATCH" | base64 -d | gunzip > /tmp/placefix.patch
          git apply --check /tmp/placefix.patch
          git apply /tmp/placefix.patch
          grep -c "innerWidth<700" games/mobile/bastion.html

      - name: Commit the change
        run: |
          git config user.name "SMLC bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q .github/workflows/bastion-placefix-bake.yml
          git add games/mobile/bastion.html
          git commit -m "Bastion Builder: pick up items reliably on phones"
          git push

      - name: Deploy the live site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
