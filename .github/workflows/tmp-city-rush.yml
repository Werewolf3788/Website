name: tmp-city-rush
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and commit
        run: |
          python3 -c "import base64,lzma;open('/tmp/p.patch','wb').write(lzma.decompress(base64.b64decode('')))"
          git apply /tmp/p.patch
          git config user.name "City Rush"
          git config user.email "noreply@example.com"
          git add -A games/mobile
          git commit -m "City Rush: deeper shop floor and a spread-out queue"
          git push origin HEAD:main
