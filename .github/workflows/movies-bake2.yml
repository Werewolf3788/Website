name: movies-bake2
on: push
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        env:
          PATCH: ""
        run: |
          set -e
          echo "$PATCH" | base64 -d | gunzip > /tmp/x.patch
          git apply --check /tmp/x.patch
          git apply /tmp/x.patch
          grep -c "link.amazon, amzn.to" Movies.html
          git config user.name "bake-bot"
          git config user.email "bake@users.noreply.github.com"
          git add Movies.html
          git rm .github/workflows/movies-bake2.yml
          git commit -m "Movies: stop appending a tag to Amazon short links (they 500)"
          git push
      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
