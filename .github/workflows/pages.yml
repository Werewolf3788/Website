# Version Timestamp: Fri, July 24, 2026, 03:00 PM (EDT)
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]

# Grants the token permissions required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# CONCURRENCY LOCK FIX:
# Automatically cancels any older builds currently running on the same branch!
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/pages-config@v3

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
