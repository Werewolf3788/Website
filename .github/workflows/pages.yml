# GitHub Actions Workflow for Automatic GitHub Pages Deployment with Concurrency Locks
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]

# Grant necessary permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# CONCURRENCY LOCK PREVENTER:
# Automatically cancels older running builds when a new commit is pushed!
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
