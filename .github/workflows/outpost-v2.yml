name: outpost-v2
on:
  push:
    paths:
      - .github/workflows/outpost-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: unpack
        run: |
          python3 - <<'PY'
          import base64, lzma, tarfile, io, hashlib
          bz = """
          
          """
          raw = lzma.decompress(base64.b64decode(bz.strip()))
          t = tarfile.open(fileobj=io.BytesIO(raw))
          print('unpacked', t.getnames())
          t.extractall('.')
          print('sha', hashlib.sha256(open('games/mobile/tiles-outpost.html','rb').read()).hexdigest())
          PY
      - name: commit
        run: |
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/tiles-outpost.html
          git commit -m "Rebuild Tiles Outpost as a mission campaign"
          git push
