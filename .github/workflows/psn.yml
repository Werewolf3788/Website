name: PSN Sync and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '*/21 * * * *'
  push:
    branches:
      - main
    paths:
      - 'Playstation/**'
      - '.github/workflows/psn.yml'

permissions:
  contents: write

concurrency:
  group: psn-sync-runner
  cancel-in-progress: true

jobs:
  psn-sync-job:
    name: PSN Sync Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: |
          npm install psn-api firebase-admin

      - name: Execute PSN Sync Engine
        env:
          # Ray's Database Key (Writes ONLY to playstation-stats)
          FIREBASE_SERVICE_RAY: ${{ secrets.FIREBASE_SERVICE_RAY }}
          # Kevin's Key (Used STRICTLY for READ-ONLY access to entertainment-71888)
          GCP_SA_KEY_WEBSITE: ${{ secrets.GCP_SA_KEY_WEBSITE }}
          FIREBASE_AUTH_SECRET: ${{ secrets.FIREBASE_AUTH_SECRET }}
          GITHUB_TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          node Playstation/psn.js
