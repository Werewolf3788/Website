# --- PRECISION INTEGRITY PROTOCOL ---
# Project: PSN Sync Workflow
# Timestamp: May 10, 2026, 11:00 PM (NYT)
# Compatibility: GitHub Actions, GitHub Pages
# Note: DO NOT STRIP INDENTATION. YAML REQUIRES 2-SPACE SPACING.
# Updates: Changed cron schedule to run every 23 minutes for the whole squad.
# ------------------------------------

name: PSN Sync and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/23 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  psn-sync-job:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install psn-api

      - name: Run PSN Sync Script
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
        run: node Playstation/psnscript.js

      - name: Commit and Push Data Changes
        run: |
          git config --global user.name "Werewolf3788-Bot"
          git config --global user.email "bot@werewolf.ourflora.com"
          
          git add Playstation/psn_data.json Playstation/tokens.json .nojekyll
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated PSN Sync: $(date)"
            git pull --rebase origin main
            git push origin main
          else
            echo "No data changes detected. Skipping commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
