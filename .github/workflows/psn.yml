# --- PRECISION INTEGRITY PROTOCOL ---
# Project: Unified PSN & G-Portal Sync
# Timestamp: May 23, 2026, 01:15 AM (NYT)
# Compatibility: GitHub Actions (Free Tier), GitHub Pages
# Note: DO NOT STRIP INDENTATION.
# ------------------------------------

name: Unified Sync and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/23 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install psn-api xml2js

      # STEP 1: PSN SYNC
      - name: Run PSN Sync Script
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
        run: node Playstation/psnscript.js

      # STEP 2: G-PORTAL SYNC
      - name: Download All Save Games via lftp
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          # Using mirror without NLST dependency, forcing it to look into savegame folders
          lftp -c "set ftp:ssl-allow no; set net:timeout 10; open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }}; cd /; mirror --verbose=3 --parallel=2 --include-glob 'savegame*/.*\\.xml' ./ ./Playstation/fs25/"

      - name: Run G-Portal Parser
        run: node Playstation/fs25/sync_data.js

      # STEP 3: COMMIT EVERYTHING
      - name: Commit and Push All Data
        run: |
          git config --global user.name "Werewolf3788-Bot"
          git config --global user.email "bot@werewolf.ourflora.com"
          git add Playstation/psn_data.json Playstation/tokens.json Playstation/fs25/server_data.json .nojekyll
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated Sync: PSN & G-Portal $(date)"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected. Skipping commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
