name: PSN Sync and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '*/21 * * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'psn.json'
      - 'Playstation/psn.json'
      - 'game/data/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: psn-sync-runner
  cancel-in-progress: true

jobs:
  psn-sync-job:
    name: PSN Sync Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: |
          npm install psn-api firebase-admin

      - name: Execute PSN Sync Engine
        env:
          FIREBASE_SERVICE_RAY: ${{ secrets.FIREBASE_SERVICE_RAY }}
          FIREBASE_AUTH_SECRET: ${{ secrets.FIREBASE_AUTH_SECRET }}
        run: |
          if [ -f "Playstation/psn.js" ]; then
            node Playstation/psn.js
          elif [ -f "psn.js" ]; then
            node psn.js
          else
            node index.js
          fi
