# --- PRECISION INTEGRITY PROTOCOL ---
# Project: PSN Live Sync & Deploy (Pure Stateless)
# Timestamp: Sat, July 25, 2026
# Compatibility: GitHub Actions, Firebase RTDB, GitHub Pages
# ==========================================

name: PSN Sync and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  psn-sync-job:
    name: PSN Sync and Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PSN Dependencies
        run: npm install psn-api

      - name: Run PSN Sync Script
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
        continue-on-error: true # Prevents red email alerts when Sony NPSSO expires
        run: node Playstation/psn.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
