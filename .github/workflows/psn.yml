# --- PRECISION INTEGRITY PROTOCOL ---
# Project: PSN Sync Workflow (Firebase Cloud Stream Target)
# Timestamp: Tue, July 7, 2026, 1:20 PM (CT)
# Compatibility: GitHub Actions, Firebase RTDB, Google Apps Script Trigger
# Note: DO NOT STRIP INDENTATION. YAML REQUIRES 2-SPACE SPACING.
# ------------------------------------

name: PSN Cloud Sync and Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [psn_trigger] # Google Apps Script will fire this explicit event type

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  psn-cloud-sync-job:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Scraping Dependencies
        run: npm install psn-api

      - name: Execute PSN Sync & Stream to Firebase Target
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
        run: node Playstation/psnscript.js

      - name: Setup Pages Architecture
        uses: actions/configure-pages@v4

      - name: Upload Static Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Frontend Site
        id: deployment
        uses: actions/deploy-pages@v4
