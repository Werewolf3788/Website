# File: .github/workflows/psn.yml
# PSN sync -> Ray's Firebase (RTDB + Firestore). No psn.json is committed anymore.
name: PSN Sync and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '*/21 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'game/data/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: psn-sync-runner
  cancel-in-progress: false

jobs:
  psn-sync-job:
    name: PSN Sync Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install psn-api firebase-admin

      - name: Execute PSN Sync Engine
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
          PSN_NPSSO_DARKWING: ${{ secrets.PSN_NPSSO_DARKWING }}
          PSN_NPSSO_MARC: ${{ secrets.PSN_NPSSO_MARC }}
          FIREBASE_SERVICE_RAY: ${{ secrets.FIREBASE_SERVICE_RAY }}
          FIREBASE_AUTH_SECRET: ${{ secrets.FIREBASE_AUTH_SECRET }}
          GCP_SA_KEY_WEBSITE: ${{ secrets.GCP_SA_KEY_WEBSITE }}
        run: |
          node Playstation/psn.js
          if [ -f "scripts/sync_active_game.js" ]; then
            node scripts/sync_active_game.js
          fi

      - name: Commit and Push Game Data
        run: |
          git config --global user.name "Werewolf3788-Bot"
          git config --global user.email "werewolf3788-bot@users.noreply.github.com"
          git add game/data/game.json game/data/games/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Automated Game Sync [skip ci] [Chicago Time: $(TZ='America/Chicago' date '+%Y-%m-%d %H:%M:%S')]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No game data changes to commit."
          fi
