# --- PRECISION INTEGRITY PROTOCOL ---
# Project: PSN Sync Workflow
# Timestamp: May 10, 2026, 6:00 PM (NYT)
# Compatibility: GitHub Actions, GitHub Pages
# Note: DO NOT STRIP INDENTATION. YAML REQUIRES 2-SPACE SPACING.
# ------------------------------------

name: PSN Sync and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  psn-sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install psn-api

      - name: Run PSN Sync Script
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
        run: node Playstation/psnscript.js

      - name: Commit and Push Data Changes
        run: |
          git config --global user.name "Werewolf3788-Bot"
          git config --global user.email "bot@werewolf.ourflora.com"
          
          # Stage only the specific data files generated by the script
          git add Playstation/psn_data.json Playstation/tokens.json .nojekyll
          
          # Only commit if there are actually changes in the staged files
          if ! git diff --cached --quiet; then
            git commit -m "Automated PSN Sync: $(date)"
            
            # Pull with rebase to cleanly sit our commit on top of any manual changes you made
            git pull --rebase origin main
            
            # Final push to the main branch
            git push origin main
          else
            echo "No data changes detected. Skipping commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
