# ==========================================
# --- PRECISION INTEGRITY PROTOCOL ---
# File: .github/workflows/psn-sync.yml
# Project: PSN Live Sync & Deploy (Dual Stream & Pages Deploy)
# Version: 15.5.0 - Pathspec Staging Fix & Clean Diff Check
# Last Modified: Saturday, August 08, 2026 | 7:27 PM EDT
# Logic: Runs Node script on 23-min schedule, pushes to Firebase RTDB,
#        commits updated Playstation/psn.json back to repo with rebase handling,
#        and deploys static payload directly to GitHub Pages.
# ==========================================

name: PSN Sync and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/23 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  psn-sync-job:
    name: PSN Sync and Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: |
          npm install psn-api

      - name: Execute PSN Sync Engine
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
        continue-on-error: true # Prevents red email alerts when Sony NPSSO expires
        run: |
          node Playstation/psn.js || node psn.js || node index.js

      - name: Commit and Push PSN Data
        run: |
          git config --global user.name "Werewolf3788-Bot"
          git config --global user.email "werewolf3788-bot@users.noreply.github.com"
          git add Playstation/psn.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated PSN Payload Sync [Playstation/psn.json]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in Playstation/psn.json to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
