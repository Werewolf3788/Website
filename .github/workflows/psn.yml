# ============================================================================
# File: .github/workflows/psn-sync.yml
# Project: PSN Live Sync Engine
# Version: 18.1.0 - Streamlined Push Engine
# ============================================================================

name: PSN Sync and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  psn-sync-job:
    name: PSN Sync Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: |
          npm install psn-api

      - name: Execute PSN Sync Engine
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -f "Playstation/psn.js" ]; then
            node Playstation/psn.js
          elif [ -f "psn.js" ]; then
            node psn.js
          else
            node index.js
          fi

      - name: Commit and Push PSN Data
        run: |
          git config --global user.name "Werewolf3788-Bot"
          git config --global user.email "werewolf3788-bot@users.noreply.github.com"
          
          git add psn.json Playstation/psn.json 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated PSN Payload Sync [Chicago Time: $(TZ='America/Chicago' date '+%Y-%m-%d %H:%M:%S')]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No local file changes detected to commit."
          fi
