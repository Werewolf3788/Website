# --- PRECISION INTEGRITY PROTOCOL ---
# Project: Combined Sync Workflow (PSN + G-Portal)
# Target: Playstation/fs25/server_data.json
# Timestamp: May 23, 2026, 12:20 AM (NYT)
# ------------------------------------

name: Unified Sync and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/23 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install psn-api xml2js

      # STEP 1: PSN SYNC
      - name: Run PSN Sync Script
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
        run: node Playstation/psnscript.js

      # STEP 2: G-PORTAL SYNC
      - name: Download XMLs via FTP
        uses: kevin-schoen/ftp-action@v1
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          download: true
          src: '/gameserver.xml'
          dest: './Playstation/fs25/' # Saved directly to target folder

      - name: Run G-Portal Parser
        run: node sync_data.js # Ensure this script writes to ./Playstation/fs25/server_data.json

      # STEP 3: COMMIT EVERYTHING
      - name: Commit and Push All Data
        run: |
          git config --global user.name "Werewolf3788-Bot"
          git config --global user.email "bot@werewolf.ourflora.com"
          git add Playstation/psn_data.json Playstation/tokens.json Playstation/fs25/server_data.json .nojekyll
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated Sync: PSN & G-Portal $(date)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-artifact
