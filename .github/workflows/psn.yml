# --- PRECISION INTEGRITY PROTOCOL ---
# Project: PSN Sync Workflow (Firebase Cloud Stream Target)
# Timestamp: Tue, July 7, 2026, 1:45 PM (CT)
# Compatibility: GitHub Actions, GitHub Pages, Firebase RTDB
# Note: DO NOT STRIP INDENTATION. YAML REQUIRES 2-SPACE SPACING.
# Updates: Self-triggering workflow loop to bypass slow cron schedules.
# ------------------------------------

name: PSN Cloud Sync and Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [psn_loop_trigger] # Allows the workflow to wake itself up

permissions:
  contents: write    # Changed to write so the action can trigger the next loop
  pages: write
  id-token: write

jobs:
  psn-cloud-sync-job:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Scraping Dependencies
        run: npm install psn-api

      - name: Execute PSN Sync & Stream to Firebase Target
        env:
          PSN_NPSSO_WEREWOLF: ${{ secrets.PSN_NPSSO_WEREWOLF }}
          PSN_NPSSO_RAY: ${{ secrets.PSN_NPSSO_RAY }}
        run: node Playstation/psnscript.js

      - name: Setup Pages Architecture
        uses: actions/configure-pages@v4

      - name: Upload Static Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Frontend Site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Queue Next Sync Cycle (5 Minute Delay)
        # This uses GitHub's built-in token to trigger the next run automatically
        run: |
          sleep 300
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "psn_loop_trigger"}'
