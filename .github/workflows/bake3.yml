name: bake
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: apply
        run: |
          set -e
          echo '' > /tmp/b64
          base64 -d /tmp/b64 | gunzip > /tmp/tip.patch
          test "$(sha256sum /tmp/tip.patch | cut -d' ' -f1)" = "87a3ea2cf7de3d74f888c7d7a821334d051bbde332ed24e09f04da473564a4d1"
          if git apply --check /tmp/tip.patch; then
            git apply /tmp/tip.patch
            git config user.name 'bake'
            git config user.email 'bake@users.noreply.github.com'
            git add assets/ww-shell.js assets/ww-shell.css
            git commit -m 'Add a Tip button to the site menu'
            git push origin HEAD:main
          fi
          git rm -q .github/workflows/bake3.yml
          git commit -m 'Remove bake workflow' || true
          git push origin HEAD:main || true
      - name: deploy
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
