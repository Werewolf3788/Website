name: bake-games
on:
  push:
    paths:
      - '.github/workflows/bake-games.yml'
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack new games and commit
        run: |
          set -euo pipefail
          echo '' | base64 -d | xz -d > /tmp/site.tar
          tar -xf /tmp/site.tar -C .
          ls -l games/mobile/bricks.html games/mobile/merge.html games/mobile/mines.html
          grep -c brickBtn games/mobile/index.html
          grep -c 'Brick Breaker' games/mobile/changelog.json
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/bricks.html games/mobile/merge.html games/mobile/mines.html games/mobile/index.html games/mobile/changelog.json
          git commit -m "Add three new games: Brick Breaker, Merge 2048 and Minefield"
          git push
