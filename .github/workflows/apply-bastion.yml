# Temporary helper: applies ci/bastion.b64, checks the result, removes both helper files,
# pushes to main and deploys the game to Firebase Hosting. Only runs for APPLY-BASTION-PATCH.
name: Apply bastion remove-mode patch

on:
  push:
    branches: [main]

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY-BASTION-PATCH')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch, verify, and commit
        run: |
          base64 -d ci/bastion.b64 | gunzip > /tmp/b.patch
          git apply --whitespace=nowarn /tmp/b.patch
          grep -q 'id="delMode"' games/mobile/bastion.html
          grep -q 'if(removeMode){ if(trap)' games/mobile/bastion.html
          grep -q "VERSION = '1.0.2'" games/mobile/bastion.html
          git rm -q ci/bastion.b64 .github/workflows/apply-bastion.yml
          git add -A
          git config user.name "SMLC bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bastion v1.0.2: Remove mode stays on until you tap Done"
          git push origin HEAD:main

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project entertainment-71888
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_WEBSITE }}
