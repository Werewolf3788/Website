name: outpost-polish
on:
  push:
    paths:
      - .github/workflows/outpost-polish.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bigger camp icons
        run: |
          python3 - <<'PY'
          import hashlib
          p = 'games/mobile/tiles-outpost.html'
          s = open(p).read()
          a = 'transform:rotate(-45deg);font-size:19px;line-height:1}'
          b = 'transform:rotate(-45deg);font-size:27px;line-height:1;filter:drop-shadow(0 2px 3px #0008)}'
          if a in s:
              s = s.replace(a, b)
              print('emoji bigger')
          else:
              print('emoji already patched')
          c = '.tile .lv{font-size:9px;'
          d = '.tile .lv{font-size:10px;'
          if c in s:
              s = s.replace(c, d)
              print('level text bigger')
          else:
              print('level text already patched')
          open(p, 'w').write(s)
          print('sha', hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - name: commit
        run: |
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/tiles-outpost.html
          git commit -m "Polish Tiles Outpost board icons"
          git push
