# Project: fs25-a3563 (/fs25 RTDB Node)
# Database Target: https://fs25-a3563-default-rtdb.firebaseio.com/fs25
# Google Analytics Tag: G-CTYHDF4MSD (Gaming, Progress Tracking, Firebase Entertainment)
# Measurement ID: G-SGJF0FJPQZ
# Description: Tiered FS25 Savegame & Telemetry Ingestion Workflow.
#              - Poller runs every 16 minutes matching G-Portal's 15-min auto-save.
#              - Evaluates Port 9050 live stats:
#                  * If server is offline: marks serverStatus.isOnline = false and exits (zero overwrite).
#                  * If active players > 0: executes high-frequency sync (vehicles, fields, farms, missions).
#                  * If in-game calendar day changed: updates weather/environment forecast.
#                  * If 0 players: skips volatile files; triggers slow sync (economy, sales, placeables)
#                    only on the daily/6-12 hour window.
#              - Manual Trigger Override (workflow_dispatch):
#                  * Bypasses the 0-player and 6-hour idle guards to force an immediate full sync.
# ============================================================================

name: FS25 Live Backup Sync

on:
  schedule:
    # Triggers every 16 minutes in alignment with G-Portal auto-save
    - cron: '*/16 * * * *'
  workflow_dispatch:

concurrency:
  group: fs25-sync
  cancel-in-progress: true

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          cd games/FS25
          if [ -f package.json ]; then
            npm install basic-ftp dotenv xml2js
          else
            npm init -y
            npm install basic-ftp dotenv xml2js
          fi

      - name: Run Tiered Sync Pipeline
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FS25_API_CODE: ${{ secrets.FS25_API_CODE }}
          DEFAULT_SAVE_SLOT: ${{ secrets.DEFAULT_SAVE_SLOT || '3' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          cd games/FS25
          node fs25.js
