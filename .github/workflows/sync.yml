name: FS25 Live Backup Sync

on:
  schedule:
    # Triggers precisely every 16 minutes to avoid overlapping server saves
    - cron: '*/16 * * * *'
  workflow_dispatch: # Allows manual "Run workflow" trigger in GitHub Actions tab

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Prevents long runs if G-Portal FTP connection drops

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node Dependencies
      run: |
        cd games/FS25
        npm install firebase-admin ftp dotenv

    - name: Run G-Portal to Firebase Bridge
      env:
        # Pulls your credentials safely out of GitHub's encrypted secrets vault
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_PORT: ${{ secrets.FTP_PORT }}
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        DEFAULT_SAVE_SLOT: ${{ secrets.DEFAULT_SAVE_SLOT || '1' }}
      run: |
        cd games/FS25
        node fs25.js
