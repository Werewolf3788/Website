# Deployment Timestamp: Sun, Aug 30, 2026, 17:55:00 (EDT - New York)
# Project: entertainment-71888 (/fs25 RTDB Node)
# Description: Smart FS25 Dynamic Savegame Ingestion Workflow.
#              - Triggers every 16 minutes via cron.
#              - Automatically downloads savegame XMLs if players are online.
#              - Runs a full 24-hour maintenance sync when the server is idle.
# ============================================================================

name: FS25 Live Backup Sync

on:
  schedule:
    # Trigger every 16 minutes
    - cron: '*/16 * * * *'
  workflow_dispatch:

concurrency:
  group: fs25-sync
  cancel-in-progress: true

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd games/FS25
          npm install basic-ftp firebase-admin dotenv @xmldom/xmldom

      - name: Run Dynamic Sync Pipeline
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FS25_API_CODE: ${{ secrets.FS25_API_CODE }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEFAULT_SAVE_SLOT: ${{ secrets.DEFAULT_SAVE_SLOT || '3' }}
        run: |
          cd games/FS25
          node fs25.js
