name: FS25 Live Backup Sync

on:
  schedule:
    # Triggers precisely every 16 minutes to avoid overlapping server saves
    - cron: '*/16 * * * *'
  workflow_dispatch: # This adds a manual "Run workflow" button in GitHub for testing

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm ci

    - name: Run G-Portal to Firebase Bridge
      env:
        # Pulls your credentials safely out of GitHub's encrypted secrets vault
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_PORT: ${{ secrets.FTP_PORT }}
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: node index.js
