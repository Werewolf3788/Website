name: FS25 Live Backup Sync

on:
  schedule:
    - cron: '*/16 * * * *'
  workflow_dispatch:

concurrency:
  group: fs25-sync
  cancel-in-progress: true

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          cd games/FS25
          if [ -f package.json ]; then
            npm install basic-ftp dotenv xml2js
          else
            npm init -y
            npm install basic-ftp dotenv xml2js
          fi

      - name: Run Tiered Sync Pipeline
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FS25_API_CODE: ${{ secrets.FS25_API_CODE }}
          DEFAULT_SAVE_SLOT: ${{ secrets.DEFAULT_SAVE_SLOT || '3' }}
        run: |
          cd games/FS25
          node fs25.js
