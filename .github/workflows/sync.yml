name: FS25 Live Backup Sync

on:
  schedule:
    # Triggers every 16 minutes in alignment with G-Portal auto-save
    - cron: '*/16 * * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force immediate full telemetry and Discord dispatch'
        required: false
        default: 'true'

concurrency:
  group: fs25-sync
  cancel-in-progress: true

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          cd games/FS25
          if [ -f package.json ]; then
            npm install basic-ftp dotenv xml2js
          else
            npm init -y
            npm install basic-ftp dotenv xml2js
          fi

      - name: Run Tiered Sync Pipeline & Discord Dispatcher
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FS25_API_CODE: ${{ secrets.FS25_API_CODE }}
          DEFAULT_SAVE_SLOT: ${{ secrets.DEFAULT_SAVE_SLOT || '3' }}
          FIREBASE_DATABASE_URL: "https://fs25-a3563-default-rtdb.firebaseio.com"
          FIREBASE_PROJECT_ID: "fs25-a3563"
          FIREBASE_API_KEY: "AIzaSyBwhhUNH0itRb2hQcnSap_vGfnErAGVzZc"
          FIREBASE_APP_ID: "1:528331196894:web:5af51bc2c80fd56aecf54f"
          FIREBASE_MEASUREMENT_ID: "G-SGJF0FJPQZ"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          cd games/FS25
          if [ -f index.js ]; then
            node index.js ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          elif [ -f fs25.js ]; then
            node fs25.js ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          else
            echo "❌ Error: Neither index.js nor fs25.js found in games/FS25!"
            exit 1
          fi
