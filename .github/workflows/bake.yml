name: bake

on:
  push:
    paths:
      - '.github/workflows/bake.yml'

permissions:
  contents: write
  actions: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply the PLU game patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/plu.patch
          git apply /tmp/plu.patch
          git config user.name bake
          git config user.email bake@users.noreply.github.com
          git add plu.html
          git rm -q .github/workflows/bake.yml
          git commit -m "PLU page: add the code-matching memory game"
          git push origin HEAD:main
      - name: Start the site deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
