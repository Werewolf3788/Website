name: Bastion slots bake (one-off)

# One-off helper: applies the "spaces left" patch for Bastion Builder, commits it,
# then removes itself and kicks off the normal deploy workflow.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bastion-slots-bake.yml'

permissions:
  contents: write
  actions: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        env:
          PATCH: ""
        run: |
          echo "$PATCH" | base64 -d | gunzip > /tmp/slots.patch
          git apply --check /tmp/slots.patch
          git apply /tmp/slots.patch
          grep -c paintHoldSlots games/mobile/bastion.html

      - name: Commit the change
        run: |
          git config user.name "SMLC bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q .github/workflows/bastion-slots-bake.yml
          git add games/mobile/bastion.html
          git commit -m "Bastion Builder: show spaces left before the upgrade wall while placing"
          git push

      - name: Deploy the live site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
