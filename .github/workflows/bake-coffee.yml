name: coffee-bake
on:
  push:
    paths:
      - '.github/workflows/bake-coffee.yml'
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply support-link patch
        env:
          PATCH: ''
        run: |
          set -euo pipefail
          echo "$PATCH" | base64 -d | gunzip > /tmp/support.patch
          git apply /tmp/support.patch
          git config user.name "Werewolf3788"
          git config user.email "raykevin71888@gmail.com"
          git add games/all.html games/mobile/bastion.html games/mobile/index.html games/mobile/js/survive3d.js
          git rm -q .github/workflows/bake-coffee.yml
          git commit -m "Add Buy Me a Coffee support links (games hub, games page, Bastion, Tile Survival)"
          git push origin HEAD:main
      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
