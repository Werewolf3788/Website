name: temp app packaging
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: apply patch
        run: |
          python3 -c "import base64,lzma;open('p.patch','wb').write(lzma.decompress(base64.b64decode('')))"
          git apply p.patch
          rm p.patch
          git config user.name "Bastion Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Bastion: shorter upgrade name so the readout never clips"
          git push
