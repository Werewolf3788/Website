name: temp app packaging
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: apply patch
        run: |
          python3 -c "import base64,lzma;open('p.patch','wb').write(lzma.decompress(base64.b64decode('')))"
          git apply p.patch
          rm p.patch
          python3 -m pip install --quiet --break-system-packages pillow
          python3 android/bastion-icon.py games/mobile/icons
          git config user.name "Bastion Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Add the Bastion app manifest, offline shell, icons and the Android project"
          git push
