name: outpost-publish
on:
  push:
    paths:
      - .github/workflows/outpost-publish.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: unpack and patch
        run: |
          python3 - <<'PY'
          import base64, lzma, tarfile, io, json, hashlib
          bz = """
          
          """
          raw = lzma.decompress(base64.b64decode(bz.strip()))
          t = tarfile.open(fileobj=io.BytesIO(raw))
          names = t.getnames()
          t.extractall('.')
          print('unpacked', names)
          game = 'games/mobile/tiles-outpost.html'
          print('sha', hashlib.sha256(open(game,'rb').read()).hexdigest())

          p = 'games/mobile/index.html'
          s = open(p).read()
          if 'tilesOutpostBtn' in s:
              print('hub already has card')
          else:
              anchor = '<div class="card soon">'
              assert s.count(anchor) == 1, s.count(anchor)
              card = ('<div class="card">\n'
                      '  <h2 style="margin:0 0 4px">\U0001F3DB\uFE0F Tiles Outpost</h2>\n'
                      '  <div class="muted">Build a camp on a grid, train three heroes and send them out to clear expedition stages. Farms, sawmills, quarries and gold mines keep earning while you are away; barracks and temples add squad power, and every cleared stage fills the backpack with loot. Saves on this device.</div>\n'
                      '  <div class="row"><button id="tilesOutpostBtn">Play</button></div>\n'
                      '</div>\n')
              s = s.replace(anchor, card + anchor)
              marker = '// ---- leaderboard'
              assert s.count(marker) == 1, s.count(marker)
              line = "$('tilesOutpostBtn').onclick=function(){location.href='tiles-outpost.html'};\n"
              s = s.replace(marker, line + marker)
              open(p,'w').write(s)
              print('hub patched', len(s))

          c = json.load(open('games/mobile/changelog.json'))
          if c['entries'][0]['id'] < 57:
              c['entries'].insert(0, {
                  'id': 57,
                  'date': 'Nov 25',
                  'game': 'all',
                  'items': ['\U0001F3DB\uFE0F New game: Tiles Outpost - build a grid camp, train three heroes and clear expedition stages for loot']
              })
              json.dump(c, open('games/mobile/changelog.json','w'), indent=1, ensure_ascii=False)
              print('changelog latest', c['entries'][0]['id'])
          PY
      - name: commit
        run: |
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/tiles-outpost.html games/mobile/index.html games/mobile/changelog.json
          git commit -m "Add Tiles Outpost game and hub card"
          git push
