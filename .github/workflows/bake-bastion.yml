name: bake-bastion
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply drop-rate patch
        env:
          PAYLOAD: ''
        run: |
          printf '%s' "$PAYLOAD" | base64 -d | xz -dc > "$RUNNER_TEMP/drops.patch"
          test "$(sha256sum "$RUNNER_TEMP/drops.patch" | cut -d' ' -f1)" = "7339a342bf9242b656e6431a38834c475c1584dfa1d11806393baffe0ab8720f"
          git apply "$RUNNER_TEMP/drops.patch"
          test "$(sha256sum games/mobile/bastion.html | cut -d' ' -f1)" = "02db861a56ceb188c4df74b6ae82dd8833e7102cc7eda984d8cf2b0e91680e11"
      - name: Commit and push
        run: |
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/bastion.html
          if git diff --cached --quiet; then echo "already up to date"; else git commit -m "Gate legendary and mythic drops by wave and spawner"; git push origin HEAD:main; fi
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
