name: bake-bastion
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply tower model patch
        env:
          PAYLOAD: ''
        run: |
          printf '%s' "$PAYLOAD" | base64 -d | xz -dc > "$RUNNER_TEMP/towers.patch"
          test "$(sha256sum "$RUNNER_TEMP/towers.patch" | cut -d' ' -f1)" = "4f6071330ac263fc5ca6b3c4a11d2a5e463c48090c35d3d5a2984b1a2e145065"
          git apply "$RUNNER_TEMP/towers.patch"
          test "$(sha256sum games/mobile/bastion.html | cut -d' ' -f1)" = "6efb9ef5f2f3cdd1b864bf11908bb6645ebf0f12634b1fa45d01d613ef6c15e2"
      - name: Commit and push
        run: |
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/bastion.html
          if git diff --cached --quiet; then echo "already up to date"; else git commit -m "Give every Bastion tower its own model"; git push origin HEAD:main; fi
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
