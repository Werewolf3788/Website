name: bake-bastion
on:
  push:
    paths:
      - '.github/workflows/bake-bastion.yml'
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Bastion patch and push
        run: |
          set -euo pipefail
          f=games/mobile/bastion.html
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "b287a0fa049da156d8b75cb597a6882977da429d2695b5874d8c5e219ddcfad1"
          echo '' | base64 -d | xz -d > /tmp/bastion.diff
          git apply /tmp/bastion.diff
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "d110ecb72c4000932eddfa625863e6cbeae078684fbe13792c9b8965660c0dcd"
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add "$f"
          git commit -m "Bastion v1.1.2: Skyguard Flak anti-air tower"
          git push
