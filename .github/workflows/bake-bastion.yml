name: bake-bastion
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply wave difficulty patch
        env:
          PAYLOAD: ''
        run: |
          printf '%s' "$PAYLOAD" | base64 -d | xz -dc > "$RUNNER_TEMP/wave.patch"
          test "$(sha256sum "$RUNNER_TEMP/wave.patch" | cut -d' ' -f1)" = "3821095c70eeeb48e492b155f7ca7227878b7984715858e4eec1dd25d78b77ec"
          git apply "$RUNNER_TEMP/wave.patch"
          test "$(sha256sum games/mobile/bastion.html | cut -d' ' -f1)" = "9075f95bbb8843e48fd08c32cf7cd71998faa94012428c36ac1a2234b9008592"
      - name: Commit and push
        run: |
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/bastion.html
          if git diff --cached --quiet; then echo "already up to date"; else git commit -m "Make enemies tougher and faster as waves go up"; git push origin HEAD:main; fi
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
