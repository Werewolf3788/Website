name: bake-bastion
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply cash icon patch
        env:
          PAYLOAD: ''
        run: |
          printf '%s' "$PAYLOAD" | base64 -d | xz -dc > "$RUNNER_TEMP/cash.patch"
          test "$(sha256sum "$RUNNER_TEMP/cash.patch" | cut -d' ' -f1)" = "86dcad1d34f9a43c8087f583e3ee7d62b12f121bd00a5f8635b1aaba4a492515"
          git apply "$RUNNER_TEMP/cash.patch"
          test "$(sha256sum games/mobile/bastion.html | cut -d' ' -f1)" = "14a507981a190407c453fd48900d21fb0bce2a687de57a20ada56e4b0f7d7d59"
      - name: Commit and push
        run: |
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/bastion.html
          if git diff --cached --quiet; then echo "already up to date"; else git commit -m "Use a money bag instead of the coin emoji for cash"; git push origin HEAD:main; fi
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
