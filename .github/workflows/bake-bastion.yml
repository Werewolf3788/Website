name: bake-bastion
on:
  push:
    paths:
      - '.github/workflows/bake-bastion.yml'
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit
        env:
          PAYLOAD: |
            
        run: |
          set -euo pipefail
          f=games/mobile/bastion.html
          echo "9075f95bbb8843e48fd08c32cf7cd71998faa94012428c36ac1a2234b9008592  $f" | sha256sum -c -
          printf '%s' "$PAYLOAD" | base64 -d | xz -d > /tmp/p.patch
          git apply --whitespace=nowarn /tmp/p.patch
          echo "b287a0fa049da156d8b75cb597a6882977da429d2695b5874d8c5e219ddcfad1  $f" | sha256sum -c -
          git config user.name 'Werewolf'
          git config user.email 'werewolf3788@users.noreply.github.com'
          git add "$f"
          git commit -m 'Bastion 1.1.1: pause button and early-wave cash bonus'
          git push origin HEAD:main
