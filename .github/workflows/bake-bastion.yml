name: bake-bastion
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write the game file
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/b.xz
          xz -dc /tmp/b.xz > games/mobile/bastion.html
          test "$(sha256sum games/mobile/bastion.html | cut -d' ' -f1)" = "c6597d394076050284e68f352ed111e0ea1302cca27e43823c3e6f79a4d90db9"
          wc -c games/mobile/bastion.html
      - name: Commit and push
        run: |
          git config user.name "Werewolf3788"
          git config user.email "raykevin71888@gmail.com"
          git add games/mobile/bastion.html
          git commit -m "Bastion Builder 1.1.0: real 3D weapons, explosions and sounds"
          git push origin HEAD:main
      - name: Deploy to Firebase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
