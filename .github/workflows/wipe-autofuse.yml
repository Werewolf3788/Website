name: temp wipe and autofuse
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: apply patch
        run: |
          python3 -c "import base64,lzma;open('p.patch','wb').write(lzma.decompress(base64.b64decode('')))"
          git apply --check p.patch
          git apply p.patch
          rm p.patch
          git config user.name "Bastion Bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -am "Bastion: wipe the board, auto-fuse switch, instant inventory refresh"
          git push
