name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'overlay/saves/**'
      - 'public/games/**'
      - 'Playstation/**'
      - 'games/data/**'
      - 'psn.json'
      - 'README.md'
      - '.github/workflows/psn.yml'
      - '.github/workflows/sync-games-rtdb.yml'
  workflow_run:
    workflows: ["Sync Game JSONs to Firebase RTDB"]
    types:
      - completed
  workflow_dispatch:

# GitHub Pages (werewolf3788.github.io/Website) is the test site and always shows the Claude-Test
# branch (GitHub builds it from that branch). main only goes to Firebase, so merging to main never
# overwrites the test site.
permissions:
  contents: read

jobs:
  firebase:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting
      cancel-in-progress: false
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Hosting storage (keep last 5 releases)
        run: |
          pip install --quiet google-auth requests
          python scripts/hosting-cleanup.py
        env:
          GCP_SA_KEY_WEBSITE: ${{ secrets.GCP_SA_KEY_WEBSITE }}
          HOSTING_KEEP_RELEASES: '5'
        continue-on-error: true

      - name: Stamp version.json (open game pages reload themselves when this changes)
        run: printf '{"v":"%s","at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project entertainment-71888
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_WEBSITE }}

