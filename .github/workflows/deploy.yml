name: Deploy to Firebase Hosting & GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'overlay/saves/**'
      - 'public/games/**'
      - 'Playstation/**'
      - 'games/data/**'
      - 'games/fs25/data/**'
      - '.github/workflows/fs25-sync.yml'
      - 'psn.json'
      - 'README.md'
      - '.github/workflows/psn.yml'
      - '.github/workflows/sync-games-rtdb.yml'
  workflow_run:
    workflows: ["Sync Game JSONs to Firebase RTDB"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  firebase:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting
      cancel-in-progress: false
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Hosting storage (keep last 5 releases)
        run: |
          pip install --quiet google-auth requests
          python scripts/hosting-cleanup.py
        env:
          GCP_SA_KEY_WEBSITE: ${{ secrets.GCP_SA_KEY_WEBSITE }}
          HOSTING_KEEP_RELEASES: '5'
        continue-on-error: true

      - name: Stamp version.json (open game pages reload themselves when this changes)
        run: printf '{"v":"%s","at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project entertainment-71888
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_WEBSITE }}

  pages:
    name: Deploy to GitHub Pages (overlays)
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy_try.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stamp version.json (open game pages reload themselves when this changes)
        run: printf '{"v":"%s","at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # GitHub sometimes can't find the artifact it was just given ("No artifacts named github-pages"):
      # wait a moment and try once more before calling the deploy failed
      - name: Deploy to GitHub Pages
        id: deploy_try
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying
        if: steps.deploy_try.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deploy_retry
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
