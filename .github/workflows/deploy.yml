name: Deploy to Firebase Hosting & GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/games/**'
      - 'Playstation/**'
      - 'game/data/**'
      - 'psn.json'
      - 'README.md'
      - '.github/workflows/psn.yml'
      - '.github/workflows/sync-games-rtdb.yml'
  workflow_run:
    workflows: ["Sync Game JSONs to Firebase RTDB"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  firebase:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting
      cancel-in-progress: false
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project entertainment-71888
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_WEBSITE }}

  pages:
    name: Deploy to GitHub Pages (overlays)
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
