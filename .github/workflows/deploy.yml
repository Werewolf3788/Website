# ==============================================================================
# GitHub Actions Workflow: Dual-Deploy to Firebase Hosting & GitHub Pages
# Firebase:      https://entertainment-71888.web.app  (hosting.public in firebase.json)
# GitHub Pages:  https://werewolf3788.github.io/Website/  (whole repo, for overlays)
# Target Secret: GCP_SA_KEY_WEBSITE
# The two deploys run as separate jobs, so one failing does not block the other.
# ==============================================================================

name: Deploy to Firebase Hosting & GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  firebase:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tip: pin this to a release tag or commit SHA instead of @master
      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project entertainment-71888
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_WEBSITE }}

  pages:
    name: Deploy to GitHub Pages (overlays)
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
