# ==============================================================================
# GitHub Actions Workflow: Auto-Deploy to Firebase Hosting
# Project: playstation-be936
# Target Secret: GCP_SA_KEY_WEBSITE
# Timestamp: 2026-09-23 11:45:00 EDT (New York)
# ==============================================================================

name: Deploy to Google Cloud & Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build, Package and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository files into runner workspace
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 environment
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Deploy to Firebase Hosting using GCP_SA_KEY_WEBSITE secret
      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project playstation-be936
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_WEBSITE }}
