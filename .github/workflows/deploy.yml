# ==============================================================================
# GitHub Actions Workflow: Deploy to Firebase Hosting
# Target Project: entertainment-71888  |  Site: https://entertainment-71888.web.app
# Target Secret: GCP_SA_KEY_WEBSITE
# Deploys whatever folder firebase.json names under hosting.public (your /public).
# ==============================================================================

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tip: pin this to a release tag or commit SHA instead of @master
      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project entertainment-71888
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_WEBSITE }}
