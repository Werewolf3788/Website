name: add music theme entry
on:
  push:
    paths:
      - '.theme-build/add-music.py'
      - '.github/workflows/add-music-theme.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch theme file
        run: python3 .theme-build/add-music.py
      - name: Verify
        run: |
          test "$(sha256sum overlay/stream_overlay_theme.json | cut -d' ' -f1)" = "7b39c76721f32da2cdd5f777758432319f543ff6b8a721503e2b2568cd6ea215"
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .theme-build/add-music.py .github/workflows/add-music-theme.yml
          git add overlay/stream_overlay_theme.json
          git commit -m "overlay: add Music category palette to stream_overlay_theme.json"
          git push
