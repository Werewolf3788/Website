name: tmp-outpost-ch2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and commit
        run: |
          python3 - <<'PY'
          import base64, lzma
          blob = ""
          open("/tmp/p.patch", "wb").write(lzma.decompress(base64.b64decode(blob)))
          PY
          git apply --verbose /tmp/p.patch
          git config user.name "site-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A games/mobile
          git commit -m "Tiles Outpost: second chapter with twelve new missions"
          git push origin HEAD:main
