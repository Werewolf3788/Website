name: Bastion APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Launcher icon
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 android/bastion-icon.py /tmp/icon
          mkdir -p android/app/src/main/res/drawable
          cp /tmp/icon/bastion-512.png android/app/src/main/res/drawable/ic_launcher.png
      - name: Android SDK pieces
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null || true
          "$SDK" --install "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build the app
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleDebug
      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BastionBuilder.apk
          gh release create "bastion-app-${{ github.run_number }}" BastionBuilder.apk --title "Bastion Builder for Android" --notes "Download BastionBuilder.apk and open it on your phone to install. Android may ask you to allow installs from your browser first."
