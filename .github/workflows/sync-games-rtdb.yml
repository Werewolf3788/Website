name: Sync Game JSONs to Firebase RTDB

on:
  push:
    paths:
      - 'public/games/**'
      - '.github/workflows/sync-games-rtdb.yml'
  workflow_dispatch:

jobs:
  sync-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify JSON Files Exist
        run: |
          echo "Checking public/games folder:"
          ls -la public/games/

      - name: Push All Game JSONs to Firebase RTDB
        run: |
          for filepath in public/games/*.json; do
            [ -e "$filepath" ] || continue
            filename=$(basename "$filepath")
            gamekey="${filename%.*}"
            
            echo "Uploading $filename as key: $gamekey ..."
            
            response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT \
              -H "Content-Type: application/json" \
              -d @"$filepath" \
              "https://entertainment-71888-default-rtdb.firebaseio.com/games/${gamekey}.json")
            
            http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
            body=$(echo "$response" | sed '/HTTP_STATUS/d')
            
            echo "Status Code: $http_status"
            if [ "$http_status" -ne 200 ]; then
              echo "Firebase Error Response: $body"
              exit 1
            else
              echo "Successfully synced $gamekey to /games/$gamekey"
            fi
          done
