name: Sync Game JSONs to Firebase RTDB

on:
  push:
    paths:
      - 'public/games/**'
      - 'website/public/games/**'
      - '.github/workflows/sync-games-rtdb.yml'
  workflow_dispatch:

jobs:
  sync-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Games to RTDB
        env:
          FIREBASE_ENTERTAINEMENT_API: ${{ secrets.FIREBASE_ENTERTAINEMENT_API }}
        run: node scripts/sync-games-rtdb.js
