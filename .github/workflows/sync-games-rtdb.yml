name: Sync Game JSONs to Firebase RTDB

on:
  push:
    paths:
      - 'public/games/**'
      - '.github/workflows/sync-games-rtdb.yml'
  workflow_dispatch:

jobs:
  sync-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate and Push JSONs to RTDB
        shell: python
        run: |
          import os
          import glob
          import json
          import urllib.request
          import urllib.error

          target_dir = "public/games"
          if not os.path.exists(target_dir):
              print(f"Error: Target directory '{target_dir}' does not exist.")
              exit(1)

          json_files = glob.glob(os.path.join(target_dir, "*.json"))
          if not json_files:
              print(f"No .json files found in {target_dir}")
              exit(0)

          print(f"Found {len(json_files)} game file(s). Starting validation and upload...")

          failed_files = []
          catalog_index = {}
          success_count = 0

          for filepath in json_files:
              filename = os.path.basename(filepath)
              game_key = os.path.splitext(filename)[0]

              # Skip any manifest or internal index files
              if game_key in ["manifest", "catalog"]:
                  continue

              # Step 1: Read and validate JSON syntax
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      raw_data = json.load(f)
              except Exception as err:
                  print(f"⚠️ SKIPPING BAD FILE: Syntax error in {filename}: {err}")
                  failed_files.append((filename, f"Syntax Error: {err}"))
                  continue

              # Step 2: Minify payload
              try:
                  clean_payload = json.dumps(raw_data).encode('utf-8')
              except Exception as dump_err:
                  print(f"⚠️ SKIPPING BAD FILE: Serialization error in {filename}: {dump_err}")
                  failed_files.append((filename, f"Serialization Error: {dump_err}"))
                  continue

              # Step 3: PUT directly to RTDB REST endpoint
              url = f"https://entertainment-71888-default-rtdb.firebaseio.com/games/{game_key}.json"
              print(f"Pushing {filename} -> /games/{game_key} ...")

              req = urllib.request.Request(
                  url,
                  data=clean_payload,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="PUT"
              )

              try:
                  with urllib.request.urlopen(req) as resp:
                      if resp.status == 200:
                          print(f"✅ Successfully synced: /games/{game_key}")
                          success_count += 1
                          # Extract game title for the dynamic catalog
                          game_title = raw_data.get("game") or raw_data.get("title") or game_key.upper()
                          catalog_index[game_key] = {
                              "key": game_key,
                              "title": game_title,
                              "file": filename
                          }
                      else:
                          print(f"⚠️ Unexpected status {resp.status} for {filename}")
                          failed_files.append((filename, f"HTTP Status {resp.status}"))
              except Exception as net_err:
                  print(f"❌ Upload Error on {filename}: {net_err}")
                  failed_files.append((filename, f"Error: {net_err}"))

          # Step 4: Push the dynamic catalog index so Universal.js never hardcodes game lists
          if catalog_index:
              catalog_payload = json.dumps(catalog_index).encode('utf-8')
              catalog_url = "https://entertainment-71888-default-rtdb.firebaseio.com/games_catalog.json"
              req_cat = urllib.request.Request(
                  catalog_url,
                  data=catalog_payload,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="PUT"
              )
              try:
                  with urllib.request.urlopen(req_cat) as resp:
                      if resp.status == 200:
                          print(f"✅ Published dynamic catalog to /games_catalog ({len(catalog_index)} games)")
              except Exception as cat_err:
                  print(f"⚠️ Could not write /games_catalog index: {cat_err}")

          print(f"\nUpload complete. {success_count}/{len(json_files)} succeeded.")

          if failed_files:
              print("\nFiles with issues (skipped):")
              for f_name, f_err in failed_files:
                  print(f"  - {f_name}: {f_err}")

          # Do not fail the whole build if at least one game was pushed
          if success_count > 0:
              print("Proceeding: Successful games are live on RTDB.")
              exit(0)
          else:
              print("Error: Zero games were successfully pushed.")
              exit(1)
