name: rush-v2
on:
  push:
    paths:
      - .github/workflows/rush-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: unpack
        run: |
          python3 - <<'PY'
          import base64, lzma, tarfile, io, hashlib
          bz = """
          
          """
          raw = lzma.decompress(base64.b64decode(bz.strip()))
          t = tarfile.open(fileobj=io.BytesIO(raw))
          print('unpacked', t.getnames())
          t.extractall('.')
          for f in ['idle-city','merge-lair']:
              p = 'games/mobile/' + f + '.html'
              print(f, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - name: commit
        run: |
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/idle-city.html games/mobile/merge-lair.html
          git commit -m "Rebuild City Rush and Merge Lair as active games"
          git push
