name: tmp-daily-events
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and commit
        run: |
          python3 - <<'PY'
          import base64, lzma, os
          js = ""
          patch = ""
          os.makedirs("games/mobile/js", exist_ok=True)
          open("games/mobile/js/daily.js", "wb").write(lzma.decompress(base64.b64decode(js)))
          open("/tmp/p.patch", "wb").write(lzma.decompress(base64.b64decode(patch)))
          PY
          git apply --verbose /tmp/p.patch
          git add -A games/mobile
          git config user.name "site-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -m "Daily events for the games"
          git push origin HEAD:main
