name: tmp-fix-list-1
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unpack and commit
        run: |
          python3 - <<'PY'
          import base64, lzma
          files = {
          "games/mobile/bricks.html": "",
          }
          for path, blob in files.items():
              data = lzma.decompress(base64.b64decode(blob))
              open(path, "wb").write(data)
              print("wrote", path, len(data))
          PY
          git config user.name "site-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A games/mobile
          git commit -m "Fix campaign list spacing (1/2)"
          git push origin HEAD:main
