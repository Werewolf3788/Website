name: hub-patch
on:
  push:
    paths:
      - '.github/workflows/hub-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add hub cards and changelog entry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          p = 'games/mobile/index.html'
          s = open(p, encoding='utf-8').read()

          cards = '''<div class="card">
            <h2 style="margin:0 0 4px">🏙️ Idle City</h2>
            <div class="muted">Build a city that earns while you are away. Tap the skyline for cash, spend it on lemonade stands up to sky towers, and buy upgrades for bigger taps and +10% city income. It keeps earning for up to two hours offline at half speed, and saves on this device.</div>
            <div class="row"><button id="idleCityBtn">Play</button></div>
          </div>
          <div class="card">
            <h2 style="margin:0 0 4px">🐉 Merge Lair</h2>
            <div class="muted">Merge Dragons-style: tap the nest to lay eggs, then tap an egg and tap another of the same kind — a third one joins in and the three become the next creature. Work up from Eggs to Elder Dragons, sell what you don't need and buy extra eggs with your coins. Saves on this device.</div>
            <div class="row"><button id="mergeLairBtn">Play</button></div>
          </div>
          '''

          anchor = '<div class="card soon">'
          assert s.count(anchor) == 1
          s = s.replace(anchor, cards + anchor)

          handlers = """  $('idleCityBtn').onclick = function () { location.href = 'idle-city.html'; };
            $('mergeLairBtn').onclick = function () { location.href = 'merge-lair.html'; };
          """
          a2 = '  // ---- leaderboard'
          assert s.count(a2) == 1
          s = s.replace(a2, handlers + a2)
          open(p, 'w', encoding='utf-8').write(s)

          cp = 'games/mobile/changelog.json'
          d = json.load(open(cp, encoding='utf-8'))
          assert d['entries'][0]['id'] == 55
          d['entries'].insert(0, {
            'id': 56,
            'date': 'Nov 25',
            'game': 'all',
            'items': [
              "🏙️ New game: Idle City — tap and build a skyline that keeps earning while you're away, with upgrades and offline cash",
              "🐉 New game: Merge Lair — lay eggs, merge three of a kind and work your way up to Elder Dragons"
            ]
          })
          open(cp, 'w', encoding='utf-8').write(json.dumps(d, indent=1, ensure_ascii=False) + '\n')
          print('patched', len(s))
          PY
          git config user.name "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"
          git add games/mobile/index.html games/mobile/changelog.json games/mobile/idle-city.html games/mobile/merge-lair.html
          git commit -m "Add Idle City and Merge Lair to the games hub"
          git push
