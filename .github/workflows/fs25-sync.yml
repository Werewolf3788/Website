# ============================================================================
# File: .github/workflows/fs25-sync.yml
# Deployment Timestamp: 2026-09-28 01:55:00 (EDT - 24hr New York Time)
# Project: fs25-a3563 (/fs25 RTDB Node)
# Target Database: https://fs25-a3563-default-rtdb.firebaseio.com/fs25
# Description: Automated FS25 Live G-Portal Ingestion Pipeline.
#              - Stripped Discord webhooks for pure Firebase RTDB syncing.
#              - Light Scan: Checks HTTP dedicated-server-stats.xml for players.
#              - Heavy Scan: Syncs Farm 1 & 2 balances and harvest-ready fields.
#              - Runs every 30 minutes on cron schedule.
#              - Supports manual workflow_dispatch with force override.
# ============================================================================

name: FS25 Live Backup Sync

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force immediate telemetry run'
        required: false
        default: 'true'

concurrency:
  group: fs25-sync
  cancel-in-progress: true

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          cd games/FS25
          if [ -f package.json ]; then
            npm install basic-ftp dotenv xml2js
          else
            npm init -y
            npm install basic-ftp dotenv xml2js
          fi

      - name: Execute Live Ingestion Script
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || '207.244.246.70' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FS25_API_CODE: ${{ secrets.FS25_API_CODE || '3FvqSlOsYKckfauM' }}
          FS25_WEB_PORT: ${{ secrets.FS25_WEB_PORT || '8080' }}
          DEFAULT_SAVE_SLOT: ${{ secrets.DEFAULT_SAVE_SLOT || '3' }}
          FIREBASE_DATABASE_URL: "https://fs25-a3563-default-rtdb.firebaseio.com"
          FIREBASE_PROJECT_ID: "fs25-a3563"
          FIREBASE_API_KEY: "AIzaSyBwhhUNH0itRb2hQcnSap_vGfnErAGVzZc"
          FIREBASE_APP_ID: "1:528331196894:web:5af51bc2c80fd56aecf54f"
          FIREBASE_MEASUREMENT_ID: "G-SGJF0FJPQZ"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          cd games/FS25
          echo "🚀 Running fs25.js under Node $(node -v)..."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node fs25.js --force
          else
            node fs25.js
          fi
