<!-- Firebase Session & Active Nickname Sync Engine -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        setPersistence, 
        browserLocalPersistence, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDeuNBGHcwU4rFyOcsfGxLHjmEdpADacmc",
        authDomain: "entertainment-71888.firebaseapp.com",
        databaseURL: "https://entertainment-71888-default-rtdb.firebaseio.com",
        projectId: "entertainment-71888",
        storageBucket: "entertainment-71888.firebasestorage.app",
        messagingSenderId: "660524340277",
        appId: "1:660524340277:web:ef8f4ed04fa985a4f88d7c",
        measurementId: "G-JDNSLD3GFE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Enforce local persistence across the entire domain repository
    setPersistence(auth, browserLocalPersistence).then(() => {
        onAuthStateChanged(auth, (user) => {
            const badge = document.getElementById("activeNicknameBadge");

            if (user && !user.isAnonymous) {
                // User is logged in: grab their custom gaming nickname (or fallback)
                const activeNickname = localStorage.getItem('active_gaming_nickname') || user.displayName || user.email.split('@')[0];
                localStorage.setItem('active_gaming_nickname', activeNickname);
                
                if (badge) {
                    badge.textContent = `🎮 ${activeNickname}`;
                    badge.classList.remove("hidden");
                }
            } else {
                // Guest mode: check if a nickname was chosen previously in cookies/localStorage
                const savedNickname = localStorage.getItem('active_gaming_nickname');
                if (savedNickname && badge) {
                    badge.textContent = `🎮 ${savedNickname} (Guest View)`;
                    badge.classList.remove("hidden");
                } else if (badge) {
                    badge.classList.add("hidden");
                }
            }
        });
    });
</script>
