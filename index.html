    <style>
        /* === SECTION: Dynamic CSS Custom Variables & Theme System === */
        :root {
            --header-text-size: 30px;
            --body-text-size: 14px;
            --row-height: 30px;
            --section-height: 50px;
            
            /* Fallbacks before user settings load from Firestore / LocalStorage */
            --primary-color: #ff5f1f;   /* Default Glow, Active Tab, Borders */
            --secondary-color: #1e293b; /* Default Cards & Menu Backgrounds */
            
            --color-werewolf: #FF5F1F;
            --color-ray: #C41E3A;
            --color-phoenix: #00f2ff;
            --color-terrdog: #9333ea;
        }

        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-size: var(--body-text-size);
            line-height: var(--row-height);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .max-w-7xl {
            width: 80% !important;
            max-width: 80% !important;
            margin-left: auto;
            margin-right: auto;
        }

        h1, h2, h3 {
            font-size: var(--header-text-size);
            line-height: 1.2;
            font-weight: 800;
            color: #38bdf8;
        }

        .section-padding {
            padding-top: var(--section-height);
            padding-bottom: var(--section-height);
        }

        /* === SECTION: Dynamic Card & Surface Theme Integration === */
        .custom-card, .category-section {
            background-color: var(--secondary-color, rgba(30, 41, 59, 0.85)) !important;
            backdrop-filter: blur(10px);
            border: 1px solid var(--primary-color, rgba(255, 255, 255, 0.2)) !important;
            box-shadow: 0 0 12px var(--primary-color, rgba(255, 95, 31, 0.3)) !important;
            border-radius: 1rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        /* === SECTION: Dynamic Menu & Active Tab Glow System === */
        #desktop-nav-links .group\/dropdown > button,
        #mobile-nav-links .group\/dropdown > button {
            background-color: var(--secondary-color, #1e293b) !important;
            border-radius: 6px;
        }

        /* Rule: Menu Font Color STRICTLY Pure White (#ffffff) */
        #desktop-nav-links button span,
        #desktop-nav-links a span,
        #mobile-nav-links button span,
        #mobile-nav-links a span,
        .group\/dropdown button,
        .group\/dropdown a {
            color: #ffffff !important;
        }

        /* Active Tab: Text Glow using Primary Color while font stays white */
        .nav-tab-active,
        .active-menu-item,
        a.active-tab,
        a[data-active="true"] {
            border-bottom: 2px solid var(--primary-color, #ff5f1f) !important;
            border-left: 4px solid var(--primary-color, #ff5f1f) !important;
            background-color: var(--secondary-color, #1e293b) !important;
            box-shadow: 0 0 14px var(--primary-color, #ff5f1f), inset 0 0 8px var(--primary-color, rgba(255, 95, 31, 0.3)) !important;
        }

        /* Active Text Glow Effect */
        .nav-tab-active span,
        .active-menu-item span,
        a.active-tab span,
        a[data-active="true"] span {
            color: #ffffff !important;
            text-shadow: 0 0 10px var(--primary-color, #ff5f1f), 0 0 18px var(--primary-color, #ff5f1f) !important;
            font-weight: 900 !important;
        }

        /* Weather Overlay Support */
        .weather-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .weather-layer.active { opacity: 1; }

        .card-content {
            position: relative;
            z-index: 10;
        }

        .bg-rain { background: linear-gradient(to bottom, #1e293b, #0f172a); }
        .bg-cloudy { background: linear-gradient(to bottom, #475569, #1e293b); }
        .bg-sunny { background: linear-gradient(to bottom, #fbbf24, #f59e0b); }
        .bg-snowy { background: linear-gradient(to bottom, #1e40af, #3b82f6); }
        .bg-clear { background: linear-gradient(to bottom, #0f172a, #020617); }

        .rain-drop {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            width: 1px;
            height: 15px;
            top: -20px;
            animation: fall linear infinite;
        }

        .cloud-puff {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            filter: blur(20px);
            animation: float 10s ease-in-out infinite;
        }

        .sun-glow {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            animation: pulse-sun 4s ease-in-out infinite;
        }

        .snow-ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: white;
            filter: blur(8px);
            opacity: 0.6;
        }
        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            top: -10px;
            animation: drift linear infinite;
        }

        @keyframes fall { to { transform: translateY(350px); } }
        @keyframes drift { to { transform: translateY(350px) translateX(20px); } }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 15px); }
        }
        @keyframes pulse-sun {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }

        .status-pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .border-werewolf { border-color: var(--color-werewolf); }
        .text-werewolf { color: var(--color-werewolf); }
        .shadow-werewolf { box-shadow: 0 10px 15px -3px rgba(255, 95, 31, 0.4); }

        .border-ray { border-color: var(--color-ray); }
        .text-ray { color: var(--color-ray); }
        .shadow-ray { box-shadow: 0 10px 15px -3px rgba(196, 30, 58, 0.4); }

        .border-phoenix { border-color: var(--color-phoenix); }
        .text-phoenix { 
            color: var(--color-phoenix); 
            text-shadow: 0 0 8px rgba(0, 242, 255, 0.6);
        }
        .shadow-phoenix { box-shadow: 0 0 20px -5px rgba(0, 242, 255, 0.5); }

        .border-terrdog { border-color: var(--color-terrdog); }
        .text-terrdog { color: var(--color-terrdog); }
        .shadow-terrdog { box-shadow: 0 10px 15px -3px rgba(147, 51, 234, 0.4); }

        .is-sunny h3 { color: #0f172a !important; }
        .is-sunny p { color: #1e293b !important; }
        .is-sunny .weather-desc { color: #334155 !important; opacity: 0.9; }
        .is-sunny .border-terrdog, .is-sunny .border-werewolf, .is-sunny .border-ray, .is-sunny .border-phoenix { border-color: rgba(0,0,0,0.4); }
        .is-sunny .visit-link { color: #0f172a !important; border-color: rgba(0,0,0,0.3) !important; }
        
        .is-sunny .text-phoenix { 
            color: #007788 !important; 
            text-shadow: none;
        }

        .kf-watermark {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-family: 'Arial Black', sans-serif;
            font-size: 28px;
            z-index: 999;
            pointer-events: none;
            user-select: none;
            opacity: 0.8;
        }
        .k-sig { color: #FF4500; display: inline-block; transform: scaleX(-1); position: relative; z-index: 2; }
        .f-sig { color: #000000; display: inline-block; margin-left: -0.22em; position: relative; z-index: 1; }
    </style>
    
    <!-- Instant Local Theme Cache Reader to Prevent Flash -->
    <script>
        (function() {
            const p = localStorage.getItem('user_primary_color');
            const s = localStorage.getItem('user_secondary_color');
            if (p) document.documentElement.style.setProperty('--primary-color', p);
            if (s) document.documentElement.style.setProperty('--secondary-color', s);
        })();
    </script>
