<script>
// --- CORE ENGINE ---
(function() {
    let movies = [];
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbnwK6U18P1u1eAS8a_PqZzpOKxQ9AATL6RBH7CfxXQR10YPM63akRqxSDbNiXYJWs92tvobh6iqE7/pub?output=csv";

    // Strict Date Handler for Column J (MM/DD/YYYY)
    function getSafeTimestamp(ds) {
        if (!ds) return 0;
        const p = ds.split(/[\/\-\.]/);
        if (p.length < 3) return 0;
        let m = parseInt(p[0]), d = parseInt(p[1]), y = parseInt(p[2]);
        if (isNaN(m) || isNaN(d) || isNaN(y)) return 0;
        if (y < 100) y += (y < 50 ? 2000 : 1900);
        return new Date(y, m-1, d).getTime() || 0;
    }

    async function loadCSV() {
        try {
            // SPEED UPGRADE 1: Blazing Fast Local Cache (1 Hour Expiration)
            const cachedData = localStorage.getItem('werewolf_cinema_csv');
            const cacheTime = localStorage.getItem('werewolf_cinema_time');
            const now = Date.now();
            
            if (cachedData && cacheTime && (now - parseInt(cacheTime) < 3600000)) {
                // Instantly load from memory
                parseCSV(cachedData);
                
                // Silently fetch in the background to update the cache for the next load
                fetch(CSV_URL).then(r => r.text()).then(text => {
                    localStorage.setItem('werewolf_cinema_csv', text);
                    localStorage.setItem('werewolf_cinema_time', Date.now().toString());
                }).catch(e => console.error("Silent Background Sync Failed", e));
                return;
            }

            // Normal fetch if no cache exists
            const res = await fetch(CSV_URL);
            const text = await res.text();
            
            // Save to Cache for next time
            localStorage.setItem('werewolf_cinema_csv', text);
            localStorage.setItem('werewolf_cinema_time', Date.now().toString());
            
            parseCSV(text);
        } catch (e) { console.error("CSV Sync Failure", e); }
    }

    function parseCSV(data) {
        let rows = [], currentRow = [], currentCell = '', inQuotes = false;
        for (let i=0; i<data.length; i++) {
            let char = data[i], next = data[i+1];
            if (char === '"' && inQuotes && next === '"') { currentCell += '"'; i++; }
            else if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { currentRow.push(currentCell.trim()); currentCell = ''; }
            else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && next === '\n') i++;
                currentRow.push(currentCell.trim()); rows.push(currentRow); currentRow = []; currentCell = '';
            } else currentCell += char;
        }
        if (currentCell || currentRow.length) { currentRow.push(currentCell.trim()); rows.push(currentRow); }
        
        movies = rows.slice(1).map(v => ({
            title: v[0]||'', image: v[1]||'', year: v[2]||'', 
            platforms: { amazon:v[3], google:v[4], youtube:v[5], moviesanywhere:v[6], apple:v[7], fandango:v[8] },
            dateAdded: v[9]||'', imdbId: v[10]||'', 
            cast: v[11] ? v[11].split(',').map(s=>s.trim()).filter(Boolean) : [],
            edition: v[12]||'', collection: v[13]||'', genre: v[14]||'', runtime: v[15]||'',
            type: v[16]||'', streaming: v[17]||'', description: v[18]||'',
            timestamp: getSafeTimestamp(v[9])
        })).filter(m => m.title && m.title.length < 120);

        updateDropdowns();
        runFilters();
    }

    // --- SPEED UPGRADE 2: Global vars for Infinite Scroll (DOM Virtualization) ---
    let currentRenderList = [];
    let currentRenderIndex = 0;
    const CHUNK_SIZE = 48; // Load 48 movies at a time to prevent UI freezing
    let scrollObserver;

    window.renderMovies = (list) => {
        const grid = document.getElementById('movie-library-grid');
        grid.innerHTML = ''; // Clear current grid
        
        currentRenderList = list;
        currentRenderIndex = 0;
        
        // Render first chunk immediately
        window.renderNextChunk();
        
        document.getElementById('movie-counter').innerHTML = `Cinema Inventory: <span>${list.length}</span>`;
    };

    window.renderNextChunk = () => {
        const grid = document.getElementById('movie-library-grid');
        const slice = currentRenderList.slice(currentRenderIndex, currentRenderIndex + CHUNK_SIZE);
        
        slice.forEach(m => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openLightbox(m);
            
            // Suppression: Hide "Standard" or empty editions
            const hasEdition = m.edition && m.edition.toLowerCase() !== 'standard' && m.edition.trim() !== '';
            
            card.innerHTML = `
                <div class="poster-box">
                    <img src="${m.image}" loading="lazy" onerror="this.src='https://raw.githubusercontent.com/KFruti88/Movies-Anywhere/main/images/default.jpg'">
                    <div class="poster-year-badge black-outline">${m.year}</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title black-outline">${m.title}</div>
                    <div class="main-desc">${m.description || 'N/A'}</div>
                    <div class="main-meta-row black-outline">
                        <span>${m.runtime || '0m'}</span>
                        ${hasEdition ? `<span>•</span><span>${m.edition}</span>` : ''}
                    </div>
                    <div class="click-indicator black-outline">Details & Streams</div>
                </div>
            `;
            grid.appendChild(card);
        });
        
        currentRenderIndex += CHUNK_SIZE;
        
        // Trigger infinite scroll setup if there are more movies
        if (currentRenderIndex < currentRenderList.length) {
            setupIntersectionObserver();
        }
    };

    function setupIntersectionObserver() {
        let sentinel = document.getElementById('scroll-sentinel');
        if (!sentinel) {
            sentinel = document.createElement('div');
            sentinel.id = 'scroll-sentinel';
            sentinel.style.width = "100%";
            sentinel.style.height = "20px";
            // Insert sentinel right after the grid
            const grid = document.getElementById('movie-library-grid');
            grid.parentNode.insertBefore(sentinel, grid.nextSibling);
        }
        
        if (scrollObserver) scrollObserver.disconnect();
        
        scrollObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                scrollObserver.disconnect();
                window.renderNextChunk();
            }
        });
        scrollObserver.observe(sentinel);
    }

    window.runFilters = () => {
        const query = document.getElementById('movie-search').value.toLowerCase();
        const typeF = document.getElementById('type-select').value;
        const genreF = document.getElementById('genre-select').value;
        const collF = document.getElementById('collection-select').value;
        const artF = document.getElementById('artist-select').value;
        const sort = document.getElementById('sort-select').value;

        let filtered = movies.filter(m => {
            const pool = [m.title, m.year, m.genre, m.description, ...m.cast].join(' ').toLowerCase();
            const searchMatch = pool.includes(query);
            const typeMatch = !typeF || (typeF === 'TV' ? m.type.toLowerCase().includes('tv') : m.type.toLowerCase().includes('movie'));
            const genreMatch = !genreF || m.genre.toLowerCase().includes(genreF.toLowerCase());
            const collMatch = !collF || m.collection === collF;
            const artMatch = !artF || m.cast.includes(artF);
            return searchMatch && typeMatch && genreMatch && collMatch && artMatch;
        });

        // Advanced Sorting Logic
        if (sort === 'newest') filtered.sort((a,b) => b.timestamp - a.timestamp);
        else if (sort === 'oldest') filtered.sort((a,b) => a.timestamp - b.timestamp);
        else if (sort === 'az') filtered.sort((a,b) => a.title.localeCompare(b.title));
        else if (sort === 'za') filtered.sort((a,b) => b.title.localeCompare(a.title));
        else if (sort === 'new-old') filtered.sort((a,b) => (parseInt(b.year)||0) - (parseInt(a.year)||0));
        else if (sort === 'old-new') filtered.sort((a,b) => (parseInt(a.year)||0) - (parseInt(b.year)||0));
        else if (sort === 'actor-az') filtered.sort((a,b) => (a.cast[0]||'').localeCompare(b.cast[0]||''));

        renderMovies(filtered);
    };

    // --- NEW: Filter By Clicked Actor ---
    window.filterByActor = (actorName) => {
        closeLightbox();
        // Clear conflicting filters to ensure all movies for this actor are visible
        document.getElementById('movie-search').value = '';
        document.getElementById('genre-select').value = '';
        document.getElementById('collection-select').value = '';
        
        // Select the artist in the dropdown
        document.getElementById('artist-select').value = actorName;
        
        runFilters();
        // Scroll smoothly back up to the controls
        document.getElementById('controls-container').scrollIntoView({ behavior: 'smooth' });
    };

    window.openLightbox = (m) => {
        const lb = document.getElementById('movie-lightbox');
        document.getElementById('lightbox-inner').style.backgroundImage = `url('${m.image}')`;
        document.getElementById('lb-title').textContent = m.title;
        
        const hasEdition = m.edition && m.edition.toLowerCase() !== 'standard' && m.edition.trim() !== '';
        
        // --- Clickable IMDb Link ---
        const imdbLinkHtml = m.imdbId ? `<a href="https://www.imdb.com/title/${m.imdbId}/" target="werewolf_cinema_window" class="imdb-link black-outline">IMDb: ${m.imdbId}</a> | ` : '';
        document.getElementById('lb-meta-container').innerHTML = `${imdbLinkHtml}${m.genre}${hasEdition ? ` | Edition: ${m.edition}` : ''}`;
        
        // --- FIXED: Only show buttons if they exist in the spreadsheet ---
        let btns = [];
        const p = m.platforms;
        
        if (p.amazon && p.amazon.startsWith('http')) btns.push(`<a href="${p.amazon}" target="werewolf_cinema_window" class="m-link btn-amazon">Amazon</a>`);
        if (p.google && p.google.startsWith('http')) btns.push(`<a href="${p.google}" target="werewolf_cinema_window" class="m-link btn-google">Google</a>`);
        if (p.moviesanywhere && p.moviesanywhere.startsWith('http')) btns.push(`<a href="${p.moviesanywhere}" target="werewolf_cinema_window" class="m-link btn-moviesanywhere">MA</a>`);
        if (p.apple && p.apple.startsWith('http')) btns.push(`<a href="${p.apple}" target="werewolf_cinema_window" class="m-link btn-apple">Apple TV</a>`);
        if (p.fandango && p.fandango.startsWith('http')) btns.push(`<a href="${p.fandango}" target="werewolf_cinema_window" class="m-link btn-fandango">Fandango</a>`);
        if (p.youtube && p.youtube.startsWith('http')) btns.push(`<button onclick="playYouTube('${p.youtube}')" class="m-link btn-youtube">YouTube</button>`);
        
        document.getElementById('lb-buttons').innerHTML = btns.join('');
        
        // --- FIXED: Show Column R text with Buy/Rent suppression, but NO clickable links ---
        let streamingText = '';
        if (m.streaming && m.streaming.trim() !== '') {
            const platforms = m.streaming.split(',').map(s => s.trim()).filter(Boolean);
            let displayPlatforms = [];
            
            platforms.forEach(platform => {
                const pLower = platform.toLowerCase();
                // Suppress "Buy / Rent" text if we already have store buttons rendered below
                if ((pLower === 'buy' || pLower === 'rent' || pLower.includes('buy/rent') || pLower.includes('buy / rent') || pLower.includes('buy & rent')) && btns.length > 0) {
                    return;
                }
                displayPlatforms.push(platform);
            });
            
            if (displayPlatforms.length > 0) {
                streamingText = `Available on: ${displayPlatforms.join(', ')}`;
            }
        }
        document.getElementById('lb-streaming').textContent = streamingText;
        
        // --- Clickable Actor Links ---
        // Replacing single quotes safely so it doesn't break the onclick attribute
        const actorLinksHtml = m.cast.map(actor => `<span class="actor-link black-outline" onclick="filterByActor('${actor.replace(/'/g, "\\'")}')">${actor}</span>`).join(' • ');
        document.getElementById('lb-artists').innerHTML = `<strong class="black-outline">Starring:</strong><br>${actorLinksHtml}`;
        
        const hasMA = m.platforms.moviesanywhere && m.platforms.moviesanywhere.trim() !== '';
        document.getElementById('lb-store-heading').textContent = hasMA ? "Buy / Rent / Sync" : "Buy / Rent";

        lb.classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = () => {
        document.getElementById('movie-lightbox').classList.remove('active');
        document.body.style.overflow = 'auto';
        closeYouTube();
    };

    window.playYouTube = (u) => {
        const vid = u.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        if (vid && vid[2].length === 11) {
            document.getElementById('lb-video-wrapper').classList.add('active').style.display = "flex";
            document.getElementById('lb-yt-iframe').src = `https://www.youtube.com/embed/${vid[2]}?autoplay=1`;
        } else window.open(u, 'werewolf_cinema_window');
    };

    window.closeYouTube = (e) => {
        if(e) e.stopPropagation();
        
        const videoWrapper = document.getElementById('lb-video-wrapper');
        const iframe = document.getElementById('lb-yt-iframe');
        
        if(videoWrapper && iframe) {
            videoWrapper.classList.remove('active');
            videoWrapper.style.display = "none";
            iframe.src = "";
        }
    };

    function updateDropdowns() {
        const gSet = new Set(), cSet = new Set(), aSet = new Set();
        movies.forEach(m => { 
            if(m.genre) gSet.add(m.genre); 
            if(m.collection) cSet.add(m.collection);
            m.cast.forEach(a => aSet.add(a));
        });
        const fill = (id, set, label) => {
            const el = document.getElementById(id);
            if (!el) return;
            const cur = el.value;
            el.innerHTML = `<option value="">All ${label}</option>`;
            Array.from(set).sort().forEach(v => {
                const o = document.createElement('option');
                o.value = v; o.textContent = v;
                if (v === cur) o.selected = true;
                el.appendChild(o);
            });
        };
        fill('genre-select', gSet, 'Genres');
        fill('collection-select', cSet, 'Collections');
        fill('artist-select', aSet, 'Artists');
    }

    window.resetFilters = () => {
        ['movie-search','type-select','genre-select','collection-select','artist-select'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('sort-select').value = 'newest';
        runFilters();
    };

    const startClock = () => {
        const update = () => {
            const now = new Date();
            document.getElementById('header-clock').textContent = `${now.toLocaleDateString()} | ${now.toLocaleTimeString()}`;
        };
        update(); setInterval(update, 1000);
    };

    window.onload = () => { startClock(); loadCSV(); };
})();
</script>
