<script>
// --- CORE ENGINE ---
(function() {
    let movies = [];
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbnwK6U18P1u1eAS8a_PqZzpOKxQ9AATL6RBH7CfxXQR10YPM63akRqxSDbNiXYJWs92tvobh6iqE7/pub?output=csv";
    let currentDataHash = null;

    // --- FALLBACK STREAMING LINK DICTIONARY (Updated with Affiliate Cinemax) ---
    const streamMap = {
        'disney+': 'https://www.disneyplus.com',
        'disney plus': 'https://www.disneyplus.com',
        'hulu': 'https://www.hulu.com',
        'netflix': 'https://www.netflix.com',
        'max': 'https://www.max.com',
        'hbo max': 'https://www.max.com',
        'paramount+': 'https://www.paramountplus.com',
        'paramount plus': 'https://www.paramountplus.com',
        'peacock': 'https://www.peacocktv.com',
        'peacock premium': 'https://www.peacocktv.com',
        'crunchyroll': 'https://www.crunchyroll.com',
        'tubi': 'https://tubitv.com',
        'tubi tv': 'https://tubitv.com',
        'pluto tv': 'https://pluto.tv',
        'pluto': 'https://pluto.tv',
        'freevee': 'https://www.amazon.com/freevee',
        'cinemax': 'https://www.amazon.com/gp/video/channel/82d58d06-360f-4b41-a276-945c01205d62?&linkCode=ll2&tag=moviesanywhere02-20&linkId=332d0f3133b19a4ca8f34eec4ca698a4&language=en_US&ref_=as_li_ss_tl'
    };

    function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = Math.imul(31, hash) + str.charCodeAt(i) | 0;
        return hash;
    }

    function getSafeTimestamp(ds) {
        if (!ds) return 0;
        const p = ds.split(/[\/\-\.]/);
        if (p.length < 3) return 0;
        let m = parseInt(p[0]), d = parseInt(p[1]), y = parseInt(p[2]);
        if (isNaN(m) || isNaN(d) || isNaN(y)) return 0;
        if (y < 100) y += (y < 50 ? 2000 : 1900);
        return new Date(y, m-1, d).getTime() || 0;
    }

    async function loadCSV() {
        try {
            const noCacheUrl = CSV_URL + "&t=" + new Date().getTime();
            const res = await fetch(noCacheUrl, { cache: 'no-store' });
            const text = await res.text();
            parseCSV(text);
        } catch (e) { console.error("CSV Sync Failure", e); }
    }

    function parseCSV(data) {
        let newHash = hashString(data);
        if (currentDataHash === newHash) return; 
        let isUpdate = currentDataHash !== null;
        currentDataHash = newHash;

        let rows = [], currentRow = [], currentCell = '', inQuotes = false;
        for (let i=0; i<data.length; i++) {
            let char = data[i], next = data[i+1];
            if (char === '"' && inQuotes && next === '"') { currentCell += '"'; i++; }
            else if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { currentRow.push(currentCell.trim()); currentCell = ''; }
            else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && next === '\n') i++;
                currentRow.push(currentCell.trim()); rows.push(currentRow); currentRow = []; currentCell = '';
            } else currentCell += char;
        }
        if (currentCell || currentRow.length) { currentRow.push(currentCell.trim()); rows.push(currentRow); }
        
        movies = rows.slice(1).map((v, index) => {
            const p = { amazon:v[3], google:v[4], youtube:v[5], moviesanywhere:v[6], apple:v[7], fandango:v[8] };
            return {
                title: v[0]||'', image: v[1]||'', year: v[2]||'', 
                platforms: p,
                dateAdded: v[9]||'', imdbId: v[10]||'', 
                cast: v[11] ? v[11].split(',').map(s=>s.trim()).filter(Boolean) : [],
                edition: v[12]||'', collection: v[13]||'', genre: v[14]||'', runtime: v[15]||'',
                type: v[16]||'', streaming: v[17]||'', description: v[18]||'',
                timestamp: getSafeTimestamp(v[9]),
                csvIndex: index
            };
        }).filter(m => {
            const hasValidLink = m.platforms.amazon?.trim() || m.platforms.google?.trim() || m.platforms.youtube?.trim() || 
                                 m.platforms.moviesanywhere?.trim() || m.platforms.apple?.trim() || m.platforms.fandango?.trim();
            return m.title && m.title.length < 120 && hasValidLink;
        });

        updateDropdowns();
        runFilters();
        if (isUpdate) {
            const counter = document.getElementById('movie-counter');
            counter.innerHTML = `Live Sync Completed! <span style="color:#1ce783;">(New Edits Live)</span>`;
            setTimeout(() => { counter.innerHTML = `Cinema Inventory: <span>${movies.length}</span>`; }, 4000);
        }
    }

    window.renderMovies = (list) => {
        const grid = document.getElementById('movie-library-grid');
        grid.innerHTML = '';
        list.forEach(m => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openLightbox(m);
            const hasEdition = m.edition && m.edition.toLowerCase() !== 'standard' && m.edition.trim() !== '';
            card.innerHTML = `
                <div class="poster-box">
                    <img src="${m.image}" loading="lazy" onerror="this.src='https://raw.githubusercontent.com/KFruti88/Movies-Anywhere/main/images/default.jpg'">
                    <div class="poster-year-badge black-outline">${m.year}</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title black-outline">${m.title}</div>
                    <div class="main-desc">${m.description || 'N/A'}</div>
                    <div class="main-meta-row black-outline">
                        <span>${m.runtime || '0m'}</span>
                        ${hasEdition ? `<span>•</span><span>${m.edition}</span>` : ''}
                    </div>
                    <div class="click-indicator black-outline">Details & Streams</div>
                </div>
            `;
            grid.appendChild(card);
        });
        document.getElementById('movie-counter').innerHTML = `Cinema Inventory: <span>${list.length}</span>`;
    };

    window.runFilters = () => {
        const query = document.getElementById('movie-search').value.toLowerCase();
        const typeF = document.getElementById('type-select').value;
        const genreF = document.getElementById('genre-select').value;
        const collF = document.getElementById('collection-select').value;
        const artF = document.getElementById('artist-select').value;
        const sort = document.getElementById('sort-select').value;
        const queryWords = query.split(/\s+/).filter(w => w.length > 0);

        let filtered = movies.filter(m => {
            const pool = [m.title, m.year, m.genre, ...m.cast].join(' ').toLowerCase();
            const searchMatch = queryWords.length === 0 || queryWords.every(word => pool.includes(word));
            const typeMatch = !typeF || (typeF === 'TV' ? m.type.toLowerCase().includes('tv') : m.type.toLowerCase().includes('movie'));
            const genreMatch = !genreF || m.genre.toLowerCase().includes(genreF.toLowerCase());
            const collMatch = !collF || m.collection === collF;
            const artMatch = !artF || m.cast.some(a => a.toLowerCase() === artF.toLowerCase());
            return searchMatch && typeMatch && genreMatch && collMatch && artMatch;
        });

        if (sort === 'newest') filtered.sort((a,b) => (b.timestamp - a.timestamp) || (b.csvIndex - a.csvIndex));
        else if (sort === 'oldest') filtered.sort((a,b) => (a.timestamp - b.timestamp) || (a.csvIndex - b.csvIndex));
        else if (sort === 'az') filtered.sort((a,b) => a.title.toLowerCase().localeCompare(b.title.toLowerCase()));
        else if (sort === 'za') filtered.sort((a,b) => b.title.toLowerCase().localeCompare(a.title.toLowerCase()));
        else if (sort === 'new-old') filtered.sort((a,b) => (parseInt(b.year)||0) - (parseInt(a.year)||0));
        else if (sort === 'old-new') filtered.sort((a,b) => (parseInt(a.year)||0) - (parseInt(b.year)||0));
        renderMovies(filtered);
    };

    window.filterByActor = (actorName) => {
        closeLightbox();
        document.getElementById('movie-search').value = '';
        document.getElementById('genre-select').value = '';
        document.getElementById('collection-select').value = '';
        document.getElementById('artist-select').value = actorName;
        runFilters();
        document.getElementById('controls-container').scrollIntoView({ behavior: 'smooth' });
    };

    window.openLightbox = (m) => {
        const lb = document.getElementById('movie-lightbox');
        document.getElementById('lightbox-inner').style.backgroundImage = `url('${m.image}')`;
        document.getElementById('lb-title').textContent = m.title;
        const hasEdition = m.edition && m.edition.toLowerCase() !== 'standard' && m.edition.trim() !== '';
        const imdbLinkHtml = m.imdbId ? `<a href="https://www.imdb.com/title/${m.imdbId}/" target="werewolf_cinema_window" class="imdb-link black-outline">IMDb: ${m.imdbId}</a> | ` : '';
        document.getElementById('lb-meta-container').innerHTML = `${imdbLinkHtml}${m.genre}${hasEdition ? ` | Edition: ${m.edition}` : ''}`;
        
        const streamContainer = document.getElementById('lb-streaming');
        let streamText = m.streaming ? m.streaming.trim() : '';
        
        if (!streamText || streamText.toLowerCase() === 'no free streams' || streamText.toLowerCase() === 'not streaming') {
            streamContainer.style.display = 'none';
        } else {
            let cleanedText = streamText.replace(/No Free Streams\s*\|\s*/gi, '').replace(/Buy\/Rent:\s*/gi, '');
            const streamParts = cleanedText.split(/\s*[,|]\s*/).map(rawName => {
                let s = rawName.trim();
                if (!s) return null;
                let key = s.toLowerCase();
                let targetUrl = null;
                let isYouTube = false;
                let isAppTarget = false;

                const getAmzUrl = (url) => {
                    if (!url) return null;
                    let amzUrl = url.trim();
                    if (amzUrl && !amzUrl.includes('moviesanywhere02-20')) {
                        amzUrl += amzUrl.includes('?') ? '&tag=moviesanywhere02-20' : '?tag=moviesanywhere02-20';
                    }
                    return amzUrl;
                };

                if ((key.includes('amazon') || key.includes('prime')) && m.platforms.amazon) {
                    targetUrl = getAmzUrl(m.platforms.amazon);
                    isAppTarget = true;
                } else if ((key.includes('google') || key.includes('play')) && m.platforms.google) {
                    targetUrl = m.platforms.google;
                } else if (key.includes('youtube') && m.platforms.youtube) {
                    targetUrl = m.platforms.youtube;
                    isYouTube = true;
                } else if ((key.includes('apple') || key.includes('itunes')) && m.platforms.apple) {
                    targetUrl = m.platforms.apple;
                    isAppTarget = true;
                } else if ((key.includes('fandango') || key.includes('vudu')) && m.platforms.fandango) {
                    targetUrl = m.platforms.fandango;
                } else if ((key.includes('movies anywhere') || key === 'ma') && m.platforms.moviesanywhere) {
                    targetUrl = m.platforms.moviesanywhere;
                } else {
                    for (const [mapKey, mapUrl] of Object.entries(streamMap)) {
                        if (key.includes(mapKey)) {
                            targetUrl = mapUrl;
                            if (mapKey === 'youtube') isYouTube = true;
                            if (mapKey.includes('amazon') || mapKey.includes('prime') || mapKey.includes('apple') || mapKey === 'cinemax') isAppTarget = true;
                            break;
                        }
                    }
                }
                if (targetUrl) {
                    if (isYouTube) return `<a href="#" onclick="playYouTube('${targetUrl}'); return false;" class="stream-link black-outline">${s}</a>`;
                    let linkTarget = isAppTarget ? '_blank' : 'werewolf_cinema_window';
                    return `<a href="${targetUrl}" target="${linkTarget}" class="stream-link black-outline">${s}</a>`;
                }
                return `<span class="black-outline">${s}</span>`;
            }).filter(Boolean);
            
            if (streamParts.length > 0) {
                streamContainer.innerHTML = `Available on: ${streamParts.join(', ')}`;
                streamContainer.style.display = 'block';
            } else { streamContainer.style.display = 'none'; }
        }
        const actorLinksHtml = m.cast.map(actor => `<span class="actor-link black-outline" onclick="filterByActor('${actor.replace(/'/g, "\\'")}')">${actor}</span>`).join(' • ');
        document.getElementById('lb-artists').innerHTML = `<strong class="black-outline">Starring:</strong><br>${actorLinksHtml}`;
        const hasMA = m.platforms.moviesanywhere && m.platforms.moviesanywhere.trim() !== '';
        document.getElementById('lb-store-heading').textContent = hasMA ? "Buy / Rent / Sync" : "Buy / Rent";
        let btns = [];
        const p = m.platforms;
        if (p.amazon && p.amazon.trim() !== '') {
            let amzUrl = p.amazon.trim();
            if (!amzUrl.includes('moviesanywhere02-20')) amzUrl += amzUrl.includes('?') ? '&tag=moviesanywhere02-20' : '?tag=moviesanywhere02-20';
            btns.push(`<a href="${amzUrl}" target="_blank" class="m-link btn-amazon">Amazon</a>`);
        }
        if (p.google && p.google.trim() !== '') btns.push(`<a href="${p.google}" target="werewolf_cinema_window" class="m-link btn-google">Google</a>`);
        if (p.moviesanywhere && p.moviesanywhere.trim() !== '') btns.push(`<a href="${p.moviesanywhere}" target="werewolf_cinema_window" class="m-link btn-moviesanywhere">MA</a>`);
        if (p.apple && p.apple.trim() !== '') btns.push(`<a href="${p.apple}" target="_blank" class="m-link btn-apple">Apple TV</a>`);
        if (p.fandango && p.fandango.trim() !== '') btns.push(`<a href="${p.fandango}" target="werewolf_cinema_window" class="m-link btn-fandango">Fandango</a>`);
        if (p.youtube && p.youtube.trim() !== '') btns.push(`<button onclick="playYouTube('${p.youtube}')" class="m-link btn-youtube">YouTube</button>`);
        document.getElementById('lb-buttons').innerHTML = btns.join('');
        lb.classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = () => { document.getElementById('movie-lightbox').classList.remove('active'); document.body.style.overflow = 'auto'; closeYouTube(); };
    window.playYouTube = (u) => {
        const vid = u.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        if (vid && vid[2].length === 11) {
            document.getElementById('lb-video-wrapper').classList.add('active').style.display = "flex";
            document.getElementById('lb-yt-iframe').src = `https://www.youtube.com/embed/${vid[2]}?autoplay=1`;
        } else window.open(u, 'werewolf_cinema_window');
    };
    window.closeYouTube = (e) => {
        if(e) e.stopPropagation();
        const videoWrapper = document.getElementById('lb-video-wrapper');
        const iframe = document.getElementById('lb-yt-iframe');
        if(videoWrapper && iframe) { videoWrapper.classList.remove('active'); videoWrapper.style.display = "none"; iframe.src = ""; }
    };
    function updateDropdowns() {
        const gSet = new Set(), cSet = new Set(), aSet = new Set();
        movies.forEach(m => { 
            if(m.genre) m.genre.split(',').forEach(g => { const clean = g.trim(); if(clean) gSet.add(clean); });
            if(m.collection) cSet.add(m.collection);
            m.cast.forEach(a => aSet.add(a));
        });
        const fill = (id, set, label) => {
            const el = document.getElementById(id); if (!el) return;
            const cur = el.value; el.innerHTML = `<option value="">All ${label}</option>`;
            const fragment = document.createDocumentFragment();
            Array.from(set).sort((a,b) => a.toLowerCase().localeCompare(b.toLowerCase())).forEach(v => {
                const o = document.createElement('option'); o.value = v; o.textContent = v;
                if (v === cur) o.selected = true; fragment.appendChild(o);
            });
            el.appendChild(fragment);
        };
        fill('genre-select', gSet, 'Genres'); fill('collection-select', cSet, 'Collections'); fill('artist-select', aSet, 'Artists');
    }
    window.resetFilters = () => { ['movie-search','type-select','genre-select','collection-select','artist-select'].forEach(id => document.getElementById(id).value = ''); document.getElementById('sort-select').value = 'newest'; runFilters(); };
    const startClock = () => { const update = () => { const now = new Date(); document.getElementById('header-clock').textContent = `${now.toLocaleDateString()} | ${now.toLocaleTimeString()}`; }; update(); setInterval(update, 1000); };
    window.onload = () => { startClock(); loadCSV(); setInterval(loadCSV, 30000); };
})();
</script>
