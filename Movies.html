      function getDirectDatabaseReferenceUrl(item) {

        const rawId = item.id.toString().trim();

        }
        if (lower.startsWith("tvdb-")) {
          const cleanSeries = rawId.replace(/^tvdb-/i, "").split("-")[0];
          return `//www.thetvdb.com/dereferrer/series/${cleanSeries}`;
        }

        // 2. IMDb (tt format or imdb- prefix)
        if (lower.startsWith("tt") || lower.startsWith("imdb-")) {

          return `//www.imdb.com/title/${imdbClean}/`;

              <div class="card-body">
                <div>
                  <h3 class="card-title" title="${m.title || ''}">${m.title || 'Untitled'}</h3>
                  <div class="card-sub">
                    <span>${m.year || ''}</span>
                    <span>&bull;</span>
                    <span>${m.runtime || (m.type === 'TV Show' ? '22 min' : '')}</span>
                  </div>
                </div>
                ${streamingSnippet}
                <div class="card-actions">
                  <button class="btn btn-primary" onclick="openDetailsModal('${m._key}')">Details &amp; Watch</button>
                </div>
              </div>
            </div>
          `;
        }).join("");
      }

      // Line 475: Lightbox Modal Handler
      window.openDetailsModal = function(itemKey) {
        const item = libraryCatalog.find(m => m._key === itemKey);
        if (!item) return;

        modalTitle.textContent = item.title || "Untitled";
        modalPoster.src = item.poster || "//via.placeholder.com/500x750/141419/a1a1aa?text=No+Poster";
        
        // Restrict image ALT descriptions strictly to Lightbox view
        const altText = `Official key art poster for ${item.title || 'Media'} (${item.year || 'N/A'}) - Edition: ${item.edition || 'Standard'}`;
        modalPoster.alt = altText;
        modalAltDesc.textContent = altText;

        modalRating.textContent = item.rating || "NR";
        modalYear.textContent = item.year || "N/A";
        modalRuntime.textContent = item.runtime || (item.type === "TV Show" ? "22 min" : "N/A");
        modalType.textContent = item.type || "Movie";

        if (item.edition) {
          modalEdition.textContent = item.edition;
          modalEdition.style.display = "inline-block";
        } else {
          modalEdition.style.display = "none";
        }

        modalGenres.textContent = item.genre ? `Genre: ${item.genre}` : "";
        
        const castStr = Array.isArray(item.actors) ? item.actors.join(", ") : (item.actors || "");
        modalCast.textContent = castStr ? `Starring: ${castStr}` : "";

        modalSynopsis.textContent = item.description || "No plot summary available in catalog.";

        // Streaming Availability (Column L data)
        if (item.streaming && item.streaming.trim() !== "") {
          modalStreaming.textContent = item.streaming;
          modalStreaming.style.display = "block";
        } else {
          modalStreaming.style.display = "none";
        }

        // External Storefronts & Universal Reference Buttons
        const buttons = [];
        const refUrl = getDirectDatabaseReferenceUrl(item);

        if (refUrl) {
          const isTvdb = (item.id || "").toLowerCase().includes("tvdb");
          const isImdb = (item.id || "").toLowerCase().includes("tt");
          const label = isTvdb ? "TheTVDB" : (isImdb ? "IMDb" : "TMDb");
          buttons.push(`<a class="btn btn-secondary" href="${refUrl}" target="_blank" rel="noopener">${label}</a>`);
        }

        if (item.amazon) buttons.push(`<a class="btn btn-secondary" href="${item.amazon}" target="_blank" rel="noopener">Amazon</a>`);
        if (item.apple) buttons.push(`<a class="btn btn-secondary" href="${item.apple}" target="_blank" rel="noopener">Apple TV</a>`);
        if (item.fandango) buttons.push(`<a class="btn btn-secondary" href="${item.fandango}" target="_blank" rel="noopener">Fandango</a>`);
        if (item.google) buttons.push(`<a class="btn btn-secondary" href="${item.google}" target="_blank" rel="noopener">Google TV</a>`);
        if (item.ma) buttons.push(`<a class="btn btn-secondary" href="${item.ma}" target="_blank" rel="noopener">Movies Anywhere</a>`);
        if (item.youtube) buttons.push(`<a class="btn btn-secondary" href="${item.youtube}" target="_blank" rel="noopener">${item.youtubeFree ? 'YouTube Free' : 'YouTube'}</a>`);
        if (item.justwatch) buttons.push(`<a class="btn btn-secondary" href="${item.justwatch}" target="_blank" rel="noopener">JustWatch</a>`);

        modalStorefronts.innerHTML = buttons.join("");
        mediaModal.classList.add("active");

        // Google Analytics Card Open Event
        if (typeof gtag === "function") {
          gtag("event", "movie_card_open", {
            movie_title: item.title,
            canonical_id: item.id,
            media_type: item.type || "Movie"
          });
        }
      };

      function closeModal() {
        mediaModal.classList.remove("active");
        modalPoster.src = "";
        modalPoster.alt = "";
        modalAltDesc.textContent = "";
      }

      modalCloseBtn.addEventListener("click", closeModal);
      mediaModal.addEventListener("click", (e) => {
        if (e.target === mediaModal) closeModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && mediaModal.classList.contains("active")) {
          closeModal();
        }
      });

      // Filter & Search Triggers
      searchInput.addEventListener("input", renderCards);
      typeFilter.addEventListener("change", () => {
        renderCards();
        if (typeof gtag === "function") {
          gtag("event", "filter_change", {
            filter_type: typeFilter.value
          });
        }
      });

      // Deep Linking via URL Hash (#id)
      function checkUrlDeepLink() {
        const hash = window.location.hash.replace("#", "").trim().toLowerCase();
        if (!hash) return;

        const target = libraryCatalog.find(m => 
          (m.id && m.id.toLowerCase() === hash) || 
          (m._key && m._key.toLowerCase() === hash)
        );

        if (target) {
          openDetailsModal(target._key);
        }
      }

      // Initialize Load
      loadCinemaLibrary();
    });
  </script>
</body>
</html>
