<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Cinema Library</title>
    
    <script src="https://raw.githack.com/Werewolf3788/SKVentureSigns/main/Languge_Fonts/language_alphabets.js"></script>
    <script src="https://raw.githack.com/Werewolf3788/SKVentureSigns/main/Languge_Fonts/fontSwitcher.js"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z9M5LXQ5XN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Z9M5LXQ5XN');
      gtag('config', 'G-L376P3NPY4');
    </script>

    <style>
        :root {
            --wolf-red: #8b0000;
            --wolf-glow: rgba(139, 0, 0, 0.6);
            --header-bg: rgba(0, 0, 0, 0.95);
            --card-bg: rgba(15, 15, 15, 0.98);
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            margin: 0; padding: 0;
            overflow-x: hidden;
            background: radial-gradient(circle at center top, #1a1010 0%, #050505 50%, #000000 100%) fixed;
        }

        .master-85-width { width: 85% !important; margin: 0 auto; max-width: 2560px; }
        .black-outline { text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000 !important; }

        /* Navigation Styling */
        #dynamic-nav-container {
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 10000;
            backdrop-filter: blur(10px);
        }

        .nav-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px 0;
            gap: 5px;
        }

        .nav-item { position: relative; display: inline-block; }
        
        .nav-link {
            color: #ccc;
            text-decoration: none;
            padding: 8px 15px;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-link:hover { background: var(--wolf-red); color: #fff; }

        .nav-img { height: 18px; width: 18px; object-fit: cover; border-radius: 4px; }

        /* Dropdown Menu */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            min-width: 220px;
            display: none;
            flex-direction: column;
            padding: 8px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .nav-item:hover .dropdown-menu { display: flex; }

        .dropdown-item {
            padding: 10px 15px;
            color: #eee;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item:hover { background: var(--wolf-red); color: #fff; }

        /* Header & Library Grid */
        #library-header {
            width: 100%; background: var(--header-bg); border-bottom: 2px solid var(--wolf-red);
            padding: 40px 20px; border-radius: 0 0 24px 24px; margin-bottom: 30px;
            text-align: center; position: relative;
        }

        h2, #cinema-logo { font-size: 30px !important; font-weight: 900; }
        #cinema-logo span { color: var(--wolf-red); }
        #header-clock { position: absolute; top: 10px; right: 20px; font-size: 11px; color: #ff0000; opacity: 0.8; }
        
        #movie-library-grid { display: grid; gap: 15px; width: 100%; grid-template-columns: repeat(2, 1fr); }
        @media (min-width: 768px) { #movie-library-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; } }

        .movie-card {
            background: var(--card-bg); border: 1px solid #222; border-radius: 12px;
            overflow: hidden; transition: 0.3s; cursor: pointer; display: flex; flex-direction: column;
        }
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px var(--wolf-glow); border-color: var(--wolf-red); }

        .poster-box { position: relative; aspect-ratio: 2/3; background: #000; }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; }
        .poster-year-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 900; }

        .movie-info { padding: 12px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; }
        .movie-title { font-weight: 800; font-size: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; min-height: 2.5em; display: flex; align-items: center; justify-content: center; }

        /* Filters */
        #movie-search { width: 90%; max-width: 600px; padding: 14px 25px; border-radius: 50px; background: #111; border: 1px solid #333; color: #fff; margin-bottom: 20px; text-align: center; }
        .f-select { background: #111; color: #ffff00; border: 1px solid #444; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* Lightbox */
        #movie-lightbox { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 20px; }
        #movie-lightbox.active { display: flex; }
        .lightbox-content { width: 100%; max-width: 500px; height: 85vh; border: 2px solid #ff0000; border-radius: 20px; position: relative; background-size: cover; background-position: center; }
        .lightbox-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #000 45%, rgba(0,0,0,0.4) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; text-align: center; overflow-y: auto; }
        
        .m-link { padding: 10px 4px; border-radius: 8px; font-size: 10px; text-transform: uppercase; color: #fff; text-decoration: none; text-align: center; }
        .btn-amazon { background: #FF9900 !important; color: #000 !important; }
        .btn-google { background: #4285F4; }
        .btn-moviesanywhere { background: #00aeef; }
        .btn-youtube { background: #FF0000; }
        
        .actor-link { cursor: pointer; color: #38bdf8; }
        .actor-link:hover { color: #ff0000; text-decoration: underline; }

        #kf-watermark { position: fixed; bottom: 10px; left: 10px; font-size: 24px; font-weight: 900; opacity: 0.8; z-index: 10000; pointer-events: none; }
        .kf-k { color: #FF4500; transform: scaleX(-1); display: inline-block; }
        .kf-f { color: #000; margin-left: -0.22em; text-shadow: 0 0 2px #fff; }
    </style>
</head>
<body class="theme-dark">

<nav id="dynamic-nav-container">
    <div id="nav-target" class="nav-wrapper master-85-width">
        <span style="color:#555; font-size:12px;">Syncing Menu...</span>
    </div>
</nav>

<div id="wp-custom-wrapper" class="master-85-width">
    <div id="library-header">
        <div id="header-clock" class="black-outline">Loading...</div>
        <div id="cinema-logo" class="black-outline">WEREWOLF <span>CINEMA</span></div>
        <div id="movie-counter" class="black-outline">Updating Inventory...</div>
        <div id="sync-indicator" class="black-outline" style="font-size: 11px; color: #1ce783; margin-top: 5px; font-weight: bold;">🟢 LIVE ITC SYNC ACTIVE</div>
        
        <div style="margin: 20px 0; font-size: 12px; color: #aaa;">
            <p class="black-outline">As an Amazon Associate, <strong>Werewolf3788</strong> earns from qualifying purchases.</p>
        </div>

        <div id="controls-container">
            <input type="text" id="movie-search" placeholder="Search library..." onkeyup="runFilters()">
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px;">
                <select id="type-select" class="f-select" onchange="runFilters()">
                    <option value="">All Content</option>
                    <option value="Movie">Movies</option>
                    <option value="TV">TV Shows</option>
                </select>
                <select id="genre-select" class="f-select" onchange="runFilters()"><option value="">All Genres</option></select>
                <select id="sort-select" class="f-select" onchange="runFilters()">
                    <option value="newest">Recently Added</option>
                    <option value="az">A-Z</option>
                    <option value="actor-az">Actor: A-Z</option>
                </select>
                <button onclick="resetFilters()" style="background:#222; color:#fff; border:1px solid #444; padding:10px 20px; border-radius:8px; cursor:pointer;">Reset</button>
            </div>
        </div>
    </div>

    <div id="movie-library-grid"></div>
</div>

<div id="movie-lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" id="lightbox-inner" onclick="event.stopPropagation()">
        <button onclick="closeLightbox()" style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.8); color:#fff; border:1px solid #fff; border-radius:50%; width:30px; height:30px; cursor:pointer; z-index:100;">X</button>
        <div class="lightbox-overlay">
            <h2 id="lb-title" class="black-outline"></h2>
            <div id="lb-meta" style="font-size:12px; color:#ccc; margin-bottom:10px;"></div>
            <div id="lb-cast" style="font-size:13px; margin-bottom:20px;"></div>
            <div id="lb-buttons" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px;"></div>
        </div>
    </div>
</div>

<div id="kf-watermark"><span class="kf-k">K</span><span class="kf-f">F</span></div>

<script>
(function() {
    let movies = [];
    const LIBRARY_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbnwK6U18P1u1eAS8a_PqZzpOKxQ9AATL6RBH7CfxXQR10YPM63akRqxSDbNiXYJWs92tvobh6iqE7/pub?output=csv";
    const NAV_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7s86dWkDdx-SomMJamUCFEEsQEpgcPBxUFmanAuYrWqqVSfDqOEhgLs1hZfLRFOPK7vLFeXKcMXqK/pub?output=csv";

    // --- HELPER: CSV Parser ---
    function parseCSVToArray(data) {
        let rows = [], currentRow = [], currentCell = '', inQuotes = false;
        for (let i = 0; i < data.length; i++) {
            let char = data[i], next = data[i+1];
            if (char === '"' && inQuotes && next === '"') { currentCell += '"'; i++; }
            else if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { currentRow.push(currentCell.trim()); currentCell = ''; }
            else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && next === '\n') i++;
                currentRow.push(currentCell.trim()); rows.push(currentRow); currentRow = []; currentCell = '';
            } else currentCell += char;
        }
        if (currentCell || currentRow.length) { currentRow.push(currentCell.trim()); rows.push(currentRow); }
        return rows;
    }

    // --- LOGIC: Navigation ---
    async function loadNavigation() {
        try {
            const cachedNav = localStorage.getItem('werewolf_nav_csv');
            if (cachedNav) renderNavigation(cachedNav);
            
            const res = await fetch(NAV_CSV + "&_t=" + Date.now());
            const text = await res.text();
            if (text !== cachedNav) {
                localStorage.setItem('werewolf_nav_csv', text);
                renderNavigation(text);
            }
        } catch (e) { console.error("Nav Sync Failed", e); }
    }

    function renderNavigation(csvData) {
        const rows = parseCSVToArray(csvData).slice(1);
        const navTarget = document.getElementById('nav-target');
        if (!navTarget) return;
        
        navTarget.innerHTML = '';
        const groups = {};
        const standalone = [];

        rows.forEach(row => {
            const item = { name: row[0], group: row[1], url: row[2], img: row[3] };
            if (!item.name) return;
            if (item.group && item.group.trim() !== "") {
                if (!groups[item.group]) groups[item.group] = [];
                groups[item.group].push(item);
            } else standalone.push(item);
        });

        standalone.forEach(item => {
            const el = document.createElement('div');
            el.className = 'nav-item';
            el.innerHTML = `<a href="${item.url}" target="werewolf_cinema_window" class="nav-link">
                ${item.img ? `<img src="${item.img}" class="nav-img" onerror="this.style.display='none'">` : ''} ${item.name}
            </a>`;
            navTarget.appendChild(el);
        });

        Object.keys(groups).forEach(gName => {
            const el = document.createElement('div');
            el.className = 'nav-item';
            let html = `<a href="javascript:void(0)" class="nav-link">${gName} ▾</a><div class="dropdown-menu">`;
            groups[gName].forEach(sub => {
                html += `<a href="${sub.url}" target="werewolf_cinema_window" class="dropdown-item">
                    ${sub.img ? `<img src="${sub.img}" class="nav-img" onerror="this.style.display='none'">` : ''} ${sub.name}
                </a>`;
            });
            html += `</div>`;
            el.innerHTML = html;
            navTarget.appendChild(el);
        });
    }

    // --- LOGIC: Movie Library ---
    async function loadLibrary() {
        try {
            const cached = localStorage.getItem('werewolf_cinema_csv');
            if (cached) processLibrary(cached);
            
            const res = await fetch(LIBRARY_CSV + "&_t=" + Date.now());
            const text = await res.text();
            if (text !== cached) {
                localStorage.setItem('werewolf_cinema_csv', text);
                processLibrary(text);
            }
        } catch (e) { console.error("Lib Sync Failed", e); }
    }

    function processLibrary(csvData) {
        const rows = parseCSVToArray(csvData).slice(1);
        movies = rows.map(v => ({
            title: v[0]||'', image: v[1]||'', year: v[2]||'',
            platforms: { amz: v[3], goo: v[4], yt: v[5], ma: v[6] },
            dateStr: v[9]||'', cast: v[11] ? v[11].split(',').map(s=>s.trim()) : [],
            genre: v[14]||'', type: v[16]||''
        })).filter(m => m.title);
        
        // Populate Genres
        const genres = [...new Set(movies.map(m => m.genre))].sort();
        const gSelect = document.getElementById('genre-select');
        gSelect.innerHTML = '<option value="">All Genres</option>';
        genres.forEach(g => gSelect.innerHTML += `<option value="${g}">${g}</option>`);

        runFilters();
    }

    window.runFilters = () => {
        const q = document.getElementById('movie-search').value.toLowerCase();
        const g = document.getElementById('genre-select').value;
        const s = document.getElementById('sort-select').value;

        let filtered = movies.filter(m => {
            const matchSearch = m.title.toLowerCase().includes(q) || m.cast.join(' ').toLowerCase().includes(q);
            const matchGenre = !g || m.genre === g;
            return matchSearch && matchGenre;
        });

        if (s === 'az') filtered.sort((a,b) => a.title.localeCompare(b.title));
        if (s === 'actor-az') filtered.sort((a,b) => (a.cast[0]||'').localeCompare(b.cast[0]||''));

        renderGrid(filtered);
    };

    function renderGrid(list) {
        const grid = document.getElementById('movie-library-grid');
        grid.innerHTML = '';
        list.forEach(m => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openLightbox(m);
            card.innerHTML = `
                <div class="poster-box">
                    <img src="${m.image}" loading="lazy" onerror="this.src='https://placehold.co/200x300/111/fff?text=No+Image'">
                    <div class="poster-year-badge">${m.year}</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title black-outline">${m.title}</div>
                    <div style="font-size:10px; color:#aaa; margin-top:5px;">${m.genre}</div>
                </div>
            `;
            grid.appendChild(card);
        });
        document.getElementById('movie-counter').innerHTML = `Cinema Inventory: <span>${list.length}</span>`;
    }

    window.openLightbox = (m) => {
        const lb = document.getElementById('movie-lightbox');
        document.getElementById('lb-title').innerText = m.title;
        document.getElementById('lb-meta').innerText = `${m.year} • ${m.genre}`;
        document.getElementById('lb-cast').innerHTML = `<strong>Starring:</strong> ` + m.cast.join(', ');
        
        let btns = [];
        if (m.platforms.amz) btns.push(`<a href="${m.platforms.amz}" target="werewolf_cinema_window" class="m-link btn-amazon">Amazon</a>`);
        if (m.platforms.goo) btns.push(`<a href="${m.platforms.goo}" target="werewolf_cinema_window" class="m-link btn-google">Google</a>`);
        if (m.platforms.ma) btns.push(`<a href="${m.platforms.ma}" target="werewolf_cinema_window" class="m-link btn-moviesanywhere">MA</a>`);
        if (m.platforms.yt) btns.push(`<a href="${m.platforms.yt}" target="werewolf_cinema_window" class="m-link btn-youtube">YouTube</a>`);
        
        document.getElementById('lb-buttons').innerHTML = btns.join('');
        document.getElementById('lightbox-inner').style.backgroundImage = `url('${m.image}')`;
        lb.classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = () => {
        document.getElementById('movie-lightbox').classList.remove('active');
        document.body.style.overflow = 'auto';
    };

    window.resetFilters = () => {
        document.getElementById('movie-search').value = '';
        document.getElementById('genre-select').value = '';
        document.getElementById('sort-select').value = 'newest';
        runFilters();
    };

    // --- Initialization ---
    function startClock() {
        const update = () => {
            const now = new Date();
            document.getElementById('header-clock').innerText = now.toLocaleString();
        };
        update(); setInterval(update, 1000);
    }

    // Background Poll
    setInterval(() => { loadLibrary(); loadNavigation(); }, 180000);

    window.onload = () => {
        startClock();
        loadNavigation();
        loadLibrary();
    };
})();
</script>
</body>
</html>
