    function isHolidayActiveThisMonth(holidayString) {
      if (!holidayString || typeof holidayString !== "string") return false;
      const str = holidayString.trim().toLowerCase();
      if (str === "all" || str === "none" || str === "") return false;

      const currentMonth = new Date().getMonth(); // 0 to 11

      for (const [key, targetMonth] of Object.entries(HOLIDAY_CALENDAR)) {

        }
      }
      return false;
    }

    /**
     * Line 1001: Dynamic Category Color Engine
     */
    function getCategoryColor(categoryName) {
      if (!categoryName) return "var(--accent)";

      let hash = 0;
      for (let i = 0; i < categoryName.length; i++) {
        hash = categoryName.charCodeAt(i) + ((hash << 5) - hash);
      }

      const hue = Math.abs(hash % 360);
      const isLight = document.body && document.body.classList.contains("light-theme");

      const saturation = isLight ? 75 : 85;
      const lightness = isLight ? 40 : 62;

      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    function buildDynamicUtmUrl(rawUrl, campaignId, mediumType, contentElement, itemType) {
      if (!rawUrl || rawUrl.trim() === "" || rawUrl === "#") return "#";

      try {
        const url = new URL(rawUrl, window.location.origin);

        if (url.hostname !== window.location.hostname) {
          const sourceName = window.location.hostname.replace("www.", "") || "media_hub";

          url.searchParams.set("utm_source", sourceName);
          url.searchParams.set("utm_medium", mediumType || "affiliate_link");
          url.searchParams.set("utm_campaign", (campaignId || "catalog").toLowerCase().replace(/[^a-z0-9-_]/g, "-"));

          if (contentElement) {
            url.searchParams.set("utm_content", contentElement);
          }
        }

        const webUrl = url.toString();

        if (!isMobileDevice()) {
          return webUrl;
        }

        const type = (itemType || "").toLowerCase();

        if (type === "movie" || type === "movies" || webUrl.includes("primevideo.com") || webUrl.includes("/video/")) {
          return `primevideo://watch?gti=${campaignId}&url=${encodeURIComponent(webUrl)}`;
        }

        if (type === "music" || webUrl.includes("music.amazon.com")) {
          return `amznmp3://play?url=${encodeURIComponent(webUrl)}`;
        }

        if (type === "book" || type === "ebook" || type === "kindle") {
          return `kindle://book?asin=${campaignId}&fallback=${encodeURIComponent(webUrl)}`;
        }

        if (webUrl.includes("amazon.com") || webUrl.includes("amzn.to")) {
          const pathAndQuery = url.pathname + url.search;
          return `com.amazon.mobile.shopping.web://amazon.com${pathAndQuery}`;
        }

        return webUrl;
      } catch (err) {
        console.warn("Invalid URL passed to router:", rawUrl, err);
        return rawUrl;
      }
    }

    function isPromotionalSaleLive(item) {
      const todayStr = new Date().toISOString().split("T")[0];
      let startDate = item.start_date;
      let endDate = item.end_date;

      if ((!startDate || !endDate) && item.event_tag) {
        const tag = item.event_tag.trim().toLowerCase();
        if (EVENT_SCHEDULE[tag]) {
          startDate = EVENT_SCHEDULE[tag].start;
          endDate = EVENT_SCHEDULE[tag].end;
        }
      }

      if (!startDate && !endDate) return false;

      if (startDate && todayStr < startDate) return false;
      if (endDate && todayStr > endDate) return false;
      return true;
    }

    /**
     * Line 1222: Parse Deals Tree
     */
    function parseDealsTree(tree) {
      if (!tree) return [];
      const list = [];
      Object.keys(tree).forEach(catKey => {
        const group = tree[catKey];
        if (typeof group === "object" && group !== null) {
          Object.keys(group).forEach(itemKey => {
            const item = group[itemKey];
            if (!item) return;

            const rawActive = item.is_active;
            const isActive = (rawActive === true || rawActive === 1 || String(rawActive).trim().toLowerCase() === "true");

            if (isActive) {
              list.push({
                ...item,
                isMovie: false,
                category: item.category || catKey,
                placement: (item.placement || "deals_page").toLowerCase().trim(),
                isSaleActive: isPromotionalSaleLive(item)
              });
            }
          });
        }
      });
      return list;
    }

    /**
     * Line 1252: Parse Movies Tree
     */
    function parseMoviesTree(tree) {
      if (!tree) return [];
      const list = [];

      Object.keys(tree).forEach(key => {
        const movie = tree[key];
        if (!movie || typeof movie !== "object") return;

        const amazonUrl = movie.amazon || movie.site_url || "";
        if (!amazonUrl || String(amazonUrl).trim() === "") return;

        const imdbId = movie.id || movie.imdb_id || (key.includes("tt") ? key.substring(key.indexOf("tt")) : key);

        let genreList = [];
        if (Array.isArray(movie.genre)) {
          genreList = movie.genre;
        } else if (typeof movie.genre === "string" && movie.genre.trim() !== "") {
          genreList = movie.genre.split(",").map(g => g.trim());
        } else {
          genreList = ["Feature"];
        }

        const isHolidayActive = isHolidayActiveThisMonth(movie.holidays);

        list.push({
          id: imdbId,
          imdb_id: imdbId,
          isMovie: true,
          title: movie.title || "Untitled Film",
          year: movie.year || "",
          rating: movie.rating || "",
          runtime: movie.runtime || "",
          type: movie.type || "movie",
          edition: movie.edition || "",
          collection: movie.collection || "",
          genre: movie.genre || "",
          holidays: movie.holidays || "",
          studio: movie.studio || "",
          image_url: movie.poster || movie.image_url || "",
          site_url: amazonUrl,
          description: movie.description || movie.overview || movie.plot || "",
          streaming: movie.streaming || "",
          category: "Movies",
          sub_category: movie.type || (movie.year ? String(movie.year) : "Feature"),
          placement: (movie.placement || "deals_page").toLowerCase().trim(),
          isSaleActive: false,
          isHolidayActive: isHolidayActive,
          tags: genreList
        });
      });

      return list;
    }

      section.style.setProperty("--cat-color", catColor);

      section.innerHTML = `
        <div class="section-header">
          <h2 class="section-title">${title}</h2>
          ${viewAllHash ? `<a href="${viewAllHash}" class="view-all-btn">View All (${items.length}) &rarr;</a>` : ''}
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left" aria-label="Scroll left">&#8249;</button>
          <div class="carousel-track"></div>
          <button class="carousel-arrow right" aria-label="Scroll right">&#8250;</button>
        </div>
      `;

      const track = section.querySelector(".carousel-track");
      items.forEach(item => track.appendChild(createCardElement(item)));

      const leftBtn = section.querySelector(".carousel-arrow.left");
      const rightBtn = section.querySelector(".carousel-arrow.right");

      leftBtn.addEventListener("click", () => {
        track.scrollBy({ left: -560, behavior: "smooth" });
      });

      rightBtn.addEventListener("click", () => {
        track.scrollBy({ left: 560, behavior: "smooth" });
      });

      return section;
    }

    /**
     * Line 1524: Intelligent Home Catalog Balancer
     * - Holiday films active this month sit up front at the very top.
     * - Store deals and flash sales are placed up front when store inventory is smaller than movies.
     * - When store inventory is similar/equal to movies (or larger), alternate evenly (Store -> Movie -> Store...).
     */
    function buildBalancedHomeCatalog(dealsList, moviesList) {
      const holidayMovies = moviesList.filter(m => m.isHolidayActive);
      const standardMovies = moviesList.filter(m => !m.isHolidayActive);

      // Sort catalogs alphabetically A-Z
      standardMovies.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
      const sortedDeals = [...dealsList].sort((a, b) => (a.title || "").localeCompare(b.title || ""));

      let balancedBody = [];

      const dealsCount = sortedDeals.length;
      const moviesCount = standardMovies.length;

      // Ratio of deals to movies
      const ratio = moviesCount > 0 ? (dealsCount / moviesCount) : 1;

      // 1. Less store items than movies (ratio < 0.75) -> Store deals front-loaded
      if (dealsCount > 0 && ratio < 0.75) {
        balancedBody = [...sortedDeals, ...standardMovies];
      } 
      // 2. Similar amount of store items & movies (or more store items) -> Alternate evenly
      else {
        const maxLen = Math.max(dealsCount, moviesCount);
        for (let i = 0; i < maxLen; i++) {
          if (i < dealsCount) balancedBody.push(sortedDeals[i]);
          if (i < moviesCount) balancedBody.push(standardMovies[i]);
        }
      }

      // Holiday films active this calendar month always lead at the top
      if (holidayMovies.length > 0) {
        holidayMovies.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
        return [...holidayMovies, ...balancedBody];
      }

      return balancedBody;
    }

    /**
     * Line 1572: Master View Renderer
     */
    function renderCatalog() {
      const root = document.getElementById("catalogRoot");
      if (!root) return;
      root.innerHTML = "";

      let activeCatalog = [];

      if (AppState.currentView === "home") {
        activeCatalog = buildBalancedHomeCatalog(AppState.deals, AppState.movies);
      } else if (AppState.currentView === "movies") {
        activeCatalog = AppState.movies;
      } else if (AppState.currentView === "deals") {
        activeCatalog = AppState.deals;
      } else if (AppState.currentView === "category") {
        activeCatalog = AppState.deals.filter(i => 
          i.category && i.category.toLowerCase() === AppState.selectedCategory.toLowerCase()
        );
      }

      renderPlacements(activeCatalog);

      // Search filtering across title, description, category, edition, studio, collection, tags
      const query = AppState.searchQuery.toLowerCase().trim();
      const searchFiltered = activeCatalog.filter(item => {
        if (!query) return true;
        const inTitle = item.title && item.title.toLowerCase().includes(query);
        const inDesc = item.description && item.description.toLowerCase().includes(query);
        const inCat = item.category && item.category.toLowerCase().includes(query);
        const inSub = item.sub_category && item.sub_category.toLowerCase().includes(query);
        const inEdition = item.edition && item.edition.toLowerCase().includes(query);
        const inStudio = item.studio && item.studio.toLowerCase().includes(query);
        const inCollection = item.collection && item.collection.toLowerCase().includes(query);
        const inTags = (item.tags || []).some(t => t.toLowerCase().includes(query));
        return inTitle || inDesc || inCat || inSub || inEdition || inStudio || inCollection || inTags;
      });

      if (searchFiltered.length === 0) {
        root.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 60px 0;">No active listings found.</div>`;
        return;
      }

      // --- HOME, SEARCH, CATEGORY, OR GRID MODE: RENDER IN FULL RESPONSIVE GRID ---
      if (AppState.currentView === "home" || AppState.currentView === "category" || AppState.displayMode === "grid" || query.length > 0) {
        let headerTitle = "";
        let catColor = "var(--accent)";

        if (query) {
          headerTitle = `Search Results for "${AppState.searchQuery}" (${searchFiltered.length})`;
        } else if (AppState.currentView === "home") {
          headerTitle = `Featured Hub &amp; Live Inventory (${searchFiltered.length})`;
        } else if (AppState.currentView === "movies") {
          headerTitle = `All Prime Movies (${searchFiltered.length})`;
          catColor = "var(--prime-blue)";
        } else if (AppState.currentView === "category") {
          headerTitle = `${AppState.selectedCategory} (${searchFiltered.length})`;
          catColor = getCategoryColor(AppState.selectedCategory);
        } else {
          headerTitle = `${AppState.selectedCategory} (All ${searchFiltered.length})`;
          catColor = getCategoryColor(AppState.selectedCategory);
        }

        const gridSection = document.createElement("section");
        gridSection.className = "catalog-section";
        gridSection.style.setProperty("--cat-color", catColor);

        gridSection.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">${headerTitle}</h2>
            ${(AppState.currentView !== "home" && !query) ? `<a href="#/home" class="view-all-btn">&larr; Back to All</a>` : ''}
          </div>
          <div class="grid-view-container"></div>
        `;

        const gridContainer = gridSection.querySelector(".grid-view-container");
        searchFiltered.forEach(item => gridContainer.appendChild(createCardElement(item)));
        root.appendChild(gridSection);
        return;
      }

      // --- MOVIES VIEW: Automatic Monthly Holiday Spotlight + A-Z Library ---
      if (AppState.currentView === "movies") {
        const holidayMovies = searchFiltered.filter(m => m.isHolidayActive);
        const standardMovies = searchFiltered.filter(m => !m.isHolidayActive);

        standardMovies.sort((a, b) => (a.title || "").localeCompare(b.title || ""));

        if (holidayMovies.length > 0 && !query) {
          holidayMovies.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
          const holidaySection = createCarouselSection(
            `🎃 Featured Holiday Picks (${holidayMovies[0].holidays})`, 
            holidayMovies, 
            true, 
            `#/movies/all/grid`, 
            "#ff5722"
          );
          root.appendChild(holidaySection);
        }

        const libraryList = query ? searchFiltered : (holidayMovies.length > 0 ? standardMovies : searchFiltered);
        if (!query) {
          libraryList.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
        }

        const movieSection = createCarouselSection("Prime Video Library", libraryList, true, `#/movies/all/grid`, "var(--prime-blue)");
        root.appendChild(movieSection);
        return;
      }

      // --- DEALS VIEW: Category Carousels with individual dynamic colors ---
      const activeDeals = searchFiltered.filter(i => i.isSaleActive);
      if (activeDeals.length > 0) {
        const promoSection = createCarouselSection("⚡ Live Prime & Holiday Deals", activeDeals, false, `#/deals/active-sales/grid`, "var(--badge-red)");
        root.appendChild(promoSection);
      }

      const categoriesMap = {};
      searchFiltered.forEach(item => {
        if (item.placement === "sidebar") return;
        const cat = item.category || "General";
        if (!categoriesMap[cat]) categoriesMap[cat] = [];
        categoriesMap[cat].push(item);
      });

      Object.keys(categoriesMap).sort().forEach(catName => {
        const catItems = categoriesMap[catName];
        catItems.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
        const viewAllHash = `#/category/${encodeURIComponent(catName)}`;
        const carousel = createCarouselSection(catName, catItems, false, viewAllHash);
        root.appendChild(carousel);
      });
    }

    /**
     * Line 1698: Hash Router
     */
    function routeFromHash() {
      const hash = window.location.hash.replace("#/", "").replace("#", "");
      const segments = hash.split("/").map(s => decodeURIComponent(s));

      const view = segments[0] || "home";
      const cat = segments[1] || "all";
      const mode = segments[2] || "carousel";

      if (view === "category") {
        AppState.currentView = "category";
        AppState.selectedCategory = cat;
        AppState.displayMode = "grid";
      } else if (view === "movies") {
        AppState.currentView = "movies";
        AppState.selectedCategory = cat;
        AppState.displayMode = (mode === "grid") ? "grid" : "carousel";
      } else if (view === "deals") {
        AppState.currentView = "deals";
        AppState.selectedCategory = cat;
        AppState.displayMode = (mode === "grid") ? "grid" : "carousel";
      } else {
        AppState.currentView = "home";
        AppState.selectedCategory = "all";
        AppState.displayMode = "grid";
      }

      // Update active nav button state
      document.querySelectorAll(".nav-btn").forEach(btn => {
        const isMatch = (btn.dataset.view === AppState.currentView) || 
                        (btn.dataset.view === "home" && AppState.currentView === "category");
        btn.classList.toggle("active", isMatch);
      });

      // Highlight active dropdown category item
      document.querySelectorAll(".dropdown-item").forEach(item => {
        const itemCat = item.dataset.cat;
        if (AppState.currentView === "category") {
          item.classList.toggle("active", itemCat.toLowerCase() === AppState.selectedCategory.toLowerCase());
        } else if (AppState.currentView === "home") {
          item.classList.toggle("active", itemCat === "all");
        } else {
          item.classList.remove("active");
        }
      });

      renderCatalog();
    }

    /**
     * Line 1756: Initialize DOM Bindings & Start Persistent Listeners
     */
    function init() {
      // Brand Title click returns to Home
      const brand = document.getElementById("brandTitle");
      if (brand) {
        brand.addEventListener("click", () => {
          AppState.searchQuery = "";
          window.location.hash = "#/home";
        });
      }

      // Primary Navigation Tabs
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          // If clicking dropdown arrow specifically, toggle dropdown only
          if (e.target.id === "homeMenuTrigger") return;

          const view = btn.dataset.view;
          AppState.searchQuery = "";
          const sInput = document.getElementById("siteSearch");
          const sClear = document.getElementById("searchClear");
          if (sInput) sInput.value = "";
          if (sClear) sClear.style.display = "none";

          window.location.hash = (view === "home") ? "#/home" : `#/${view}`;
        });
      });

      // Home Dropdown Trigger Handlers
      const trigger = document.getElementById("homeMenuTrigger");
      const menu = document.getElementById("homeCategoryMenu");

      if (trigger && menu) {
        trigger.addEventListener("click", (e) => {
          e.stopPropagation();
          menu.classList.toggle("show");
        });

        // Close dropdown when clicking outside
        document.addEventListener("click", (e) => {
          if (!menu.contains(e.target) && e.target !== trigger) {
            menu.classList.remove("show");
          }
        });

        // All Categories dropdown option click
        const allOption = menu.querySelector('[data-cat="all"]');
        if (allOption) {
          allOption.addEventListener("click", (e) => {
            e.stopPropagation();
            menu.classList.remove("show");
            window.location.hash = "#/home";
          });
        }
      }

      // In-Page Instant Search Controller
      const searchInput = document.getElementById("siteSearch");
      const searchClear = document.getElementById("searchClear");

      if (searchInput && searchClear) {
        searchInput.addEventListener("input", (e) => {
          AppState.searchQuery = e.target.value;
          searchClear.style.display = AppState.searchQuery ? "block" : "none";
          renderCatalog();
        });

        searchClear.addEventListener("click", () => {
          searchInput.value = "";
          AppState.searchQuery = "";
          searchClear.style.display = "none";
          renderCatalog();
        });
      }

      // Light/Dark Theme Switcher
      const themeBtn = document.getElementById("themeToggleBtn");
      if (themeBtn) {
        themeBtn.addEventListener("click", () => {
          document.body.classList.toggle("light-theme");
          const isLight = document.body.classList.contains("light-theme");
          themeBtn.textContent = isLight ? "☀️" : "🌙";
          AppState.theme = isLight ? "light" : "dark";
          renderCatalog();
        });
      }

      // Lightbox Close Handlers
      const closeBtn = document.getElementById("lightboxClose");
      const modal = document.getElementById("lightbox");
      if (closeBtn && modal) {
        closeBtn.addEventListener("click", () => modal.classList.remove("active"));
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.classList.remove("active");
        });
      }

      window.addEventListener("hashchange", routeFromHash);
      routeFromHash();
      setupLiveFirebaseListeners();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
