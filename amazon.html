    /**
     * Line 590: Dynamic Category Color Engine
     * Generates persistent HSL colors for each unique category name
     * Automatically adjusts lightness for dark vs. light theme readability
     */
    function getCategoryColor(categoryName) {
      if (!categoryName) return "var(--accent)";

      let hash = 0;
      for (let i = 0; i < categoryName.length; i++) {
        hash = categoryName.charCodeAt(i) + ((hash << 5) - hash);
      }

      const hue = Math.abs(hash % 360);
      const isLight = document.body.classList.contains("light-theme");

      const saturation = isLight ? 75 : 85;
      const lightness = isLight ? 40 : 62;

      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    /**
     * Line 612: Centralized Dynamic Outbound UTM Generator

     */
    function buildDynamicUtmUrl(rawUrl, campaignId, mediumType, contentElement) {
      if (!rawUrl || rawUrl.trim() === "" || rawUrl === "#") return "#";

      try {
        const url = new URL(rawUrl, window.location.origin);

        // Only append UTM parameters if the destination domain is external
        if (url.hostname !== window.location.hostname) {
          const sourceName = window.location.hostname.replace("www.", "") || "entertainment_hub";

          url.searchParams.set("utm_source", sourceName);
          url.searchParams.set("utm_medium", mediumType || "affiliate_link");
          url.searchParams.set("utm_campaign", (campaignId || "catalog").toLowerCase().replace(/[^a-z0-9-_]/g, "-"));

          if (contentElement) {
            url.searchParams.set("utm_content", contentElement);
          }
        }

        return url.toString();
      } catch (err) {
        console.warn("Invalid URL passed to UTM generator:", rawUrl, err);
        return rawUrl;
      }
    }

    /**

    function isPromotionalSaleLive(item) {

          startDate = EVENT_SCHEDULE[tag].start;
          endDate = EVENT_SCHEDULE[tag].end;
        }

      if (startDate && todayStr < startDate) return false;
      if (endDate && todayStr > endDate) return false;
      return Boolean(startDate || endDate || item.event_tag);

      metaRow.innerHTML = "";
      if (isMovie) {
        if (item.imdb_id) metaRow.innerHTML += `<span class="meta-badge">${item.imdb_id}</span>`;
        if (item.year) metaRow.innerHTML += `<span class="meta-badge">${item.year}</span>`;
        if (item.edition) metaRow.innerHTML += `<span class="meta-badge edition">${item.edition}</span>`;
        if (item.rating) metaRow.innerHTML += `<span class="meta-badge">★ ${item.rating}</span>`;
        if (item.runtime) metaRow.innerHTML += `<span class="meta-badge">${item.runtime}</span>`;
        if (item.type) metaRow.innerHTML += `<span class="meta-badge" style="text-transform: capitalize;">${item.type}</span>`;
      } else {
        const catColor = getCategoryColor(item.category);
        metaRow.innerHTML += `<span class="meta-badge" style="color: ${catColor}; border-color: ${catColor};">${item.category}</span>`;
        if (item.sub_category) metaRow.innerHTML += `<span class="meta-badge">${item.sub_category}</span>`;
        if (item.isSaleActive) metaRow.innerHTML += `<span class="meta-badge" style="border-color: var(--badge-red); color: var(--badge-red); font-weight: 700;">⚡ ${item.event_tag || 'Prime Deal'}</span>`;
      }

      tagsBox.innerHTML = (item.tags || []).map(t => `<span class="tag-pill">${t}</span>`).join("");

      const medium = isMovie ? "prime_video_modal" : "deal_modal";
      const finalLink = buildDynamicUtmUrl(item.site_url, item.id, medium, "lightbox_cta");

      outboundBtn.href = finalLink;
      outboundBtn.className = `cta-btn ${isMovie ? 'movie-btn' : ''}`;
      outboundBtn.textContent = isMovie ? "Watch on Prime Video" : "View on Amazon";

      modal.classList.add("active");
    }

    /**
     * Line 714: Fetch and Process Data from Firebase RTDB
     */
    async function loadData() {
      try {
        const [dealsRes, moviesRes] = await Promise.all([
          fetch(ENDPOINTS.deals),
          fetch(ENDPOINTS.movies)
        ]);

        if (dealsRes.ok) {
          const dealsJson = await dealsRes.json();
          AppState.deals = parseDealsTree(dealsJson);
        }

        if (moviesRes.ok) {
          const moviesJson = await moviesRes.json();
          AppState.movies = parseMoviesTree(moviesJson);
        }

        routeFromHash();
      } catch (err) {
        console.error("Firebase fetch error:", err);
      }
    }

    /**
     * Line 741: Parse /deals/{category}/{id}
     */
    function parseDealsTree(tree) {
      if (!tree) return [];
      const list = [];
      Object.keys(tree).forEach(catKey => {
        const group = tree[catKey];
        if (typeof group === "object" && group !== null) {
          Object.keys(group).forEach(itemKey => {
            const item = group[itemKey];
            const activeState = (item.is_active === true || String(item.is_active).toUpperCase() === "TRUE");
            if (item && activeState) {
              list.push({
                ...item,
                category: item.category || catKey,
                isSaleActive: isPromotionalSaleLive(item)
              });
            }
          });
        }
      });
      return list;
    }

    /**
     * Line 765: Parse /movies_guide
     */
    function parseMoviesTree(tree) {
      if (!tree) return [];
      const list = [];
      Object.keys(tree).forEach(key => {
        const movie = tree[key];
        if (!movie || typeof movie !== "object") return;

        const amazonUrl = movie.amazon || movie.site_url || "";
        if (!amazonUrl || amazonUrl.trim() === "") return;

        const imdbId = movie.imdb_id || (key.includes("tt") ? key.substring(key.indexOf("tt")) : key);

        list.push({
          id: imdbId,
          imdb_id: imdbId,
          title: movie.title || "Untitled Film",
          description: movie.description || movie.overview || movie.plot || "",
          image_url: movie.poster || movie.image_url || "",
          site_url: amazonUrl,
          category: movie.genre || "Movies",
          sub_category: movie.type || (movie.year ? String(movie.year) : "Feature"),
          year: movie.year || "",
          rating: movie.rating || movie.vote_average || "",
          runtime: movie.runtime || "",
          type: movie.type || "movie",
          edition: movie.edition || "",
          isSaleActive: false,
          tags: Array.isArray(movie.genre) ? movie.genre : (movie.genre ? movie.genre.split(",").map(g => g.trim()) : ["Movie"])
        });
      });
      return list;
    }

    /**
     * Line 801: Card DOM Construction with Dynamic Outbound UTM Link
     */
    function createCardElement(item, isMovie) {
      const card = document.createElement("div");
      const catColor = isMovie ? "var(--prime-blue)" : getCategoryColor(item.category);

      card.className = `card ${item.isSaleActive ? 'prime-glow-deal' : ''}`;
      card.id = `item-${item.id}`;
      card.style.setProperty("--cat-color", catColor);

      const medium = isMovie ? "prime_video" : (item.isSaleActive ? "flash_sale" : "deals_catalog");
      const outboundLink = buildDynamicUtmUrl(item.site_url, item.id, medium, "card_cta");

      let badgeHtml = "";
      if (isMovie) {
        badgeHtml = `<div class="badge-pill prime">Prime Video</div>`;
      } else if (item.isSaleActive) {
        badgeHtml = `<div class="badge-pill">⚡ ${item.event_tag || 'Prime Deal'}</div>`;
      }

      const metaRowHtml = isMovie ? `
        <div class="meta-row">
          ${item.imdb_id ? `<span class="meta-badge">${item.imdb_id}</span>` : ''}
          ${item.year ? `<span class="meta-badge">${item.year}</span>` : ''}
          ${item.edition ? `<span class="meta-badge edition">${item.edition}</span>` : ''}
          ${item.rating ? `<span class="meta-badge">★ ${item.rating}</span>` : ''}
          ${item.runtime ? `<span class="meta-badge">${item.runtime}</span>` : ''}
        </div>
      ` : `
        <div class="meta-row">
          <span class="meta-badge" style="color: ${catColor}; border-color: ${catColor};">${item.category}</span>
          ${item.sub_category ? `<span class="meta-badge">${item.sub_category}</span>` : ''}
        </div>
      `;

      const tagsHtml = (item.tags || []).slice(0, 3).map(t => `<span class="tag-pill">${t}</span>`).join("");

      card.innerHTML = `
        <div class="card-media">
          ${badgeHtml}
          <img src="${item.image_url || ''}" loading="lazy" alt="">
        </div>
        <div class="card-content">
          ${metaRowHtml}
          <h3 class="card-title">${item.title}</h3>
          <p class="card-desc">${item.description}</p>
          <div class="tag-container">${tagsHtml}</div>
          <div class="btn-group">
            <button class="cta-btn details-btn" type="button">Details</button>
            <a href="${outboundLink}" class="cta-btn ${isMovie ? 'movie-btn' : ''}" target="_blank" rel="noopener noreferrer">
              ${isMovie ? 'Watch' : (item.isSaleActive ? 'Claim Deal' : 'Buy Now')}
            </a>
          </div>
        </div>
      `;

      card.querySelector(".card-media").addEventListener("click", () => openLightbox(item, isMovie));
      card.querySelector(".card-title").addEventListener("click", () => openLightbox(item, isMovie));
      card.querySelector(".details-btn").addEventListener("click", () => openLightbox(item, isMovie));

      return card;
    }

    /**
     * Line 866: Carousel Construction with Navigation Arrows
     */
    function createCarouselSection(title, items, isMovie, viewAllHash, customColor) {
      const section = document.createElement("section");
      section.className = "catalog-section";

      const catColor = customColor || (isMovie ? "var(--prime-blue)" : getCategoryColor(title));
      section.style.setProperty("--cat-color", catColor);

      section.innerHTML = `
        <div class="section-header">
          <h2 class="section-title">${title}</h2>
          ${viewAllHash ? `<a href="${viewAllHash}" class="view-all-btn">View All (${items.length}) &rarr;</a>` : ''}
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left" aria-label="Scroll left">&#8249;</button>
          <div class="carousel-track"></div>
          <button class="carousel-arrow right" aria-label="Scroll right">&#8250;</button>
        </div>
      `;

      const track = section.querySelector(".carousel-track");
      items.forEach(item => track.appendChild(createCardElement(item, isMovie)));

      const leftBtn = section.querySelector(".carousel-arrow.left");
      const rightBtn = section.querySelector(".carousel-arrow.right");

      leftBtn.addEventListener("click", () => {
        track.scrollBy({ left: -560, behavior: "smooth" });
      });

      rightBtn.addEventListener("click", () => {
        track.scrollBy({ left: 560, behavior: "smooth" });
      });

      return section;
    }

    /**
     * Line 906: Master View Renderer
     */
    function renderCatalog() {
      const root = document.getElementById("catalogRoot");
      if (!root) return;
      root.innerHTML = "";

      const isMovie = AppState.currentView === "movies";
      const activeCatalog = isMovie ? AppState.movies : AppState.deals;

      // In-page search filtering across all primary fields
      const query = AppState.searchQuery.toLowerCase().trim();
      const searchFiltered = activeCatalog.filter(item => {
        if (!query) return true;
        const inTitle = item.title && item.title.toLowerCase().includes(query);
        const inDesc = item.description && item.description.toLowerCase().includes(query);
        const inCat = item.category && item.category.toLowerCase().includes(query);
        const inSub = item.sub_category && item.sub_category.toLowerCase().includes(query);
        const inEdition = item.edition && item.edition.toLowerCase().includes(query);
        const inTags = (item.tags || []).some(t => t.toLowerCase().includes(query));
        return inTitle || inDesc || inCat || inSub || inEdition || inTags;
      });

      if (searchFiltered.length === 0) {
        root.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 60px 0;">No matching items found for "${AppState.searchQuery}".</div>`;
        return;
      }

      // If viewing all for a category or search is active, render Grid View
      if (AppState.displayMode === "grid" || query.length > 0) {
        const headerTitle = query ? `Search Results for "${AppState.searchQuery}" (${searchFiltered.length})`
                                  : `${AppState.selectedCategory} (All ${searchFiltered.length})`;

        const catColor = isMovie ? "var(--prime-blue)" : getCategoryColor(AppState.selectedCategory);
        const gridSection = document.createElement("section");
        gridSection.className = "catalog-section";
        gridSection.style.setProperty("--cat-color", catColor);

        gridSection.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">${headerTitle}</h2>
            ${!query ? `<a href="#/${AppState.currentView}/all" class="view-all-btn">&larr; Back to Carousels</a>` : ''}
          </div>
          <div class="grid-view-container"></div>
        `;
        const gridContainer = gridSection.querySelector(".grid-view-container");
        searchFiltered.forEach(item => gridContainer.appendChild(createCardElement(item, isMovie)));
        root.appendChild(gridSection);
        return;
      }

      // 1. Promotional Flash Deals Spotlight Carousel (Only in Deals view when active)
      if (!isMovie) {
        const activeDeals = searchFiltered.filter(i => i.isSaleActive);
        if (activeDeals.length > 0) {
          const promoSection = createCarouselSection("⚡ Live Prime & Holiday Deals", activeDeals, false, `#/deals/active-sales/grid`, "var(--badge-red)");
          root.appendChild(promoSection);
        }
      }

      // 2. Group Inventory by Category into Carousels
      const categoriesMap = {};
      searchFiltered.forEach(item => {
        const cat = item.category || (isMovie ? "Movies" : "General");
        if (!categoriesMap[cat]) categoriesMap[cat] = [];
        categoriesMap[cat].push(item);
      });

      Object.keys(categoriesMap).sort().forEach(catName => {
        const catItems = categoriesMap[catName];
        const viewAllHash = `#/${AppState.currentView}/${encodeURIComponent(catName)}/grid`;
        const carousel = createCarouselSection(catName, catItems, isMovie, viewAllHash);
        root.appendChild(carousel);
      });
    }

    /**
     * Line 977: Hash Router (#/view/category/displayMode)
     */
    function routeFromHash() {
      const hash = window.location.hash.replace("#/", "").replace("#", "");
      const segments = hash.split("/").map(s => decodeURIComponent(s));

      const view = segments[0] || "deals";
      const cat = segments[1] || "all";
      const mode = segments[2] || "carousel";

      AppState.currentView = (view === "movies") ? "movies" : "deals";
      AppState.selectedCategory = cat;
      AppState.displayMode = (mode === "grid" || cat !== "all") ? "grid" : "carousel";

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === AppState.currentView);
      });

      renderCatalog();
    }

    /**
     * Line 999: DOM Ready Setup & Event Binding
     */
    window.addEventListener("DOMContentLoaded", () => {
      // Primary Tab Navigation
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const view = e.target.dataset.view;
          AppState.searchQuery = "";
          document.getElementById("siteSearch").value = "";
          document.getElementById("searchClear").style.display = "none";
          window.location.hash = `#/${view}/all`;
        });
      });

      // Site Search Controller
      const searchInput = document.getElementById("siteSearch");
      const searchClear = document.getElementById("searchClear");

      searchInput.addEventListener("input", (e) => {
        AppState.searchQuery = e.target.value;
        searchClear.style.display = AppState.searchQuery ? "block" : "none";
        renderCatalog();
      });

      searchClear.addEventListener("click", () => {
        searchInput.value = "";
        AppState.searchQuery = "";
        searchClear.style.display = "none";
        renderCatalog();
      });

      // Light/Dark Theme Switcher Controller
      const themeBtn = document.getElementById("themeToggleBtn");
      themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("light-theme");
        const isLight = document.body.classList.contains("light-theme");
        themeBtn.textContent = isLight ? "☀️" : "🌙";
        AppState.theme = isLight ? "light" : "dark";
        renderCatalog(); // Re-render to adapt category colors for contrast
      });

      // Lightbox Close Handlers
      const closeBtn = document.getElementById("lightboxClose");
      const modal = document.getElementById("lightbox");
      if (closeBtn && modal) {
        closeBtn.addEventListener("click", () => modal.classList.remove("active"));
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.classList.remove("active");
        });
      }

      window.addEventListener("hashchange", routeFromHash);
      loadData();
    });
  </script>
</body>
