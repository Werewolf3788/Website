    /**
     * Line 640: Dynamic Category Color Engine
     */
    function getCategoryColor(categoryName) {
      if (!categoryName) return "var(--accent)";

      let hash = 0;
      for (let i = 0; i < categoryName.length; i++) {
        hash = categoryName.charCodeAt(i) + ((hash << 5) - hash);
      }

      const hue = Math.abs(hash % 360);
      const isLight = document.body && document.body.classList.contains("light-theme");

      const saturation = isLight ? 75 : 85;
      const lightness = isLight ? 40 : 62;

      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    /**

     */
    function buildDynamicUtmUrl(rawUrl, campaignId, mediumType, contentElement) {
      if (!rawUrl || rawUrl.trim() === "" || rawUrl === "#") return "#";

      try {
        const url = new URL(rawUrl, window.location.origin);

        if (url.hostname !== window.location.hostname) {
          const sourceName = window.location.hostname.replace("www.", "") || "media_hub";

          url.searchParams.set("utm_source", sourceName);
          url.searchParams.set("utm_medium", mediumType || "affiliate_link");
          url.searchParams.set("utm_campaign", (campaignId || "catalog").toLowerCase().replace(/[^a-z0-9-_]/g, "-"));

          if (contentElement) {
            url.searchParams.set("utm_content", contentElement);
          }
        }

        return url.toString();
      } catch (err) {
        console.warn("Invalid URL passed to UTM generator:", rawUrl, err);
        return rawUrl;
      }
    }

    function isPromotionalSaleLive(item) {
      const todayStr = new Date().toISOString().split("T")[0];

      let endDate = item.end_date;

      if ((!startDate || !endDate) && item.event_tag) {
        const tag = item.event_tag.trim().toLowerCase();
        if (EVENT_SCHEDULE[tag]) {
          startDate = EVENT_SCHEDULE[tag].start;
          endDate = EVENT_SCHEDULE[tag].end;

      }

      if (startDate && todayStr < startDate) return false;

      return Boolean(startDate || endDate || item.event_tag);
    }

    function parseDealsTree(tree) {
      if (!tree) return [];
      const list = [];
      Object.keys(tree).forEach(catKey => {
        const group = tree[catKey];
        if (typeof group === "object" && group !== null) {
          Object.keys(group).forEach(itemKey => {
            const item = group[itemKey];
            const activeState = (item.is_active === true || String(item.is_active).toUpperCase() === "TRUE");
            if (item && activeState) {
              list.push({
                ...item,
                isMovie: false,
                category: item.category || catKey,
                placement: (item.placement || "deals_page").toLowerCase().trim(),
                isSaleActive: isPromotionalSaleLive(item)
              });

          });

      });

    function parseMoviesTree(tree) {
      if (!tree) return [];

        const amazonUrl = movie.amazon || movie.site_url || "";

        const imdbId = movie.imdb_id || (key.includes("tt") ? key.substring(key.indexOf("tt")) : key);

          sub_category: movie.type || (movie.year ? String(movie.year) : "Feature"),

          runtime: movie.runtime || "",

      const modal = document.getElementById("lightbox");
      if (closeBtn && modal) {
        closeBtn.addEventListener("click", () => modal.classList.remove("active"));
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.classList.remove("active");
        });
      }

      window.addEventListener("hashchange", routeFromHash);
      routeFromHash();
      setupLiveFirebaseListeners();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
