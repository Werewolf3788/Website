            { id: 'm2_cd4', cat: '2: Occupied Residence', name: 'New Orders, Effective Immediately', type: 'Classified Doc', desc: 'Inside the locked weapons chamber at the north-east Waffenkammer building.' },
            { id: 'm2_cd5', cat: '2: Occupied Residence', name: 'Immediate Request For Attic Repairs', type: 'Classified Doc', desc: 'North-east Waffenkammer building table. Alternate: Chateau top floor padlock door.' },
            { id: 'm2_cd6', cat: '2: Occupied Residence', name: 'Grateful, Thanks.', type: 'Classified Doc', desc: 'Sitting directly on the desk inside Möller\'s secret document study room.' },
            { id: 'm2_hi1', cat: '2: Occupied Residence', name: 'Old Man Statuette', type: 'Hidden Item', desc: 'Chateau first floor bedroom; open the safe hidden behind the wall painting.' },
            { id: 'm2_hi2', cat: '2: Occupied Residence', name: 'Group Statuette', type: 'Hidden Item', desc: 'Chateau top floor servant room chest; unlockable via standard lockpicks.' },
            { id: 'm2_hi3', cat: '2: Occupied Residence', name: 'Soldier Statuette', type: 'Hidden Item', desc: 'Looted from the body of the Sniper positioned in the north tower outpost.' },
            { id: 'm2_se1', cat: '2: Occupied Residence', name: 'Stone Eagle #1', type: 'Stone Eagle', desc: 'Perched on the roof apex of the munitions farmhouse in the north-west.' },
            { id: 'm2_se2', cat: '2: Occupied Residence', name: 'Stone Eagle #2', type: 'Stone Eagle', desc: 'Look west from the central river bridge; sits on the jagged river cliffs.' },
            { id: 'm2_se3', cat: '2: Occupied Residence', name: 'Stone Eagle #3', type: 'Stone Eagle', desc: 'Sits on the roof ridge of the stone outbuilding north of the chateau.' },
            { id: 'm2_wb1', cat: '2: Occupied Residence', name: 'Rifle Workbench', type: 'Workbench', desc: 'Chateau basement cellar; access via the ramp in the south-east courtyard.' },
            { id: 'm2_wb2', cat: '2: Occupied Residence', name: 'SMG Workbench', type: 'Workbench', desc: 'Upstairs room of the house west of the chateau; access via external wall vines.' },
            { id: 'm2_wb3', cat: '2: Occupied Residence', name: 'Pistol Workbench', type: 'Workbench', desc: 'Inside the locked weapon vault room at the north-east Waffenkammer building.' }
        ];

        const appState = {
            targetUserId: 'Guest',
            targetDisplayName: 'Guest User',
            targetPlatform: DEFAULT_PLATFORM,
            masterDataset: defaultSniperDataset,
            hunterData: [],
            // Separate in-memory progress for guest sessions per platform
            guestProgress: {},
            app: null,
            auth: null,
            db: null,
            analytics: null,
            collapsedSections: {},
            masterUnsub: null,
            dataLoaded: false,
            lastSyncTime: 0,
            isOnline: true,

            showToast: function(msg) {
                const toast = document.getElementById('toast-modal');
                if (toast) {
                    toast.innerText = msg;
                    toast.style.display = 'block';
                    setTimeout(() => { toast.style.display = 'none'; }, 3500);
                }
            },

            openLightbox: function(src, title) {
                const modal = document.getElementById('lightbox-modal');
                const img = document.getElementById('lightbox-img');
                const titleNode = document.getElementById('lightbox-title');
                if (modal && img) {
                    img.src = src;
                    if (titleNode) titleNode.innerText = title || 'Image Preview';
                    modal.classList.add('active');
                }
            },

            closeLightbox: function() {
                const modal = document.getElementById('lightbox-modal');
                if (modal) modal.classList.remove('active');
            },

            loadMasterDataset: async function() {
                const endpoints = [
                    `se.json?v=${Date.now()}`,
                    `/Website/games/Sniper-Elite/5/se.json?v=${Date.now()}`,
                    `${RAW_JSON_DATA_URL}?v=${Date.now()}`
                ];

                for (const url of endpoints) {
                    try {
                        const response = await fetch(url);
                        if (response.ok) {
                            let text = await response.text();
                            text = text.replace(/\/\*[\s\S]*?\*\/|\/\/.*/g, '').trim();
                            const data = JSON.parse(text);
                            if (Array.isArray(data) && data.length > 0) {
                                this.masterDataset = data;
                                return true;
                            }
                        }
                    } catch (err) {
                        console.warn(`Dataset endpoint notice (${url}):`, err.message);
                    }
                }
                return false;
            },

            loadCsvMenu: async function() {
                const navContainer = document.getElementById('dynamic-nav-links');
                if (!navContainer) return;

                try {
                    const response = await fetch(`${GOOGLE_CSV_MENU_URL}&v=${Date.now()}`);
                    if (!response.ok) throw new Error("CSV Fetch HTTP Error");

                    const textData = await response.text();
                    const rows = textData.split('\n');

                    const groups = {};
                    const standalone = [];

                    let startIdx = 0;
                    if (rows[0] && rows[0].toLowerCase().includes("name")) startIdx = 1;

                    for (let i = startIdx; i < rows.length; i++) {
                        const rowStr = rows[i].replace(/\r/g, '').trim();
                        if (!rowStr) continue;

                        const cols = rowStr.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        const name = cols[0] ? cols[0].replace(/^"|"$/g, '').trim() : '';
                        const group = cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : '';
                        const url = cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '';
                        const image = cols[3] ? cols[3].replace(/^"|"$/g, '').trim() : '';

                        if (!name || !url) continue;

                        const itemObj = { name, url, image };

                        if (group && group.toLowerCase() !== 'none') {
                            if (!groups[group]) groups[group] = [];
                            groups[group].push(itemObj);
                        } else {
                            standalone.push(itemObj);
                        }
                    }

                    let navHTML = '';

                    Object.keys(groups).forEach(groupName => {
                        const dropItems = groups[groupName].map(it => {
                            const imgTag = it.image ? `<img src="${it.image}" class="menu-thumb" alt="" onclick="event.preventDefault(); event.stopPropagation(); window.appState.openLightbox('${it.image}', '${it.name.replace(/'/g, "\\'")}')">` : '';
                            return `<a href="${it.url}">${imgTag}<span>${it.name}</span></a>`;
                        }).join('');

                        navHTML += `
                            <div class="nav-dropdown">
                                <button class="nav-dropbtn">${groupName} ▾</button>
                                <div class="nav-dropdown-content">
                                    ${dropItems}
                                </div>
                            </div>
                        `;
                    });

                    standalone.forEach(it => {
                        const imgTag = it.image ? `<img src="${it.image}" class="menu-thumb" alt="" onclick="event.preventDefault(); event.stopPropagation(); window.appState.openLightbox('${it.image}', '${it.name.replace(/'/g, "\\'")}')">` : '';
                        navHTML += `<a href="${it.url}">${imgTag}<span>${it.name}</span></a>`;
                    });

                    navContainer.innerHTML = navHTML;
                } catch (err) {
                    console.warn("CSV Menu fetch notice:", err.message);
                }
            },

            initSPARouter: function() {
                window.addEventListener('hashchange', () => {
                    const hash = window.location.hash.replace('#/', '');
                    if (hash) {
                        const parts = hash.split('/');
                        if (parts[0] === 'tracker' && parts[1]) {
                            const targetUser = parts[1];
                            const newPlatform = parts[2] || this.targetPlatform;
                            this.targetPlatform = newPlatform;
                            const platformSelect = document.getElementById('platform-select');
                            if (platformSelect) platformSelect.value = newPlatform.toLowerCase();
                            this.loadLiveProgress(targetUser, newPlatform);
                        }
                    }
                });
            },

            init: async function() {
                this.app = initializeApp(firebaseConfig);
                this.auth = getAuth(this.app);
                this.db = getFirestore(this.app);

                try { this.analytics = getAnalytics(this.app); } catch (e) {}

                this.loadCsvMenu();
                await this.loadMasterDataset();

                const cats = [...new Set(this.masterDataset.map(i => i.cat))];
                cats.forEach(cat => {
                    const sid = cat.replace(/[^a-z0-9]/gi, '');
                    this.collapsedSections[sid] = true;
                });

                this.initSPARouter();
                this.initClockAndMonitors();

                // Bind Lightbox Close
                const closeBtn = document.getElementById('lightbox-close');
                const modal = document.getElementById('lightbox-modal');
                if (closeBtn) closeBtn.onclick = () => this.closeLightbox();
                if (modal) modal.onclick = (e) => { if (e.target === modal) this.closeLightbox(); };

                // Platform Selector Event
                const platformSelect = document.getElementById('platform-select');
                if (platformSelect) {
                    platformSelect.value = this.targetPlatform;
                    platformSelect.addEventListener('change', (e) => {
                        this.targetPlatform = e.target.value.toLowerCase();
                        window.location.hash = `#/tracker/${this.targetUserId}/${this.targetPlatform}`;
                        this.loadLiveProgress(this.targetUserId, this.targetPlatform);
                    });
                }

                // Auth Button Event
                const authBtn = document.getElementById('auth-action-btn');
                if (authBtn) {
                    authBtn.addEventListener('click', () => {
                        if (this.auth.currentUser && !this.auth.currentUser.isAnonymous) {
                            signOut(this.auth).then(() => {
                                signInAnonymously(this.auth);
                                this.showToast("Signed out. Switched to Guest preview mode.");
                            });
                        } else {
                            const tempAnon = this.auth.currentUser && this.auth.currentUser.isAnonymous ? this.auth.currentUser : null;
                            const provider = new GoogleAuthProvider();
                            provider.setCustomParameters({ prompt: 'select_account' });
                            signInWithPopup(this.auth, provider).then((res) => {
                                if (tempAnon) deleteUser(tempAnon).catch(() => {});
                                this.showToast(`Welcome back, ${res.user.displayName || 'Operative'}!`);
                            }).catch(err => {
                                this.showToast("Authentication failed or cancelled.");
                            });
                        }
                    });
                }

                signInAnonymously(this.auth).catch(() => {});

                onAuthStateChanged(this.auth, async (user) => {
                    const badge = document.getElementById('auth-badge');
                    const avatar = document.getElementById('user-avatar');
                    const nameLabel = document.getElementById('user-name');
                    const btnSpan = authBtn ? authBtn.querySelector('span') : null;

                    if (user && !user.isAnonymous) {
                        const rawName = user.displayName || (user.email ? user.email.split('@')[0] : 'Operative');
                        const safeUserId = rawName.replace(/[\/\#\?\[\]]/g, '_');
                        
                        this.targetUserId = safeUserId;
                        this.targetDisplayName = rawName;

                        if (badge) badge.style.display = 'flex';
                        if (avatar) avatar.src = user.photoURL || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23aaa"><circle cx="12" cy="8" r="4"/><path d="M12 14c-6.1 0-8 4-8 4v2h16v-2s-1.9-4-8-4z"/></svg>';
                        if (nameLabel) nameLabel.innerText = rawName;
                        if (btnSpan) btnSpan.innerText = 'Sign Out';
                        if (authBtn) authBtn.classList.add('logout');

                        await setDoc(doc(this.db, "users", safeUserId), {
                            uid: user.uid,
                            email: user.email || "",
                            displayName: rawName,
                            photoURL: user.photoURL || '',
                            lastLogin: new Date().toISOString()
                        }, { merge: true }).catch(() => {});
                    } else {
                        this.targetUserId = 'Guest';
                        this.targetDisplayName = 'Guest User';

                        if (badge) badge.style.display = 'none';
                        if (btnSpan) btnSpan.innerText = 'Google Sign-In';
                        if (authBtn) authBtn.classList.remove('logout');
                    }

                    this.loadLiveProgress(this.targetUserId, this.targetPlatform);
                });

                this.render();
            },

            initClockAndMonitors: function() {
                const updateClock = () => {
                    const clockNode = document.getElementById('footer-clock');
                    const statusNode = document.getElementById('status-indicator');
                    const statusLine = document.getElementById('footer-status');

                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York' }) + ' EDT';

                    if (clockNode) clockNode.innerText = timeStr;

                    const online = navigator.onLine;
                    this.isOnline = online;

                    if (statusNode && statusLine) {
                        if (online) {
                            statusNode.innerText = '● ONLINE';
                            statusLine.classList.remove('offline');
                        } else {
                            statusNode.innerText = '▲ CONNECTION DROPPED (OFFLINE)';
                            statusLine.classList.add('offline');
                        }
                    }
                };

                updateClock();
                setInterval(updateClock, 1000);

                window.addEventListener('online', () => updateClock());
                window.addEventListener('offline', () => updateClock());
            },

            loadLiveProgress: function(userId, platform = "ps5") {
                this.targetUserId = userId;
                this.targetPlatform = platform.toLowerCase();

                const displayNode = document.getElementById('hunter-display');
                if (displayNode) {
                    displayNode.innerText = `${userId.toUpperCase()} [${this.targetPlatform.toUpperCase()}]`;
                }

                if (this.masterUnsub) { this.masterUnsub(); this.masterUnsub = null; }

                const currentUser = this.auth ? this.auth.currentUser : null;
                const isGuest = !currentUser || currentUser.isAnonymous || userId.toLowerCase() === 'guest';

                if (isGuest) {
                    // Guest Mode: Use local in-memory progress for the selected platform
                    if (!this.guestProgress[this.targetPlatform]) {
                        this.guestProgress[this.targetPlatform] = {};
                    }

                    const platformSavedMap = this.guestProgress[this.targetPlatform];
                    this.hunterData = this.masterDataset.map(item => ({
                        ...item,
                        collected: !!platformSavedMap[item.id]
                    }));

                    this.dataLoaded = true;
                    this.render();
                    return;
                }

                // Signed-In Mode: Bind Firestore real-time snapshot
                this.hunterData = this.masterDataset.map(item => ({ ...item, collected: false }));

                const primaryRef = doc(this.db, "users", userId, "progress", this.targetPlatform, "games", GAME_ID);

                this.masterUnsub = onSnapshot(primaryRef, (snap) => {
                    this.lastSyncTime = Date.now();
                    if (snap.exists()) {
                        const data = snap.data();
                        const incoming = data.progress || [];
                        if (Array.isArray(incoming)) {
                            this.hunterData = this.masterDataset.map(item => {
                                const status = incoming.find(s => s.id === item.id);
                                return { ...item, collected: status ? (status.collected || status.done || false) : false };
                            });
                        }
                        this.dataLoaded = true;
                        this.render();
                    } else {
                        this.hunterData = this.masterDataset.map(item => ({ ...item, collected: false }));
                        this.dataLoaded = true;
                        this.render();
                    }
                }, (err) => {
                    console.warn("Snapshot notice:", err.message);
                });
            },

            toggleItem: async function(id) {
                const item = this.hunterData.find(i => i.id === id);
                if (!item) return;

                item.collected = !item.collected;
                this.render();

                const currentUser = this.auth ? this.auth.currentUser : null;
                const isSignedIn = currentUser && !currentUser.isAnonymous && this.targetUserId.toLowerCase() !== 'guest';

                if (isSignedIn) {
                    this.sync();
                } else {
                    // Store in local guest memory for current platform
                    if (!this.guestProgress[this.targetPlatform]) {
                        this.guestProgress[this.targetPlatform] = {};
                    }
                    this.guestProgress[this.targetPlatform][id] = item.collected;

                    if (item.collected) {
                        this.showToast("Marked in Guest Preview! Sign in to save permanently across devices.");
                    }
                }
            },

            sync: async function() {
                if (!this.db || !this.dataLoaded) return;
                const currentUser = this.auth ? this.auth.currentUser : null;
                if (!currentUser || currentUser.isAnonymous || this.targetUserId.toLowerCase() === 'guest') return;

                const progress = this.hunterData.map(i => ({ id: i.id, collected: i.collected }));
                
                const platformRef = doc(this.db, "users", this.targetUserId, "progress", this.targetPlatform);
                await setDoc(platformRef, { platform: this.targetPlatform, lastActive: new Date().toISOString() }, { merge: true });

                const docRef = doc(this.db, "users", this.targetUserId, "progress", this.targetPlatform, "games", GAME_ID);

                try {
                    await setDoc(docRef, {
                        user: this.targetDisplayName,
                        platform: this.targetPlatform,
                        gameId: GAME_ID,
                        lastUpdated: new Date().toISOString(),
                        progress: progress
                    }, { merge: true });
                } catch (err) {
                    this.showToast("Save failed: Check network or security rules.");
                }
            },

            toggleSection: function(sid) {
                this.collapsedSections[sid] = !this.collapsedSections[sid];
                this.render();
            },

            render: function() {
                const container = document.getElementById('section-container');
                if (!container) return;
                container.innerHTML = '';
                const cats = [...new Set(this.hunterData.map(i => i.cat))];
                let totalFound = 0;

                cats.forEach(cat => {
                    const items = this.hunterData.filter(i => i.cat === cat);
                    const count = items.filter(i => i.collected).length;
                    totalFound += count;

                    const sid = cat.replace(/[^a-z0-9]/gi, '');
                    const section = document.createElement('div');
                    section.className = `category-section ${this.collapsedSections[sid] ? 'section-collapsed' : ''}`;
                    
                    section.innerHTML = `
                        <div class="category-header outlined-text" id="header-${sid}">
                            <h2>${cat}</h2>
                            <div style="font-weight:900; font-size: 14px; color: #ff8800;">${count}/${items.length} FOUND</div>
                        </div>
                        <div class="section-content" id="content-${sid}">
                            <div class="item-grid"></div>
                        </div>
                    `;

                    section.querySelector(`#header-${sid}`).addEventListener('click', () => {
                        this.toggleSection(sid);
                    });

                    const grid = section.querySelector('.item-grid');
                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = `item-card ${item.collected ? 'completed' : ''}`;
                        card.innerHTML = `
                            <div>
                                <div class="item-type-tag">${item.type}</div>
                                <div class="outlined-text" style="font-weight:900; font-size:14px; margin-bottom:4px;">${item.name}</div>
                                <div class="outlined-text" style="font-size:12px; color:#ddd; font-style:italic; line-height:1.3;">${item.desc}</div>
                            </div>
                            <div class="action-zone"></div>
                        `;

                        const actionZone = card.querySelector('.action-zone');

                        if (item.collected) {
                            actionZone.innerHTML = `<button class="lock-badge outlined-text toggle-btn">LOGGED REGISTRY (Undo)</button>`;
                            actionZone.querySelector('button').addEventListener('click', () => this.toggleItem(item.id));
                        } else {
                            const btn = document.createElement('button');
                            btn.className = 'toggle-btn outlined-text';
                            btn.innerText = 'Confirm Found';
                            btn.addEventListener('click', () => this.toggleItem(item.id));
                            actionZone.appendChild(btn);
                        }

                        grid.appendChild(card);
                    });
                    container.appendChild(section);
                });

                const percent = Math.round((totalFound / (this.hunterData.length || 1)) * 100) || 0;
                const barNode = document.getElementById('overall-bar');
                const textNode = document.getElementById('percent-text');
                if (barNode) barNode.style.width = percent + '%';
                if (textNode) textNode.innerText = `TOTAL CAMPAIGN COLLECTION: ${percent}%`;
            }
        };

        window.appState = appState;
        appState.init();
    </script>
