<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){var p=location.pathname.replace(/[^\/]*$/,'');document.write('<base href="'+p+'">');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Neighborly Acre</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#0b1220;color:#e2e8f0;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hud{position:fixed;z-index:5}
  #top{top:0;left:0;right:0;padding:6px 12px;font-size:.82rem;background:linear-gradient(#000a,#0000);text-shadow:0 1px 3px #000}
  #top .r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.5}
  #top a,#top button{color:#e2e8f0;text-decoration:none;background:none;border:0;font:inherit;padding:0 2px;cursor:pointer}
  #toast{top:78px;left:0;right:0;text-align:center;color:#fde68a;font-size:.9rem;text-shadow:0 1px 3px #000;pointer-events:none;min-height:1.3em;padding:0 12px}
  #prompt{bottom:calc(var(--bh,120px) + 8px);left:0;right:0;text-align:center;pointer-events:none}
  #prompt span{background:#000a;color:#fff;padding:5px 12px;border-radius:14px;font-size:.88rem;display:inline-block;margin:2px}
  #prompt small{display:block;color:#cbd5e1;font-size:.78rem}
  #bars{bottom:0;left:0;right:0;background:linear-gradient(#0000,#000b);padding:6px 8px 8px}
  .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:2px 0}
  #seedBar .mix{align-self:center;font-size:.78rem;color:#cbd5e1;padding:0 6px;text-shadow:0 1px 3px #000}
  .row button{flex:0 0 auto;background:#1e293bcc;color:#e2e8f0;border:2px solid transparent;border-radius:12px;padding:7px 9px;font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap}
  .row button.sel{border-color:#22c55e;background:#14532dcc} .row button.lock{opacity:.45}
  #joy{left:18px;bottom:calc(var(--bh,120px) + 10px);width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;touch-action:none;display:none}
  #knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff88}
  #useBtn{right:18px;bottom:calc(var(--bh,120px) + 14px);width:92px;height:92px;border-radius:50%;border:0;background:#22c55ecc;color:#04210f;font-weight:800;font-size:1rem;display:none;touch-action:none}
  body.touch #joy,body.touch #useBtn{display:block}
  #shop{inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:20}
  #shop .box{background:#1e293b;border-radius:16px;padding:14px;width:min(96vw,460px);max-height:88vh;display:flex;flex-direction:column}
  #shop h2{margin:0 0 8px;font-size:1.1rem} #shopTabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
  #shopTabs button{flex:1 1 auto;background:#334155;color:#e2e8f0;border:0;border-radius:9px;padding:7px 10px;font:inherit;font-size:.8rem;cursor:pointer} #shopTabs button.sel{background:#22c55e;color:#04210f;font-weight:700}
  #shopItems{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#475569 transparent} .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #334155;font-size:.85rem}
  .item{flex-wrap:wrap} .item>div:first-child{flex:1 1 170px;min-width:0}
  .item small{color:#94a3b8;display:block} .item .btns{display:flex;gap:5px;flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end}
  .item .btns:has(button:nth-child(3)){flex-basis:100%;justify-content:flex-start}   /* rows with many buttons (seed packs) wrap onto their own lines instead of scrolling sideways */
  #shopItems::-webkit-scrollbar{width:8px} #shopItems::-webkit-scrollbar-thumb{background:#475569;border-radius:8px} #shopItems::-webkit-scrollbar-track{background:transparent}
  #shop button.b{background:#22c55e;color:#04210f;font-weight:700;border:0;border-radius:9px;padding:7px 10px;font:inherit;font-size:.8rem;cursor:pointer} #shop button.b:disabled{opacity:.35;cursor:default}
  #shop button.close{background:#334155;color:#e2e8f0;border:0;border-radius:10px;padding:10px;margin-top:10px;width:100%;font:inherit;cursor:pointer}
  #gate{position:fixed;inset:0;z-index:30;background:#0f172a;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px}
  #gate button{background:#22c55e;color:#04210f;font-weight:700;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="hud">
  <div class="r"><span>🌾 <b id="roomLabel">Neighborly Acre</b> · 👥 <b id="count">1</b></span><span style="color:#fde68a;font-weight:700">$<span id="coins">0</span></span><span><button id="bagBtn">🎒 Bag</button> <button id="missionsBtn">📜 Missions</button> <button id="shareBtn">Invite</button> · <button id="gamesBtn">☰ Games</button></span></div>
  <div class="r"><span>⭐ Lv <b id="lvl">1</b> <small id="xpTxt"></small></span><span id="wx">--</span><span id="cropInfo"></span></div>
  <div class="r" id="peers" style="display:none;font-size:.78rem"></div>
</div>
<div id="toast" class="hud"></div>
<div id="prompt" class="hud"></div>
<div id="joy" class="hud"><div id="knob"></div></div>
<button id="useBtn" class="hud">Use</button>
<div id="bars" class="hud"><div class="row" id="seedBar"></div><div class="row" id="bar"></div></div>
<div id="shop" class="hud"><div class="box"><h2>🏪 Barn</h2><div id="shopTabs"></div><div id="shopItems"></div><button class="close" id="shopClose">Close</button></div></div>
<div id="gate"><div id="gateText">Sign in to play</div><button id="gateBtn" style="display:none">Sign in with Google</button><button id="soloBtn" style="background:#334155;color:#e2e8f0">Play solo instead</button></div>

<script>if(window.ResizeObserver){addEventListener('DOMContentLoaded',function(){new ResizeObserver(function(){document.documentElement.style.setProperty('--bh',document.getElementById('bars').offsetHeight+'px')}).observe(document.getElementById('bars'))})}</script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>/* one-time: bring a guest's farm over from the old Claude-Test storage key */
try{var K='werewolf_mobilegames_local_v1',O='neighborly_acre_local_v1',o=localStorage.getItem(O);if(o&&!localStorage.getItem('neighborly_acre_migrated')){var od=JSON.parse(o),nd=JSON.parse(localStorage.getItem(K)||'{}');nd.game_rooms=nd.game_rooms||{};nd.games_saves=nd.games_saves||{};nd.games_saves.local=nd.games_saves.local||{};
if(!nd.game_rooms.farm&&od.game_rooms&&od.game_rooms.farm)nd.game_rooms.farm=od.game_rooms.farm;if(!nd.games_saves.local.farm&&od.games_saves&&od.games_saves.local&&od.games_saves.local.farm)nd.games_saves.local.farm=od.games_saves.local.farm;localStorage.setItem(K,JSON.stringify(nd));localStorage.setItem('neighborly_acre_migrated','1');}}catch(e){}</script>
<script>document.write('<script src="js/common.js"><\/script>');</script>
<script>document.write('<script src="js/gamenav.js"><\/script>');</script>
<script>document.write('<script type="module" src="js/farm3d.js"><\/script>');</script>
</body>
</html>
