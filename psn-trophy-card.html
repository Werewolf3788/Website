    :root {

      --bg-surface: #0e121a;
      --bg-surface-elevated: #151b26;
      --bg-card: rgba(18, 24, 38, 0.85);

      flex-direction: column;

      gap: 0.85rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .brand-badge {

      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0.2rem 0.5rem;

    /* Dynamic Menu Navigation */
    nav.main-nav {

    .nav-item {

    }

    .nav-link {

      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.5rem 0.85rem;

    .nav-link:hover, .nav-item.open > .nav-link {

    /* Card Styling */
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);

      display: flex;

    .platform-badge {
      position: absolute;
      top: 0.85rem;

    .operative-info {

    .operative-label {

      font-size: 0.75rem;
      font-weight: 600;
    }

    .op-name {

    }

    .op-percent {

    .progress-bar-bg {

      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;

    .amazon-alt-btn {

      color: var(--text-muted);

      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-subtle);

    .amazon-alt-btn:hover {

      border-color: rgba(255, 255, 255, 0.25);

    /* Lightbox Modal */
    .lightbox-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(14px);

    .lightbox-content {

      width: 100%;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
    }

    .lightbox-img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
    }

    .lightbox-details {
      padding: 1.25rem;
    }

    .lightbox-title {

<body>

  <!-- Cockpit Header -->
  <header class="cockpit-header">
    <div class="header-container">
      <div class="brand-section">
        <a href="/" class="brand-title">
          <span>SQUAD PACK</span>
          <span class="brand-badge">CATALOG</span>
        </a>
      </div>

      <nav class="main-nav" id="desktopNavMenu">
        <div class="nav-item">
          <span class="nav-link" style="color:var(--text-muted);">Loading Menu...</span>
        </div>
      </nav>

      <div class="header-telemetry">
        <div class="sync-status-pill">
          <div class="pulse-dot"></div>
          <span>PSN SYNC: <strong id="telemetrySyncTimestamp">CHECKING...</strong></span>
        </div>
        <button class="hamburger-btn" id="mobileDrawerOpenBtn" aria-label="Open Navigation Menu">☰</button>
      </div>
    </div>
  </header>

    <div class="mobile-drawer-content">
      <div class="mobile-drawer-header">
        <span class="brand-title">NAVIGATION</span>
        <button class="mobile-drawer-close" id="mobileDrawerCloseBtn">&times;</button>
      </div>
      <div id="mobileDrawerNavList"></div>
    </div>
  </div>

  <!-- Filters & Search -->
  <div class="controls-strip">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="catalogSearchInput" class="search-input" placeholder="Search by game title, operative, or NPWR...">
    </div>
    <div class="filters-group" id="filterButtonGroup">
      <button class="filter-btn active" data-filter="all">All Games</button>
      <button class="filter-btn" data-filter="multiplayer">Multiplayer & Co-Op</button>
      <button class="filter-btn" data-filter="coop">Co-Op Dedicated</button>
      <button class="filter-btn" data-filter="crossplay">Cross-Play</button>
      <button class="filter-btn" data-filter="singleplayer">Pure Single Player</button>
    </div>
  </div>

  <!-- Main Grid -->
  <main class="catalog-viewport">
    <div class="catalog-grid" id="catalogGrid">
      <div class="state-banner">Connecting to Squad Pack Telemetry Node...</div>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="imageLightbox" role="dialog" aria-modal="true">
    <div class="lightbox-content">
      <button class="lightbox-close-btn" id="lightboxCloseBtn" aria-label="Close Lightbox">&times;</button>
      <img src="" id="lightboxImg" class="lightbox-img">
      <div class="lightbox-details">
        <div class="lightbox-title" id="lightboxTitle">Game Poster</div>
        <div class="lightbox-alt-desc" id="lightboxAltText">Poster preview</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="cockpit-footer">
    <div class="footer-inner">
      <div>Engine Version: <strong>v51.0.0</strong> | Direct Game Node & Hybrid Capabilities</div>
      <div>Latest PSN Sync: <span id="footerSyncStamp" class="footer-stamp">Awaiting feed...</span></div>
      <div>Timestamp: <span class="footer-stamp">2026-09-28 20:58:00 (EDT)</span></div>
    </div>
  </footer>

  <script>
    const FIREBASE_BASE_ENDPOINT = "//entertainment-71888-default-rtdb.firebaseio.com";
    const PSN_ENDPOINT = `${FIREBASE_BASE_ENDPOINT}/psn.json`;
    const UTM_LINKS_ENDPOINT = `${FIREBASE_BASE_ENDPOINT}/utm_links.json`;

    let catalogMasterList = [];
    let activeFilter = "all";
    let searchQuery = "";

    // Comprehensive Game Capabilities Directory with Dual-Mode (Solo + MP) & Co-Op tagging
    const VERIFIED_CAPABILITIES_MAP = {
      // It Takes Two
      "NPWR21671_00": { isMultiplayer: true, isCoOpOnly: true, hasCampaign: true, multiplayerType: "Co-Op Only (2-Player)", isCrossPlatform: true, psPlusRequired: true },
      "NPWR21672_00": { isMultiplayer: true, isCoOpOnly: true, hasCampaign: true, multiplayerType: "Co-Op Only (2-Player)", isCrossPlatform: true, psPlusRequired: true },
      // Sniper Elite 5
      "NPWR24346_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Co-Op & Invasion (2-16)", isCrossPlatform: true, psPlusRequired: true },
      // Ghost Recon Wildlands & Breakpoint
      "NPWR08933_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Online Co-Op (4-Player)", isCrossPlatform: false, psPlusRequired: true },
      "NPWR10901_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Online Co-Op (4-Player)", isCrossPlatform: false, psPlusRequired: true },
      "NPWR15843_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Online Co-Op (4-Player)", isCrossPlatform: false, psPlusRequired: true },
      // theHunter: Call of the Wild
      "NPWR12297_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Reserves + Online Multiplayer (8-Player)", isCrossPlatform: false, psPlusRequired: true },
      // Far Cry 5 / 6
      "NPWR12348_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Online Co-Op (2-Player)", isCrossPlatform: false, psPlusRequired: true },
      "NPWR20668_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Online Co-Op (2-Player)", isCrossPlatform: true, psPlusRequired: true },
      // Farming Simulator 22 & 25
      "NPWR23547_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: false, multiplayerType: "Solo Farm + Online Co-Op (6-Player)", isCrossPlatform: true, psPlusRequired: true },
      "NPWR32145_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: false, multiplayerType: "Solo Farm + Online Co-Op (6-Player)", isCrossPlatform: true, psPlusRequired: true },
      // Path of Titans
      "NPWR27529_00": { isMultiplayer: true, isCoOpOnly: false, hasCampaign: false, multiplayerType: "Cross-Play MMO Survival", isCrossPlatform: true, psPlusRequired: true },
      // A Way Out
      "NPWR12628_00": { isMultiplayer: true, isCoOpOnly: true, hasCampaign: true, multiplayerType: "Co-Op Only (2-Player)", isCrossPlatform: false, psPlusRequired: true }
    };

    // Deep Title Matcher for Hybrid Games
    function deriveGameCapabilities(gameTitle, commId, rootGameNode = {}) {
      const canonical = commId ? commId.toUpperCase() : "";

      // 1. Direct verified database lookup
      if (canonical && VERIFIED_CAPABILITIES_MAP[canonical]) {
        return VERIFIED_CAPABILITIES_MAP[canonical];
      }

      // 2. Direct root property check from Firebase (/psn/games/NPWRxxxx)
      if (rootGameNode.isMultiplayer !== undefined && rootGameNode.isMultiplayer !== false) {
        return {
          isMultiplayer: true,
          hasCampaign: rootGameNode.hasCampaign !== undefined ? rootGameNode.hasCampaign : true,
          isCoOpOnly: !!rootGameNode.isCoOpOnly,
          multiplayerType: rootGameNode.multiplayerType || "Online Multiplayer",
          isCrossPlatform: !!rootGameNode.isCrossPlatform,
          psPlusRequired: rootGameNode.psPlusRequired !== undefined ? rootGameNode.psPlusRequired : true
        };
      }

      // 3. Nested multiplayerInfo object check
      const mpInfo = rootGameNode.multiplayerInfo;
      if (mpInfo && mpInfo.isMultiplayer) {
        return {
          isMultiplayer: true,
          hasCampaign: mpInfo.hasCampaign !== undefined ? mpInfo.hasCampaign : true,
          isCoOpOnly: !!mpInfo.isCoOpOnly,
          multiplayerType: mpInfo.multiplayerType || "Online Multiplayer",
          isCrossPlatform: !!mpInfo.isCrossPlatform,
          psPlusRequired: mpInfo.psPlusRequired !== undefined ? mpInfo.psPlusRequired : true
        };
      }

      // 4. Intelligent Title-Name Keyword Heuristic
      const clean = (gameTitle || "").toLowerCase().trim();

      // Dedicated Co-Op
      if (clean.includes("it takes two") || clean.includes("a way out") || clean.includes("we were here")) {
        return { isMultiplayer: true, isCoOpOnly: true, hasCampaign: true, multiplayerType: "Co-Op Only (2-Player)", isCrossPlatform: clean.includes("it takes two"), psPlusRequired: true };
      }

      // Campaign + Co-Op / PvP Hybrids
      if (clean.includes("sniper elite")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Co-Op & Invasion (2-16)", isCrossPlatform: clean.includes("5"), psPlusRequired: true };
      }
      if (clean.includes("wildlands") || clean.includes("breakpoint") || clean.includes("division")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Online Co-Op (4-Player)", isCrossPlatform: false, psPlusRequired: true };
      }
      if (clean.includes("far cry")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Online Co-Op (2-Player)", isCrossPlatform: clean.includes("6"), psPlusRequired: true };
      }
      if (clean.includes("borderlands") || clean.includes("tiny tina")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Campaign + Online Co-Op (4-Player)", isCrossPlatform: true, psPlusRequired: true };
      }
      if (clean.includes("thehunter") || clean.includes("hunter: call of the wild") || clean.includes("way of the hunter")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Solo Reserves + Online Multiplayer (8-Player)", isCrossPlatform: false, psPlusRequired: true };
      }
      if (clean.includes("farming simulator")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: false, multiplayerType: "Solo Farm + Online Co-Op (6-Player)", isCrossPlatform: true, psPlusRequired: true };
      }
      if (clean.includes("left 4 dead") || clean.includes("back 4 blood") || clean.includes("world war z") || clean.includes("helldivers")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Campaign + Co-Op Squad (4-Player)", isCrossPlatform: true, psPlusRequired: true };
      }
      if (clean.includes("path of titans") || clean.includes("ark: survival") || clean.includes("conan exiles")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: false, multiplayerType: "Survival MMO", isCrossPlatform: true, psPlusRequired: true };
      }
      if (clean.includes("call of duty") || clean.includes("battlefield") || clean.includes("grand theft auto") || clean.includes("gta") || clean.includes("red dead")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: true, multiplayerType: "Story Campaign + Online Multiplayer", isCrossPlatform: clean.includes("call of duty") || clean.includes("battlefield"), psPlusRequired: true };
      }
      if (clean.includes("rocket league") || clean.includes("fortnite") || clean.includes("apex legends") || clean.includes("overwatch")) {
        return { isMultiplayer: true, isCoOpOnly: false, hasCampaign: false, multiplayerType: "Online Competitive (Cross-Play)", isCrossPlatform: true, psPlusRequired: false };
      }

      // Default Pure Single Player
      return {
        isMultiplayer: false,
        isCoOpOnly: false,
        hasCampaign: true,
        multiplayerType: "Single Player",
        isCrossPlatform: false,
        psPlusRequired: false
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      initNavigationInteractions();
      initFilterAndSearchControls();
      initLightboxControls();
      
      loadUtmMenu();
      loadPsnCatalog();
    });

    function isInternalUrl(url) {
      if (!url) return false;
      try {
        if (url.startsWith("/") || url.startsWith("#")) return true;
        const targetHost = new URL(url, window.location.href).hostname;
        return targetHost === window.location.hostname;
      } catch (e) {
        return false;
      }
    }

    function normalizeAssetUrl(url) {
      if (!url || typeof url !== "string") return "";
      let clean = url.trim();
      if (clean.startsWith("http://")) return clean.replace("http://", "//");
      if (clean.startsWith("https://")) return clean.replace("https://", "//");
      return clean;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function initNavigationInteractions() {
      const openBtn = document.getElementById("mobileDrawerOpenBtn");
      const closeBtn = document.getElementById("mobileDrawerCloseBtn");
      const drawer = document.getElementById("mobileNavDrawer");

      if (openBtn && drawer) {
        openBtn.addEventListener("click", () => drawer.classList.add("active"));
      }
      if (closeBtn && drawer) {
        closeBtn.addEventListener("click", () => drawer.classList.remove("active"));
      }
      if (drawer) {
        drawer.addEventListener("click", (e) => {
          if (e.target === drawer) drawer.classList.remove("active");
        });
      }
    }

    function initFilterAndSearchControls() {
      const searchInput = document.getElementById("catalogSearchInput");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          searchQuery = (e.target.value || "").toLowerCase().trim();
          renderCatalog();
        });
      }

      const filterButtons = document.querySelectorAll("#filterButtonGroup .filter-btn");
      filterButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          filterButtons.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          activeFilter = btn.getAttribute("data-filter") || "all";
          renderCatalog();
        });
      });
    }

    function initLightboxControls() {
      const lightbox = document.getElementById("imageLightbox");
      const closeBtn = document.getElementById("lightboxCloseBtn");
      if (closeBtn && lightbox) {
        closeBtn.addEventListener("click", () => lightbox.classList.remove("active"));
        lightbox.addEventListener("click", (e) => {
          if (e.target === lightbox) lightbox.classList.remove("active");
        });
      }
    }

    async function loadUtmMenu() {
      const desktopNav = document.getElementById("desktopNavMenu");
      const mobileNav = document.getElementById("mobileDrawerNavList");

      try {
        const response = await fetch(UTM_LINKS_ENDPOINT);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        const data = await response.json();

        if (!data || typeof data !== "object") {
          if (desktopNav) desktopNav.innerHTML = `<span style="font-size:0.8rem; color:var(--text-muted);">Main Portal</span>`;
          return;
        }

        const folders = {};
        const standalone = [];

        Object.entries(data).forEach(([topKey, nodeVal]) => {
          if (!nodeVal) return;

          if (typeof nodeVal === "object" && (nodeVal.url || nodeVal.link)) {
            const groupName = nodeVal.group ? nodeVal.group.trim() : null;
            if (groupName) {
              if (!folders[groupName]) folders[groupName] = [];
              folders[groupName].push(nodeVal);
            } else {
              standalone.push(nodeVal);
            }
          } else if (typeof nodeVal === "object") {
            const subItems = Array.isArray(nodeVal) ? nodeVal : Object.values(nodeVal);
            subItems.forEach(sub => {
              if (!sub || typeof sub !== "object") return;
              const groupName = sub.group ? sub.group.trim() : topKey;
              if (!folders[groupName]) folders[groupName] = [];
              folders[groupName].push(sub);
            });
          }
        });

        let desktopHtml = "";
        standalone.forEach(item => {
          const url = item.url || item.link || "#";
          const title = item.title || item.name || "Home";
          const thumb = normalizeAssetUrl(item.image || item.thumbnail || item.icon);
          const isInternal = isInternalUrl(url);
          const targetAttr = isInternal ? `target="_self"` : `target="_blank" rel="noopener noreferrer"`;

          desktopHtml += `
            <div class="nav-item">
              <a href="${url}" class="nav-link" ${targetAttr}>
                ${thumb ? `<img src="${thumb}" class="nav-thumbnail" loading="lazy">` : ''}
                <span>${escapeHtml(title)}</span>
              </a>
            </div>
          `;
        });

        Object.entries(folders).forEach(([folderName, items]) => {
          desktopHtml += `
            <div class="nav-item">
              <div class="nav-link">
                <span>${escapeHtml(folderName)}</span>
                <span class="dropdown-caret">▼</span>
              </div>
              <div class="dropdown-panel">
                ${items.map(subItem => {
                  const subUrl = subItem.url || subItem.link || "#";
                  const subTitle = subItem.title || subItem.name || "Item";
                  const subDesc = subItem.description || "";
                  const subThumb = normalizeAssetUrl(subItem.image || subItem.thumbnail || subItem.icon);
                  const isInternal = isInternalUrl(subUrl);
                  const targetAttr = isInternal ? `target="_self"` : `target="_blank" rel="noopener noreferrer"`;

                  return `
                    <a href="${subUrl}" class="dropdown-link" ${targetAttr}>${subThumb ? `<img src="${subThumb}" class="nav-thumbnail" loading="lazy">` : ''}
                      <div class="dropdown-link-details">
                        <span class="dropdown-link-title">${escapeHtml(subTitle)}</span>${subDesc ? `<span class="dropdown-link-sub">${escapeHtml(subDesc)}</span>` : ''}
                      </div>
                    </a>
                  `;
                }).join("")}
              </div>
            </div>
          `;
        });

        if (desktopNav) desktopNav.innerHTML = desktopHtml;

        let mobileHtml = "";
        standalone.forEach(item => {
          const url = item.url || item.link || "#";
          const title = item.title || item.name || "Home";
          const thumb = normalizeAssetUrl(item.image || item.thumbnail || item.icon);
          const isInternal = isInternalUrl(url);
          const targetAttr = isInternal ? `target="_self"` : `target="_blank" rel="noopener noreferrer"`;

          mobileHtml += `
            <a href="${url}" class="dropdown-link" style="padding:0.75rem 0;" ${targetAttr}>
              ${thumb ? `<img src="${thumb}" class="nav-thumbnail" loading="lazy">` : ''}
              <span class="dropdown-link-title">${escapeHtml(title)}</span>
            </a>
          `;
        });

        Object.entries(folders).forEach(([folderName, items]) => {
          mobileHtml += `<div class="mobile-nav-group-title">${escapeHtml(folderName)}</div>`;
          items.forEach(subItem => {
            const subUrl = subItem.url || subItem.link || "#";
            const subTitle = subItem.title || subItem.name || "Item";
            const subThumb = normalizeAssetUrl(subItem.image || subItem.thumbnail || subItem.icon);
            const isInternal = isInternalUrl(subUrl);
            const targetAttr = isInternal ? `target="_self"` : `target="_blank" rel="noopener noreferrer"`;

            mobileHtml += `
              <a href="${subUrl}" class="dropdown-link" style="padding:0.6rem 0.5rem;" ${targetAttr}>
                ${subThumb ? `<img src="${subThumb}" class="nav-thumbnail" loading="lazy">` : ''}
                <span class="dropdown-link-title">${escapeHtml(subTitle)}</span>
              </a>
            `;
          });
        });

        if (mobileNav) mobileNav.innerHTML = mobileHtml;

      } catch (err) {
        console.warn("[UTM MENU FETCH WARN]", err.message);
        if (desktopNav) desktopNav.innerHTML = `<span style="font-size:0.8rem; color:var(--text-muted);">Main Portal</span>`;
      }
    }

    async function loadPsnCatalog() {
      const grid = document.getElementById("catalogGrid");
      try {
        const response = await fetch(PSN_ENDPOINT);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        const data = await response.json();

        if (!data) {
          if (grid) grid.innerHTML = `<div class="state-banner">No game records found in PSN telemetry node.</div>`;
          return;
        }

        const syncTimestamp = data.lastGlobalUpdate || "Unknown";
        const headerStamp = document.getElementById("telemetrySyncTimestamp");
        const footerStamp = document.getElementById("footerSyncStamp");
        if (headerStamp) headerStamp.textContent = syncTimestamp;
        if (footerStamp) footerStamp.textContent = syncTimestamp;

        const games = data.games || {};
        const gamertags = data.gamertags || {};

        catalogMasterList = buildConsolidatedCatalog(games, gamertags);
        renderCatalog();

      } catch (err) {
        console.error("[CATALOG FETCH ERROR]", err);
        if (grid) {
          grid.innerHTML = `<div class="state-banner">Telemetry node sync error: ${err.message}. Please retry later.</div>`;
        }
      }
    }

    function buildConsolidatedCatalog(games, gamertags) {
      const catalogMap = new Map();

      // 1. Ingest Master Games from /psn/games/
      Object.entries(games).forEach(([commId, g]) => {
        const cId = commId.toUpperCase();
        const resolvedName = g.name || "PlayStation Title";
        const capabilities = deriveGameCapabilities(resolvedName, cId, g);

        catalogMap.set(cId, {
          commId: cId,
          titleId: g.titleId || null,
          conceptId: g.conceptId || null,
          name: resolvedName,
          platform: g.platform || "PS5",
          posterArt: normalizeAssetUrl(g.posterArt || g.trophyTitleIconUrl),
          playstationStoreUrl: g.playstationStoreUrl || generateStoreUrl(g.titleId, resolvedName, g.conceptId),
          amazonAffiliateUrl: g.amazonAffiliateUrl || null,
          multiplayerInfo: capabilities,
          operatives: []
        });
      });

      // 2. Cross-reference Squad Members who have played
      Object.entries(gamertags).forEach(([gamerTag, userData]) => {
        const avatar = normalizeAssetUrl(userData.avatar);
        const recentGames = userData.recentGames || [];

        recentGames.forEach(rg => {
          const cId = (rg.npCommunicationId || "").toUpperCase();
          if (!cId) return;

          const gameTitle = rg.name || rg.trophyTitleName || "PlayStation Title";

          if (!catalogMap.has(cId)) {
            const capabilities = deriveGameCapabilities(gameTitle, cId, rg);
            catalogMap.set(cId, {
              commId: cId,
              titleId: rg.titleId || rg.npTitleId || null,
              conceptId: null,
              name: gameTitle,
              platform: rg.platform || "PS5",
              posterArt: normalizeAssetUrl(rg.posterArt || rg.trophyTitleIconUrl || rg.art),
              playstationStoreUrl: rg.playstationStoreUrl || generateStoreUrl(rg.titleId || rg.npTitleId, gameTitle),
              amazonAffiliateUrl: null,
              multiplayerInfo: capabilities,
              operatives: []
            });
          }

          const entry = catalogMap.get(cId);
          entry.operatives.push({
            gamerTag: gamerTag,
            avatar: avatar,
            progress: rg.progress || 0,
            completionRatio: rg.completionRatio || `${rg.progress || 0}%`,
            playtimeFormatted: rg.nativePlaytimeFormatted || "Played"
          });
        });
      });

      return Array.from(catalogMap.values()).sort((a, b) => {
        return b.operatives.length - a.operatives.length || a.name.localeCompare(b.name);
      });
    }

    function generateStoreUrl(titleId, gameName, conceptId) {
      if (conceptId) {
        return `//store.playstation.com/en-us/concept/${conceptId}`;
      }
      if (titleId && (titleId.startsWith("CUSA") || titleId.startsWith("PPSA"))) {
        return `//store.playstation.com/en-us/product/${titleId}`;
      }
      if (gameName && gameName !== "Dashboard") {
        const query = encodeURIComponent(gameName.replace(/®|™/g, "").trim());
        return `//store.playstation.com/en-us/search/${query}`;
      }
      return "//store.playstation.com/";
    }

    function renderCatalog() {
      const grid = document.getElementById("catalogGrid");
      if (!grid) return;

      const filtered = catalogMasterList.filter(item => {
        const matchesSearch = !searchQuery || 
          item.name.toLowerCase().includes(searchQuery) ||
          item.commId.toLowerCase().includes(searchQuery) ||
          item.operatives.some(op => op.gamerTag.toLowerCase().includes(searchQuery));

        if (!matchesSearch) return false;

        const mp = item.multiplayerInfo || {};
        if (activeFilter === "multiplayer") return !!mp.isMultiplayer;
        if (activeFilter === "coop") return !!mp.isCoOpOnly || (mp.multiplayerType && mp.multiplayerType.toLowerCase().includes("co-op"));
        if (activeFilter === "crossplay") return !!mp.isCrossPlatform;
        if (activeFilter === "singleplayer") return !mp.isMultiplayer;

        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="state-banner">No games found matching criteria "${searchQuery || activeFilter}".</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const posterUrl = item.posterArt || "//placehold.co/600x340/151b26/ffffff?text=PlayStation";
        const mp = item.multiplayerInfo || {};

        let operativesMarkup = `<div class="squad-presence-box"><div class="squad-box-header"><span>Squad Records</span><span>${item.operatives.length} Logged</span></div>`;
        if (item.operatives.length > 0) {
          operativesMarkup += item.operatives.map(op => `
            <div class="operative-row">
              <img src="${op.avatar || '//placehold.co/40x40/111/fff?text=?'}" class="operative-avatar" loading="lazy">
              <div class="operative-info">
                <div class="operative-label">
                  <span class="op-name">${escapeHtml(op.gamerTag)}</span>
                  <span class="op-percent">${op.completionRatio}</span>
                </div>
                <div class="progress-bar-bg">
                  <div class="progress-fill" style="width: ${Math.min(100, Math.max(0, op.progress))}%"></div>
                </div>
              </div>
            </div>
          `).join("");
        } else {
          operativesMarkup += `<div style="font-size:0.75rem; color:var(--text-muted);">Available in Vault (Not actively logged by squad)</div>`;
        }
        operativesMarkup += `</div>`;

        // Smart Hybrid Badging
        let tagsMarkup = `<div class="tags-container">`;
        if (mp.isCoOpOnly) {
          tagsMarkup += `<span class="tag tag-coop">🤝 ${escapeHtml(mp.multiplayerType)}</span>`;
        } else if (mp.isMultiplayer) {
          tagsMarkup += `<span class="tag tag-multiplayer">🌐 ${escapeHtml(mp.multiplayerType)}</span>`;
          if (mp.hasCampaign) {
            tagsMarkup += `<span class="tag tag-campaign">🎯 Solo Campaign</span>`;
          }
        } else {
          tagsMarkup += `<span class="tag tag-single">👤 Single Player Only</span>`;
        }

        if (mp.isCrossPlatform) {
          tagsMarkup += `<span class="tag tag-crossplay">⚡ Cross-Play</span>`;
        }
        if (mp.psPlusRequired) {
          tagsMarkup += `<span class="tag tag-plus">★ PS Plus Required</span>`;
        }
        tagsMarkup += `</div>`;

        const psStoreUrl = item.playstationStoreUrl;
        const isInternalStore = isInternalUrl(psStoreUrl);
        const storeTargetAttr = isInternalStore ? `target="_self"` : `target="_blank" rel="noopener noreferrer"`;

        return `
          <article class="game-card">
            <div class="card-banner" onclick="openLightbox('${encodeURIComponent(posterUrl)}', '${encodeURIComponent(item.name)}')">
              <span class="platform-badge">${item.platform}</span>
              <img src="${posterUrl}" loading="lazy">
            </div>
            <div class="card-body">
              <div class="title-row">
                <div class="game-title" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
                <div class="game-commid">${item.commId}</div>
              </div>
              ${tagsMarkup}
              ${operativesMarkup}
              <div class="card-footer-action">
                <a href="${psStoreUrl}" class="ps-store-btn" ${storeTargetAttr} onclick="trackOutboundClick('${psStoreUrl}', 'playstation_store', '${escapeHtml(item.name)}', '${item.commId}')">
                  <span>🛒 View in PS Store</span>
                </a>
                ${item.amazonAffiliateUrl ? `
                  <a href="${item.amazonAffiliateUrl}" class="amazon-alt-btn" target="_blank" rel="noopener noreferrer" onclick="trackOutboundClick('${item.amazonAffiliateUrl}', 'amazon_affiliate', '${escapeHtml(item.name)}', '${item.commId}')">Amazon</a>
                ` : ''}
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function openLightbox(encodedUrl, encodedTitle) {
      const url = decodeURIComponent(encodedUrl);
      const title = decodeURIComponent(encodedTitle);

      const modal = document.getElementById("imageLightbox");
      const img = document.getElementById("lightboxImg");
      const titleElem = document.getElementById("lightboxTitle");
      const altElem = document.getElementById("lightboxAltText");

      if (img) {
        img.src = url;
        img.alt = `Official PlayStation artwork for ${title}`;
      }
      if (titleElem) titleElem.textContent = title;
      if (altElem) altElem.textContent = `High-resolution promotional key art and display banner for ${title}.`;

      if (modal) modal.classList.add("active");
    }
  </script>
</body>
</html>
